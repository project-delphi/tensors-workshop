# ── Sections ─────────────────────────────────────────────────────────────────
# The section spine is the handbook's own 210-minute schedule table, breaks
# excluded. `n` is authoritative: it fixes the notebook filename prefix, the
# slide anchor (#sec-NN-slug) and the row order in every table on the site.
#
# `part` and `block` are the handbook's own vocabulary — Part I-IV, Block 1-7 —
# carried here so the handbook's schedule table can be generated with both the
# section number and the label beside it. That table is the only key a reader
# has for resolving "Block 4" to section 07, so the labels live with the
# sections they name rather than being retyped in the prose. A section that is
# not one of the seven exercise blocks has `block: "—"`.
#
# `start` and `end` are the running clock offsets both decks print on the
# section title slides. They are derived — walk the sections in order, adding
# `schedule` time after the ones that are followed by a quiz or a break — but
# they are written out here rather than computed, because `{{< var >}}` can
# only look a value up, not add one. check_links.py recomputes them and fails
# if they have drifted, so editing a `minutes` without re-deriving is caught.
sections:
  s00:
    n: "00"
    slug: "setup-and-data"
    part: "—"
    block: "—"
    minutes: 5
    start: "+00:00"
    end: "+00:05"
    format_en: "setup"
    format_es: "preparación"
    title_en: "Setup and welcome"
    title_es: "Preparación y bienvenida"
    network_note_for: "upload.wikimedia.org/wikipedia/commons/1/1e"
