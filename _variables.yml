# ── The files the notebooks download ─────────────────────────────────────────
# Every external file a notebook fetches at runtime, and what to call it in the
# Network column of the notebooks page. `match` is a fragment of the URL, which
# is what the notebooks build theirs from — several are split across string
# literals, so matching on a fragment is the only thing that works without
# reassembling them.
#
# This registry is what makes that table generated rather than hand-written,
# and it is worth saying why. The table used to be prose, and its rows for 09,
# 11, 12 and 13 sat rotated by an old section renumber for months: it told a
# student section 09 needed no network when 09 downloads a CSV, and that
# notebook 13 needed `tensorly`, which it never imports. Nothing compared it to
# the notebooks, because nothing could.
#
# `notebook_deps_table()` in gen_tables.py **exits** on a URL that matches no
# entry here. So a notebook that starts fetching something new fails the build
# until this list learns its name, rather than quietly dropping it from the
# column that tells a student whether they can work on a train.
datasets:
  - match: "housing.csv"
    label_en: "California housing"
    label_es: "vivienda en California"
  - match: "flights.csv"
    label_en: "airline passengers"
    label_es: "pasajeros de aerolínea"
  - match: "taxis.csv"
    label_en: "NYC taxi trips"
    label_es: "viajes en taxi de Nueva York"
  - match: "upload.wikimedia.org/wikipedia/commons/1/1e"
    label_en: "the storm clip"
    label_es: "el clip de la tormenta"
  - match: "pdx-cs-sound"
    label_en: "a voice recording"
    label_es: "una grabación de voz"

# ── The brainstorm diagram ───────────────────────────────────────────────────
# One picture of the whole day, on both companion pages. Four ideas, and every
# section hangs off the one it serves.
#
# The four ideas are the deck's own opening slide, `slide-02a` in
# `scripts/gen_slide_art.py`. The wording here is shorter than the slide's,
# because a card in a diagram is not a card on a projector — but it is the same
# four ideas in the same order, and changing one means changing both.
#
# **The hub → section mapping is a hand-made reading**, exactly like `covers` on
# `companion.shorts` above. Nothing in this repo knows which idea a section
# serves; a person decided. `gen_tables.py` verifies that every section in
# `sections:` and `extras:` is placed exactly once, which catches a section
# added here twice or not at all — and cannot catch a section filed under the
# wrong idea.
#
# Section titles are NOT repeated here. `brainstorm_svg()` reads `title_{lang}`
# out of `sections:` and wraps it, so a retitled section changes the diagram
# with no edit in this block.
brainstorm:
  title_en: "Four ideas, one object"
  title_es: "Cuatro ideas, un solo objeto"
  lead_en: "Every section serves one of these four ideas."
  lead_es: "Cada sección sirve a una de estas cuatro ideas."

  hubs:
    - glyph: "⊞"
      title_en: "It generalizes a matrix"
      title_es: "Generaliza la matriz"
      gloss_en: "The same object, with as many axes as the data needs."
      gloss_es: "El mismo objeto, con tantos ejes como pidan los datos."
      sections: ["01", "02"]
    - glyph: "▦"
      title_en: "It holds the data"
      title_es: "Contiene los datos"
      gloss_en: "Images, video, taxi trips: one box of numbers."
      gloss_es: "Imágenes, vídeo, viajes en taxi: una sola caja de números."
      sections: ["00", "03", "05"]
    - glyph: "⇄"
      title_en: "Its axes can move"
      title_es: "Sus ejes se mueven"
      gloss_en: "reshape re-reads the numbers. transpose moves the axes."
      gloss_es: "reshape relee los números. transpose mueve los ejes."
      sections: ["04", "06"]
    - glyph: "∏"
      title_en: "It factors"
      title_es: "Se factoriza"
      gloss_en: "Break it into simpler parts you can use."
      gloss_es: "Divídelo en partes más simples que puedas usar."
      sections: ["07", "08", "09", "10", "11"]

  # The ribbon under the four cards. There are **two different claims** about
  # the workshop's connecting idea, and they name different sections. Keeping
  # them apart is what stopped four documents contradicting each other:
  #
  #   * Where the idea is **stated** — sections 07, 09 and 10. That is the
  #     handbook's wrap-up, and notebook 13's header repeats it.
  #   * Where you **watch it happen** — 07, 10 and take-home 13. That is this
  #     list, and it is what `slide-30.png` draws: the pseudoinverse, Tucker
  #     and Richardson-Lucy deconvolution side by side. That slide is one of
  #     the thirty-one with no source, so it cannot be redrawn to match a
  #     different three — which is why the split is the resolution rather
  #     than picking one list and propagating it.
  #
  # So `thread_lead_*` reads "you watch it happen in", not "you meet it in".
  # Change this list and the handbook's second sentence has to move with it,
  # and the slide cannot follow either. check_links.py verifies only that each
  # number names a section that exists; the split itself is prose, and prose
  # is what drifts.
  #
  # The numbers are rendered from this list rather than written into the
  # sentence, so at least a renumbered section cannot leave a wrong number
  # painted on the picture.
  thread_en: "One thread runs through all four. When there is no exact answer, find the best approximation you can trust."
  thread_es: "Un hilo recorre las cuatro. Cuando no hay respuesta exacta, busca la mejor aproximación en la que puedas confiar."
  thread_lead_en: "You watch it happen in sections"
  thread_lead_es: "Lo ves ocurrir en las secciones"
  thread_sections: ["07", "10", "13"]

  # Where the day lands. These two are not filed under an idea: 12 collects all
  # four, and 13 is the take-home that sits past the clock. They are listed
  # here so the "every section placed exactly once" rule has somewhere to put
  # them.
  closing_en: "12 pulls the four together. 13 is the take-home."
  closing_es: "12 une las cuatro. 13 es el ejercicio para casa."
  closing_sections: ["12", "13"]

# ── Further reading: the ML blog ─────────────────────────────────────────────
# Companion posts on https://project-delphi.github.io/ml-blog/, one per core
# concept. These are the *second explanation* — the one a student wants forty
# minutes in, when the first one did not land.
#
# They are also part of the end-of-workshop bibliography: `references:` below
# cites them as its `ref-blog` group, by key rather than by URL, so each post
# is declared exactly once in this file and check_links.py's "every ml-blog
# URL is declared" rule needs no exception for the references page.
#
# Both decks link them from the slide where the concept is introduced, as
# `.reading-tab` chips, and the two factorization notebooks list them at the end.
# Neither deck hard-codes a URL: they live here for the same reason every
# other shared fact does, so the EN and ES decks cannot come to disagree.
#
# The notebooks are the exception, and the only one. An .ipynb has no
# `{{< var >}}`, so 09 and 11 carry a copy of the URL *and* of the title.
# check_links.py catches half of that drift — change a `url` here and the
# notebook's now-undeclared copy fails check 1 — but a `title_en` or
# `title_es` edit reaches the decks and silently does not reach the
# notebooks. Change a title here and change it in the notebook's "Where this
# goes next" cell in the same commit.
#
# `title_es` is a real translation of the post's title, but **the posts
# themselves are in English**. The ES deck says so on screen: slides.scss adds
# a "(EN)" marker to every `.reading-tab` under `html[lang="es"]`, so the
# language switch is announced before the click rather than after it.
#
# These are the only *external* links in either deck, and check_links.py does
# not follow them — it is offline by design. It does check that both decks
# link exactly the same set and that every URL in them is declared here, which
# is the half that can go wrong silently. The other half, whether the post is
# still there, is a manual concern: last verified 2026-09-05, all 200.
#
# Slug note: `sparse_tensors` uses an underscore where every other post uses
# hyphens. That is the blog's URL, not a typo here.
reading:
