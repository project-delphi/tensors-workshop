# ── References and further reading ───────────────────────────────────────────
# The bibliography, and the single home for it. It used to live in the
# handbook's own "Further Reading" section, in English only; that section is
# now a pointer here, and README.md's two "Further reading" sections point
# here as well, so there is one copy of each citation rather than three.
#
# scripts/gen_tables.py renders this into _includes/references-{en,es}.md,
# which references.qmd and es/references.qmd include. Both pages are entirely
# generated below the intro, so EN and ES cannot list different works.
#
# A group is one `## ` heading on the page. `anchor` is its id, written out
# rather than derived from the title, because the titles differ by language
# and the anchors must not — the handbook links to `#ref-tensors`.
#
# A group carries either `items` (works cited in full) or `reading` (a list of
# keys into `reading:` above, so the blog posts are declared exactly once and
# check_links.py's "every ml-blog URL is declared" rule still holds here).
#
# Per item, only `title`, `url` and the two notes are required:
#   authors  "Kolda, T. G. & Bader, B. W." — as printed, not translated
#   year     the year of publication, for papers
#   where    journal, volume and pages, or the publisher
#   note_en  what it is FOR, and why you would open this one rather than
#   note_es  another. Not a summary of the work — a reason to read it.
#   also     author pages and other secondary links. `name` is a person or a
#            page name, so it is the same in both languages by construction.
#   code     true if the title is a package name, so it renders as `code`.
#
# In `spine`, the placeholder `{{URL}}` inside each note is replaced with
# `chapter_url` by the generator, so the one link is written once and both
# languages get it.
references:
  # Shown above the first group on both pages. The one thing every reader has
  # already read, and what it does not cover — which is the whole reason this
  # page exists.
  spine:
    chapter_url: "https://www.deeplearningbook.org/contents/linear_algebra.html"
    note_en: >-
      Background: [Chapter 2 of *Deep Learning*]({{URL}}).
      See the [pre-work](index.qmd#prerequisites) before the session.
    note_es: >-
      Base: [capítulo 2 de *Deep Learning*]({{URL}}).
      Consulta el [trabajo previo](index.qmd#requisitos-previos) antes de la sesión.
  groups:
    - anchor: ref-linear-algebra
      title_en: "Linear algebra"
      title_es: "Álgebra lineal"
      note_en: >-
        From an introduction to numerical methods.
      note_es: >-
        De una introducción a los métodos numéricos.
      items:
        - authors: "Strang, G."
          title: "Introduction to Linear Algebra"
          url: "https://math.mit.edu/~gs/linearalgebra/"
          note_en: "an introduction"
          note_es: "una introducción"
          also:
            - name: "Gilbert Strang"
              url: "https://math.mit.edu/~gs/"
        - authors: "Trefethen, L. N. & Bau, D."
          title: "Numerical Linear Algebra"
          url: "https://people.maths.ox.ac.uk/trefethen/text.html"
          note_en: "numerical methods and SVD"
          note_es: "métodos numéricos y SVD"
          also:
            - name: "Nick Trefethen"
              url: "https://people.maths.ox.ac.uk/trefethen/"
        - authors: "Golub, G. H. & Van Loan, C. F."
          title: "Matrix Computations"
          url: "https://www.press.jhu.edu/books/title/10678/matrix-computations"
          note_en: "matrix algorithms"
          note_es: "algoritmos matriciales"
          also:
            - name: "Gene Golub"
              url: "https://mathshistory.st-andrews.ac.uk/Biographies/Golub/"
            - name: "Charles Van Loan"
              url: "https://as.cornell.edu/people/charles-van-loan"
    - anchor: ref-tensors
      title_en: "Tensors"
      title_es: "Tensores"
      note_en: >-
        Start with the survey. Then choose a method.
      note_es: >-
        Empieza por la revisión. Después elige un método.
      items:
        - authors: "Kolda, T. G. & Bader, B. W."
          year: 2009
          title: "Tensor Decompositions and Applications"
          url: "https://doi.org/10.1137/07070111X"
          where: "SIAM Review 51(3), 455–500"
          note_en: >-
            the survey; start here
          note_es: >-
            la revisión; empieza aquí
          also:
            - name: "Tamara Kolda"
              url: "https://www.mathsci.ai/"
            - name: "Brett Bader"
              url: "https://scholar.google.com/citations?user=OJQ8pq0AAAAJ"
        - authors: "Ballard, G. & Kolda, T. G."
          year: 2025
          title: "Tensor Decompositions for Data Science"
          url: "https://www.cambridge.org/core/books/tensor-decompositions-for-data-science/640814D308696CD61CB9112EA57B2911"
          where: "Cambridge University Press"
          note_en: >-
            the textbook the survey grew into; the authors keep a
