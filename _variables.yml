# ── Kahoot quizzes ───────────────────────────────────────────────────────────
# `url` is the live join/share link. It does not exist until the facilitator
# imports the .xlsx into kahoot.it (Create → Add question → Import → Import
# spreadsheet). Paste the three real URLs here and nothing else needs editing.
kahoot:
  join: "kahoot.it"
  # Replaced per quiz once each .xlsx has been imported and has a real
  # join link. The default is functional: students enter the PIN there.
  default_url: "https://kahoot.it/"
  q1:
    n: 1
    title_en: "Tensor Vocabulary & Shapes"
    title_es: "Vocabulario de tensores y formas"
    xlsx: "kahoot/kahoot_quiz_1_vocabulary_shapes.xlsx"
    url: "https://kahoot.it/"          # TODO: paste the Kahoot 1 join URL
    after: "04"
    covers: ["01", "03", "04"]
    questions: 6
  q2:
    n: 2
    title_en: "Einsum, Distance & the Pseudoinverse"
    title_es: "Einsum, distancia y la pseudoinversa"
    xlsx: "kahoot/kahoot_quiz_2_distance_pseudoinverse.xlsx"
    url: "https://kahoot.it/"          # TODO: paste the Kahoot 2 join URL
    after: "07"
    covers: ["06", "07"]
    questions: 6
  # Its six questions are unchanged, so the title still describes them -- but
  # half of them now ask about convolution, which became take-home 13 when
  # factorizations took section 09. Retitle it only when the questions change.
  q3:
    n: 3
    title_en: "Convolution & Tensor Decompositions"
    title_es: "Convolución y descomposiciones tensoriales"
    xlsx: "kahoot/kahoot_quiz_3_convolution_decompositions.xlsx"
    url: "https://kahoot.it/"          # TODO: paste the Kahoot 3 join URL
    after: "10"
    covers: ["10"]
    questions: 6

# ── Schedule ─────────────────────────────────────────────────────────────────
# What sits *between* the sections. The thirteen sections come to 180 minutes;
# these two fill the remaining 30 and are the whole reason a section's `start`
# is not just the sum of the `minutes` before it. Each quiz already declares
# the section it follows (`kahoot.qN.after`), so only the breaks are listed.
schedule:
  quiz_minutes: 5
  break_minutes: 5
  # Sections after which the room takes a break. After 04 the break follows
  # Kahoot 1, which is why the agenda shows a single 10-minute block there.
  break_after: ["04", "06", "09"]

# ── The machine-generated companion ──────────────────────────────────────────
# A NotebookLM notebook built from this workshop's own sources, and the
# artifacts generated from it. It is generated, not written: it is a second
# pass over material already seen, and anything it asserts is checked against
# the handbook, never the other way round. Say so on every page that shows it.
#
# Two kinds of artifact, and the difference decides how each one is published:
#
#   - Video, infographics and audio EXPORT (MP4, PNG, WAV/MP3). Those are
#     committed here, so they work for a visitor with no Google account and
#     survive the notebook being edited, unshared or deleted. The video is the
#     one exception: it is re-uploaded to YouTube rather than committed,
#     because an MP4 lands in the repo twice — once in `images/`-style source
#     and again in `docs/` — against a 1 GB Pages ceiling. Until that upload
#     exists it is published as a link into NotebookLM, like the three below.
#   - Quiz, flashcards and the mind map DO NOT export. They are link-only, and
#     the links work only while the notebook is shared as "anyone with the
#     link". They are the only things here that ask a visitor to sign in.
#
# These assets are hand-exported, not script-generated, so there is no
# SHA-256 pin to fall back on: `notebook_url` plus each artifact's own
# `/artifact/<uuid>` URL plus `exported` IS the provenance record. Re-export
# an asset, update `exported`.
#
# `default_url` is the placeholder an artifact carries until its real share
# link has been pasted in, exactly as `kahoot.default_url` works. Check 10 in
# check_links.py prints a non-fatal TODO for every field still holding it.
companion:
  notebook_url: "https://notebook.google.com/notebook/29755b94-43c4-46ca-83b8-8cf0524f040c"
  default_url: "https://notebook.google.com/notebook/29755b94-43c4-46ca-83b8-8cf0524f040c"
  exported: "2026-09-07"
  # The overview infographic, linked on its own from both companion pages
  # since #76 — not the video, whatever the field name suggests. Neither the
  # handbook nor `references:` carries this URL: both link the companion page,
  # which holds every artifact link exactly once. It is also
  # an entry in `infographics:` below, which is why the URL is a YAML anchor:
  # the same artifact reached from two places, one string to change if it
  # moves.
  overview_url: &overview_url "https://notebook.google.com/notebook/29755b94-43c4-46ca-83b8-8cf0524f040c/artifact/53361223-7a9f-4eda-a928-64a2080421eb"

  # The Video Overview. Two ways to publish it, and the generator prefers the
  # first that exists:
  #
  #   - `youtube_id_*` — the video re-uploaded to YouTube. Only the id: the
  #     watch URL and the privacy-preserving youtube-nocookie embed URL are
  #     both built from it, and a full URL pasted here would silently break
  #     the embed. This is the endpoint, because it works logged out.
  #   - `url_*` — the artifact's own `/artifact/<uuid>` link in NotebookLM,
  #     which plays there and therefore asks for a Google account. It is the
  #     honest interim: a real video a visitor can watch today, rather than a
  #     note saying there is nothing yet. Leave it in place once the YouTube
  #     id lands; the embed simply wins.
  video:
    title_en: "Tensors in machine learning — video overview"
    title_es: "Tensores en aprendizaje automático — resumen en vídeo"
    youtube_id_en: ""                 # TODO: paste the EN YouTube video id
    youtube_id_es: ""                 # TODO: paste the ES YouTube video id
    # Organizer-supplied video and poster, added 2026-09-09. Both page
    # languages link to this same artifact; its duration is not verified.
    url_en: &video_overview_url "https://notebook.google.com/notebook/29755b94-43c4-46ca-83b8-8cf0524f040c/artifact/4cd12b58-ba38-428b-9f0f-c16d76ce6bb7"
    url_es: *video_overview_url
    minutes_en: 0
    minutes_es: 0
    # A poster frame, committed under images/, shown while the video is still
    # a NotebookLM link: the section then looks like a video rather than
    # reading like one. One image for both languages -- the same choice
    # `infographics:` makes with `file` -- and the alt text per language,
    # because that is the part a screen reader actually reads out. The
    # YouTube embed, when it lands, wins over it: an embed carries its own
    # poster.
    thumb: "images/companion-video.png"
    thumb_alt_en: "Watch the NotebookLM video: Tensors Machine Learning, illustrated with stacked tensor slices."
    thumb_alt_es: "Ver el vídeo de NotebookLM: Tensors Machine Learning, ilustrado con cortes de un tensor apilados."

  # The Audio Overview, committed under media/. `_quarto.yml` carries
  # `media/**` in `resources:` so Quarto copies it verbatim, the same way it
  # copies the notebooks.
  audio:
    title_en: "Audio overview"
    title_es: "Resumen en audio"
    file_en: ""                       # TODO: e.g. media/companion-overview-en.mp3
    file_es: ""                       # TODO: e.g. media/companion-overview-es.mp3
    minutes_en: 2                     # 1:36 in NotebookLM
    minutes_es: 0                     # TODO
    # The same three-state ladder the video uses, for the same reason: the
    # committed file is the endpoint, and until it exists the artifact's own
    # NotebookLM link is a real thing to click rather than a note saying there
    # is nothing. `file_*` wins over `url_*` whenever both are set.
    url_en: "https://notebook.google.com/notebook/29755b94-43c4-46ca-83b8-8cf0524f040c/artifact/73a2479d-d5de-4884-b5e8-0c3635231634"
    url_es: ""                        # TODO: the ES audio artifact, if generated
    thumb: ""                         # TODO: e.g. images/companion-audio.png
    thumb_alt_en: ""
    thumb_alt_es: ""

  # Link-only artifacts. Leave at default_url until the real share link exists.
  #
  # Checked signed in on 2026-09-07: **every** artifact in this notebook has a
  # `/artifact/<uuid>` URL, the quiz and the flashcards and the Audio Overview
  # included. The Studio row's ⋮ menu offers only "View prompt and sources" for
  # those three, which makes them look unshareable from the notebook side —
  # but open the artifact page itself and there is a Copy link button on it
  # like any other. The ids below were read out of the Studio DOM and each was
  # then confirmed against its own page's og:title and og:image kind, so a
  # wrong id would have shown up as the wrong artifact rather than as a link
  # that merely happens to load.
  #
  # gen_tables.py still marks any card left sitting at `default_url`, because a
  # card headed "Self-check quiz" that lands you on a notebook has mis-sold the
  # click. Nothing here should need that any more.
  #
  # None of the three can be exported, so what a visitor gets here is a link
  # into NotebookLM and a Google sign-in. `thumb` is what makes that link
  # honest to look at: a screenshot of the artifact, committed under images/
  # and served from this site, so the page shows what is behind the link
  # before anyone spends an account on it. It is a *screenshot*, not the
  # artifact — the mind map is interactive and the quiz is endless, and
  # neither survives being turned into a PNG. The caption on each card says so.
  #
  # One image for both languages, matching `infographics:`; `thumb_alt_*` per
  # language, because that is the copy a screen reader reads out. A `thumb`
  # that is set must exist under images/ before it is listed here: check 3
  # resolves it like any other internal link and a missing PNG fails the build.
  quiz:
    title_en: "Self-check quiz"
    title_es: "Cuestionario de autoevaluación"
    url_en: "https://notebook.google.com/notebook/29755b94-43c4-46ca-83b8-8cf0524f040c/artifact/72379ae0-b758-4fa9-b203-b68ed934b59a"
    url_es: "https://notebook.google.com/notebook/29755b94-43c4-46ca-83b8-8cf0524f040c/artifact/72379ae0-b758-4fa9-b203-b68ed934b59a"
    thumb: "images/companion-quiz.png"
    thumb_alt_en: "The first of the quiz's twenty-six questions, as NotebookLM shows it: how an order-3 tensor is distinguished from a matrix, with four answers lettered A to D and a Hint button beside Next."
    thumb_alt_es: "La primera de las veintiséis preguntas del cuestionario, tal como la muestra NotebookLM: cómo se distingue un tensor de orden 3 de una matriz, con cuatro respuestas de la A a la D y un botón de pista junto a Siguiente."
  flashcards:
