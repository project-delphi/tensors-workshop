  x15:
    n: "15"
    slug: "generalized-cp"
    format_en: "deep dive"
    format_es: "estudio a fondo"
    format_line_en: "deep dive · take-home"
    format_line_es: "estudio a fondo · para después"
    title_en: "Generalized CP for counts and binary data"
    title_es: "CP generalizado para conteos y datos binarios"
    summary_en: "Squared error is a modelling assumption, not a definition of fit. Swap it for a Poisson or Bernoulli loss, decompose a real tensor of crime counts — including one component that turns out to be an artifact of the file — then hand the same objective to PyTorch and watch what momentum does to it."
    summary_es: "El error cuadrático es una hipótesis de modelado, no la definición de buen ajuste. Cámbialo por una pérdida de Poisson o Bernoulli, descompón un tensor real de conteos de delitos — incluida una componente que resulta ser un artefacto del fichero — y después entrégale el mismo objetivo a PyTorch para ver qué hace el momento con él."
    network_note_for: "data.cityofchicago.org"
    network_note_en: "3 MB, once"
    network_note_es: "3 MB, una vez"
    intro_en: |-
      Every decomposition so far has minimised squared error. Deep dive 14 did too. This one asks what that choice was actually assuming:

      > **Least squares is maximum likelihood under Gaussian noise of constant variance.**

      Counts are not that. The variance of a count grows with its mean, two cells in five are zero, and a Gaussian model will cheerfully predict −1.6 crimes. Binary data is not that either: a 0/1 tensor fitted by squared error predicts 1.27 and −0.26.

      **Generalized CP** keeps the CP model and replaces the loss, one element at a time. The factors are still what you read; the alternating structure still holds, because these losses stay convex in one factor with the others fixed. Only the question being asked of the data changes.

      The data is one calendar year of Chicago crime reports, aggregated into a tensor of day-of-week × hour × community area × crime type. One of the components we fit is not a pattern in the city at all.
    intro_es: |-
      > 🇪🇸 Todas las descomposiciones hasta ahora han minimizado el error cuadrático. El estudio a fondo 14 también. Este pregunta qué suponía en realidad esa elección:
      >
      > **Los mínimos cuadrados son máxima verosimilitud bajo ruido gaussiano de varianza constante.**
      >
      > Los conteos no son eso. La varianza de un conteo crece con su media, dos de cada cinco celdas son cero y un modelo gaussiano predecirá tan campante −1,6 delitos. Los datos binarios tampoco son eso: un tensor de 0 y 1 ajustado por error cuadrático predice 1,27 y −0,26.
      >
      > El **CP generalizado** conserva el modelo CP y sustituye la pérdida, elemento a elemento. Los factores siguen siendo lo que se lee; la estructura alterna sigue valiendo, porque estas pérdidas siguen siendo convexas en un factor con los demás fijos. Lo único que cambia es la pregunta que se le hace a los datos.
      >
      > Los datos son un año natural de informes de delitos de Chicago, agregados en un tensor de día de la semana × hora × área comunitaria × tipo de delito. Una de las componentes que ajustamos no es un patrón de la ciudad en absoluto.
    objectives_en:
      - "State what **squared error assumes** about the data, and name two kinds of data that break it."
      - "Write a **generalized CP** objective as an elementwise sum of a loss `f(x, m)`."
      - "Write the **Poisson** and **Bernoulli** losses and their gradients, and say what each one is for."
      - "Explain why the **alternating structure survives** the change of loss."
      - "Build a real order-4 count tensor from an aggregated query, not from a downloaded file."
      - "Fit **GCP-Poisson** to crime counts and read the day, hour, area and type profiles."
      - "Recognise a component that is an artifact of **how the data was recorded**, not of the world."
      - "Fit **GCP-Bernoulli** to the same data binarised, and say what the two fits disagree about."
      - "Write the objective in **PyTorch** and let autograd replace the gradient you derived by hand."
