# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for the whole site.
#
# Read three ways:
#   1. `{{< var … >}}` shortcodes in .qmd pages and both slide decks
#   2. scripts/gen_tables.py (section and README tables) and
#      scripts/gen_notebooks.py (the thirteen section notebooks plus the
#      take-home extra), which generate from it
#   3. scripts/check_links.py, which verifies the rendered output against it
#
# Change a value here and it changes everywhere. Do not hard-code these
# anywhere else — the EN and ES decks are kept in sync precisely because both
# read this file.
# ─────────────────────────────────────────────────────────────────────────────

repo:
  user: project-delphi
  name: tensors-workshop
  branch: main
  url: https://github.com/project-delphi/tensors-workshop
  colab_base: https://colab.research.google.com/github/project-delphi/tensors-workshop/blob/main/notebooks
  site: https://project-delphi.github.io/tensors-workshop
  # Standalone widgets, copied into docs/ via `resources: interactive/**`.
  # Not render targets: each is its own page, with `?lang=` for EN/ES, rather
  # than a Quarto wrapper. Root pages link them relatively; Spanish pages use a
  # raw <a href="../interactive/..."> so Quarto cannot rewrite the path out of
  # docs/. Notebooks use the absolute site URL.
  #
  # check_links.py fails the build if any of these is missing from the repo or
  # from docs/, which is what would happen if `interactive/**` fell out of
  # `resources:`. The vendored three.js is here for the same reason and cannot
  # be caught any other way: the visualizer imports it from inside a module
  # script, so there is no `src` attribute for check 3 to harvest.
  widgets:
    # The frame every widget page shares: palette, type, nav, the stage ink,
    # the panel card and the embed chrome. Linked by <link href>, which the harvest does see;
    # listed anyway because without it every widget renders unstyled.
    - interactive/widget-chrome.css
    # The site's two vendored typefaces (fonts/README.md), reached from a
    # `@font-face url()` in custom.scss and in widget-chrome.css. A url() is
    # CSS content, not an attribute, so the link harvest cannot see it --
    # these two lines are the only thing that would notice either file
    # failing to reach docs/, the way the cmu-serif lines below are for the
    # stages' labels.
    - fonts/fonts.css
    - fonts/inter-latin.woff2
    - fonts/source-serif-4-latin.woff2
    - interactive/tensor-visualizer.html
    - interactive/tensor-core.js
    - interactive/data/photos.json
    - interactive/broadcasting-simulator.html
    - interactive/vendor/three-boot.js
    - interactive/vendor/three-0.169.0.module.min.js
    - interactive/linalg-stage.html
    - interactive/linalg-core.js
    # The stage's drawing kit and its eight scenes, one per step, loaded
    # by plain <script src> lines the link harvest does see -- but listed
    # here anyway, because a scene that fails to reach docs/ is a step the
    # page throws on at boot, not a broken link.
    - interactive/linalg-kit.js
    - interactive/linalg-scenes/projection.js
    - interactive/linalg-scenes/wide.js
    - interactive/linalg-scenes/collapse.js
    - interactive/linalg-scenes/portal.js
    - interactive/linalg-scenes/ellipsoid.js
    - interactive/linalg-scenes/eigen.js
    - interactive/linalg-scenes/collinear.js
    - interactive/linalg-scenes/precision.js
    # The voice tensor stage: its page, its drawing kit and one file per
    # scene, loaded by plain <script src> lines the link harvest does see --
    # listed anyway, because a scene that fails to reach docs/ is a tab the
    # page throws on at boot, not a broken link.
    - interactive/voice-stage.html
    - interactive/voice-kit.js
    - interactive/voice-scenes/sample.js
    - interactive/voice-scenes/quantize.js
    - interactive/voice-scenes/array.js
    - interactive/voice-scenes/frame.js
    - interactive/voice-scenes/spectrum.js
    - interactive/voice-scenes/window.js
    - interactive/voice-scenes/scramble.js
    - interactive/voice-scenes/lowrank.js
    - interactive/voice-scenes/nmf.js
    - interactive/voice-scenes/batch.js
    # The attention stage: its page, its arithmetic, its drawing kit and one
    # file per scene, loaded by plain <script src> lines the link harvest
    # does see -- listed anyway, because a scene that fails to reach docs/ is
    # a step the page throws on at boot, not a broken link. No three.js and
    # no vendored asset: every picture on this stage is inline SVG.
    - interactive/attention-stage.html
    - interactive/attention-core.js
    - interactive/attention-kit.js
    - interactive/attention-scenes/tokens.js
    - interactive/attention-scenes/project.js
    - interactive/attention-scenes/heads.js
    - interactive/attention-scenes/scores.js
    - interactive/attention-scenes/softmax.js
    - interactive/attention-scenes/output.js
    - interactive/attention-scenes/batch.js
    # The arithmetic under the voice tensor stage, and the recording it
    # factors (interactive/vendor/README.md). The recording is fetched by
    # audio-core.js rather than named in any href, so the harvest cannot see
    # it either, and Appendix E's numbers depend on these exact bytes.
    - interactive/audio-core.js
    - interactive/vendor/voice.wav
    - interactive/vendor/beat.wav
    # The stage's serif, vendored (interactive/vendor/README.md). A
    # @font-face url is CSS content, which the harvest cannot see.
    - interactive/vendor/cmu-serif/cmu-serif-500-roman.woff2
    - interactive/vendor/cmu-serif/cmu-serif-500-italic.woff2
    # The post-processing addons and the CSS2D label renderer, resolved from
    # the bare specifier `three` by an import map in linalg-stage.html. A map
    # is element content rather than an attribute, so the link harvest cannot
    # see it either -- these lines are the only thing that would notice one of
    # them failing to reach docs/.
    - interactive/vendor/linalg-boot.js
    - interactive/vendor/three-0.169.0/examples/jsm/postprocessing/EffectComposer.js
    - interactive/vendor/three-0.169.0/examples/jsm/postprocessing/MaskPass.js
    - interactive/vendor/three-0.169.0/examples/jsm/postprocessing/OutputPass.js
    - interactive/vendor/three-0.169.0/examples/jsm/postprocessing/Pass.js
    - interactive/vendor/three-0.169.0/examples/jsm/postprocessing/RenderPass.js
    - interactive/vendor/three-0.169.0/examples/jsm/postprocessing/ShaderPass.js
    - interactive/vendor/three-0.169.0/examples/jsm/postprocessing/UnrealBloomPass.js
    - interactive/vendor/three-0.169.0/examples/jsm/renderers/CSS2DRenderer.js
    - interactive/vendor/three-0.169.0/examples/jsm/shaders/CopyShader.js
    - interactive/vendor/three-0.169.0/examples/jsm/shaders/LuminosityHighPassShader.js
    - interactive/vendor/three-0.169.0/examples/jsm/shaders/OutputShader.js
    # The Tucker & CP stage: its page, its arithmetic (pinned under npm test),
    # its drawing kit, and one file per scene, loaded by plain <script src>
    # lines the link harvest does see -- listed anyway, because a scene that
    # fails to reach docs/ is a picture the page throws on at boot, not a
    # broken link. No three.js: every picture here is SVG.
    - interactive/factor-stage.html
    - interactive/factor-core.js
    - interactive/factor-kit.js
    - interactive/factor-scenes/tensor.js
    - interactive/factor-scenes/unfold.js
    - interactive/factor-scenes/hosvd.js
    - interactive/factor-scenes/tucker.js
    - interactive/factor-scenes/rank1.js
    - interactive/factor-scenes/cp.js
    - interactive/factor-scenes/budget.js
    # The real taxi tensor (scripts/gen_figures.py taxi), fetched by a plain
    # relative path in factor-stage.html's own script -- the same reason
