# ── The files the notebooks download ─────────────────────────────────────────
# Every external file a notebook fetches at runtime, and what to call it in the
# Network column of the notebooks page. `match` is a fragment of the URL, which
# is what the notebooks build theirs from — several are split across string
# literals, so matching on a fragment is the only thing that works without
# reassembling them.
#
# This registry is what makes that table generated rather than hand-written,
# and it is worth saying why. The table used to be prose, and its rows for 09,
# 11, 12 and 13 sat rotated by an old section renumber for months: it told a
# student section 09 needed no network when 09 downloads a CSV, and that
# notebook 13 needed `tensorly`, which it never imports. Nothing compared it to
# the notebooks, because nothing could.
#
# `notebook_deps_table()` in gen_tables.py **exits** on a URL that matches no
# entry here. So a notebook that starts fetching something new fails the build
# until this list learns its name, rather than quietly dropping it from the
# column that tells a student whether they can work on a train.
