# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for the whole site.
#
# Read three ways:
#   1. `{{< var … >}}` shortcodes in .qmd pages and both slide decks
#   2. scripts/gen_tables.py (section and README tables) and
#      scripts/gen_notebooks.py (the twelve notebooks), which generate from it
#   3. scripts/check_links.py, which verifies the rendered output against it
#
# Change a value here and it changes everywhere. Do not hard-code these
# anywhere else — the EN and ES decks are kept in sync precisely because both
# read this file.
# ─────────────────────────────────────────────────────────────────────────────

repo:
  user: project-delphi
  name: tensors-workshop
  branch: main
  url: https://github.com/project-delphi/tensors-workshop
  colab_base: https://colab.research.google.com/github/project-delphi/tensors-workshop/blob/main/notebooks
  site: https://project-delphi.github.io/tensors-workshop

workshop:
  title_en: "Tensors for Machine Learning"
  title_es: "Tensores para Aprendizaje Automático"
  subtitle_en: "A 3-hour workshop, plus three Kahoot knowledge checks"
  subtitle_es: "Un taller de 3 horas, más tres controles de conocimiento con Kahoot"
  minutes: 195
  book: "[Deep Learning](https://www.deeplearningbook.org/contents/linear_algebra.html) (Goodfellow, Bengio & Courville), Chapter 2 — Linear Algebra"
  prereq_repo_url: "https://github.com/Laverde97/linear-algebra-deep-learning"

# ── Kahoot quizzes ───────────────────────────────────────────────────────────
# `url` is the live join/share link. It does not exist until the facilitator
# imports the .xlsx into kahoot.it (Create → Add question → Import → Import
# spreadsheet). Paste the three real URLs here and nothing else needs editing.
kahoot:
  join: "kahoot.it"
  # Replaced per quiz once each .xlsx has been imported and has a real
  # join link. The default is functional: students enter the PIN there.
  default_url: "https://kahoot.it/"
  q1:
    n: 1
    title_en: "Tensor Vocabulary & Shapes"
    title_es: "Vocabulario de tensores y formas"
    xlsx: "kahoot/kahoot_quiz_1_vocabulary_shapes.xlsx"
    url: "https://kahoot.it/"          # TODO: paste the Kahoot 1 join URL
    after: "04"
    covers: ["01", "03", "04"]
    questions: 6
  q2:
    n: 2
    title_en: "Einsum, Distance & the Pseudoinverse"
    title_es: "Einsum, distancia y la pseudoinversa"
    xlsx: "kahoot/kahoot_quiz_2_distance_pseudoinverse.xlsx"
    url: "https://kahoot.it/"          # TODO: paste the Kahoot 2 join URL
    after: "07"
    covers: ["06", "07"]
    questions: 6
  q3:
    n: 3
    title_en: "Convolution & Tensor Decompositions"
    title_es: "Convolución y descomposiciones tensoriales"
    xlsx: "kahoot/kahoot_quiz_3_convolution_decompositions.xlsx"
    url: "https://kahoot.it/"          # TODO: paste the Kahoot 3 join URL
    after: "10"
    covers: ["09", "10"]
    questions: 6

# ── Schedule ─────────────────────────────────────────────────────────────────
# What sits *between* the sections. The twelve sections come to 165 minutes;
# these two fill the remaining 30 and are the whole reason a section's `start`
# is not just the sum of the `minutes` before it. Each quiz already declares
# the section it follows (`kahoot.qN.after`), so only the breaks are listed.
schedule:
  quiz_minutes: 5
  break_minutes: 5
  # Sections after which the room takes a break. After 04 the break follows
  # Kahoot 1, which is why the agenda shows a single 10-minute block there.
  break_after: ["04", "06", "09"]

# ── Agenda ───────────────────────────────────────────────────────────────────
# The agenda table both decks show, one entry per row. Everything numeric —
# the start time, the duration and the Part column — is derived from
# `sections`, `kahoot` and `schedule` by scripts/timeline.py; only the label is
# written here, because the agenda abbreviates: two sections share one row as
# "Recursion · Convolution" rather than printing both full titles.
#
# `items` says what the row covers, in run order, using the ids the rest of the
# file already uses: "00".."11" for a section, "q1".."q3" for a quiz, and
# "break-NN" for the break `schedule.break_after` puts after section NN.
# Together the rows have to spell out the whole running clock — every section,
# quiz and break exactly once, in order — and timeline.py refuses to build the
# table otherwise, so a section cannot be added above without being placed here.
agenda:
  - items: ["00"]
    label_en: "Setup and welcome"
    label_es: "Preparación y bienvenida"
  - items: ["01"]
    label_en: "What a tensor is"
    label_es: "Qué es un tensor"
  - items: ["02"]
    label_en: "Thinking in N dimensions *(group)*"
    label_es: "Pensar en N dimensiones *(grupo)*"
  - items: ["03", "04"]
    label_en: "Indexing & broadcasting · Reshape & transpose"
    label_es: "Indexación y broadcasting · Reshape y transposición"
  - items: ["q1", "break-04"]
    label_en: "**Kahoot 1** + break"
    label_es: "**Kahoot 1** + pausa"
  - items: ["05"]
    label_en: "Video pipeline design *(group)*"
    label_es: "Diseño de un pipeline de vídeo *(grupo)*"
  - items: ["06"]
    label_en: "Contraction with einsum"
    label_es: "Contracción con einsum"
  - items: ["break-06"]
    label_en: "Break"
    label_es: "Pausa"
  - items: ["07"]
    label_en: "Inverses and the pseudoinverse"
    label_es: "Inversas y la pseudoinversa"
  - items: ["q2"]
    label_en: "**Kahoot 2**"
    label_es: "**Kahoot 2**"
  - items: ["08", "09"]
    label_en: "Recursion · Convolution"
    label_es: "Recursión · Convolución"
  - items: ["break-09"]
    label_en: "Break"
    label_es: "Pausa"
  - items: ["10"]
    label_en: "Tucker decomposition"
    label_es: "Descomposición de Tucker"
  - items: ["q3", "11"]
    label_en: "**Kahoot 3** + wrap-up"
    label_es: "**Kahoot 3** + cierre"

# ── Sections ─────────────────────────────────────────────────────────────────
# The section spine is the handbook's own 195-minute schedule table, breaks
# excluded. `n` is authoritative: it fixes the notebook filename prefix, the
# slide anchor (#sec-NN-slug) and the row order in every table on the site.
#
# `start` and `end` are the running clock offsets both decks print on the
# section title slides. They are derived — walk the sections in order, adding
# `schedule` time after the ones that are followed by a quiz or a break — but
# they are written out here rather than computed, because `{{< var >}}` can
# only look a value up, not add one. check_links.py recomputes them and fails
# if they have drifted, so editing a `minutes` without re-deriving is caught.
sections:
  s00:
    n: "00"
    slug: "setup-and-data"
    part: "—"
    minutes: 5
    start: "+00:00"
    end: "+00:05"
    format_en: "setup"
    format_es: "preparación"
    title_en: "Setup and welcome"
    title_es: "Preparación y bienvenida"
    summary_en: "Load every dataset and confirm your runtime works before anything else."
    summary_es: "Carga todos los conjuntos de datos y confirma que tu entorno funciona antes de empezar."
    objectives_en:
      - "Confirm your Colab runtime can reach every dataset the workshop uses."
      - "Know which data ships inside the libraries and which is downloaded."
      - "Recognise the shapes you will be working with all day."
    objectives_es:
      - "Confirmar que tu entorno de Colab puede acceder a todos los conjuntos de datos que usa el taller."
      - "Saber qué datos vienen incluidos en las librerías y cuáles se descargan."
      - "Reconocer las formas de los tensores con las que trabajarás durante todo el taller."
  s01:
    n: "01"
    slug: "what-a-tensor-is"
    part: "I"
    minutes: 20
    start: "+00:05"
    end: "+00:25"
    format_en: "demo"
    format_es: "demostración"
    title_en: "What a tensor is"
    title_es: "Qué es un tensor"
    summary_en: "Learn to read a tensor's structure and track what its axes mean as you fix, rearrange, or contract them."
    summary_es: "Aprender a leer la estructura de un tensor y seguir el significado de sus ejes al fijarlos, reorganizarlos o contraerlos."
    objectives_en:
      - "Explain order, axis/mode and shape, and distinguish tensor order from matrix/tensor rank."
      - "Read `.shape`, `.ndim` and `.size` and explain what every axis means on real image data."
      - "Predict how slices, fibers, unfolding and contraction change or preserve axes."
      - "Use `np.einsum` for a dot product and matrix multiplication and reason about the output shape."
    objectives_es:
      - "Explicar orden, eje/modo y forma, y distinguir el orden tensorial del rango matricial/tensorial."
      - "Leer `.shape`, `.ndim` y `.size` e interpretar qué significa cada eje en datos reales de imágenes."
      - "Predecir cómo cortes, fibras, unfolding y contracción cambian o conservan los ejes."
      - "Usar `np.einsum` para un producto escalar y una multiplicación matricial, razonando sobre la forma de salida."
  s02:
    n: "02"
    slug: "thinking-in-n-dimensions"
    part: "II"
    minutes: 20
    start: "+00:25"
    end: "+00:45"
    format_en: "group"
    format_es: "grupo"
    title_en: "Thinking in N dimensions"
    title_es: "Pensar en N dimensiones"
    summary_en: "Learn to read real tensors by asking what every axis counts and why a batch axis is not the same thing as a time axis."
    summary_es: "Aprender a leer tensores reales preguntando qué cuenta cada eje y por qué un eje de lote no significa lo mismo que un eje temporal."
    objectives_en:
      - "Read the order and shape of real image and video tensors and explain what each axis counts."
      - "Compare two real tensors with the same shape but different axis semantics."
      - "Show with real data why shuffling a batch can be valid while shuffling time changes the data's meaning."
      - "Build a padded order-5 batch from real video clips of different lengths and carry a validity mask."
    objectives_es:
      - "Leer el orden y la forma de tensores reales de imágenes y video y explicar qué cuenta cada eje."
      - "Comparar dos tensores reales con la misma forma pero con distinta semántica en sus ejes."
      - "Demostrar con datos reales por qué reorganizar un lote puede ser válido mientras reorganizar el tiempo cambia el significado de los datos."
      - "Construir un lote rellenado de orden 5 a partir de clips de video reales de distintas longitudes y mantener una máscara de validez."
  s03:
    n: "03"
    slug: "indexing-and-broadcasting"
    part: "III"
    minutes: 15
    start: "+00:45"
    end: "+01:00"
    format_en: "exercise"
    format_es: "ejercicio"
    title_en: "Indexing and broadcasting real data"
    title_es: "Indexación y broadcasting con datos reales"
    summary_en: "Select named measurements from real tumour-sample data, compare meaningful subsets, then standardize real image data safely."
    summary_es: "Seleccionar medidas reales por nombre, comparar subconjuntos con máscaras booleanas y detectar píxeles de varianza cero."
    objectives_en:
      - "Select a named column of real data by name, never by a hard-coded number."
      - "Use fancy indexing and boolean masks to select meaningful subsets of rows."
      - "Standardize a real data matrix with broadcasting."
      - "Recognise zero-variance pixels and explain why real image datasets can contain them."
    objectives_es:
      - "Seleccionar una columna de datos reales por su nombre, nunca mediante un número escrito manualmente."
      - "Usar fancy indexing y máscaras booleanas para seleccionar subconjuntos significativos de filas."
      - "Estandarizar una matriz de datos reales mediante broadcasting."
      - "Reconocer píxeles de varianza cero y explicar por qué los conjuntos de imágenes reales pueden contenerlos."
  s04:
    n: "04"
    slug: "reshape-and-transpose"
    part: "III"
    minutes: 15
    start: "+01:00"
    end: "+01:15"
    format_en: "exercise"
    format_es: "ejercicio"
    title_en: "Reshape and transpose real images"
    title_es: "Reshape y transposición de imágenes reales"
    summary_en: "Use real images to move between HWC↔CHW and NHWC↔NCHW, then show why matching shapes do not guarantee matching axis semantics."
    summary_es: "Reordenar ejes correctamente en imágenes y lotes reales, y comprobar por qué `reshape` puede conservar la forma mientras destruye el significado."
    objectives_en:
      - "Convert a real RGB image between `(H, W, C)` and `(C, H, W)` with `np.transpose`."
      - "Build a batch from three distinct real RGB images and convert NHWC to NCHW."
      - "Explain why two axes with the same size cannot be identified from shape alone."
      - "Demonstrate on a real image why `reshape` can run without error and still scramble the data."
    objectives_es:
      - "Convertir una imagen RGB real entre `(H, W, C)` y `(C, H, W)` con `np.transpose`."
      - "Construir un lote con tres imágenes RGB reales distintas y convertir NHWC a NCHW."
      - "Explicar por qué dos ejes con el mismo tamaño no pueden identificarse únicamente a partir de la forma."
      - "Demostrar sobre una imagen real por qué `reshape` puede ejecutarse sin error y aun así desorganizar los datos."
  s05:
    n: "05"
    slug: "video-pipeline-design"
    part: "III"
    minutes: 15
    start: "+01:25"
    end: "+01:40"
    format_en: "group"
    format_es: "grupo"
    title_en: "Video pipeline design"
    title_es: "Diseño de un pipeline de vídeo"
    summary_en: "Process one pinned real video end to end, then use what its axes actually mean to design two downstream video pipelines."
    summary_es: "Convertir un archivo de vídeo real en un tensor, observar qué se pierde al muestrear fotogramas y diseñar formas tensoriales que respeten el significado del tiempo."
    objectives_en:
      - "Decode a pinned real video file into an order-4 tensor and name every axis."
      - "Measure how much temporal information a frame-sampling decision keeps and discards."
      - "Design tensor shapes for video-level and timestep-level prediction systems."
      - "Explain the memory trade-off between padding variable-length clips and fixed-frame sampling."
    objectives_es:
      - "Decodificar un archivo de vídeo real y verificado en un tensor de orden 4, nombrando cada eje."
      - "Medir cuánta información temporal conserva y descarta una decisión de muestreo de fotogramas."
      - "Diseñar formas tensoriales para sistemas de predicción a nivel de vídeo y a nivel de timestep."
      - "Explicar el compromiso de memoria entre rellenar clips de longitud variable y muestrear un número fijo de fotogramas."
  s06:
    n: "06"
    slug: "contraction-with-einsum"
    part: "IV"
    minutes: 15
    start: "+01:40"
    end: "+01:55"
    format_en: "exercise"
    format_es: "ejercicio"
    title_en: "Contraction with einsum"
    title_es: "Contracción con einsum"
    summary_en: "Use one index rule on real data, then change the inputs interactively to test which index disappears."
    summary_es: "Aprender una sola regla de índices, comprobarla con datos reales y cambiar las entradas de forma interactiva para identificar qué índice desaparece."
    objectives_en:
      - "Explain the `einsum` rule: indices missing after `->` are summed over; indices that remain are kept."
      - "Contract the colour axis of a real microscopy image and explain what the RGB sliders change — and what they do not change."
      - "Read trace, transpose and matrix multiplication as index operations on pixel patches cut from real handwritten digits."
      - "Build all 3,229,209 pairwise similarities between 1,797 real digit images and explore retrieval with cosine similarity versus raw dot product."
    objectives_es:
      - "Explicar la regla de `einsum`: los índices que desaparecen después de `->` se suman; los que permanecen se conservan."
      - "Contraer el eje de color de una imagen real de microscopía y explicar qué cambian los sliders RGB y qué no cambian."
      - "Interpretar la traza, la transposición y el producto matricial como operaciones sobre índices usando recortes de píxeles de dígitos manuscritos reales."
      - "Construir las 3.229.209 similitudes por pares entre 1.797 imágenes reales de dígitos y explorar la recuperación con similitud coseno frente al producto punto crudo."
  s07:
    n: "07"
    slug: "inverses-and-pseudoinverse"
    part: "IV"
    minutes: 15
    start: "+02:00"
    end: "+02:15"
    format_en: "exercise"
    format_es: "ejercicio"
    title_en: "Inverses and the pseudoinverse"
    title_es: "Inversas y la pseudoinversa"
    summary_en: "Use the pseudoinverse on real singular, tall, and wide systems, then inspect the geometry interactively."
    summary_es: "Usar la pseudoinversa en sistemas reales singulares, altos y anchos, e inspeccionar su geometría de forma interactiva."
    objectives_en:
      - "Diagnose whether a real-data square matrix is invertible and explain why duplicated information makes it singular."
      - "Compute the Moore-Penrose pseudoinverse and verify its four defining conditions."
      - "Explain the difference between wide, square, and tall systems using real California housing observations."
      - "Solve a real 20,433-by-7 least-squares problem and interpret the residual rather than pretending an exact solution exists."
      - "Unfold a real image tensor, solve a wide system with the pseudoinverse, and fold the minimum-norm solution back into an image."
    objectives_es:
      - "Diagnosticar si una matriz cuadrada construida con datos reales es invertible y explicar por qué duplicar información produce singularidad."
      - "Calcular la pseudoinversa de Moore-Penrose y verificar sus cuatro condiciones definitorias."
      - "Explicar la diferencia entre sistemas anchos, cuadrados y altos usando observaciones reales de vivienda en California."
      - "Resolver un problema real de mínimos cuadrados de 20.433 por 7 e interpretar el residuo en lugar de suponer una solución exacta."
      - "Desplegar un tensor real de imágenes, resolver un sistema ancho con la pseudoinversa y volver a plegar la solución de norma mínima."
  s08:
    n: "08"
    slug: "recursion-with-matrices"
    part: "IV"
    minutes: 10
    start: "+02:20"
    end: "+02:30"
    format_en: "demo"
    format_es: "demostración"
    title_en: "Recursion with matrices and vectors"
    title_es: "Recursión con matrices y vectores"
    summary_en: "Treat recursion as repeated state updates, connect repeated multiplication with dominant eigen-directions, and test recursive forecasting on real airline-passenger data."
    summary_es: "Entender una recurrencia como una actualización de estado repetida, observar cuándo domina una dirección propia y comprobar qué ocurre cuando un pronóstico reutiliza sus propias predicciones."
    objectives_en:
      - "Write a recurrence as a repeated state update `x[t+1] = A @ x[t]`."
      - "Explain why repeated multiplication can align a state with a dominant eigenvector."
      - "Use a controlled synthetic matrix to see how the eigenvalue ratio controls convergence speed."
      - "Fit a real autoregressive model with the pseudoinverse and feed its own predictions back in."
      - "Diagnose why recursive forecast error can compound with horizon."
    objectives_es:
      - "Escribir una recurrencia como una actualización repetida del estado `x[t+1] = A @ x[t]`."
      - "Explicar por qué las multiplicaciones repetidas pueden alinear un estado con un autovector dominante."
      - "Usar una matriz sintética controlada para observar cómo la razón entre autovalores controla la velocidad de convergencia."
      - "Ajustar un modelo autorregresivo real con la pseudoinversa y reutilizar sus propias predicciones como entradas."
      - "Diagnosticar por qué el error de un pronóstico recursivo puede acumularse con el horizonte."
  s09:
    n: "09"
    slug: "convolution-and-deconvolution"
    part: "IV"
    minutes: 15
    start: "+02:30"
    end: "+02:45"
    format_en: "exercise"
    format_es: "ejercicio"
    title_en: "Convolution and deconvolution"
    title_es: "Convolución y deconvolución"
    summary_en: "Treat convolution as a structured linear operator, separate it from correlation, understand transposed convolution, and partially recover a real blurred image."
    summary_es: "Ver la convolución como un operador lineal estructurado, distinguir correlación de convolución, entender la convolución transpuesta y recuperar parcialmente una imagen real desenfocada."
    objectives_en:
      - "Predict `full`, `same`, and `valid` output shapes for a real image and verify them interactively."
      - "Explain why deep-learning convolution is usually cross-correlation and show the kernel-flip relationship."
      - "Write a 1D convolution of a real image scanline as multiplication by a Toeplitz matrix."
      - "Explain transposed convolution as an overlap-add linear operator that changes shape but is not a true inverse."
      - "Recover a real blurred image with Richardson-Lucy and measure improvement away from boundary artifacts."
    objectives_es:
      - "Predecir los tamaños de salida `full`, `same` y `valid` para una imagen real y verificarlos de forma interactiva."
      - "Explicar por qué la convolución en deep learning suele ser correlación cruzada y mostrar la relación mediante el volteo del kernel."
      - "Escribir una convolución 1D de una fila real de píxeles como multiplicación por una matriz Toeplitz."
      - "Explicar la convolución transpuesta como un operador lineal de superposición y suma que cambia la forma pero no es una inversa verdadera."
      - "Recuperar una imagen real desenfocada con Richardson-Lucy y medir la mejora lejos de los artefactos de borde."
  s10:
    n: "10"
    slug: "tucker-decomposition"
    part: "IV"
    minutes: 15
    start: "+02:50"
    end: "+03:05"
    format_en: "exercise"
    format_es: "ejercicio"
    title_en: "Tucker decomposition on real data"
    title_es: "Descomposición de Tucker con datos reales"
    summary_en: "Build a real tensor from New York taxi trips, compress each mode with HOSVD, and explore the trade-off between size, reconstruction error, and interpretable structure."
    summary_es: "Construir un tensor real de viajes en taxi, comprimir cada modo con HOSVD y explorar el compromiso entre tamaño, error e interpretación."
    objectives_en:
      - "Build and interpret a genuine order-3 tensor from a flat table of real trips."
      - "Unfold the tensor along each mode and explain what information each matricization exposes."
      - "Compute Tucker/HOSVD using only unfolding, SVD, and `einsum`."
      - "Change the rank of each mode independently and measure reconstruction error versus compression."
      - "Read the temporal factor matrix and connect a learned component back to real hourly taxi activity."
    objectives_es:
      - "Construir e interpretar un tensor real de orden 3 a partir de una tabla plana de viajes reales."
      - "Desplegar el tensor a lo largo de cada modo y explicar qué información expone cada matricización."
      - "Calcular Tucker/HOSVD usando únicamente unfolding, SVD y `einsum`."
      - "Cambiar el rango de cada modo de manera independiente y medir el error de reconstrucción frente a la compresión."
      - "Interpretar la matriz de factores temporales y relacionar un componente aprendido con la actividad horaria real de los taxis."
  s11:
    n: "11"
    slug: "wrap-up-and-take-homes"
    part: "—"
    minutes: 5
    start: "+03:10"
    end: "+03:15"
    format_en: "wrap-up"
    format_es: "cierre"
    title_en: "Wrap-up and take-homes"
    title_es: "Cierre y ejercicios para casa"
    summary_en: "What connects Blocks 4, 5 and 6, plus five take-home exercises."
    summary_es: "Qué conecta los bloques 4, 5 y 6, más cinco ejercicios para casa."
    objectives_en:
      - "State the one idea that connects the pseudoinverse, deconvolution and Tucker."
      - "Find the scaling trap in PCA on real, unstandardized data (take-home A)."
      - "Build attention out of two contractions, and mask padded positions (take-home B)."
      - "Run a real CP decomposition and read its components as trip types nobody labelled (take-home C)."
      - "Build correlated data from independent noise with Cholesky, and see why ignoring covariance understates portfolio risk (take-home D)."
      - "Denoise a real voice recording by truncating the SVD of its STFT, and measure the result in SNR rather than by ear (take-home E)."
      - "Trade parameter count against reconstruction error with a rank slider, on a real dense tensor (optional appendix)."
    objectives_es:
      - "Enunciar la idea común que conecta la pseudoinversa, la deconvolución y Tucker."
      - "Identificar la trampa de escala de PCA sobre datos reales sin estandarizar (take-home A)."
      - "Construir atención mediante dos contracciones y enmascarar las posiciones de padding (take-home B)."
      - "Ejecutar una descomposición CP real e interpretar sus componentes como tipos de viajes que nadie etiquetó previamente (take-home C)."
      - "Construir datos correlacionados a partir de ruido independiente con Cholesky y observar por qué ignorar la covarianza subestima el riesgo de portafolio (take-home D)."
      - "Eliminar ruido de una grabación de voz real truncando la SVD de su STFT y medir el resultado con SNR en lugar de evaluarlo solo de oído (take-home E)."
      - "Comparar número de parámetros y error de reconstrucción mediante un slider de rango sobre un tensor denso real (apéndice opcional)."
