    thumb: "images/companion-flashcards.png"
    thumb_alt_en: "Card one of sixty, face up: what is the geometric interpretation of a vector in linear algebra, with a See answer prompt underneath and the got-it and missed-it counters below the card."
    thumb_alt_es: "La primera de sesenta tarjetas, por la cara delantera: cuál es la interpretación geométrica de un vector en álgebra lineal, con la indicación Ver respuesta debajo y los contadores de acertadas y falladas bajo la tarjeta."
  # One mind map, generated from the EN sources, linked from both pages — the
