    slug: "cp-factorization"
    format_en: "deep dive"
    format_es: "estudio a fondo"
    format_line_en: "deep dive · take-home"
    format_line_es: "estudio a fondo · para después"
    title_en: "CP factorization and the rank-1 view"
    title_es: "Factorización CP y la vista de rango 1"
    summary_en: "Read a CP component as one vector per axis, fit it by alternating least squares, constrain it to be non-negative, and watch real neural recordings sort themselves by a label the method never saw."
    summary_es: "Leer una componente CP como un vector por eje, ajustarla con mínimos cuadrados alternos, restringirla a valores no negativos y ver cómo grabaciones neuronales reales se ordenan solas según una etiqueta que el método nunca vio."
    network_note_for: "tensor_data_monkey_bmi"
    network_note_en: "5 MB, once"
    network_note_es: "5 MB, una vez"
    intro_en: |-
      Section 11 fits a CP decomposition and compares its storage against Tucker's. This deep dive asks the other question:

      > **What is a single CP component, and what can you read off it?**

      The answer is the reason people reach for CP rather than Tucker. One component is one vector per axis, and each of those vectors is a profile over its own axis — where it peaks, where it dips, and what that means. A Tucker core mixes every basis vector with every other, so there is no component to read.

      We will fit CP **by hand**, because the way it is fitted is the lesson. The problem is not convex in all the factors at once. Fix every factor but one and it becomes an ordinary least-squares problem — the one from section 07 — with a closed-form answer. That is **alternating least squares**, and it is the whole algorithm.

      The data is Tamara Kolda's own demo tensor: 43 neurons × 200 time steps × 88 trials, recorded while a monkey moved a cursor to one of four targets.
    intro_es: |-
      > 🇪🇸 La sección 11 ajusta una descomposición CP y compara su almacenamiento con el de Tucker. Este estudio a fondo hace la otra pregunta:
      >
      > **¿Qué es una sola componente CP y qué puedes leer en ella?**
      >
      > La respuesta es la razón por la que se elige CP antes que Tucker. Una componente es un vector por eje, y cada uno de esos vectores es un perfil sobre su propio eje: dónde sube, dónde baja y qué significa eso. El núcleo de Tucker mezcla cada vector base con todos los demás, así que no hay componente que leer.
      >
      > Ajustaremos CP **a mano**, porque la forma de ajustarlo es la lección. El problema no es convexo en todos los factores a la vez. Fija todos los factores menos uno y se convierte en un problema de mínimos cuadrados corriente — el de la sección 07 — con solución cerrada. Eso es **mínimos cuadrados alternos**, y es todo el algoritmo.
      >
      > Los datos son el tensor de demostración de la propia Tamara Kolda: 43 neuronas × 200 instantes × 88 ensayos, grabados mientras un mono movía un cursor hacia uno de cuatro objetivos.
    objectives_en:
      - "Write a **rank-1 tensor** as an outer product `a ∘ b ∘ c` and say what each vector means."
      - "Read **peaks and troughs** in a factor vector as a profile over that vector's own axis."
      - "Explain why CP gives you components to read and **Tucker does not**."
      - "Fix two factors and recognise the third subproblem as the **least squares** of section 07."
      - "Implement **alternating least squares** yourself with a Khatri–Rao product and a pseudoinverse."
      - "Explain why **non-negativity** changes the subproblem to NNLS and keeps it convex."
      - "Fit non-negative CP to a real neural tensor and find a behavioural variable **the method never saw**."
      - "Tell **essential uniqueness** apart from what a run of ALS actually returns."
    objectives_es:
      - "Escribir un **tensor de rango 1** como producto exterior `a ∘ b ∘ c` y decir qué significa cada vector."
      - "Leer los **picos y valles** de un vector factor como un perfil sobre su propio eje."
      - "Explicar por qué CP da componentes que se pueden leer y **Tucker no**."
