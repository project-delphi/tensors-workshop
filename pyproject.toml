# The Python environments this repo needs, in one place.
#
# There is no package here to build and nothing to import — `tool.uv.package =
# false` says so, and uv then treats this file as a description of environments
# rather than of a distribution. What it buys is that every documented command
# names a group instead of spelling out a dependency list:
#
#     uv run --group notebooks jupyter lab          # run the notebooks locally
#     uv run --group site python scripts/gen_tables.py
#     uv run --group figures python scripts/gen_figures.py
#
# Floors, not pins. A workshop that runs on Colab wants a local environment
# that tracks Colab rather than one frozen away from it, so each bound says
# "older than this and it breaks" and nothing says "exactly this". There is no
# committed lockfile for the same reason.

[project]
name = "tensors-workshop"
version = "0"
description = "A 210-minute bilingual workshop on tensors"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]

# GENERATED by scripts/gen_tables.py, read off what the notebooks import.
# Do not edit by hand — add the import to a notebook and regenerate.
# `tensorly` and `imageio` are absent on purpose: the notebooks that need them
# install them for themselves with `%pip`, which is what the dagger in the
# "what each notebook needs" table means.
notebooks = [
# BEGIN notebooks-group
  "numpy>=1.26",
  "matplotlib>=3.8",
  "ipywidgets>=8.1",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "pillow>=10.2",
  "torch>=2.2",
  "jupyterlab>=4.1",
# END notebooks-group
]

# The generators and the checker: scripts/gen_tables.py, gen_notebooks.py,
# check_links.py, timeline.py. Deliberately tiny — none of them executes a
# notebook or touches the scientific stack.
site = [
  "pyyaml>=6.0",
  "nbformat>=5.10",
]

# The test suite. NumPy drives the tiny worked counterexamples and feedback
# tests; SciPy checks convolution feedback against real convolution routines.
test = [
  {include-group = "site"},
  "numpy>=1.26",
  "scipy>=1.11",
]

# The image generators. Network and a scientific stack, which is why CI does
# not run them (see AGENTS.md) and why they are not in `site`.
# scripts/gen_slide_art.py is not here: it needs Chrome, not Python packages.
figures = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pillow>=10.2",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4.9",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
]

# Executes the notebooks: scripts/test_notebooks.py. Kept out of `test`, which
# is deliberately kernel-free, and out of the generated `notebooks` group
# above -- that one is read off the notebooks' own imports and must not be
# hand-edited. `tensorly` and `imageio` are absent on purpose: the notebooks
# %pip-install them for themselves, exactly as they do in Colab, and that
# install is part of what this group exists to exercise.
#
# `pip` is not redundant here. A uv virtualenv ships without it, and `%pip
# install` shells out to `sys.executable -m pip` -- so without this line the
# install cells fail silently, with no traceback and no cell error, leaving a
# later `import tensorly` to fail for a reason that names nothing useful.
execute = [
  {include-group = "notebooks"},
  "nbclient>=0.10",
  "ipykernel>=6.29",
  "pip>=24",
]
