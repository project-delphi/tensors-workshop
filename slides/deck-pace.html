<!--
  Audience-facing pace chrome for both decks, pulled in by `include-after-body`.

  Two things reveal does not give you for free:

    1. A timer the *room* can see. Reveal has `totalTime`, but it drives the
       speaker view only — the students never see it, and neither does anyone
       watching a recording.
    2. A breadcrumb saying which section is on screen. The deck's `footer:` is
       a single global string; there is no per-section variant.

  One file serves EN and ES: everything language-dependent is chosen off
  <html lang>, so the two decks cannot drift the way two copies would. All
  styling lives in slides.scss — this file only builds nodes and keeps them
  current.
-->
<script>
(function () {
  "use strict";

  // The whole workshop, in seconds: 195 minutes. This is the one place it is
  // written — Quarto has no passthrough for reveal's `totalTime`, so setting it
  // in the deck header does nothing (it silently never reaches the config).
  // We hand it to Reveal.configure() below, which drives the speaker view's
  // pacing clock as well as the audience timer here. check_links.py fails if
  // this stops matching workshop.minutes in _variables.yml.
  var TOTAL_SECONDS = 11700;

  // Survives a reload — a facilitator who refreshes mid-workshop should not
  // silently get a clock that restarts at zero. sessionStorage rather than
  // localStorage so opening the deck again tomorrow starts fresh.
  var STORAGE_KEY = "tensors-workshop-deck-start";

  // sessionStorage lives until the *tab* closes, not until the workshop ends.
  // Open the deck in the morning to check it, leave the tab open, present
  // from it that afternoon, and the room's first sight of the timer would be
  // hours into the amber. Anything this old is a leftover, not a session.
  var STALE_AFTER_SECONDS = 11700 * 2;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // Always minutes and seconds; hours only once there are any. The remaining
  // side of a 195-minute workshop is over an hour for most of the room's day,
  // and "182:26" is harder to read at a glance than "3:02:26".
  function hms(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    return h ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
  }

  // Reveal may or may not have finished initialising when an after-body script
  // runs, depending on how fast the deck's own assets load. Cover all three
  // orderings rather than betting on one.
  function whenReady(fn) {
    if (window.Reveal && Reveal.isReady && Reveal.isReady()) { fn(); return; }
    if (window.Reveal && Reveal.on) { Reveal.on("ready", fn); return; }
    setTimeout(function () { whenReady(fn); }, 50);
  }

  whenReady(function () {
    var reveal = document.querySelector(".reveal");
    if (!reveal) { return; }

    var es = (document.documentElement.lang || "en").slice(0, 2) === "es";
    var total = TOTAL_SECONDS;
    // Gives the speaker view the same *total* the room is counting against.
    // Not the same clock: reveal's pacing timer starts when reveal does,
    // while the one below starts from the stored value, so a reset here does
    // not move the speaker view's.
    if (Reveal.configure) { Reveal.configure({ totalTime: total }); }

    // ── The timer ───────────────────────────────────────────────────────
    // Top right, because reveal puts *everything* along the bottom edge: the
    // footer, the slide number, the controls, and the progress bar (which is
    // `bottom: 0` in reveal.css, not top). The top edge is the only one free.
    var timer = document.createElement("div");
    timer.className = "deck-timer";
    timer.title = es
      ? "Tiempo transcurrido y restante · clic para reiniciar"
      : "Elapsed and remaining time · click to reset";

    var elapsedEl = document.createElement("span");
    elapsedEl.className = "deck-timer-elapsed";
    var remainingEl = document.createElement("span");
    remainingEl.className = "deck-timer-remaining";
    timer.appendChild(elapsedEl);
    timer.appendChild(remainingEl);
    reveal.appendChild(timer);

    function readStart() {
      try {
        var stored = window.sessionStorage.getItem(STORAGE_KEY);
        if (stored) {
          var n = parseInt(stored, 10);
          if (!isNaN(n) && (Date.now() - n) / 1000 < STALE_AFTER_SECONDS) {
            return n;
          }
        }
      } catch (e) { /* private windows throw on access, not just on write */ }
      return null;
    }

    function writeStart(value) {
      try { window.sessionStorage.setItem(STORAGE_KEY, String(value)); }
      catch (e) { /* the timer still works, it just won't survive a reload */ }
    }

    var startedAt = readStart();
    if (startedAt === null) { startedAt = Date.now(); writeStart(startedAt); }

    function tick() {
      var elapsed = (Date.now() - startedAt) / 1000;
      var remaining = total - elapsed;
      var over = remaining < 0;
      elapsedEl.textContent = hms(elapsed);
      remainingEl.textContent =
        (over ? "+" : "") + hms(Math.abs(remaining)) +
        (es ? (over ? " de más" : " restante") : (over ? " over" : " left"));
      timer.classList.toggle("over", over);
    }

    // Clicking resets, for the gap between opening the deck and actually
    // starting. A click rather than a key: every unclaimed letter is one
    // reveal might bind later, and a mis-hit there would change slide.
    timer.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      startedAt = Date.now();
      writeStart(startedAt);
      tick();
    });

    tick();
    setInterval(tick, 1000);

    // ── The section breadcrumb ──────────────────────────────────────────
    // Walk every section in document order, not just the top-level ones.
    // Historically the rendered HTML was flat — a level-1 title slide, then
    // its level-2 slides as siblings — with reveal's init wrapping each
    // group in a `.stack` to make it a vertical column, so by the time this
    // runs the level-1 slides sit one level down. Since issue #45's redesign
    // (31 flat, image-backed slides per deck, every slide a plain `##`
    // level-2 background-image block) only the 15 section/Kahoot divider
    // slides carry the intentional `h1.sr-only` marker, so detection keys
    // off that specific element rather than the level. Deliberately not a
    // bare "h1, h2": an ordinary content slide has no heading of its own —
    // its `##` line carries only slide attributes — but matching any h2 on
    // principle would be one accidental heading away from manufacturing a
    // false section break.
    var slides = reveal.querySelectorAll(".slides section");
    var crumbText = "";
    Array.prototype.forEach.call(slides, function (slide) {
      // `.stack` wrappers are neither level, and must not take a crumb.
      var isSlide = slide.classList.contains("level1") ||
                    slide.classList.contains("level2");
      var heading = slide.querySelector("h1.sr-only");
      if (heading) {
        var title = heading.textContent.trim();
        // Drop the "01 · " prefix: the slide number already tells the room
        // where it is, and the part is about to be spelled out anyway.
        title = title.replace(/^\d+\s*·\s*/, "");
        // A hidden marker on the divider slide, not an attribute on the
        // heading: a var shortcode inside a heading's `{...}` is not parsed
        // as an attribute at all, and takes the #sec-NN anchor down with it.
        // (Quarto runs its shortcode parser over this file too, so the
        // shortcode cannot be written out literally here either.) Kahoot
        // dividers carry no `.sec-part` at all, so they fall straight to the
        // plain-title branch below.
        var marker = slide.querySelector(".sec-part");
        var part = marker ? marker.textContent.trim() : "";
        // Sections 00 and 11 sit outside the four parts and carry "—".
        crumbText = (part && part !== "—")
          ? (es ? "Parte " : "Part ") + part + ": " + title
          : title;
      }
      if (isSlide) { slide.dataset.crumb = crumbText; }
    });

    var footer = document.querySelector(".reveal .footer");
    var crumb = null;
    if (footer) {
      crumb = document.createElement("span");
      crumb.className = "deck-crumb";
      // Into the footer's <p>, not the footer itself: quarto wraps the footer
      // text in a paragraph, and a span placed beside a block element gets
      // its own line — the crumb would sit on a row above the links.
      var host = footer.querySelector("p") || footer;
      host.insertBefore(crumb, host.firstChild);
    }

    // The three Kahoot dividers paint themselves #b3541e. Quarto flips its own
    // footer and slide number to light text on a slide like that, but the
    // timer hangs off `.reveal` rather than off the slide, so nothing would
    // ever tell it — and it would sit navy-on-orange for the whole quiz.
    //
    // Measured off the painted colour, NOT off reveal's `has-dark-background`
    // class. That class is set once at init from the computed background, and
    // if the theme CSS has not applied by then reveal reads every slide as
    // transparent and marks the whole deck dark — the failure CLAUDE.md
    // describes. Trusting it would turn the timer white on a white slide on
    // exactly those loads.
    function isDark(element) {
      var match = element
        ? getComputedStyle(element).backgroundColor.match(/rgba?\(([^)]+)\)/)
        : null;
      if (!match) { return false; }
      var parts = match[1].split(",").map(parseFloat);
      // Fully transparent means nothing was painted over the deck's own
      // background, and that is #ffffff.
      if (parts.length > 3 && parts[3] === 0) { return false; }
      // Rec. 601 luma, the same rough split reveal uses.
      var luma = (parts[0] * 299 + parts[1] * 587 + parts[2] * 114) / 1000;
      return luma < 128;
    }

    function updateContrast() {
      var slide = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
      var background = (slide && Reveal.getSlideBackground)
        ? Reveal.getSlideBackground(slide) : null;
      timer.classList.toggle("has-dark-background", isDark(background));
    }

    function updateChrome() {
      updateContrast();
      if (!crumb) { return; }
      // getCurrentSlide() returns the slide itself, never its `.stack`, so
      // the label tagged on above is already the right one.
      var slide = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
      var text = (slide && slide.dataset) ? (slide.dataset.crumb || "") : "";
      crumb.textContent = text;
      // Empty on the opening slides: an empty span would still draw its
      // separator and leave a bullet floating at the start of the footer.
      crumb.classList.toggle("empty", text === "");
    }

    Reveal.on("slidechanged", updateChrome);
    updateChrome();

    // ── The Colab panel ─────────────────────────────────────────────────
    // The .colab-tab links in the qmd are the canonical source of notebook
    // URLs; this panel promotes them to one audience-facing control and keeps
    // the right notebook reachable across a whole section, not only on the
    // slide that happens to carry the link.
    //
    // Which slides get which notebook is derived from the deck itself. Slide
    // positions are deliberately never written down here: an earlier version
    // hard-coded a 1-based index -> notebook map, and inserting a single slide
    // anywhere in the qmd would have silently pointed every later button at
    // the wrong notebook, with nothing to fail.
    //
    // The rule, in one sentence: a section makes its notebook available on
    // every slide of that section, while a Kahoot break adopts none, so a
    // slide sitting after a break carries its own link. Groups start at each
    // divider (the `h1.sr-only` marker the breadcrumb already keys off); a
    // divider with a `.sec-part` is a section and shares its links group-wide,
    // and one without — a Kahoot — leaves them on the declaring slide.

    function colabNumbers(scope) {
      var numbers = [];

      Array.prototype.forEach.call(
        scope.querySelectorAll(".colab-tab"),
        function (link) {
          var match = (link.getAttribute("href") || "")
            .match(/\/(\d{2})-[^/]+\.ipynb/);

          if (match && numbers.indexOf(match[1]) === -1) {
            numbers.push(match[1]);
          }
        }
      );

      return numbers;
    }

    var hrefByNumber = {};

    Array.prototype.forEach.call(
      document.querySelectorAll(".colab-tab"),
      function (link) {
        var href = link.getAttribute("href") || "";
        var match = href.match(/\/(\d{2})-[^/]+\.ipynb/);

        if (match) {
          hrefByNumber[match[1]] = href;
        }
      }
    );

    // Same traversal the breadcrumb uses, for the same reason: reveal has
    // already wrapped groups into `.stack` wrappers by the time this runs.
    var panelSlides = [];
    var panelNumbers = [];
    var group = null;

    Array.prototype.forEach.call(
      reveal.querySelectorAll(".slides section"),
      function (slide) {
        if (!slide.classList.contains("level1") &&
            !slide.classList.contains("level2")) {
          return;   // a `.stack` wrapper is not a slide
        }

        var own = colabNumbers(slide);

        if (slide.querySelector("h1.sr-only")) {
          group = slide.querySelector(".sec-part")
            ? { numbers: own }
            : null;   // a Kahoot break shares nothing forward
        }

        panelSlides.push(slide);

        if (group) {
          // Every slide of the section pushes the same object, so a link
          // found later in the walk reaches the divider too.
          if (own.length) {
            group.numbers = own;
          }

          panelNumbers.push(group);
        } else {
          panelNumbers.push({ numbers: own });
        }
      }
    );

    // A section's links are resolved after the walk, so a divider carrying no
    // link of its own still picks up the one declared later in its section.
    panelNumbers = panelNumbers.map(function (entry) {
      return entry.numbers;
    });

    var colabPanel = document.createElement("div");
    colabPanel.className = "deck-colab-panel";
    colabPanel.hidden = true;
    reveal.appendChild(colabPanel);

    function updateColabPanel() {
      // Guard the API this actually calls. `?print-pdf` and the moment before
      // reveal finishes initialising both land here with no current slide, and
      // an empty panel is the right answer for both.
      if (!Reveal.getCurrentSlide) {
        colabPanel.innerHTML = "";
        colabPanel.hidden = true;
        return;
      }

      var current = Reveal.getCurrentSlide();
      var position = current ? panelSlides.indexOf(current) : -1;
      var numbers = position === -1 ? [] : (panelNumbers[position] || []);

      colabPanel.innerHTML = "";

      var visibleButtons = 0;

      numbers.forEach(function (number) {
        var href = hrefByNumber[number];

        if (!href) {
          return;
        }

        var isExtra = number === "12" || number === "13";

        // Both halves go through `es`: the extra label was English-only, so
        // the ES deck's final slide read "Abrir Colab 11" beside
        // "Deep dive 12". `estudio a fondo` is the wording _variables.yml
        // already uses for an extra in Spanish.
        var label = isExtra
          ? (es ? "Estudio a fondo " : "Deep dive ") + number + " ↗"
          : (es ? "Abrir Colab " : "Open Colab ") + number + " ↗";

        var button = document.createElement("a");

        button.className =
          "deck-colab-button" +
          (isExtra ? " deck-colab-button-extra" : "");

        button.href = href;
        button.target = "_blank";
        button.rel = "noopener noreferrer";
        button.textContent = label;
        button.title = label;
        button.setAttribute("aria-label", label);

        colabPanel.appendChild(button);
        visibleButtons += 1;
      });

      colabPanel.classList.toggle("final-row", visibleButtons > 1);
      colabPanel.hidden = visibleButtons === 0;
    }

    Reveal.on("slidechanged", updateColabPanel);
    Reveal.on("overviewhidden", updateColabPanel);

    updateColabPanel();

    // Last, and only on success: this is what retires the inline .colab-tab
    // links in slides.scss. Anything above throwing leaves them visible, so a
    // broken panel degrades to the markdown links instead of to no link.
    reveal.classList.add("deck-colab-ready");
  });
})();
</script>
