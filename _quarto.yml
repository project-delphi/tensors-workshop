project:
  type: website
  output-dir: docs
  # Explicit render list. Without it Quarto sweeps up notebooks/*.ipynb and
  # tries to EXECUTE them (needs Jupyter + every dependency, and would bake
  # outputs into the committed files), and renders every README.md as a page.
  render:
    - index.qmd
    - notebooks.qmd
    - kahoot.qmd
    - references.qmd
    - companion.qmd
    - teach.qmd
    - faq.qmd
    # Optional diagnostics: rendered for direct sharing, absent from navigation/search.
    - readiness-check.qmd
    - readiness-instructor.qmd
    - readiness-refresher.qmd
    - es/readiness-check.qmd
    - es/readiness-instructor.qmd
    - es/readiness-refresher.qmd
    - facilitator-guide.md
    - assessments.md
    - worked-mistakes.md
    - group-tasks.md
    - workshop-feedback.md
    - es/index.qmd
    - es/notebooks.qmd
    - es/kahoot.qmd
    - es/references.qmd
    - es/companion.qmd
    - es/teach.qmd
    - es/faq.qmd
    - es/facilitator-guide.md
    - es/assessments.md
    - es/worked-mistakes.md
    - es/group-tasks.md
    - es/workshop-feedback.md
    - es/tensors_workshop_plan_with_quizzes.md
    - slides/en/index.qmd
    - slides/es/index.qmd
    - tensors_workshop_plan_with_quizzes.md
  resources:
    - .nojekyll
    - kahoot/*.xlsx
    - notebooks/*.ipynb
    - images/**
    # The companion's Audio Overview. Copied verbatim, like the notebooks --
    # nothing renders it, so it must be a resource or it never reaches docs/.
    - media/**
    # Standalone widgets. Copied verbatim, like the notebooks — nothing
    # renders them, so without this line they never reach docs/.
    - interactive/**

website:
  # Optional instructor diagnostics use draft: true for unlisted, direct-link access.
  draft-mode: unlinked
  title: "Tensors for Machine Learning"
  description: "A 210-minute workshop on tensors for machine learning, including quizzes and breaks, in English and Spanish."
  site-url: https://project-delphi.github.io/tensors-workshop
  repo-url: https://github.com/project-delphi/tensors-workshop
  favicon: favicon.svg
  navbar:
    background: primary
    search: true
    # One navbar, two languages. Quarto has a single global navbar, so both
    # halves live here and each item that exists in two languages carries a
    # `rel` saying which one it belongs to -- `rel` is the only attribute
    # Quarto passes through to the anchor, and an unknown `rel` value is inert
    # in every browser. `custom.scss` then shows the half that matches the
    # page's own `html lang`, which Quarto sets from each page's `lang:`.
    # So a reader on a Spanish page sees a Spanish navbar, and the EN/ES
    # switch at the right does the switching -- rather than every destination
    # appearing twice on every page, which is what this navbar used to do.
    left:
      - href: index.qmd
        text: Home
        rel: lang-en
      - href: es/index.qmd
        text: Inicio
        rel: lang-es
      - href: tensors_workshop_plan_with_quizzes.md
        text: Handbook
        rel: lang-en
      - href: es/tensors_workshop_plan_with_quizzes.md
        text: Manual
        rel: lang-es
      - href: notebooks.qmd
        text: Notebooks
        rel: lang-en
      - href: es/notebooks.qmd
        text: Cuadernos
        rel: lang-es
      - href: kahoot.qmd
        text: Kahoot
        rel: lang-en
      - href: es/kahoot.qmd
        text: Kahoot
        rel: lang-es
      - href: references.qmd
        text: References
        rel: lang-en
      - href: es/references.qmd
        text: Referencias
        rel: lang-es
      - href: slides/en/index.qmd
        text: Slides
        rel: lang-en
      - href: slides/es/index.qmd
        text: Diapositivas
        rel: lang-es
      - href: companion.qmd
        text: Companion
        rel: lang-en
      - href: es/companion.qmd
        text: Complemento
        rel: lang-es
      - href: teach.qmd
        text: Teach
        rel: lang-en
      - href: es/teach.qmd
        text: Enseñar
        rel: lang-es
      - href: faq.qmd
        text: FAQ
        rel: lang-en
      - href: es/faq.qmd
        text: FAQ
        rel: lang-es
    right:
      # Both always visible -- this is the control that switches the rest of
      # the navbar. `lang-switch-*` marks them so the current language can be
      # shown as the active one. language-switch.html upgrades these homepage
      # fallbacks to the matching page and, where available, translated section.
      - text: "🇬🇧 EN"
        href: index.qmd
        rel: lang-switch-en
      - text: "🇪🇸 ES"
        href: es/index.qmd
        rel: lang-switch-es
      - icon: github
        href: https://github.com/project-delphi/tensors-workshop
        aria-label: "Source on GitHub"
  page-footer:
    left: "Tensors for Machine Learning · Built with [Quarto](https://quarto.org)"
    right: "[Source](https://github.com/project-delphi/tensors-workshop)"

filters:
  - scripts/responsive_tables.lua

format:
  html:
    include-after-body: _includes/language-switch.html
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    anchor-sections: true
    # Opt-in, not `auto`. A bare `lightbox: true` *is* auto: it wrapped every
    # image on the site in an `<a class="lightbox">`, which is how the
    # handbook's four figures ended up 766px wide and hugging the left margin
    # -- the anchor sat between the `<p>` and the `<img>`, so custom.scss's
    # figure rules stopped matching and the paragraph fell back to the prose
    # measure. Written as a mapping *without* `match: auto`, the filter only
    # wraps an image that carries `.lightbox`: the companion's infographics,
    # and the handbook's four figures, which are boxed to the prose measure
    # by custom.scss and open at full size on a click.
    # Quarto's schema has no `match: manual`, so naming the effect (its
    # default) is what spells "opt-in" here.
    lightbox:
      effect: zoom
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/project-delphi\.github\.io'
