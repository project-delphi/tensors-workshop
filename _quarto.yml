project:
  type: website
  output-dir: docs
  # Explicit render list. Without it Quarto sweeps up notebooks/*.ipynb and
  # tries to EXECUTE them (needs Jupyter + every dependency, and would bake
  # outputs into the committed files), and renders every README.md as a page.
  render:
    - index.qmd
    - notebooks.qmd
    - kahoot.qmd
    - references.qmd
    - companion.qmd
    - es/index.qmd
    - es/references.qmd
    - es/companion.qmd
    - slides/en/index.qmd
    - slides/es/index.qmd
    - tensors_workshop_plan_with_quizzes.md
  resources:
    - .nojekyll
    - kahoot/*.xlsx
    - notebooks/*.ipynb
    - images/**
    # The companion's Audio Overview. Copied verbatim, like the notebooks --
    # nothing renders it, so it must be a resource or it never reaches docs/.
    - media/**

website:
  title: "Tensors for Machine Learning"
  description: "A 3-hour workshop on tensors for machine learning, in English and Spanish."
  site-url: https://project-delphi.github.io/tensors-workshop
  repo-url: https://github.com/project-delphi/tensors-workshop
  favicon: favicon.svg
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: tensors_workshop_plan_with_quizzes.md
        text: Handbook
      - href: notebooks.qmd
        text: Notebooks
      - href: kahoot.qmd
        text: Kahoot
      - href: references.qmd
        text: References
      # Slides and the companion each exist in two languages. These were two
      # dropdowns; they are eight-plus characters of flat navbar instead,
      # because a dropdown hides the Spanish half behind a click on a site
      # whose whole point is that both halves are equal. Each is labelled in
      # its own language, so the pairs read as four destinations rather than
      # as two words printed twice.
      - href: slides/en/index.qmd
        text: Slides
      - href: slides/es/index.qmd
        text: Diapositivas
      - href: companion.qmd
        text: Companion
      - href: es/companion.qmd
        text: Complemento
    right:
      - text: "EN"
        href: index.qmd
      - text: "ES"
        href: es/index.qmd
      - icon: github
        href: https://github.com/project-delphi/tensors-workshop
        aria-label: "Source on GitHub"
  page-footer:
    left: "Tensors for Machine Learning · Built with [Quarto](https://quarto.org)"
    right: "[Source](https://github.com/project-delphi/tensors-workshop)"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    anchor-sections: true
    # Opt-in, not `auto`: `auto` lightboxes every image on the site, which
    # rewrites the handbook's figures and the dataset cards too. Only the
    # companion's infographics carry `.lightbox`, because only they are worth
    # reading at full size.
    lightbox: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/project-delphi\.github\.io'
