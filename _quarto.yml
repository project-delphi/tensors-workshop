project:
  type: website
  output-dir: docs
  # Explicit render list. Without it Quarto sweeps up notebooks/*.ipynb and
  # tries to EXECUTE them (needs Jupyter + every dependency, and would bake
  # outputs into the committed files), and renders every README.md as a page.
  render:
    - index.qmd
    - notebooks.qmd
    - kahoot.qmd
    - references.qmd
    - companion.qmd
    - teach.qmd
    - facilitator-guide.md
    - assessments.md
    - worked-mistakes.md
    - group-tasks.md
    - workshop-feedback.md
    - es/index.qmd
    - es/notebooks.qmd
    - es/references.qmd
    - es/companion.qmd
    - es/teach.qmd
    - es/facilitator-guide.md
    - es/assessments.md
    - es/worked-mistakes.md
    - es/group-tasks.md
    - es/workshop-feedback.md
    - es/tensors_workshop_plan_with_quizzes.md
    - slides/en/index.qmd
    - slides/es/index.qmd
    - tensors_workshop_plan_with_quizzes.md
  resources:
    - .nojekyll
    - kahoot/*.xlsx
    - notebooks/*.ipynb
    - images/**
    # The companion's Audio Overview. Copied verbatim, like the notebooks --
    # nothing renders it, so it must be a resource or it never reaches docs/.
    - media/**

website:
  title: "Tensors for Machine Learning"
  description: "A 210-minute workshop on tensors for machine learning, including quizzes and breaks, in English and Spanish."
  site-url: https://project-delphi.github.io/tensors-workshop
  repo-url: https://github.com/project-delphi/tensors-workshop
  favicon: favicon.svg
  navbar:
    background: primary
    search: true
    # One navbar, two languages. Quarto has a single global navbar, so both
    # halves live here and each item that exists in two languages carries a
    # `rel` saying which one it belongs to -- `rel` is the only attribute
    # Quarto passes through to the anchor, and an unknown `rel` value is inert
    # in every browser. `custom.scss` then shows the half that matches the
    # page's own `html lang`, which Quarto sets from each page's `lang:`.
    # So a reader on a Spanish page sees a Spanish navbar, and the EN/ES
    # switch at the right does the switching -- rather than every destination
    # appearing twice on every page, which is what this navbar used to do.
    #
    # Kahoot is the one item with no `rel`: it exists in English only, and it
    # keeps its English label on the Spanish navbar on purpose — the label's
    # language is what tells you the page's language, and a Spanish label
    # leading to an English page is the worse surprise.
    #
    # Being untagged does a second job. That page is `lang: en`, so it shows an
    # English navbar, which would strand a Spanish reader who opened it — the
    # ES chip only goes back to the Spanish homepage. The `Español` dropdown at
    # the end is the way across, and it shows on exactly that page because it
    # is the only one whose own navbar item carries no language for
    # `custom.scss` to match `.active` against. Tagging it would take that away.
    left:
      - href: index.qmd
        text: Home
        rel: lang-en
      - href: es/index.qmd
        text: Inicio
        rel: lang-es
      - href: tensors_workshop_plan_with_quizzes.md
        text: Handbook
        rel: lang-en
      - href: es/tensors_workshop_plan_with_quizzes.md
        text: Manual
        rel: lang-es
      - href: notebooks.qmd
        text: Notebooks
        rel: lang-en
      - href: es/notebooks.qmd
        text: Cuadernos
        rel: lang-es
      - href: kahoot.qmd
        text: Kahoot
      - href: references.qmd
        text: References
        rel: lang-en
      - href: es/references.qmd
        text: Referencias
        rel: lang-es
      - href: slides/en/index.qmd
        text: Slides
        rel: lang-en
      - href: slides/es/index.qmd
        text: Diapositivas
        rel: lang-es
      - href: companion.qmd
        text: Companion
        rel: lang-en
      - href: es/companion.qmd
        text: Complemento
        rel: lang-es
      - href: teach.qmd
        text: Teach
        rel: lang-en
      - href: es/teach.qmd
        text: Enseñar
        rel: lang-es
      # Visible only on Kahoot, the one English-only page left -- see
      # `custom.scss`. It is deliberately the whole Spanish side rather than a
      # single link home, so a Spanish reader who lands there reaches
      # `Complemento` in one click rather than by way of the homepage.
      - text: "Español"
        menu:
          - href: es/index.qmd
            text: Inicio
          - href: es/tensors_workshop_plan_with_quizzes.md
            text: Manual
          - href: es/notebooks.qmd
            text: Cuadernos
          - href: es/references.qmd
            text: Referencias
          - href: slides/es/index.qmd
            text: Diapositivas
          - href: es/companion.qmd
            text: Complemento
          - href: es/teach.qmd
            text: Enseñar este taller
    right:
      # Both always visible -- this is the control that switches the rest of
      # the navbar. `lang-switch-*` marks them so the current language can be
      # shown as the active one; each goes to that language's homepage.
      # Landing pages also show a full-label switch outside the mobile menu.
      - text: "🇬🇧 EN"
        href: index.qmd
        rel: lang-switch-en
      - text: "🇪🇸 ES"
        href: es/index.qmd
        rel: lang-switch-es
      - icon: github
        href: https://github.com/project-delphi/tensors-workshop
        aria-label: "Source on GitHub"
  page-footer:
    left: "Tensors for Machine Learning · Built with [Quarto](https://quarto.org)"
    right: "[Source](https://github.com/project-delphi/tensors-workshop)"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    anchor-sections: true
    # Opt-in, not `auto`: `auto` lightboxes every image on the site, which
    # rewrites the handbook's figures and the dataset cards too. Only the
    # companion's infographics carry `.lightbox`, because only they are worth
    # reading at full size.
    lightbox: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/project-delphi\.github\.io'
