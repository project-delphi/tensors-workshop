name: Publish

# GitHub Pages serves the docs/ folder on main, so docs/ is committed and this
# workflow does not upload anything — it is the guard that keeps what is
# committed honest. It re-renders from scratch, regenerates every derived file,
# and fails if the result differs from what was pushed.
#
# (If you would rather have Actions itself publish, switch Pages to the
# "GitHub Actions" source and add an actions/deploy-pages step. Then docs/ no
# longer needs committing and the drift check below becomes unnecessary.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so CI renders what the author rendered. Version drift changes
          # markup and would surface as spurious out-of-date reports below.
          # Bump this together with a re-render.
          version: 1.6.40

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        # No cache key: uv's default keys on **/uv.lock, which is deliberately
        # not committed (see .gitignore), so caching here would key on nothing
        # and claim to do more than it does. The two groups CI resolves are
        # four small pure-Python wheels.
        with:
          enable-cache: false

      # Dependencies come from the groups in pyproject.toml, so CI runs exactly
      # the commands CONTRIBUTING and the release checklist give a human. The
      # scientific stack is in neither group used here: Quarto never executes
      # the notebooks, and NumPy is present only for the tiny teaching
      # counterexamples in tests/.

      - name: Regenerate derived files
        # Pure Python and deterministic, so this one CAN be byte-exact: it
        # catches a notebook, a section table, or the notebooks dependency
        # group edited by hand instead of through _variables.yml.
        #
        # The path list is every file gen_tables.py and gen_notebooks.py write
        # into, the two handbook schedule regions included. Leave a file out and
        # a hand-edit there does not fail here; it surfaces further down as a
        # compare_render.py mismatch instead, which names the rendered page
        # rather than the edit — because this step has already rewritten the
        # source by the time `quarto render` runs.
        run: |
          uv run --group site python scripts/gen_tables.py
          uv run --group site python scripts/gen_notebooks.py
          DRIFT=$(git status --porcelain -- notebooks _includes README.md \
                    pyproject.toml tensors_workshop_plan_with_quizzes.md \
                    es/tensors_workshop_plan_with_quizzes.md)
          if [ -n "$DRIFT" ]; then
            echo "::error::Generated files differ from what was committed."
            echo "Run scripts/gen_tables.py and scripts/gen_notebooks.py, then commit."
            echo "$DRIFT"
            exit 1
          fi

      - name: Check the committed site
        # Runs against docs/ AS COMMITTED, before any re-render — this is what
        # GitHub Pages is actually serving right now.
        run: uv run --group site python scripts/check_links.py

      - name: Check teaching materials
        run: |
          uv run --group test python scripts/check_teaching_materials.py
          uv run --group test python -m unittest discover -s tests -v

      - name: Keep a copy of the committed site
        run: cp -R docs "$RUNNER_TEMP/docs-committed"

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Check the fresh render
        run: uv run --group site python scripts/check_links.py

      - name: Fail if the committed pages are out of date
        # NOT a byte comparison. Quarto compiles the theme SCSS at render time
        # and names it by content hash, and that compilation differs between
        # macOS and ubuntu-latest even at the same pinned version — so every
        # page linking to it differs too. compare_render.py normalizes those
        # hashes away and compares the rest, which still catches the case this
        # gate exists for: prose edited without re-rendering.
        run: uv run --group site python scripts/compare_render.py "$RUNNER_TEMP/docs-committed" docs

      # The browser regression check. It needs a rendered docs/ and a real
      # Chromium, so it runs last, against the fresh render above. check_links
      # reads the HTML; this drives it — the language switch carrying the
      # matching section across languages, keyboard activation, the collapsed
      # mobile menu, the scrollable handbook tables, and the two decks. None of
      # that is visible to a parser, and it was landed without a gate.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Chromium is ~150MB and is not in the npm cache, so without this the
      # required `render` check downloads it on every run and goes red whenever
      # the Playwright CDN is unreachable. The key is the resolved Playwright
      # version, because the browser build is pinned to it.
      - name: Read the pinned Playwright version
        id: playwright
        run: |
          echo "version=$(node -p \
            "require('./package-lock.json').packages['node_modules/playwright'].version")" \
            >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright
        # `npm ci` installs the pinned version from package-lock.json. On a cache
        # hit the browser is already there, but --with-deps still has to run:
        # it installs system libraries, which the cache does not cover.
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check navigation in a browser
        run: npm run check:navigation
