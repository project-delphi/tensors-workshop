name: Publish

# This workflow IS the publisher. `render` regenerates every derived file,
# renders the site, and runs the checkers and the browser check over the
# result; `deploy` then hands that exact render to Pages. So what a visitor
# gets is the build that just passed, rather than a copy of docs/ somebody
# remembered to commit.
#
# Nothing rendered is committed. docs/ is gitignored build output, so a content
# PR carries only source and there is no staleness gate to keep honest — the
# only copy of the site that exists is the one this workflow just made.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so CI renders what the author rendered. Version drift changes
          # markup and would surface as spurious out-of-date reports below.
          # Bump this together with a re-render.
          version: 1.6.40

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        # No cache key: uv's default keys on **/uv.lock, which is deliberately
        # not committed (see .gitignore), so caching here would key on nothing
        # and claim to do more than it does. The two groups CI resolves are
        # four small pure-Python wheels.
        with:
          enable-cache: false

      # Dependencies come from the groups in pyproject.toml, so CI runs exactly
      # the commands CONTRIBUTING and the release checklist give a human. The
      # notebook stack is not installed here: Quarto never executes notebooks.
      # NumPy and SciPy exercise small teaching examples and feedback tests.

      - name: Regenerate derived files
        # Pure Python and deterministic, so this one CAN be byte-exact: it
        # catches a notebook, a section table, or the notebooks dependency
        # group edited by hand instead of through _variables.yml.
        #
        # The path list is every file gen_tables.py and gen_notebooks.py write
        # into, the two handbook schedule regions included, and it is the whole
        # of the gate: this step rewrites the source before `quarto render`
        # sees it, so a hand-edit to a generated path left off this list is
        # silently overwritten and ships. Add the path when you add the file.
        run: |
          uv run --group site python scripts/gen_tables.py
          uv run --group site python scripts/gen_notebooks.py
          DRIFT=$(git status --porcelain -- notebooks _includes README.md \
                    pyproject.toml tensors_workshop_plan_with_quizzes.md \
                    es/tensors_workshop_plan_with_quizzes.md)
          if [ -n "$DRIFT" ]; then
            echo "::error::Generated files differ from what was committed."
            echo "Run scripts/gen_tables.py and scripts/gen_notebooks.py, then commit."
            echo "$DRIFT"
            exit 1
          fi

      - name: Lint
        # ruff over the scripts and tests, configured in pyproject.toml; and
        # the whitespace half of `git diff --check`, over the whole tree rather
        # than a diff, because on a push to main there is no diff to check.
        # Notebooks are excluded: they are JSON, and their Markdown cells end
        # lines with two spaces on purpose.
        run: |
          uv run --group lint ruff check scripts tests
          uv run --group lint ruff format --check scripts tests
          if git grep -n -I -E '[[:space:]]+$' -- ':!*.ipynb'; then
            echo "::error::Trailing whitespace (see above)."
            exit 1
          fi

      - name: Check teaching materials
        run: |
          uv run --group test python scripts/check_teaching_materials.py
          uv run --group test python -m unittest discover -s tests -v

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Check the site
        # The render that is about to ship, so this is the last word on it.
        run: uv run --group site python scripts/check_links.py

      # The browser regression check. It needs a rendered docs/ and a real
      # Chromium, so it runs last, against the fresh render above. check_links
      # reads the HTML; this drives it — the language switch carrying the
      # matching section across languages, keyboard activation, the collapsed
      # mobile menu, the scrollable handbook tables, and the two decks -- and
      # axe over every page and both widgets. None of that is visible to a
      # parser, and it was landed without a gate.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Chromium is ~150MB and is not in the npm cache, so without this the
      # required `render` check downloads it on every run and goes red whenever
      # the Playwright CDN is unreachable. The key is the resolved Playwright
      # version, because the browser build is pinned to it.
      - name: Read the pinned Playwright version
        id: playwright
        run: |
          echo "version=$(node -p \
            "require('./package-lock.json').packages['node_modules/playwright'].version")" \
            >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright
        # `npm ci` installs the pinned version from package-lock.json. On a cache
        # hit the browser is already there, but --with-deps still has to run:
        # it installs system libraries, which the cache does not cover.
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test the visualizer's arithmetic
        # tests/tensor_core.test.cjs pins interactive/tensor-core.js -- the
        # strides, contiguity and view-or-copy rule under the reshape &
        # transpose visualizer -- under Node alone. No browser and no render,
        # so it could run anywhere; it sits here because this is where Node is.
        run: npm test

      - name: Check navigation in a browser
        run: npm run check:navigation

      # The tested build is what ships. Everything above has run against this
      # exact docs/ — the checkers, the byte-identity check on the notebooks,
      # and the browser pass — so the artifact `deploy` publishes is the render
      # that passed, not a re-render nobody looked at.
      #
      # Uploaded on pull requests too, though only `deploy` ever consumes it: a
      # render that succeeds but cannot be packaged should go red on the PR,
      # not afterwards on a main whose required check is already green.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Publishes the artifact `render` just built.
  #
  # A separate job, not a step, because `render` is the required status check
  # and runs on every pull request — a PR must not be able to deploy. The `if`
  # says so twice over, and the split keeps `pages: write` and `id-token:
  # write` off every other job in the file.
  deploy:
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and never cancel one in flight — a half-applied
    # deploy is a broken site. Scoped to this job on purpose: at workflow level
    # the same group would serialize unrelated pull-request runs.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Starts a real kernel per notebook and runs the core route each one
  # declares, through to the solution that answers it. This is the gate
  # RELEASE_CHECKLIST.md used to hand to a human.
  #
  # A separate job, not a step in `render`, for two reasons. It needs the
  # network and the scientific stack, which `render` deliberately does not
  # install; and a dead dataset URL or a PyPI blip should not red-light
  # `render`, which is the required check and the thing `deploy` publishes.
  #
  # Nothing here is stripped or mocked: %pip install runs verbatim and the
  # remote datasets are fetched for real, because Colab is the runtime this
  # defends and parity with it is the point.
  notebooks:
    runs-on: ubuntu-latest
    # Each notebook has a 300s cell ceiling, plus pip and dataset fetches.
    # A healthy run is minutes; without this a stalled kernel would sit on a
    # runner until GitHub's six-hour default killed it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Execute the core routes
        # Headless: the solutions plot, and no runner has a display.
        env:
          MPLBACKEND: Agg
        run: uv run --group execute python scripts/test_notebooks.py

      - name: Fail if executing a notebook changed it
        # The runner executes in memory and never writes back. If that ever
        # regresses, notebooks/ drifts and the byte-exact regenerate gate in
        # `render` would fail later with a confusing message; catch it here.
        #
        # always(), because this is the only step that would report WHY a
        # notebook changed. Skipping it whenever the run above fails hides the
        # drift behind the route failure, which is the confusion it exists to
        # prevent.
        if: always()
        run: |
          DRIFT=$(git status --porcelain -- notebooks)
          if [ -n "$DRIFT" ]; then
            echo "::error::Executing the notebooks modified them."
            echo "$DRIFT"
            exit 1
          fi
