name: mirror

# Pushes this repo's `main` to genial-labs-ai/tensors-workshop, a read-only
# mirror in the org used for professional work. The mirror is a copy, not a
# second home: nothing there is rendered, Pages is off, and every Colab badge
# and `data/` fallback URL inside it still points at project-delphi, which is
# correct, because project-delphi is what publishes the site. So this workflow
# changes no content and reruns no generator -- it moves bytes and nothing else.
#
# It is deliberately NOT a job in publish.yml. That workflow is the publisher
# and both its jobs are required checks on every PR; a mirror that fails
# because its credential was revoked must not read like a failed render.
#
# The credential is a GitHub App owned by genial-labs-ai and installed on the
# mirror and nothing else, with two permissions: Contents (write), to push, and
# Workflows (write), because main carries .github/workflows/ and a push that
# changes a file there is refused without it. Each run trades the app's private
# key for an installation token that lasts an hour and reaches only the mirror.
# Not a deploy key: genial-labs-ai switches them off for every repo it owns,
# so the mirror refuses to take one ("Deploy keys are disabled for this
# repository"), and this file's first version, which pushed over SSH, failed
# with "Permission denied (publickey)" on every run. Not a personal access
# token: it belongs to a person and expires.
#
# The app's client ID is `vars.MIRROR_APP_CLIENT_ID` and its private key is
# `secrets.MIRROR_APP_PRIVATE_KEY`, both in this repo. Rotating means
# generating a new key on the app, replacing the secret, and deleting the old
# key on the app.
#
# This file reaches the mirror too, because the mirror is a copy of main, and a
# push there runs it. The job is fenced to this repository, so on the mirror it
# is skipped rather than failing for want of a key. publish.yml and health.yml
# carry the same fence for the same reason.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A mirror push is not worth racing. Two pushes to main in quick succession
# should queue, not cancel: the second one carries the commit that matters, and
# cancelling the first can leave the mirror a commit behind with nothing said.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'project-delphi/tensors-workshop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not a shallow graft. A push out of a shallow
          # clone is refused ("shallow update not allowed") once the receiving
          # end already has the history, which the mirror does from its first
          # push -- so depth 1 would work exactly once and then fail forever.
          fetch-depth: 0
          # checkout leaves this repo's GITHUB_TOKEN in .git/config as an
          # Authorization header for every github.com URL, and git would send
          # it to the mirror ahead of the app's token. It cannot push there.
          persist-credentials: false

      - name: Check the app is configured
        env:
          CLIENT_ID: ${{ vars.MIRROR_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${CLIENT_ID:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "::error::vars.MIRROR_APP_CLIENT_ID or" \
                 "secrets.MIRROR_APP_PRIVATE_KEY is not set, so there is no" \
                 "credential to push with. Create a GitHub App on" \
                 "genial-labs-ai with Contents and Workflows write, install it" \
                 "on the mirror only, and store its client ID and a private" \
                 "key in this repo. See the header of this file."
            exit 1
          fi

      - name: Mint a token for the mirror
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: genial-labs-ai
          repositories: tensors-workshop
          permission-contents: write
          permission-workflows: write

      - name: Push main and its tags to the mirror
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          # The token goes in a header for this one command, never into the
          # URL or .git/config, so it is not left on disk or in the remote
          # name git prints. The encoded form is masked as well as the token.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"

          # No --force. The mirror is read-only by policy, so a non-fast-forward
          # means something pushed to it directly, and a failure that gets
          # emailed is the right answer to that -- not a silent overwrite.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --follow-tags \
            https://github.com/genial-labs-ai/tensors-workshop.git \
            "$GITHUB_SHA:refs/heads/main"

      - name: Say what the mirror now holds
        if: always()
        run: |
          {
            echo "## Mirror"
            echo
            echo "- Target: [genial-labs-ai/tensors-workshop](https://github.com/genial-labs-ai/tensors-workshop)"
            echo "- Commit pushed: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
