    $("code").textContent = text;
    $("code").scrollTop = $("code").scrollHeight;
  }

  const shownValue = (L) => state.compare
    ? BUF[sum(L.map((v, i) => v * cstrides(state.shape)[i]))]
    : BUF[offsetOf(L)];

  // ─── the operations, as the reader triggers them ──────────────────────────

  function doTranspose(perm) {
    if (perm.every((p, i) => p === i)) return;
    peeking = false;
    const next = perm.map((p) => state.shape[p]);
    pushHistory(transposeLines(perm, next));
    beginTween();
    applyTranspose(perm);
    render();
  }
  function doReshape(next) {
    if (same(next, state.shape)) return;
    peeking = false;
    beginTween();
    const copied = applyReshape(next);
    pushHistory(reshapeLines(next, copied));
    $("status").textContent = T.saidReshape(shapeText(next), copied ? T.kindCopy : T.kindView);
    render();
  }
  function doContiguous(kind) {
    if (!posOrder(kind)) return;
    // Already in that order: NumPy hands back the same array. Saying "the
    // buffer is rewritten" here would teach the opposite of the point.
    if (isContiguousAs(kind)) {
      $("status").textContent = T.saidAlready(T.layouts[kind]);
      syncControls();
      return;
    }
    peeking = false;
    beginTween();
    applyContiguous(kind);
    pushHistory(layoutLines(kind));
    $("status").textContent = T.saidContig(T.layouts[kind]);
    render();
  }

  // A new array: a different data source, batch, resolution or element count
  // is a fresh `np.stack` / `np.arange`, so the log starts over from its build
  // line and the array is contiguous in its natural order. Keeping the old
  // transposes would print a log whose first line already has the wrong shape.
  function restart() {
    // A different array has different cubes; a tween still in flight would
    // interpolate them from positions that belonged to the old one.
    anim = null;
    pending = null;
    peeking = false;
    rebuildSource();
    view.panX = 0;
    view.panY = 0;
    render();
  }

  // ─── controls ─────────────────────────────────────────────────────────────

  function indexSliders(host) {
    host.innerHTML = "";
    const hues = axisHues();
    state.shape.forEach((sizeOf, p) => {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const lab = document.createElement("div");
      lab.className = "k";
      lab.style.color = `var(${hues[p]})`;
      const name = document.createElement("span");
      name.textContent = axTag(p);
      const val = document.createElement("span");
      val.className = "val";
      val.textContent = String(state.idx[p]);
      lab.append(name, val);
      const input = document.createElement("input");
      input.type = "range";
      input.min = "0";
      input.max = String(sizeOf - 1);
      input.value = String(state.idx[p]);
      input.dataset.pos = String(p);
      input.setAttribute("aria-label", T.sliderIdx(axName(p)));
      input.style.accentColor = `var(${hues[p]})`;
      input.addEventListener("input", () => {
        state.idx[p] = Number(input.value);
        peeking = false;
        render();
      });
      wrap.append(lab, input);
      host.appendChild(wrap);
    });
  }

  function buildControls() {
    // Data source.
    $("datas").innerHTML = ["photos", "numbers"].map((k) =>
      radio("data", k, T.datas[k], state.data === k)).join("");
    $("datas").addEventListener("change", (e) => {
      state.data = e.target.value;
      restart();
    });

    // Photo batch and resolution.
    $("photo-checks").innerHTML = "";
    (PHOTOS ? PHOTOS.photos : []).forEach((p, i) => {
      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = state.photos[i];
      box.id = `photo-${p.id}`;
      box.addEventListener("change", () => {
        if (!box.checked && photosOn().length === 1) { box.checked = true; return; }
        state.photos[i] = box.checked;
        restart();
      });
      label.append(box, document.createTextNode(`${i} · ${p[`name_${lang}`]}`));
      $("photo-checks").appendChild(label);
    });
    $("res").innerHTML = (PHOTOS ? PHOTOS.res : []).map((r) =>
      radio("res", String(r), T.resLabel(r), state.res === r)).join("");
    $("res").addEventListener("change", (e) => {
      state.res = Number(e.target.value);
      restart();
    });

    // How many counting numbers.
    $("ns").innerHTML = N_CHOICES.map((n) =>
      radio("n", String(n), String(n), state.n === n)).join("");
    $("ns").addEventListener("change", (e) => {
      state.n = Number(e.target.value);
      restart();
    });

    $("values").addEventListener("change", (e) => {
      state.values = e.target.checked;
      render();
    });

    // Reshape: one button per shape the buffer can be poured into.
    $("shape-presets").addEventListener("click", (e) => {
      const button = e.target.closest("button");
      if (button) doReshape(button.dataset.shape.split(",").map(Number));
    });

    // Transpose.
    $("order-presets").innerHTML = "";
    [["NHWC", () => ORDER_PRESETS.NHWC.map(posOfId)],
     ["NCHW", () => ORDER_PRESETS.NCHW.map(posOfId)],
     ["swapHW", () => swapPerm(posOfId(2), posOfId(3))],
     ["reverse", () => range(rank()).reverse()]].forEach(([key, next]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.id = `order-${key}`;
      button.textContent = T.presets[key];
      button.addEventListener("click", () => doTranspose(next()));
      $("order-presets").appendChild(button);
    });
    $("chips").addEventListener("click", (e) => {
      const button = e.target.closest("button");
      if (!button) return;
      const p = Number(button.dataset.pos);
      const armed = $("chips").querySelector('[aria-pressed="true"]');
      if (!armed) { button.setAttribute("aria-pressed", "true"); return; }
      const other = Number(armed.dataset.pos);
      armed.setAttribute("aria-pressed", "false");
      if (other === p) return;
      $("status").textContent = T.swapped(axTag(other), axTag(p));
      doTranspose(swapPerm(other, p));
    });

    // Arrangement: on the stage, where its effect is.
    $("arrange").addEventListener("click", (e) => {
      const button = e.target.closest("button");
      if (!button || button.dataset.arrange === state.arrange) return;
      beginTween();
      state.arrange = button.dataset.arrange;
      render();
    });

    // Memory layout, and the copy that puts the buffer in it.
    $("layouts").innerHTML = ["C", "F", "CL"].map((k) =>
      radio("layout", k, T.layouts[k], false)).join("");
    $("layouts").addEventListener("change", (e) => doContiguous(e.target.value));
    $("contig").addEventListener("click", () => doContiguous("C"));

    $("compare").addEventListener("change", (e) => {
      state.compare = e.target.checked;
      render();
    });

    // Slice.
    $("slices").addEventListener("change", (e) => {
      state.slice = Number(e.target.value);
      render();
    });

    $("reset").addEventListener("click", () => { history.length = 0; render(); });
    $("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("code").textContent);
        $("copy").textContent = T.copied;
        setTimeout(() => { $("copy").textContent = T.copy; }, 1400);
      } catch (_) { /* clipboard blocked: the text is still selectable */ }
    });
  }

  function swapPerm(a, b) {
    const perm = range(rank());
    if (a < 0 || b < 0) return perm;
    perm[a] = b;
    perm[b] = a;
    return perm;
  }

  // Rebuilt only when the shape, the identities or the data change, because a
  // slider being dragged must not be replaced under the pointer.
  function syncControls() {
    const key = `${state.data}|${state.shape.join("x")}|${state.axisId.join(",")}|${PHOTOS ? 1 : 0}`;
    const hues = axisHues();
    if (key !== controlsKey) {
      controlsKey = key;
      indexSliders($("indices"));
      $("chips").innerHTML = state.shape.map((_, p) =>
        `<button type="button" data-pos="${p}" aria-pressed="false" style="border-color:var(${hues[p]});color:var(${hues[p]})" aria-label="${axName(p)}">${axTag(p)}</button>`
      ).join("");
      $("slices").innerHTML = [-1, ...range(rank())].map((p) => {
        const label = p < 0 ? T.none : axTag(p);
        const color = p < 0 ? "" : css(hues[p]);
        return radio("slice", String(p), label, state.slice === p, color);
      }).join("");
    }
    // The reshape presets change with the shape in hand, and each says whether
    // taking it is free.
    const copies = !isCContig();
    const presetKey = `${key}|${state.stride.join(",")}`;
    if (presetKey !== presetsKey) {
      presetsKey = presetKey;
      // Asked per shape, not once for the array: from a transposed view some
      // of these are views and some are copies, and the button says which.
      $("shape-presets").innerHTML = reshapeChoices().map((s) => {
        const here = same(s, state.shape);
        const kind = here ? "" : `<span class="kind">${reshapeIsView(s) ? T.kindView : T.kindCopy}</span>`;
        return `<button type="button" data-shape="${s.join(",")}" aria-pressed="${here}">${shapeText(s)}${kind}</button>`;
      }).join("");
    }
    $("shape-note").innerHTML = (copies ? T.shapeNoteCopy : T.shapeNoteView)(numel()) +
      (state.arrange === "meaning" ? ` <button type="button" class="inline" id="to-position">${T.shapeSwitch}</button>` : "");
    const toPosition = $("to-position");
    if (toPosition) toPosition.addEventListener("click", () => {
      beginTween();
      state.arrange = "position";
      render();
    });

    const named = hasAllIds();
    const hasLetters = !!(SRC && SRC.letters);
    ["NHWC", "NCHW"].forEach((k) => { $(`order-${k}`).disabled = !named; });
    $("order-swapHW").disabled = !(hasLetters && posOfId(2) >= 0 && posOfId(3) >= 0);
    $("order-note").textContent = named ? T.orderNote
      : (hasLetters ? T.orderNoteLost : T.orderNoteNumbers);

    const photoMode = !!isPhotos();
    $("shape-photo").hidden = !photoMode;
    $("shape-numbers").hidden = photoMode;
    $("n-note").textContent = T.nNote(state.n);
    document.querySelectorAll("#indices input").forEach((el) => {
      const p = Number(el.dataset.pos);
      el.value = String(state.idx[p]);
      el.parentElement.querySelector(".val").textContent = String(state.idx[p]);
    });
    document.querySelectorAll("#datas input").forEach((el) => {
      el.checked = el.value === state.data;
      if (el.value === "photos") el.disabled = !PHOTOS;
    });
    $("data-note").textContent = !PHOTOS ? T.dataNoteFailed
      : (photoMode ? T.dataNotePhotos : T.dataNoteNumbers);
    document.querySelectorAll("#res input").forEach((el) => { el.checked = Number(el.value) === state.res; });
    document.querySelectorAll("#ns input").forEach((el) => { el.checked = Number(el.value) === state.n; });
    $("values").checked = state.values;
    document.querySelectorAll("#arrange button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.arrange === state.arrange));
    });
    const layout = currentLayout();
    document.querySelectorAll("#layouts input").forEach((el) => {
      el.checked = el.value === layout;
      el.disabled = !posOrder(el.value);
    });
    $("layout-note").textContent = (layout
      ? `${{ C: T.layoutNoteC, F: T.layoutNoteF, CL: T.layoutNoteCL }[layout]} ${T.layoutCopy}`
      : T.layoutNoteView) + ` ${T.contigNote}`;
    $("compare").checked = state.compare;
    document.querySelectorAll("#slices input").forEach((el) => { el.checked = Number(el.value) === state.slice; });
    // The letters are worth naming only when they mean something. After a
    // reshape has merged them away an axis is its position, and the line
    // below already says so.
    const anyLetter = state.shape.some((_, p) => axLetter(p));
    const letters = state.shape.map((_, p) => axSpan(p, axTag(p))).join(", ");
    $("shape-readout").innerHTML =
      `<span class="dim">${T.shapeOf}${anyLetter ? ` (${letters})` : ""} = </span>` +
      (rank() === 1
        ? `(${axSpan(0, state.shape[0])},)`
        : `(${state.shape.map((v, p) => axSpan(p, v)).join(", ")})`) +
      `<span class="pos">${state.shape.map((_, p) => T.posName(p)).join(" · ")}</span>`;
  }

  // ─── where a cube sits ────────────────────────────────────────────────────

  // Four stage roles, outermost first: batch slots across, planes in depth,
  // rows down, columns across. A shape of rank less than four is padded on the
  // left with axes of one, so every helper below stays the rank-4 arithmetic
  // it always was.
  //
  // By *meaning* the roles are the identities of the array as it was built, so
  // neither a transpose nor a reshape moves a byte on screen -- each one
  // flashes where it is. By *position* the roles are the positions of the
  // shape in hand, so both operations visibly rearrange the cubes. Same bytes
  // either way; the embed on the front door keeps the by-meaning picture.
  const byPos = () => state.arrange === "position" && !embed;
  const pad4 = (a) => [...new Array(Math.max(0, 4 - a.length)).fill(1), ...a.slice(-4)];
  const padIdx = (a) => [...new Array(Math.max(0, 4 - a.length)).fill(0), ...a.slice(-4)];

  // Sizes and indices of the source array, reindexed by identity: for the
  // photos that is (B, C, H, W) however they were stacked.
  function srcIdDims() {
    const d = new Array(SRC.dims.length);
    SRC.ids.forEach((id, i) => { d[id] = SRC.dims[i]; });
    return d;
  }
  function srcIdIndex(k) {
    const u = unravel(k, SRC.dims);
    const out = new Array(u.length);
    SRC.ids.forEach((id, i) => { out[id] = u[i]; });
    return out;
  }
  const gdims = () => pad4(byPos() ? state.shape : srcIdDims());
  const gindex = (el) => padIdx(byPos() ? el.L : srcIdIndex(el.src));

  // What each role is called and coloured, whichever arrangement is on. By
  // meaning this survives a reshape that has merged the axis away, because the
  // *source* still has it -- which is exactly what "by meaning" means.
  function roleAxis(r) {
    if (byPos()) {
      const p = rank() - 4 + r;
      return p >= 0 ? { label: axTag(p), hue: axisHues()[p], pos: p } : null;
    }
    const nId = SRC.dims.length;
    const id = nId - 4 + r;
    if (id < 0) return null;
    return { label: SRC.letters ? SRC.letters[id] : String(id), hue: AXVAR[id], pos: posOfId(id), id };
  }

  // ─── the snap ─────────────────────────────────────────────────────────────

  // How far the view has closed up: 0 is the isometric pile with gaps, 1 is
  // flat on, gaps shut, cubes meeting edge to edge.
  const snap = { on: false, t: 0 };
  // The cubes' positions bake in GAP(), ZGAP() and whether the channel planes
  // are composited, all of which read snap.t. Moving it and only repainting
  // left the tensor collapsed and composited while the camera rotated away,
  // so every write to snap.t goes through here.
  function setSnapT(t) {
    if (snap.t === t) return;
    snap.t = t;
    VOX = buildVoxels();
  }
  const glide = { active: false, t0: 0, from: null, to: null };
  const GAP = () => BASE_GAP * (1 - 0.78 * snap.t);
  const ZGAP = () => BASE_ZGAP * (1 - snap.t);
  const cubeSide = () => 0.86 + 0.14 * snap.t;

  // Face on means level, and square on to one of the four sides. The reveal
  // needs more than that: an axis of exactly three, in depth, that really is
  // the colour channel -- otherwise the front plane is one channel of a photo
  // and compositing it would be a lie.
  function nearestYaw() {
    return Math.round(view.yaw / (Math.PI / 2)) * (Math.PI / 2);
  }
  function isFaceOn() {
    return Math.abs(view.el) < SNAP_EL && Math.abs(view.yaw - nearestYaw()) < SNAP_YAW;
  }
  function canReveal() {
    if (!isPhotos() || snap.t < 0.99) return false;
    if (Math.abs(nearestYaw() % (2 * Math.PI)) > 1e-6) return false;   // only the front face
    if (gdims()[1] !== 3) return false;
    const role = roleAxis(1);
    return !!role && (byPos() ? state.axisId[role.pos] === 1 : role.id === 1);
  }

  function setSnap(on) {
    snap.on = on;
    if (on) {
      glideTo(nearestYaw(), 0);
    } else {
      glideTo(view.yaw, Math.max(view.el, 0.45));
    }
    $("snap").setAttribute("aria-pressed", String(on));
    $("snap").textContent = on ? T.snapOut : T.snapIn;
    $("stage").dataset.snapped = on ? "1" : "0";
    tick();
  }
  function glideTo(yaw, el) {
    if (reduceMotion) {
      view.yaw = yaw;
      view.el = el;
      snap.t = snap.on ? 1 : 0;
      render();
      return;
    }
    glide.active = true;
    glide.t0 = performance.now();
    glide.from = { yaw: view.yaw, el: view.el, t: snap.t };
    glide.to = { yaw, el, t: snap.on ? 1 : 0 };
  }

  // ─── the tween ────────────────────────────────────────────────────────────

  // Each cube is keyed by the source element it holds, which survives every
  // operation -- so a cube can be followed from where it was to where the new
  // shape puts it. When nothing moves, the operation still happened, and the
  // cubes say so by swelling once in place.
  let pending = null;
  let anim = null;
  let raf = 0;

  function beginTween() {
    if (reduceMotion || embed) return;
    pending = new Map(VOX.map((v) => [v.src, { x: v.x, y: v.y, z: v.z, color: v.color, off: v.off }]));
  }
  function settleTween() {
    if (!pending) return;
    const from = pending;
    pending = null;
    const moved = VOX.some((v) => {
      const was = from.get(v.src);
      return was && (Math.abs(was.x - v.x) + Math.abs(was.y - v.y) + Math.abs(was.z - v.z)) > 1e-6;
    });
    anim = { t0: performance.now(), dur: TWEEN_MS, from, pulse: !moved };
    tick();
  }

  // The cubes as they are this frame: at rest, or partway from where they were.
  function drawList() {
    if (!anim) return VOX;
    const k = Math.min(1, (performance.now() - anim.t0) / anim.dur);
    const t = easeInOut(k);
    // One swell and back, for the operation that moves nothing.
    const swell = anim.pulse ? 1 + 0.16 * Math.sin(Math.PI * k) : 1;
    return VOX.map((v) => {
      const was = anim.from.get(v.src);
      if (!was) return swell === 1 ? v : { ...v, scale: swell };
      return {
        ...v,
        x: was.x + (v.x - was.x) * t,
        y: was.y + (v.y - was.y) * t,
        z: was.z + (v.z - was.z) * t,
        color: was.color === v.color ? v.color : mix(was.color, v.color, t),
        scale: swell
      };
    });
  }

  function tick() {
    if (raf) return;
    const step = (now) => {
      raf = 0;
      let busy = false;
      if (glide.active) {
        const k = Math.min(1, (now - glide.t0) / SNAP_MS);
        const t = easeInOut(k);
        view.yaw = glide.from.yaw + (glide.to.yaw - glide.from.yaw) * t;
        view.el = glide.from.el + (glide.to.el - glide.from.el) * t;
        setSnapT(glide.from.t + (glide.to.t - glide.from.t) * t);
        if (k >= 1) { glide.active = false; render(); } else busy = true;
      }
      if (anim) {
        if (now - anim.t0 >= anim.dur) anim = null;
        else busy = true;
      }
      repaint();
      if (busy) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  // ─── geometry ─────────────────────────────────────────────────────────────

  function centre() {
    const [B, C, H, W] = gdims();
    return {
      cx: ((B - 1) * (W + GAP()) + W - 1) / 2,
      cy: -(H - 1) / 2,
      cz: -(C - 1) * (1 + ZGAP()) / 2
    };
  }
  function axisHandles() {
    const [B, C, H, W] = gdims();
    const { cx, cy, cz } = centre();
    const x0 = -cx - 0.55;
    const yTop = -cy + 0.55;
    const yBot = -(H - 1) - cy - 0.55;
    const zFront = -cz + 0.55;
    const bHandle = B > 1
      ? { r: 0, o: { x: W - cx + 0.1, y: yTop, z: zFront }, d: { x: 1, y: 0, z: 0 }, len: Math.max(GAP() - 0.35, 0.9) }
      : { r: 0, o: { x: x0, y: yBot - 1.05, z: zFront }, d: { x: 1, y: 0, z: 0 }, len: Math.max(W, 1.1) };
    return [
      { r: 3, o: { x: x0, y: yTop, z: zFront }, d: { x: 1, y: 0, z: 0 }, len: W },
      { r: 2, o: { x: x0, y: yTop, z: zFront }, d: { x: 0, y: -1, z: 0 }, len: H },
      { r: 1, o: { x: x0, y: yTop, z: zFront }, d: { x: 0, y: 0, z: -1 }, len: Math.max(C * (1 + ZGAP()) - ZGAP(), 0.9) },
      bHandle
    ].filter((a) => a.r === 3 || (roleAxis(a.r) && gdims()[a.r] > 1));
  }
  function cellScale(w, h) {
    const [B, C, H, W] = gdims();
    const extent = Math.max((B - 1) * (W + GAP()) + W, H, C * (1 + ZGAP()), 2);
    return Math.min(w, h) / (extent * FIT) * view.scale;
  }
  // The isometric projection the flat renderer and every overlay share. As the
  // view snaps flat the skew is taken out of it, so the cubes end up on a
  // square grid with square pixels rather than a compressed one.
  function canvasTo(x, y, z, w, h) {
    const s = cellScale(w, h);
    const ca = Math.cos(view.yaw), sa = Math.sin(view.yaw);
    const rx = x * ca - z * sa, rz = x * sa + z * ca;
    const flat = snap.t;
    const kx = 0.866 + 0.134 * flat;
    return [
      w / 2 + (rx - rz * (1 - flat)) * kx * s + view.panX,
      h / 2 - 12 * (1 - flat) + ((rx + rz) * 0.5 * view.el - y) * s + view.panY
    ];
  }
  function glTo(x, y, z, w, h) {
    const THREE = GL.THREE;
    const v = new THREE.Vector3(x, y, z);
    GL.group.updateMatrixWorld(true);
    v.applyMatrix4(GL.group.matrixWorld);
    v.project(glCamera());
    return [(v.x * 0.5 + 0.5) * w, (-v.y * 0.5 + 0.5) * h];
  }
  const project = (x, y, z, w, h) => (mode === "gl" && GL.ready)
    ? glTo(x, y, z, w, h) : canvasTo(x, y, z, w, h);

  // ─── the cubes ────────────────────────────────────────────────────────────

  function buildVoxels() {
    const GW = gdims()[3];
    const { cx, cy, cz } = centre();
    const gap = GAP(), zgap = ZGAP();
    const out = [];
    const reveal = canReveal();
    const rgb = reveal ? new Map() : null;
    ELS.forEach((el) => {
      const [gb, gc, gh, gw] = gindex(el);
      const lit = state.slice < 0 || el.L[state.slice] === state.idx[state.slice];
      if (reveal) {
        // Face on, the three planes along the depth role are one pixel. Keep
        // the front plane's cube and give it the colour all three make.
        const key = `${gb},${gh},${gw}`;
        let cell = rgb.get(key);
        if (!cell) {
          cell = { b: gb, h: gh, w: gw, v: [0, 0, 0], el, lit: false };
          rgb.set(key, cell);
        }
        // One cube now carries all three channels, so it is lit when any of
        // them is in the slice -- taking channel 0's answer for all three
        // dimmed the whole photograph the moment C was the sliced axis.
        cell.lit = cell.lit || lit;
        cell.v[gc] = el.value;
        if (el.off === offsetOf(state.idx)) cell.el = el;
        return;
      }
      out.push({
        x: gb * (GW + gap) + gw - cx,
        y: -gh - cy,
        z: -gc * (1 + zgap) - cz,
        color: colourOf(el),
        alpha: lit ? 1 : 0.15,
        sel: same(el.L, state.idx),
        off: el.off, src: el.src, L: el.L, lit, value: el.value
      });
    });
    if (reveal) {
      const selOff = offsetOf(state.idx);
      rgb.forEach((cell) => {
        out.push({
          x: cell.b * (GW + gap) + cell.w - cx,
          y: -cell.h - cy,
          z: -cz,
          color: `rgb(${cell.v.join(",")})`,
          alpha: cell.lit ? 1 : 0.15,
          sel: cell.el.off === selOff,
          off: cell.el.off, src: cell.el.src, L: cell.el.L, lit: cell.lit, value: cell.el.value
        });
      });
    }
    return out;
  }

  // ─── the overlays ─────────────────────────────────────────────────────────

  let peeking = false;

  function placeOverlays(w, h, draw) {
    const host = $("overlays");
    host.innerHTML = "";
    const to = (x, y, z) => project(x, y, z, w, h);
    axisHandles().forEach((a) => {
      const role = snap.t > 0.995 ? null : roleAxis(a.r);
      if (!role) return;
      const el = document.createElement("span");
      el.className = "lab";
      el.style.color = css(role.hue);
      el.textContent = role.label;
      const [px, py] = to(
        a.o.x + a.d.x * (a.len + 0.75),
        a.o.y + a.d.y * (a.len + 0.75),
        a.o.z + a.d.z * (a.len + 0.75)
      );
      el.style.left = `${px}px`;
      el.style.top = `${py}px`;
      host.appendChild(el);
    });
    const sel = draw.find((v) => v.sel);
    if (sel && !embed) {
      const el = document.createElement("span");
      const [px, py] = to(sel.x, sel.y, sel.z);
      if (peeking) {
        // What the click is for: the index, the sum the strides make of it,
        // and the offset that sum lands on.
        el.className = "peek";
        const terms = state.idx.map((v, p) => `${v}·${state.stride[p]}`).join(" + ");
        el.innerHTML = T.peek(state.idx.join(", "), terms, sel.off);
      } else {
        el.className = "off";
        el.textContent = String(sel.off);
      }
      el.style.left = `${px}px`;
      el.style.top = `${py}px`;
      host.appendChild(el);
    }
    drawGizmo();
  }

  // The orientation gizmo. It is drawn from the same yaw, elevation and snap
  // the stage uses, so it works under either renderer, and each arm is a
  // shortcut to looking down that axis.
  const GIZMO_ARMS = [
    { r: 3, d: [1, 0, 0], yaw: Math.PI / 2, el: 0 },
    { r: 2, d: [0, -1, 0], yaw: 0, el: 1.2 },
    { r: 1, d: [0, 0, -1], yaw: 0, el: 0 }
  ];
  function drawGizmo() {
    const svg = $("gizmo");
    if (embed) return;
    const ca = Math.cos(view.yaw), sa = Math.sin(view.yaw);
    const flat = snap.t;
    const kx = 0.866 + 0.134 * flat;
    const at = ([x, y, z]) => {
      const rx = x * ca - z * sa, rz = x * sa + z * ca;
      return [(rx - rz * (1 - flat)) * kx * 30, ((rx + rz) * 0.5 * view.el - y) * 30];
    };
    const arms = GIZMO_ARMS.map((arm) => ({ arm, role: roleAxis(arm.r), p: at(arm.d) }))
      .filter((a) => a.role);
    // Built once and then only moved. Rewriting the markup every frame would
    // drop keyboard focus in the middle of a drag.
    if (svg.dataset.arms !== arms.map((a) => a.arm.r).join(",")) {
      svg.dataset.arms = arms.map((a) => a.arm.r).join(",");
      svg.innerHTML = arms.map(({ arm }) =>
        `<g class="arm" data-arm="${arm.r}" role="button" tabindex="0">` +
        `<line x1="0" y1="0" stroke-width="3" stroke-linecap="round"></line>` +
        `<circle r="9"></circle><text text-anchor="middle"></text></g>`).join("");
    }
    arms.sort((a, b) => a.p[1] - b.p[1]);
    // Re-inserting an element is a remove and an insert, which blurs it. The
    // order really does change as the view turns -- activating an arm starts a
    // glide that reorders them -- so the restack is kept and the focus is put
    // back afterwards, rather than leaving the reader on <body>.
    const order = arms.map((a) => a.arm.r).join(",");
    const restack = svg.dataset.order !== order;
    const focused = restack && svg.contains(document.activeElement) ? document.activeElement : null;
    if (restack) svg.dataset.order = order;
    arms.forEach(({ arm, role, p }) => {
      const g = svg.querySelector(`[data-arm="${arm.r}"]`);
      const hue = css(role.hue);
      g.setAttribute("aria-label", T.gizmoArm(role.label));
      g.querySelector("line").setAttribute("x2", p[0].toFixed(1));
      g.querySelector("line").setAttribute("y2", p[1].toFixed(1));
      g.querySelector("line").setAttribute("stroke", hue);
      const circle = g.querySelector("circle");
      circle.setAttribute("cx", p[0].toFixed(1));
      circle.setAttribute("cy", p[1].toFixed(1));
      circle.setAttribute("fill", hue);
      const text = g.querySelector("text");
      text.setAttribute("x", p[0].toFixed(1));
      text.setAttribute("y", (p[1] + 3.2).toFixed(1));
      text.setAttribute("fill", inkOn(hue));
      text.textContent = role.label;
      if (restack) svg.appendChild(g);   // paint order: nearest last
    });
    if (focused) focused.focus({ preventScroll: true });
  }

  // ─── the flat renderer ────────────────────────────────────────────────────

  function drawArrow(ctx, x0, y0, x1, y1, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    const ang = Math.atan2(y1 - y0, x1 - x0);
    const ah = 9;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ah * Math.cos(ang - 0.45), y1 - ah * Math.sin(ang - 0.45));
    ctx.lineTo(x1 - ah * Math.cos(ang + 0.45), y1 - ah * Math.sin(ang + 0.45));
    ctx.closePath();
    ctx.fill();
  }

  function drawFlat(voxels) {
    const canvas = $("view");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const to = (x, y, z) => canvasTo(x, y, z, w, h);
    const ca = Math.cos(view.yaw), sa = Math.sin(view.yaw);
    const sorted = voxels.slice().sort((a, b) =>
      ((a.x * sa + a.z * ca) + a.y * 0.2) - ((b.x * sa + b.z * ca) + b.y * 0.2));
    const s = cellScale(w, h);
    const ink = css("--ink");
    const labels = showValues() && s >= VALUE_MIN_PX && !canReveal();
    // Face on the cubes are squares that meet: a hexagon drawn at a quarter
    // turn is a cube seen from nowhere, and the photograph would show its seams.
    const square = snap.t > 0.5;
    if (labels) { ctx.textAlign = "center"; ctx.textBaseline = "middle"; }

    sorted.forEach((v) => {
      const [px, py] = to(v.x, v.y, v.z);
      const half = s * (0.42 + 0.08 * snap.t) * (v.scale || 1);
      ctx.globalAlpha = v.alpha;
      ctx.fillStyle = v.color;
      ctx.strokeStyle = v.sel ? ink : mix(v.color, ink, 0.25);
      ctx.lineWidth = v.sel ? 2 : 1;
      ctx.beginPath();
      if (square) {
        ctx.rect(px - half, py - half, half * 2, half * 2);
      } else {
        ctx.moveTo(px, py - half);
        ctx.lineTo(px + half, py - half * 0.4);
        ctx.lineTo(px + half, py + half * 0.7);
        ctx.lineTo(px, py + half * 1.15);
        ctx.lineTo(px - half, py + half * 0.7);
        ctx.lineTo(px - half, py - half * 0.4);
        ctx.closePath();
      }
      ctx.fill();
      // Seams would show as a grid over the photograph, so the outline goes
      // once the gaps have closed -- except on the one selected cube.
      if (half >= 2 && (!square || v.sel || snap.t < 0.995 || !canReveal())) ctx.stroke();
      if (labels) {
        const text = String(v.value);
        ctx.fillStyle = inkOn(v.color);
        ctx.font = labelFont(text, half);
        ctx.fillText(text, px, py + half * (square ? 0 : 0.22));
      }
    });
    ctx.globalAlpha = 1;
    if (snap.t < 0.995) {
      axisHandles().forEach((a) => {
        const role = roleAxis(a.r);
        if (!role) return;
        const [x0, y0] = to(a.o.x, a.o.y, a.o.z);
        const [x1, y1] = to(a.o.x + a.d.x * a.len, a.o.y + a.d.y * a.len, a.o.z + a.d.z * a.len);
        drawArrow(ctx, x0, y0, x1, y1, css(role.hue));
      });
    }
    placeOverlays(w, h, voxels);
  }

  // ─── the GL renderer ──────────────────────────────────────────────────────

  const glCamera = () => (snap.t > 0.98 && GL.ortho) ? GL.ortho : GL.camera;

  function syncGL(voxels) {
    const THREE = GL.THREE;
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    const pos = new THREE.Vector3();
    const scl = new THREE.Vector3();
    const c = new THREE.Color();
    // Two meshes: a cell is either in the slice or dimmed, and instance colour
    // carries no alpha. Both materials stay constant, so nothing is allocated
    // per cell per frame.
    let nLit = 0, nDim = 0;
    const side = cubeSide() / 0.86;
    voxels.forEach((v) => {
      const mesh = v.alpha < 1 ? GL.dim : GL.lit;
      const i = v.alpha < 1 ? nDim++ : nLit++;
      const k = side * (v.scale || 1);
      pos.set(v.x, v.y, v.z);
      scl.set(k, k, k);
      m.compose(pos, q, scl);
      mesh.setMatrixAt(i, m);
      mesh.setColorAt(i, c.set(v.color));
    });
    GL.lit.count = nLit;
    GL.dim.count = nDim;
    [GL.lit, GL.dim].forEach((mesh) => {
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.computeBoundingSphere();
    });
    const sel = voxels.find((v) => v.sel);
    GL.outline.visible = !!sel;
    if (sel) {
      GL.outline.position.set(sel.x, sel.y, sel.z);
      GL.outline.scale.setScalar(side * (sel.scale || 1));
      GL.outline.material.color.set(css("--ink"));
    }
    // Repointed, never rebuilt: an ArrowHelper keeps its materials on its
    // `.line` and `.cone` children, and rebuilding leaked two per axis per render.
    const handles = axisHandles();
    GL.arrows.forEach((arrow, i) => {
      const a = handles[i];
      const role = a && roleAxis(a.r);
      arrow.visible = !!role && snap.t < 0.995;
      if (!role) return;
      arrow.position.set(a.o.x, a.o.y, a.o.z);
      arrow.setDirection(new THREE.Vector3(a.d.x, a.d.y, a.d.z).normalize());
      arrow.setLength(a.len, 0.38, 0.22);
      arrow.setColor(new THREE.Color(css(role.hue)));
    });
  }

  function initGL() {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
    if (!gl) return false;
    const THREE = window.THREE;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 80);
    camera.position.set(8, 6, 10);
    camera.lookAt(0, 0, 0);
    // Face on, the perspective camera would splay the outer cubes and leave a
    // seam down every column of the photograph. The orthographic one is matched
    // to it at the plane the cubes sit on, so taking over is not a jump.
    const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 80);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 0.65);
    key.position.set(4, 8, 6);
    scene.add(key);
    const group = new THREE.Group();
    scene.add(group);
    $("stage").insertBefore(canvas, $("overlays"));

    const box = new THREE.BoxGeometry(0.86, 0.86, 0.86);
    const instanced = (opacity) => {
      const mat = new THREE.MeshLambertMaterial({
        transparent: opacity < 1, opacity, depthWrite: opacity === 1
      });
      const mesh = new THREE.InstancedMesh(box, mat, MAX_CELLS);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.setColorAt(0, new THREE.Color("#ffffff"));   // allocates instanceColor
      mesh.count = 0;
      mesh.frustumCulled = false;
      group.add(mesh);
      return mesh;
    };
    const lit = instanced(1);
    const dim = instanced(0.15);
    const outline = new THREE.LineSegments(
      new THREE.EdgesGeometry(box),
      new THREE.LineBasicMaterial({ color: css("--ink") })
    );
    outline.visible = false;
    group.add(outline);
    const arrows = [0, 1, 2, 3].map(() => {
      const a = new THREE.ArrowHelper(
        new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xffffff, 0.38, 0.22);
      group.add(a);
      return a;
    });
    Object.assign(GL, { ready: true, THREE, renderer, scene, camera, ortho, group, box, lit, dim, outline, arrows,
                        labels: [], texCache: new Map() });
    return true;
  }

  // The value printed on a cube, as a billboard just outside its face nearest
  // the camera. A sprite is depth-tested, so a cube behind another keeps its
  // number to itself -- which an HTML overlay could not do. One texture per
  // distinct (text, colour), cached; a value is at most four characters.
  function labelTexture(text, color) {
    const THREE = GL.THREE;
    const key = `${text}|${color}`;
    let tex = GL.texCache.get(key);
    if (tex) return tex;
    if (GL.texCache.size > 2048) {
      GL.texCache.forEach((t) => t.dispose());
      GL.texCache.clear();
    }
    const cv = document.createElement("canvas");
    cv.width = cv.height = 96;
    const ctx = cv.getContext("2d");
    ctx.font = `700 ${Math.min(46, 160 / Math.max(text.length, 1))}px ${css("--mono") || "ui-monospace, monospace"}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(text, 48, 50);
    tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    GL.texCache.set(key, tex);
    return tex;
  }

  // Runs after the camera is placed, on every repaint: the labels are shown
  // only when a cell is wide enough on screen, and zooming changes that.
  function syncLabels(voxels) {
    const THREE = GL.THREE;
    let n = 0;
    if (showValues() && voxels.length && !canReveal()) {
      const stage = $("stage");
      const v0 = voxels[0];
      const [ax, ay] = glTo(v0.x, v0.y, v0.z, stage.clientWidth, stage.clientHeight);
      const [bx, by] = glTo(v0.x + 1, v0.y, v0.z, stage.clientWidth, stage.clientHeight);
      if (Math.hypot(bx - ax, by - ay) >= VALUE_MIN_PX) {
        // 0.78 clears the cube's corner (0.43 * sqrt 3) along any view direction
        // and stays short of the neighbour in front.
        const cam = glCamera().position;
        const toward = cam.clone().normalize().multiplyScalar(0.78);
        // Nearest the camera first, so if the cap is hit it is the back of the
        // pile that goes unlabelled, as in the flat renderer's paint order.
        const near = voxels.filter((v) => v.alpha >= 1);
        if (near.length > VALUE_MAX_LABELS) {
          const d2 = (v) => (v.x - cam.x) ** 2 + (v.y - cam.y) ** 2 + (v.z - cam.z) ** 2;
          near.sort((a, b) => d2(a) - d2(b));
        }
        for (const v of near) {
          if (n >= VALUE_MAX_LABELS) break;
          let sprite = GL.labels[n];
          if (!sprite) {
            sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false }));
            sprite.scale.set(0.8, 0.8, 1);
            GL.group.add(sprite);
            GL.labels[n] = sprite;
          }
          const text = String(v.value);
          const color = inkOn(v.color);
          const key = `${text}|${color}`;
          if (sprite.userData.key !== key) {
            sprite.material.map = labelTexture(text, color);
            sprite.material.needsUpdate = true;
            sprite.userData.key = key;
          }
          sprite.position.set(v.x + toward.x, v.y + toward.y, v.z + toward.z);
          sprite.visible = true;
          n++;
        }
      }
    }
    for (let i = n; i < GL.labels.length; i++) GL.labels[i].visible = false;
  }

  function setMode(next, why) {
    mode = next;
    $("view").style.display = next === "flat" ? "block" : "none";
    if (GL.renderer) GL.renderer.domElement.style.display = next === "gl" ? "block" : "none";
    $("glnote").hidden = next === "gl";
    if (why) $("glnote").textContent = T[why];
  }

  // Frame the bounding extents against whichever field of view is tighter.
  function glDistance(pitch) {
    const [B, C, H, W] = gdims();
    const spanX = (B - 1) * (W + GAP()) + W;
    const rXZ = 0.5 * Math.hypot(spanX, C * (1 + ZGAP())) + 1.1;
    const rY = 0.5 * H + 1.1;
    const vfov = GL.camera.fov * Math.PI / 180;
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * Math.max(GL.camera.aspect, 0.2));
    const needV = rY * Math.cos(pitch) + rXZ * Math.sin(pitch);
    const fit = Math.max(rXZ / Math.tan(hfov / 2), needV / Math.tan(vfov / 2));
    return fit * 1.12 / view.scale;
  }

  function repaint() {
    if (!SRC) return;
    const draw = drawList();
    // The buffer strip is part of the same animation: a copy slides its bars.
    if (anim && !embed) renderRibbon();
    if (mode === "gl" && GL.ready) {
      const pitch = Math.atan(view.el * 0.6);
      const dist = glDistance(pitch);
      const far = dist * 3;
      if (GL.camera.far !== far) {
        GL.camera.far = far;
        GL.camera.updateProjectionMatrix();
      }
      const at = [
        Math.sin(view.yaw) * dist * Math.cos(pitch),
        Math.sin(pitch) * dist,
        Math.cos(view.yaw) * dist * Math.cos(pitch)
      ];
      // The pan is a translation of the whole group, so `glTo` -- and with it
      // picking, the labels and the overlays -- follows without being told.
      GL.group.position.set(view.panX / 60, -view.panY / 60, 0);
      [GL.camera, GL.ortho].forEach((cam) => { cam.position.set(...at); cam.lookAt(0, 0, 0); });
      const height = 2 * dist * Math.tan(GL.camera.fov * Math.PI / 360);
      const width = height * GL.camera.aspect;
      Object.assign(GL.ortho, { left: -width / 2, right: width / 2, top: height / 2, bottom: -height / 2, far });
      GL.ortho.updateProjectionMatrix();
      syncGL(draw);
      syncLabels(draw);
      GL.renderer.render(GL.scene, glCamera());
      const stage = $("stage");
      placeOverlays(stage.clientWidth, stage.clientHeight, draw);
    } else {
      drawFlat(draw);
    }
  }

  // ─── the pictures under the stage ─────────────────────────────────────────

  const showValues = () => state.values && !embed;

  // Which position carries each of the four photo axes, when all four are
  // still there. A reshape that merges height into width leaves no picture to
  // draw, and this returns null to say so.
  function imageAxes() {
    if (!isPhotos()) return null;
    const b = posOfId(0), c = posOfId(1), h = posOfId(2), w = posOfId(3);
    return (b >= 0 && c >= 0 && h >= 0 && w >= 0 && state.shape[c] === 3) ? { b, c, h, w } : null;
  }
  // x reads through the strides; y reads the buffer straight through and pours
  // it into the same shape, which is what a reshape of a non-contiguous view
  // would give you.
  const readX = (L) => BUF[offsetOf(L)];
  const readY = (L) => BUF[sum(L.map((v, i) => v * cstrides(state.shape)[i]))];

  function stripRow(kind, read) {
    const row = document.createElement("div");
    row.className = "strip-row";
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = kind === "x" ? T.stripX : T.stripY;
    row.appendChild(tag);
    const ax = imageAxes();
    const L = state.idx.slice();
    const paint = (W, H, fill, label) => {
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(W, H);
      for (let h = 0; h < H; h++) {
        for (let w = 0; w < W; w++) fill(img.data, (h * W + w) * 4, h, w);
      }
      ctx.putImageData(img, 0, 0);
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", label);
      row.appendChild(canvas);
    };
    if (ax) {
      const B = state.shape[ax.b], H = state.shape[ax.h], W = state.shape[ax.w];
      for (let b = 0; b < B; b++) {
        L[ax.b] = b;
        paint(W, H, (data, o, h, w) => {
          L[ax.h] = h;
          L[ax.w] = w;
          for (let c = 0; c < 3; c++) { L[ax.c] = c; data[o + c] = read(L); }
          data[o + 3] = 255;
        }, `${kind}[${b}]`);
      }
      return row;
    }
    // No picture: the last two axes of the shape as a heatmap instead.
    const R = rank();
    const wp = R - 1, hp = R >= 2 ? R - 2 : R - 1;
    const W = state.shape[wp], H = R >= 2 ? state.shape[hp] : 1;
    const n = numel();
    paint(W, H, (data, o, h, w) => {
      L[wp] = w;
      if (R >= 2) L[hp] = h;
      // A photo byte is 0-255 whatever the element count; only np.arange runs
      // to n - 1. Normalising both the same way washed the merged photo out.
      const v = read(L);
      const t = isPhotos() ? v / 255 : (n > 1 ? v / (n - 1) : 0.5);
      const rgb = parseRgb(axisFill(fastestPos(), t));
      data[o] = rgb[0]; data[o + 1] = rgb[1]; data[o + 2] = rgb[2];
      data[o + 3] = 255;
    }, kind);
    return row;
  }

  function renderStrip() {
    const host = $("strip-rows");
    host.innerHTML = "";
    host.appendChild(stripRow("x", readX));
    const contiguous = isCContig();
    if (state.compare) {
      const row = stripRow("y", readY);
      if (!contiguous) row.classList.add("wrong");
      row.querySelector(".tag").insertAdjacentHTML("beforeend",
        `<small>${contiguous ? T.stripSame : T.stripWrong}</small>`);
      host.appendChild(row);
    }
    const ax = imageAxes();
    const x0 = shapeText(state.shape.slice(1));
    if (!isPhotos()) {
      $("strip-note").textContent = T.stripNumbers;
    } else if (!ax) {
      $("strip-note").textContent = T.stripNoImage;
    } else if (ax.b !== 0) {
      // x[0] is not a photo at all: the batch axis is not first, so x[0] is
      // one slab of whatever axis is.
      $("strip-note").textContent = T.stripNotBatch(x0, axName(0));
    } else if (ax.h === 1 && ax.w === 2 && ax.c === 3) {
      $("strip-note").textContent = T.stripImshow(x0);
    } else {
      // The transpose that brings x[0] to (H, W, C), whatever order it is in now.
      const t = [ax.h, ax.w, ax.c].map((p) => p - 1).join(", ");
      $("strip-note").textContent = T.stripTranspose(x0, t);
    }
  }

  // The buffer. A reshape and a transpose leave every bar exactly where it is
  // -- that is the point of them -- so the only thing that ever animates here
  // is a copy, and each bar slides from the offset it had to the offset it
  // now has.
  function renderRibbon() {
    const canvas = $("ribbon");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || 800, h = 44;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const n = numel();
    const cw = w / n;
    const t = anim ? easeInOut(Math.min(1, (performance.now() - anim.t0) / anim.dur)) : 1;
    ELS.forEach((el) => {
      const lit = state.slice < 0 || el.L[state.slice] === state.idx[state.slice];
      const was = anim && anim.from.get(el.src);
      const at = (was && was.off !== undefined) ? was.off + (el.off - was.off) * t : el.off;
      ctx.globalAlpha = lit ? 1 : 0.25;
      ctx.fillStyle = colourOf(el, el.raw);
      ctx.fillRect(at * cw, 10, Math.max(cw, 0.5), h - 18);
    });
    ctx.globalAlpha = 1;
    // Ticks at the slowest stride.
    const slow = Math.max(state.stride[memOrder()[0]], 1);
    ctx.strokeStyle = css("--ink-mute");
    ctx.lineWidth = 1;
    for (let k = 0; n / slow <= 96 && k <= n; k += slow) {
      ctx.beginPath();
      ctx.moveTo(Math.min(k * cw, w - 0.5), 2);
      ctx.lineTo(Math.min(k * cw, w - 0.5), 9);
      ctx.stroke();
    }
    // The selected element.
    const off = offsetOf(state.idx);
    ctx.strokeStyle = css("--ink");
    ctx.lineWidth = 2;
    ctx.strokeRect(off * cw - 1, 9, Math.max(cw, 2) + 2, h - 16);
    ctx.fillStyle = css("--ink");
    ctx.beginPath();
    ctx.moveTo(off * cw + cw / 2, h - 1);
    ctx.lineTo(off * cw + cw / 2 - 4, h - 7);
    ctx.lineTo(off * cw + cw / 2 + 4, h - 7);
    ctx.closePath();
    ctx.fill();
    const hues = axisHues();
    const order = memOrder().map((p) => `<span style="color:var(${hues[p]})">${axTag(p)}</span>`).join(" → ");
    $("ribbon-note").innerHTML = T.ribbonNote(`<span id="ribbon-order">${order}</span>`, n);
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", `${T.ribbon}: ${memOrder().map(axTag).join(" ")}`);
  }

  function renderLegend() {
    const fastest = fastestPos();
    const hues = axisHues();
    $("axis-legend").innerHTML = state.shape.map((_, p) => {
      const mark = p === fastest ? ` <em>${T.fastest}</em>` : "";
      const letter = axLetter(p);
      const name = letter ? `${T.axName[state.axisId[p]]} · ${T.posName(p)}` : "";
      return `<span class="chip"><span class="swatch" style="background:var(${hues[p]})"></span><b style="color:var(${hues[p]})">${letter || T.posName(p)}</b> ${name}${mark}</span>`;
    }).join("");
  }

  // ─── render ───────────────────────────────────────────────────────────────

  let ELS = [];

  function render() {
    // bindPointer() is installed before photos.json resolves, so a drag, a
    // click or a resize can land in that window. Without an array there is
    // nothing to draw and every geometry helper dereferences SRC.
    if (!SRC) return;
    flushCss();
    ELS = elements();
    VOX = buildVoxels();
    settleTween();
    const off = offsetOf(state.idx);
    const fastest = fastestPos();
    const hues = axisHues();
    syncControls();

    $("stride-body").innerHTML = state.shape.map((_, p) => {
      const fast = p === fastest;
      const pos = axLetter(p) ? `<span class="pos">${T.posName(p)}</span>` : "";
      return `<tr class="${fast ? "fast" : ""}"><td><span class="dot" style="background:var(${hues[p]})"></span>${axSpan(p, axTag(p))}${pos}${fast ? `<span class="mark">${T.fastest}</span>` : ""}</td><td>${state.stride[p] * ITEMSIZE}</td><td>${state.stride[p]}</td></tr>`;
    }).join("");

    const terms = state.shape.map((_, p) =>
      `<span class="term">(${axSpan(p, state.idx[p])} · ${axSpan(p, state.stride[p])})</span>`
    ).join(" + ");
    $("formula").innerHTML =
      `${T.offset} = ` + state.shape.map((_, p) => `${axSpan(p, `i_${axTag(p)}`)}·${axSpan(p, `S_${axTag(p)}`)}`).join(" + ") +
      `<span class="eq"> = ${terms} = <b>${off}</b></span>`;

    renderCode(off);
    renderLegend();
    renderStrip();
    renderRibbon();

    // What a checker can read without a screenshot: the shape, the strides,
    // whether the view is snapped flat, and a signature of the buffer that a
    // view must never change.
    const stage = $("stage");
    stage.dataset.shape = state.shape.join(",");
    stage.dataset.strides = state.stride.join(",");
    stage.dataset.bufsig = bufferSignature();
    stage.dataset.arrange = byPos() ? "position" : "meaning";

    $("status").textContent = T.status(off, state.idx,
      state.slice >= 0 ? T.sliceOf(axName(state.slice)) : "");
    const base = isPhotos() ? T.stagePhotos : T.stageNumbers(axTag(fastest));
    const parts = [state.compare ? T.stageReshape : base];
    if (snap.on) parts.push(canReveal() ? T.revealNote : (isPhotos() ? T.revealNo : T.snapNote));
    if (state.slice >= 0) parts.push(T.lit(axTag(state.slice)));
    if (byPos()) {
      const labels = [3, 2, 1, 0].map((r) => { const role = roleAxis(r); return role ? role.label : "—"; });
      parts.push(T.stageArranged(...labels));
    }
    parts.push(T.drag);
    $("stagenote").textContent = embed ? "" : parts.join(" ");

    if (mode === "gl" && GL.ready) {
      const box = $("stage");
      GL.renderer.setSize(box.clientWidth, box.clientHeight, false);
      GL.camera.aspect = box.clientWidth / Math.max(box.clientHeight, 1);
      GL.camera.updateProjectionMatrix();
    }
    repaint();
  }

  // Cheap and order-sensitive: two buffers agree only if every byte is in the
  // same place. A reshape or a transpose must leave this alone.
  function bufferSignature() {
    let a = 2166136261;
    for (let k = 0; k < BUFSRC.length; k++) {
      a ^= BUFSRC[k] + 1;
      a = Math.imul(a, 16777619);
    }
    return (a >>> 0).toString(36);
  }

  // ─── pointer, wheel, keyboard ─────────────────────────────────────────────

  function pick(clientX, clientY) {
    const canvas = mode === "gl" && GL.ready ? GL.renderer.domElement : $("view");
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const draw = drawList();
    let best = null, bestD = 28;
    draw.forEach((v) => {
      const [x, y] = project(v.x, v.y, v.z, rect.width, rect.height);
      const d = Math.hypot(x - px, y - py);
      if (d < bestD) { bestD = d; best = v; }
    });
    if (best) {
      state.idx = best.L.slice();
      peeking = true;
      render();
    }
  }
  function zoomBy(factor) {
    view.scale = Math.min(2.4, Math.max(0.5, view.scale * factor));
    repaint();
  }
  function panBy(dx, dy) {
    peeking = false;
    view.panX += dx;
    view.panY += dy;
    repaint();
  }
  // Rotating away from face on lets the cubes go back to being cubes.
  function orbitBy(dx, dy) {
    const left = (dx || dy) && snap.on;
    if (left) {
      snap.on = false;
      glide.active = false;
      $("snap").setAttribute("aria-pressed", "false");
      $("snap").textContent = T.snapIn;
      $("stage").dataset.snapped = "0";
    }
    if (dx || dy) peeking = false;
    view.yaw += dx;
    view.el = Math.min(1.2, Math.max(0, view.el + dy));
    if (!snap.on) setSnapT(0);
    // Leaving face on changes the stage note and the arrows as well as the
    // cubes, so the one frame that leaves it is a full render, not a repaint.
    if (left) render(); else repaint();
  }
  // The magnet: let go near enough to face on and the view closes the rest of
  // the way itself. Tested on release, never mid-drag, so a drag past the
  // angle is not caught by it.
  function maybeSnap() {
    if (!snap.on && !embed && isFaceOn()) setSnap(true);
  }

  function bindPointer() {
    const el = $("stage");
    const live = new Map();
    let pinch = 0;
    const points = () => [...live.values()];
    const spread = () => {
      const [a, b] = points();
      return Math.hypot(a.x - b.x, a.y - b.y);
    };
    el.addEventListener("contextmenu", (e) => { if (!embed) e.preventDefault(); });
    el.addEventListener("pointerdown", (e) => {
      if (e.target.closest("#legend, #snap, #gizmo")) return;
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      live.set(e.pointerId, {
        x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false,
        pan: e.shiftKey || e.button === 2
      });
      if (live.size === 2) pinch = spread();
    });
    el.addEventListener("pointermove", (e) => {
      const me = live.get(e.pointerId);
      if (!me) return;
      const dx = e.clientX - me.x, dy = e.clientY - me.y;
      if (Math.hypot(e.clientX - me.x0, e.clientY - me.y0) > 3) me.moved = true;
      me.x = e.clientX;
      me.y = e.clientY;
      if (live.size >= 2) {
        const now = spread();
        if (pinch > 0 && now > 0) zoomBy(now / pinch);
        pinch = now;
        orbitBy(0, -dy * 0.004);
        return;
      }
      if (me.pan) panBy(dx, dy);
      else orbitBy(dx * 0.01, dy * 0.006);
    });
    const release = (e, tap) => {
      const me = live.get(e.pointerId);
      if (!me) return;
      live.delete(e.pointerId);
      if (live.size < 2) pinch = 0;
      if (tap && !me.moved && !embed) pick(e.clientX, e.clientY);
      else if (!me.pan) maybeSnap();
    };
    el.addEventListener("pointerup", (e) => release(e, true));
    el.addEventListener("pointercancel", (e) => release(e, false));
    el.addEventListener("wheel", (e) => {
      // Ctrl or Command only: this box owns most of a phone screen and the
      // page has to stay scrollable through it.
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? 0.92 : 1.08);
    }, { passive: false });
    el.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.25 : 0.08;
      const moves = {
        ArrowLeft:  () => e.shiftKey ? panBy(-16, 0) : orbitBy(-step, 0),
        ArrowRight: () => e.shiftKey ? panBy(16, 0) : orbitBy(step, 0),
        ArrowUp:    () => e.shiftKey ? panBy(0, -16) : orbitBy(0, -step),
        ArrowDown:  () => e.shiftKey ? panBy(0, 16) : orbitBy(0, step),
        "+":        () => zoomBy(1.12),
        "=":        () => zoomBy(1.12),
        "-":        () => zoomBy(0.89),
        f:          () => setSnap(!snap.on),
        F:          () => setSnap(!snap.on),
        Escape:     () => { if (snap.on) setSnap(false); },
        Home:       () => {
          Object.assign(view, HOME);
          snap.on = false;
          glide.active = false;
          setSnapT(0);
          $("stage").dataset.snapped = "0";
          $("snap").setAttribute("aria-pressed", "false");
          $("snap").textContent = T.snapIn;
          render();
        }
      };
      const move = moves[e.key];
      if (!move) return;
      e.preventDefault();
      move();
    });
    $("snap").addEventListener("click", () => setSnap(!snap.on));
    const gizmoGo = (arm) => {
      const spec = GIZMO_ARMS.find((a) => a.r === Number(arm.dataset.arm));
      if (!spec) return;
      if (spec.el === 0) {
        view.yaw = spec.yaw;
        setSnap(true);
      } else {
        snap.on = false;
        $("stage").dataset.snapped = "0";
        $("snap").setAttribute("aria-pressed", "false");
        $("snap").textContent = T.snapIn;
        glideTo(spec.yaw, spec.el);
        tick();
      }
    };
    $("gizmo").addEventListener("click", (e) => {
      const arm = e.target.closest("[data-arm]");
      if (arm) gizmoGo(arm);
    });
    $("gizmo").addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const arm = e.target.closest("[data-arm]");
      if (!arm) return;
      e.preventDefault();
      gizmoGo(arm);
    });
  }

  // ─── the tabs ─────────────────────────────────────────────────────────────

  // One tab per operation, the homepage hero's pattern: arrow keys move between
  // them, and the panel ids are plain words so that `#transpose` in the URL
  // opens the page on that tab and a link to it resolves.
  function bindTabs() {
    const tabs = [...document.querySelectorAll("#tabs [role=tab]")];
    const panels = tabs.map((tab) => $(tab.getAttribute("aria-controls")));
    const show = (i, push) => {
      tabs.forEach((tab, j) => {
        const on = i === j;
        tab.setAttribute("aria-selected", String(on));
        tab.tabIndex = on ? 0 : -1;
        panels[j].hidden = !on;
      });
      // `window.`: the code log above is a `const history`, and shadows it.
      if (push) window.history.replaceState(null, "", `#${panels[i].id}`);
    };
    const fromHash = () => {
      const i = panels.findIndex((p) => p.id === location.hash.slice(1));
      if (i >= 0) show(i, false);
    };
    tabs.forEach((tab, i) => {
      tab.addEventListener("click", () => show(i, true));
      tab.addEventListener("keydown", (e) => {
        const k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!k) return;
        e.preventDefault();
        const n = (i + k + tabs.length) % tabs.length;
        show(n, true);
        tabs[n].focus();
      });
    });
    window.addEventListener("hashchange", fromHash);
    fromHash();
  }

  // ─── embed mode ───────────────────────────────────────────────────────────

  function startEmbed() {
    const open = document.createElement("a");
    open.href = location.pathname + `?lang=${lang}`;
    open.target = "_top";
    open.textContent = T.embedOpen;
    const text = document.createElement("span");
    $("embedcap").append(text, open);
    // Fill the frame: there is no panel beside the stage to leave room for.
    view.scale = 1.3;
    let step = 0;
    const apply = () => {
      rebuildSource();
      // Without the photos there is no NHWC to permute: the fallback array is
      // a rank-3 np.arange, so `posOfId(3)` is -1 and a permutation built from
      // it would hand the shape an undefined axis and a NaN element count.
      // Both later steps are about the photos anyway, so the fallback holds.
      const at = hasAllIds() ? step : 0;
      if (at >= 1) applyTranspose(ORDER_PRESETS.NCHW.map(posOfId));
      state.compare = at === 2;
      text.innerHTML = `<b>${T.embedSteps[at]}</b>`;
      render();
    };
    apply();
    if (reduceMotion) return;
    setInterval(() => { step = (step + 1) % 3; apply(); }, 6000);
    // A slow sway rather than a full spin: a full turn passes through the
    // angles where the three photos stack up behind one another.
    let last = 0;
    const sway = (now) => {
      if (now - last > 40) {
        last = now;
        view.yaw = HOME.yaw + 0.35 * Math.sin(now / 2600);
        repaint();
      }
      requestAnimationFrame(sway);
    };
    requestAnimationFrame(sway);
  }

  // ─── boot ─────────────────────────────────────────────────────────────────

  // Loads the vendored three.js through its module bridge and waits for the
  // `three-ready` event it fires. If the import never resolves -- a file://
  // open, a blocked request -- nothing fires and the timeout settles it.
  function whenThree(ms) {
    return new Promise((resolve, reject) => {
      if (window.THREE) return resolve();
      const timer = setTimeout(() => reject(new Error("timeout")), ms);
      window.addEventListener("three-ready", () => {
        clearTimeout(timer);
        resolve();
      }, { once: true });
      const script = document.createElement("script");
      script.type = "module";
      script.src = "vendor/three-boot.js";
      script.addEventListener("error", () => { clearTimeout(timer); reject(new Error("load")); });
      document.head.appendChild(script);
    });
  }
  function bootGL() {
    let settled = false;
    const flat = (why) => {
      if (settled) return;
      settled = true;
      setMode("flat", why);
      render();
    };
    whenThree(6000).then(() => {
      if (settled) return;
      settled = true;
      if (initGL()) setMode("gl");
      else setMode("flat", "glNoWebgl");
      render();
    }).catch(() => flat("glNoScript"));
  }

  async function loadPhotos() {
    try {
      const res = await fetch("data/photos.json");
      if (!res.ok) throw new Error(String(res.status));
      const json = await res.json();
      if (!json.photos || json.photos.length !== 3) throw new Error("shape");
      // The instanced mesh is sized for MAX_RES; a larger side added to
      // WIDGET_RES in gen_figures.py would overflow it silently, so drop it.
      json.res = json.res.filter((r) => r <= MAX_RES);
      if (!json.res.length) throw new Error("res");
      if (!json.res.includes(state.res)) state.res = Math.max(...json.res);
      PHOTOS = json;
      $("stage").dataset.photos = String(json.photos.length);
    } catch (_) {
      PHOTOS = null;
      state.data = "numbers";
      $("stage").dataset.photos = "0";
    }
  }

  applyCopy();
  bindTabs();
  $("snap").textContent = T.snapIn;
  loadPhotos().then(() => {
    rebuildSource();
    // Only now: a drag, a click or a snap before there is an array reaches
    // the geometry helpers, and every one of them dereferences SRC.
    bindPointer();
    buildControls();
    if (embed) {
      // The front door: the isometric canvas only, no three.js to fetch.
      setMode("flat");
      startEmbed();
    } else {
      render();
      bootGL();
    }
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });
})();
</script>
</body>
</html>
