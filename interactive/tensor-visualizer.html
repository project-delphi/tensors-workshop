<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tensor layout and strides</title>
<style>
  :root {
    --bg: #f7f5ef;
    --ink: #1c1917;
    --ink-mute: #57534e;
    --panel: #fffcf7;
    --sunk: #ebe6dc;
    --line: #d6d0c4;
    /* Section 04's accent is #059669 (gen_notebooks.ACCENTS[4]). Neither that
       green nor white on top of it clears 4.5:1, and it carries link text, the
       eyebrow, the bolded offset and the label of whichever control is
       selected -- so each theme takes the nearest shade of it that does, with
       the foreground that belongs on it. */
    --accent: #047857;
    --on-accent: #ffffff;
    --ax0: #0072b2;
    --ax1: #e69f00;
    --ax2: #009e73;
    --ax3: #cc79a7;
    /* The three colour channels, when the cubes are photo pixels. Not the
       axis hues above: an axis colour says *which axis*, a channel colour says
       *which plane of the C axis*, and the two must not be confused. */
    --chan0: #c8102e;
    --chan1: #1a9c3c;
    --chan2: #1f5fd0;
    --pale: #f6f6f4;
    --sans: "Source Sans 3", "Source Sans Pro", "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="navy"]) {
      --bg: #1c1917;
      --ink: #f5f0e8;
      --ink-mute: #a8a29e;
      --panel: #292524;
      --sunk: #1c1917;
      --line: #44403c;
      --accent: #34d399;
      --on-accent: #1c1917;
      --pale: #e8e6e1;
    }
  }
  /* The homepage hero embeds this page on its navy band; these are the band's
     own colours (homepage.scss), so the iframe reads as part of it. */
  :root[data-theme="navy"] {
    --bg: #0f2740;
    --ink: #e7f0f8;
    --ink-mute: #a3bdd4;
    --panel: #12324a;
    --sunk: #0b2236;
    --line: #2a4d68;
    --accent: #6fe0c6;
    --on-accent: #06202f;
    --pale: #e8eef4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); }
  a { color: var(--accent); }
  .wrap { max-width: 76rem; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
  header p { max-width: 42rem; color: var(--ink-mute); overflow-wrap: break-word; }
  h1 { font-size: 1.65rem; font-weight: 650; letter-spacing: -0.02em; margin: 0.35rem 0 0.5rem; overflow-wrap: break-word; }
  .eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 24rem); gap: 1.25rem; align-items: start; }
  @media (max-width: 56rem) { .grid { grid-template-columns: 1fr; } }
  #stage {
    position: relative;
    height: min(62vh, 32rem);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    /* Not `none`. This box owns most of a phone screen, and `none` meant a
       reader swiping down to reach the controls rotated the tensor instead.
       One finger up or down scrolls the page; one finger sideways rotates;
       two fingers zoom and tilt. */
    touch-action: pan-y;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #stagenote {
    position: absolute; left: 0.8rem; right: 0.8rem; top: 0.7rem; margin: 0;
    font: 500 0.82rem/1.35 var(--sans); color: var(--ink-mute); pointer-events: none;
    overflow-wrap: break-word;
  }
  #overlays { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #overlays .lab {
    position: absolute; transform: translate(-50%, -120%);
    font: 700 13px/1 var(--sans); letter-spacing: 0.04em;
    text-shadow: 0 0 5px var(--bg), 0 0 5px var(--bg);
  }
  #overlays .off {
    position: absolute; transform: translate(-50%, -50%);
    font: 700 11px/1 var(--mono); color: var(--ink);
    background: var(--bg); border: 1px solid var(--ink); border-radius: 4px;
    padding: 2px 5px;
  }
  #axis-legend {
    display: flex; flex-wrap: wrap; gap: 0.45rem 1rem; margin: 0.65rem 0 0;
    font: 500 0.8rem/1.3 var(--sans); color: var(--ink-mute);
  }
  #axis-legend .chip { display: inline-flex; align-items: center; gap: 0.4rem; }
  #axis-legend .swatch { width: 0.65rem; height: 0.65rem; border-radius: 2px; flex: none; }
  #axis-legend b { font-family: var(--mono); font-size: 0.85rem; }
  #axis-legend em { font-style: normal; font-weight: 700; color: var(--ink); }

  /* The two pictures under the stage: the tensor as the images it holds, and
     the buffer it lives in. */
  .under { margin-top: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem 1rem 0.9rem; }
  .under h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 0.45rem; color: var(--ink-mute); }
  .under p { margin: 0.45rem 0 0; font-size: 0.8rem; line-height: 1.45; color: var(--ink-mute); overflow-wrap: break-word; }
  .under p code, .under h2 code { font: 0.9em var(--mono); color: var(--ink); }
  .strip-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.7rem; margin-top: 0.4rem; }
  .strip-row .tag { flex: 0 0 5.5rem; font: 700 0.75rem/1.3 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
  .strip-row .tag small { display: block; font: 500 0.68rem/1.3 var(--sans); color: var(--ink-mute); }
  .strip-row canvas { width: 5.5rem; height: 5.5rem; border: 1px solid var(--line); border-radius: 4px; image-rendering: pixelated; background: var(--sunk); }
  .strip-row.wrong .tag { color: #b3261e; }
  :root[data-theme="navy"] .strip-row.wrong .tag { color: #f87171; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="navy"]) .strip-row.wrong .tag { color: #f87171; } }
  #ribbon { display: block; width: 100%; height: 44px; border-radius: 6px; background: var(--sunk); }
  #ribbon-order { font: 600 0.8rem/1.4 var(--mono); }

  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem 1.1rem; min-width: 0; }
  aside h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.95rem 0 0.45rem; color: var(--ink-mute); }
  aside h2:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem 0.7rem; }
  .field { min-width: 0; }
  .field .k { display: flex; justify-content: space-between; font: 600 0.75rem/1.2 var(--mono); }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg.stack { flex-direction: column; }
  .seg.stack label { text-align: left; padding: 0.4rem 0.7rem; white-space: nowrap; }
  .seg label {
    flex: 1; text-align: center; padding: 0.35rem 0.4rem; font-size: 0.8rem; cursor: pointer;
    background: var(--sunk);
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg input:checked + label { background: var(--accent); color: var(--on-accent); font-weight: 650; }
  .seg input:disabled + label { opacity: 0.45; cursor: not-allowed; }
  .seg.axes label { font-family: var(--mono); font-weight: 700; background: var(--panel); color: var(--ink); }
  /* These sit on an Okabe-Ito hue rather than on --accent. No single
     foreground clears 4.5:1 on all four, so each hue names its own. */
  .seg.axes input[value="0"]:checked + label { background: var(--ax0); color: #ffffff; }
  .seg.axes input[value="1"]:checked + label { background: var(--ax1); color: #14110f; }
  .seg.axes input[value="2"]:checked + label { background: var(--ax2); color: #14110f; }
  .seg.axes input[value="3"]:checked + label { background: var(--ax3); color: #14110f; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chips button, .presets button, .tools button {
    font: 500 0.75rem/1.3 var(--sans); padding: 0.3rem 0.6rem; cursor: pointer;
    color: var(--ink); background: var(--sunk);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .chips button { font: 700 0.85rem/1.3 var(--mono); border-radius: 7px; min-width: 2.3rem; border-width: 2px; }
  .chips button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chips button:hover, .presets button:hover, .tools button:hover { border-color: var(--accent); }
  .chips button:focus-visible, .presets button:focus-visible, .tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .presets { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.45rem; }
  .checks { display: grid; gap: 0.25rem; }
  .checks label { display: flex; gap: 0.45rem; align-items: center; font-size: 0.82rem; }
  .checks input, .toggle input { accent-color: var(--accent); width: 1rem; height: 1rem; }
  .toggle { display: flex; gap: 0.5rem; align-items: flex-start; font-size: 0.82rem; margin-top: 0.3rem; }
  .toggle input { margin-top: 0.2rem; flex: none; }
  .readout { font: 700 0.9rem/1.5 var(--mono); margin: 0.35rem 0 0; overflow-wrap: anywhere; }
  .readout .dim { color: var(--ink-mute); font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font: 0.8rem/1.35 var(--mono); }
  th { text-align: left; font: 600 0.7rem/1.2 var(--sans); color: var(--ink-mute); padding: 0.15rem 0.3rem 0.25rem 0; }
  td { padding: 0.2rem 0.3rem 0.2rem 0; border-top: 1px solid var(--line); }
  td .dot { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; margin-right: 0.35rem; vertical-align: -0.05rem; }
  tr.fast td { font-weight: 700; }
  .mark { font-family: var(--sans); font-size: 0.68rem; font-weight: 700; margin-left: 0.25rem; }
  .formula { font: 0.75rem/1.45 var(--mono); background: var(--sunk); border-radius: 8px; padding: 0.55rem 0.7rem; overflow-x: auto; max-width: 100%; overflow-wrap: anywhere; margin: 0.5rem 0 0; }
  .formula .eq { display: block; margin-top: 0.35rem; color: var(--ink-mute); }
  .formula .term { white-space: nowrap; }
  .formula b { color: var(--accent); font-weight: 700; }
  pre {
    margin: 0.5rem 0 0; padding: 0.55rem 0.7rem; background: var(--sunk);
    border-radius: 8px; font: 0.76rem/1.45 var(--mono); overflow-x: auto;
    max-width: 100%; max-height: 26rem;
  }
  pre .cm { color: var(--ink-mute); }
  .tools { display: flex; gap: 0.4rem; margin-top: 0.45rem; }
  .note { font-size: 0.72rem; line-height: 1.4; color: var(--ink-mute); margin: 0.4rem 0 0; }
  .note code { font: 0.95em var(--mono); color: var(--ink); }
  .fallback { font-size: 0.8rem; color: var(--ink-mute); margin: 0.4rem 0 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  /* Embed mode: the stage, a caption, and nothing else. The hero on the
     homepage is what shows this; the caption's link is how a reader gets to
     the controls. */
  #embedcap { display: none; }
  html.embed .wrap { max-width: none; padding: 0; }
  html.embed header, html.embed aside, html.embed #axis-legend, html.embed .under, html.embed #glnote { display: none; }
  html.embed .grid { display: block; }
  html.embed #stage { height: calc(100vh - 3.4rem); border-radius: 0; border: 0; background: transparent; cursor: default; }
  html.embed #embedcap {
    display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; align-items: baseline;
    min-height: 3.4rem; padding: 0.55rem 0.9rem; margin: 0;
    font: 500 0.8rem/1.35 var(--sans); color: var(--ink-mute);
  }
  html.embed #embedcap b { color: var(--ink); font-weight: 650; }
  html.embed #embedcap a { white-space: nowrap; }
</style>
</head>
<body>
  <noscript>

    </p>
  </noscript>
  <div class="wrap">
    <header>
      <div class="eyebrow" id="eyebrow">Section 04 · reshape and transpose</div>
      <h1 id="title">Tensor layout and strides</h1>
      <p id="lead"></p>
      <p><a id="back" href="../notebooks.html">← Notebooks</a></p>

    <div class="grid">
      <div>
        <div id="stage" role="img" tabindex="0" aria-describedby="stagehelp" data-photos="0">

          <div id="overlays" aria-hidden="true"></div>

        </div>
        <p id="embedcap"></p>
        <div id="axis-legend"></div>

        <section class="under" id="imgstrip" aria-labelledby="h-strip">

        <section class="under" aria-labelledby="h-ribbon">

      </div>
      <aside>
        <h2 id="h-data">Data</h2>
        <div class="seg" id="datas" role="radiogroup" aria-labelledby="h-data"></div>
        <p class="note" id="data-note"></p>
        <h2 id="h-size">Shape</h2>
        <div id="shape-photo">
          <div class="checks" id="photo-checks"></div>
          <div class="seg" id="res" role="radiogroup" aria-labelledby="h-size" style="margin-top:0.45rem"></div>
        </div>
        <div class="row" id="sizes" hidden></div>
        <p class="readout" id="shape-readout"></p>
        <h2 id="h-order"></h2>
        <div class="presets" id="order-presets" role="group" aria-labelledby="h-order"></div>
        <div class="chips" id="chips" role="group" aria-labelledby="h-order"></div>
        <p class="note" id="order-note"></p>
        <h2 id="h-layout">Memory layout</h2>
        <div class="seg stack" id="layouts" role="radiogroup" aria-labelledby="h-layout"></div>
        <p class="note" id="layout-note"></p>
        <label class="toggle"><input type="checkbox" id="reshape"><span id="reshape-label"></span></label>
        <p class="note" id="reshape-note"></p>
        <h2 id="h-idx">Selected element</h2>
        <div class="row" id="indices"></div>
        <h2 id="h-slice">Highlight a slice</h2>
        <div class="seg axes" id="slices" role="radiogroup" aria-labelledby="h-slice"></div>
        <h2 id="h-stride">Strides</h2>
        <table>
          <thead><tr><th id="th-ax">Axis</th><th id="th-np">NumPy (bytes)</th><th id="th-pt">PyTorch</th></tr></thead>
          <tbody id="stride-body"></tbody>
        </table>
        <p class="note" id="stride-note"></p>
        <p class="formula" id="formula"></p>
        <h2 id="h-code"></h2>
        <pre><code id="code"></code></pre>
        <div class="tools">
          <button type="button" id="copy"></button>
          <button type="button" id="reset"></button>
        </div>
        <p class="fallback" id="glnote" hidden></p>
      </aside>
    </div>
    <p class="sr" aria-live="polite" id="status"></p>
  </div>
<!-- The vendored three.js (vendor/three-boot.js) is injected by bootGL()
     below rather than written here, so that embed mode -- the homepage hero
     -- never fetches it: the front door gets the isometric canvas only. -->
<script>
(function () {
  "use strict";

  // Axis *identity*, fixed for the life of the page: 0 = B, 1 = C, 2 = H,
  // 3 = W. Every colour, letter and slider belongs to an identity. The
  // *logical order* -- which identity sits at which position of the shape --
  // is `state.perm`, and that is what transpose changes. The *memory order*
  // -- which identity the buffer runs fastest along -- is `state.mem`, and
  // that is what a layout copy changes. Keeping the three apart is the whole
  // lesson of section 04, so the code keeps them apart too.
  const LETTER = ["B", "C", "H", "W"];
  const AXVAR = ["--ax0", "--ax1", "--ax2", "--ax3"];
  const CHANVAR = ["--chan0", "--chan1", "--chan2"];
  const ITEMSIZE = 1;            // uint8: one byte per element, as the photos are
  const GAP = 1.5;               // between batch items, along x
  const ZGAP = 0.55;             // between channel planes, along z
  const FIT = 1.55;
  const MAX_SIDE = 8;
  const MAX_CELLS = MAX_SIDE ** 4;

  // Memory layouts, by *position* in the logical shape: which position runs
  // slowest first. That is how NumPy and PyTorch define them -- channels_last
  // is "position 1 fastest, then 3, then 2, then 0", not "the C axis" -- so
  // it is spelt positionally here and mapped to identities when applied.
  const POS_ORDERS = { C: [0, 1, 2, 3], F: [3, 2, 1, 0], CL: [0, 2, 3, 1] };
  const ORDER_PRESETS = { NHWC: [0, 2, 3, 1], NCHW: [0, 1, 2, 3] };

  const EN = {
    title: "Tensor layout and strides",
    eyebrow: "Section 04 · reshape and transpose",
    lead: "Three real photographs as one 4-D tensor, one cube per byte. Drag to rotate. Transpose changes the shape and the strides and leaves every cube where it is; a memory layout rewrites the buffer and leaves the shape alone; reshape rereads the buffer and breaks the picture.",
    back: "← Notebooks",
    data: "Data",
    datas: { photos: "Photos", numbers: "Counting numbers" },
    dataNotePhotos: "The histology slide, the astronaut and the coffee cup notebook 04 stacks -- shipped with scikit-image, downsampled here.",
    dataNoteNumbers: "np.arange, so every value is its own position in the original buffer and T[b, c, h, w] can be checked by eye.",
    dataNoteFailed: "The photos did not load, so the cubes count instead.",
    size: "Shape",
    resLabel: (r) => `${r}×${r}`,
    shapeOf: "shape",
    order: "Axis order · transpose",
    presets: { NHWC: "NHWC", NCHW: "NCHW", swapHW: "swap H↔W", reverse: "reverse (.T)" },
    orderNote: "Click two letters to swap them. Same buffer, new shape, new strides -- a view, no copy.",
    layout: "Memory layout",
    layouts: { C: "C-contiguous", F: "F-contiguous", CL: "channels_last (PyTorch)" },
    layoutNoteC: "The last axis of the shape is contiguous. NumPy's default.",
    layoutNoteF: "The first axis of the shape is contiguous. Fortran, some SciPy.",
    layoutNoteCL: "PyTorch memory_format for NCHW: position 1 of the shape runs fastest.",
    layoutNoteView: "None of these: x is a non-contiguous view. The buffer was written in another order and transpose only changed how it is read. Pick one to copy it into that order.",
    layoutCopy: "Same shape. The buffer is rewritten -- a copy.",
    reshape: "Compare with reshape",
    reshapeNote: "y = the same bytes, reread in memory order and poured into this shape. Identical when the buffer is already in this order; scrambled otherwise. The cubes show y while this is on.",
    idx: "Selected element",
    slice: "Highlight a slice",
    stride: "Strides",
    ax: "Axis",
    np: "bytes",
    pt: "elements",
    offset: "Offset (elements)",
    axName: ["batch", "channel", "height", "width"],
    none: "none",
    fastest: "fastest",
    strip: "As images",
    stripX: "x",
    stripY: "y = reshape",
    stripImshow: (s) => `plt.imshow(x[0])  # x[0] is ${s}, height × width × 3`,
    stripTranspose: (s, t) => `x[0] is ${s}; matplotlib wants (H, W, 3), so plt.imshow(x[0].transpose(${t})) -- the picture is drawn by axis meaning here, not by position.`,
    stripNotBatch: (s, ax) => `x[0] is ${s} -- one slab along the ${ax} axis, not a photo, because B is not first. The pictures here are drawn by axis meaning, not by position; put B first to index a photo.`,
    stripNumbers: (c) => `x[b, C=${c}] as a heatmap, pale to deep. Colour is value.`,
    stripWrong: "same shape, wrong picture",
    stripSame: "identical: the buffer was already in this order",
    ribbon: "The buffer",
    ribbonNote: (order, n) => `${n} bytes in memory, one bar each, in the order they are stored: ${order} (slowest → fastest). Ticks mark the slowest stride. The outlined bar is the selected element.`,
    code: "In code",
    copy: "Copy",
    reset: "Reset log",
    copied: "Copied",
    glNoWebgl: "This browser has no WebGL — showing the isometric canvas instead. Everything on the panel is the same.",
    glNoScript: "The 3-D renderer did not load — showing the isometric canvas instead. Everything on the panel is the same.",
    status: (o, i, s) => `Offset ${o} at x[${i.join(", ")}]${s ? `, ${s}` : ""}`,
    stageLabel: "A 4-D tensor drawn as cubes, one per element.",
    stageHelp: "Drag, or use the arrow keys, to rotate. Pinch, hold Ctrl and scroll, or press plus and minus to zoom. Home resets the view. Click a cube, or use the index sliders, to select an element.",
    sliderSize: (ax) => `Size of the ${ax} axis`,
    sliderIdx: (ax) => `Index along the ${ax} axis`,
    sameBuf: "same buffer",
    strideNote: "NumPy reports strides in bytes; PyTorch reports them in elements. uint8, so the two agree here.",
    sliceOf: (ax) => `slice along ${ax}`,
    stagePhotos: "Each cube is one byte of a photo: the three planes along C are its red, green and blue channels, tinted by value.",
    stageNumbers: (ax) => `Fill is the value, pale to deep, in the colour of the fastest axis (${ax}).`,
    stageReshape: "Showing y = reshape: the same bytes reread in memory order.",
    lit: (ax) => `The slice along ${ax} is lit; everything else is dimmed.`,
    drag: "Drag to rotate. Pinch, or hold Ctrl (⌘ on a Mac) and scroll, to zoom.",
    swapped: (a, b) => `Swapped ${a} and ${b}.`,
    embedOpen: "Open the full widget →",
    embedSteps: [
      "Three photos as one (3, 16, 16, 3) tensor, NHWC. One cube per byte.",

  const ES = {

    status: (o, i, s) => `Offset ${o} en x[${i.join(", ")}]${s ? `, ${s}` : ""}`,

    stageNumbers: (ax) => `El relleno es el valor, de pálido a oscuro, en el color del eje más rápido (${ax}).`,
    stageReshape: "Se muestra y = reshape: los mismos bytes releídos en orden de memoria.",
    lit: (ax) => `El corte sobre ${ax} está iluminado; el resto se atenúa.`,

    swapped: (a, b) => `${a} y ${b} intercambiados.`,
    embedOpen: "Abrir la herramienta completa →",
    embedSteps: [
      "Tres fotos como un tensor (3, 16, 16, 3), NHWC. Un cubo por byte.",

      "Con reshape a NCHW en su lugar: los mismos bytes, releídos en orden de memoria. La imagen se rompe."
    ],
    logBuild: "# miniaturas de 16 px de las tres fotos del cuaderno 04, apiladas como lote",
    logView: "una vista, sin copia",
    logCopy: "copia: el búfer se reescribe",
    logReshape: "los mismos bytes, releídos en orden de memoria",
    logSelected: (o, v) => `offset ${o}, valor ${v}`
  };

  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "es" ? "es" : "en";
  const embed = params.get("embed") === "1";
  const theme = params.get("theme");
  const T = lang === "es" ? ES : EN;
  document.documentElement.lang = lang;
  document.title = T.title;
  if (embed) document.documentElement.classList.add("embed");
  if (theme === "navy") document.documentElement.dataset.theme = "navy";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const state = {
    data: "photos",
    photos: [true, true, true],   // which of the three are in the batch
    res: 16,
    size: [2, 3, 4, 5],           // numbers mode, by identity
    perm: ORDER_PRESETS.NHWC.slice(),   // logical order: identity at each position
    mem: ORDER_PRESETS.NHWC.slice(),    // memory order: identities, slowest first
    reshape: false,
    idx: [0, 0, 0, 0],            // by identity
    slice: -1                     // identity, or -1
  };
  // Yaw is negative so the batch axis runs across the screen rather than
  // down its diagonal: at +0.55 the isometric projection laid the three
  // photos over one another and the embed read as one pile.
  const HOME = { yaw: -0.6, el: 0.55, scale: 1 };
  const view = { ...HOME };
  let PHOTOS = null;
  let VOX = [];
  let BUF = [];
  let mode = "flat";
  const GL = { ready: false };
  const history = [];
  let controlsKey = "";

  const $ = (id) => document.getElementById(id);

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function parseRgb(c) {
    if (c.startsWith("#")) {
      return [c.slice(1, 3), c.slice(3, 5), c.slice(5, 7)].map((x) => parseInt(x, 16));
    }
    return (c.match(/\d+/g) || [0, 0, 0]).slice(0, 3).map(Number);
  }
  function mix(a, b, t) {
    const pa = parseRgb(a), pb = parseRgb(b);
    const m = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
    return `rgb(${m.join(",")})`;
  }
  function axSpan(i, text) {
    return `<span style="color:var(${AXVAR[i]})">${text}</span>`;
  }
  function axisFill(i, t) {
    const hue = css(AXVAR[i]);
    return mix(mix(hue, "#ffffff", 0.84), hue, t);
  }
  function chanFill(c, v) {
    return mix(css("--pale"), css(CHANVAR[c]), 0.12 + 0.88 * (v / 255));
  }
  function shapeText(dims) {
    return `(${dims.join(", ")})`;
  }

  // ─── the array ────────────────────────────────────────────────────────────

  const photosOn = () => state.photos.map((on, i) => on ? i : -1).filter((i) => i >= 0);
  const isPhotos = () => state.data === "photos" && PHOTOS;

  function dims() {
    if (isPhotos()) return [photosOn().length, 3, state.res, state.res];
    return state.size.slice();
  }
  function shape() {
    const d = dims();
    return state.perm.map((ax) => d[ax]);
  }
  function numel() {
    return dims().reduce((a, b) => a * b, 1);
  }
  function strides() {
    const d = dims();
    const st = [0, 0, 0, 0];
    let run = 1;
    for (let k = 3; k >= 0; k--) {
      st[state.mem[k]] = run;
      run *= d[state.mem[k]];
    }
    return st;
  }
  function offsetOf(id) {
    const st = strides();
    return id.reduce((s, v, i) => s + v * st[i], 0);
  }
  function fastestAxis() {
    return state.mem[3];
  }
  const logicalOf = (id) => state.perm.map((ax) => id[ax]);
  function identityOf(L) {
    const id = [0, 0, 0, 0];
    state.perm.forEach((ax, p) => { id[ax] = L[p]; });
    return id;
  }
  function cOffsetLogical(L) {
    const sh = shape();
    let off = 0;
    for (let p = 0; p < 4; p++) off = off * sh[p] + L[p];
    return off;
  }
  // The value stored at an identity index. Photos: the byte. Numbers: the
  // position in the original C-ordered (B, C, H, W) buffer, np.arange style.
  function valueAt(id) {
    const [b, c, h, w] = id;
    if (isPhotos()) {
      const photo = PHOTOS.photos[photosOn()[b]];
      return photo.px[String(state.res)][(h * state.res + w) * 3 + c];
    }
    const [, C, H, W] = state.size;
    return ((b * C + c) * H + h) * W + w;
  }
  function buildBuffer() {
    const d = dims();
    const st = strides();
    const buf = new Array(numel());
    for (let b = 0; b < d[0]; b++)
      for (let c = 0; c < d[1]; c++)
        for (let h = 0; h < d[2]; h++)
          for (let w = 0; w < d[3]; w++) {
            const id = [b, c, h, w];
            buf[id.reduce((s, v, i) => s + v * st[i], 0)] = valueAt(id);
          }
    return buf;
  }
  // What `x.ravel(order="K").reshape(x.shape)` puts at a logical position:
  // the buffer read straight through, poured into the shape row-major.
  const yValueAt = (id) => BUF[cOffsetLogical(logicalOf(id))];
  const shownValueAt = (id) => state.reshape ? yValueAt(id) : valueAt(id);
  function isContiguousAs(kind) {
    const want = POS_ORDERS[kind].map((p) => state.perm[p]);
    return want.every((ax, k) => ax === state.mem[k]);
  }
  function currentLayout() {
    return ["C", "F", "CL"].find(isContiguousAs) || null;
  }
  function colourAt(id, v) {
    if (isPhotos()) return chanFill(id[1], v);
    return axisFill(fastestAxis(), numel() > 1 ? v / (numel() - 1) : 0.5);
  }

  // ─── copy ─────────────────────────────────────────────────────────────────

  function applyCopy() {
    $("title").textContent = T.title;
    $("eyebrow").textContent = T.eyebrow;
    $("lead").textContent = T.lead;
    $("back").textContent = T.back;
    $("back").href = lang === "es" ? "../es/notebooks.html" : "../notebooks.html";
    $("h-data").textContent = T.data;
    $("h-size").textContent = T.size;
    $("h-order").textContent = T.order;
    $("order-note").textContent = T.orderNote;
    $("h-layout").textContent = T.layout;
    $("reshape-label").textContent = T.reshape;
    $("reshape-note").textContent = T.reshapeNote;
    $("h-idx").textContent = T.idx;
    $("h-slice").textContent = T.slice;
    $("h-stride").textContent = T.stride;
    $("h-strip").textContent = T.strip;
    $("h-ribbon").textContent = T.ribbon;
    $("h-code").textContent = T.code;
    $("copy").textContent = T.copy;
    $("reset").textContent = T.reset;
    $("stage").setAttribute("aria-label", T.stageLabel);
    $("stagehelp").textContent = T.stageHelp;
    $("stride-note").textContent = T.strideNote;
    $("th-ax").textContent = T.ax;
    $("th-np").textContent = T.np;
    $("th-pt").textContent = T.pt;
  }

  function radio(name, value, label, checked, color) {
    const id = `${name}-${value}`;
    const inp = `<input type="radio" name="${name}" id="${id}" value="${value}"${checked ? " checked" : ""}>`;
    const tint = color ? ` style="border-left:3px solid ${color}"` : "";
    return `${inp}<label for="${id}"${tint}>${label}</label>`;
  }

  // ─── the code log ─────────────────────────────────────────────────────────

  // The array as it was built, before anything in the history happened to
  // it -- so the shape here is the *starting* order, not the current one.
  function buildLines() {
    const d = dims();
    if (isPhotos()) {
      const sh = shapeText(ORDER_PRESETS.NHWC.map((ax) => d[ax]));
      const names = photosOn().map((i) => PHOTOS.photos[i].id).join(", ");
      return [
        "import numpy as np",
        "import torch",
        "from skimage import data",
        T.logBuild,
        `x = np.stack([${names}])      # ${sh} — NHWC, uint8`,
        "t = torch.from_numpy(x)"
      ];
    }
    const sh = shapeText(ORDER_PRESETS.NCHW.map((ax) => d[ax]));
    return [
      "import numpy as np",
      "import torch",
      `x = np.arange(${numel()}, dtype=np.uint8).reshape${sh}   # NCHW`,
      "t = torch.from_numpy(x)"
    ];
  }
  function pushHistory(lines) {
    history.push(lines.join("\n"));
  }
  function transposeLines(from, to) {
    const axes = to.map((ax) => from.indexOf(ax));
    const sh = shapeText(to.map((ax) => dims()[ax]));
    return [
      `x = x.transpose(${axes.join(", ")})   # ${sh} — ${T.logView}`,
      `t = t.permute(${axes.join(", ")})`
    ];
  }
  function layoutLines(kind) {
    return {
      C: [`x = np.ascontiguousarray(x)   # ${T.logCopy}`, "t = t.contiguous()"],
      F: [`x = np.asfortranarray(x)      # ${T.logCopy}`, `t = torch.from_numpy(x)   # ${T.sameBuf}`],
      CL: [`t = t.contiguous(memory_format=torch.channels_last)   # ${T.logCopy}`,
           `x = t.numpy()   # ${T.sameBuf}`]
    }[kind];
  }
  function currentLines(st, off) {
    const L = logicalOf(state.idx);
    const sh = shape();
    const bytes = state.perm.map((ax) => st[ax] * ITEMSIZE).join(", ");
    const elems = state.perm.map((ax) => st[ax]).join(", ");
    const lines = [
      `x.shape      # ${shapeText(sh)}`,
      `x.strides    # (${bytes})  ${T.np}`,
      `t.stride()   # (${elems})  ${T.pt}`,
      `x.flags["C_CONTIGUOUS"]   # ${currentLayout() === "C" ? "True" : "False"}`,
      `x[${L.join(", ")}]   # ${T.logSelected(off, shownValueAt(state.idx))}`
    ];
    if (state.slice >= 0) {
      const sel = sh.map((_, p) => state.perm[p] === state.slice ? String(L[p]) : ":");
      lines.push(`x[${sel.join(", ")}]   # ${shapeText(sh.filter((_, p) => state.perm[p] !== state.slice))}`);
    }
    if (state.reshape) {
      const same = currentLayout() === "C";
      lines.push(`y = x.ravel(order="K").reshape(x.shape)   # ${T.logReshape}`);
      lines.push(`np.array_equal(x, y)   # ${same ? "True" : "False"}`);
    }
    return lines;
  }
  function renderCode(st, off) {
    const text = [buildLines().join("\n"), ...history, currentLines(st, off).join("\n")].join("\n\n");
    $("code").textContent = text;
    $("code").scrollTop = $("code").scrollHeight;
    return text;
  }

  // ─── controls ─────────────────────────────────────────────────────────────

  function sliders(host, key, maxFor) {
    host.innerHTML = "";
    state.perm.forEach((ax) => {
      const L = LETTER[ax];
      const wrap = document.createElement("div");
      wrap.className = "field";
      const lab = document.createElement("div");
      lab.className = "k";
      lab.style.color = `var(${AXVAR[ax]})`;
      const name = document.createElement("span");
      name.textContent = L;
      const val = document.createElement("span");
      val.className = "val";
      val.textContent = String(state[key][ax]);
      lab.append(name, val);
      const input = document.createElement("input");
      input.type = "range";
      input.min = key === "size" ? "1" : "0";
      input.max = String(maxFor(ax));
      input.value = String(state[key][ax]);
      input.dataset.ax = String(ax);
      input.setAttribute("aria-label",
        (key === "size" ? T.sliderSize : T.sliderIdx)(`${L} — ${T.axName[ax]}`));
      input.style.accentColor = `var(${AXVAR[ax]})`;
      input.addEventListener("input", () => {
        state[key][ax] = Number(input.value);
        if (key === "size") {
          state.idx[ax] = Math.min(state.idx[ax], state.size[ax] - 1);
        }
        render();
      });
      wrap.append(lab, input);
      host.appendChild(wrap);
    });
  }

  function buildControls() {
    // Data source.
    $("datas").innerHTML = ["photos", "numbers"].map((k) =>
      radio("data", k, T.datas[k], state.data === k)).join("");
    $("datas").addEventListener("change", (e) => {
      state.data = e.target.value;
      restart();
    });

    // Photo batch and resolution.
    $("photo-checks").innerHTML = "";
    (PHOTOS ? PHOTOS.photos : []).forEach((p, i) => {
      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = state.photos[i];
      box.id = `photo-${p.id}`;
      box.addEventListener("change", () => {
        if (!box.checked && photosOn().length === 1) { box.checked = true; return; }
        state.photos[i] = box.checked;
        restart();
      });
      label.append(box, document.createTextNode(`${i} · ${p[`name_${lang}`]}`));
      $("photo-checks").appendChild(label);
    });
    $("res").innerHTML = (PHOTOS ? PHOTOS.res : []).map((r) =>
      radio("res", String(r), T.resLabel(r), state.res === r)).join("");
    $("res").addEventListener("change", (e) => {
      state.res = Number(e.target.value);
      restart();
    });

    // Axis order.
    $("order-presets").innerHTML = "";
    [["NHWC", () => ORDER_PRESETS.NHWC.slice()],
     ["NCHW", () => ORDER_PRESETS.NCHW.slice()],
     ["swapHW", () => state.perm.map((ax) => ax === 2 ? 3 : ax === 3 ? 2 : ax)],
     ["reverse", () => state.perm.slice().reverse()]].forEach(([key, next]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.id = `order-${key}`;
      button.textContent = T.presets[key];
      button.addEventListener("click", () => setPerm(next()));
      $("order-presets").appendChild(button);
    });
    $("chips").addEventListener("click", (e) => {
      const button = e.target.closest("button");
      if (!button) return;
      const ax = Number(button.dataset.ax);
      const armed = $("chips").querySelector('[aria-pressed="true"]');
      if (!armed) { button.setAttribute("aria-pressed", "true"); return; }
      const other = Number(armed.dataset.ax);
      armed.setAttribute("aria-pressed", "false");
      if (other === ax) return;
      const next = state.perm.map((a) => a === ax ? other : a === other ? ax : a);
      $("status").textContent = T.swapped(LETTER[other], LETTER[ax]);
      setPerm(next);
    });

    // Memory layout.
    $("layouts").innerHTML = ["C", "F", "CL"].map((k) =>
      radio("layout", k, T.layouts[k], false)).join("");
    $("layouts").addEventListener("change", (e) => {
      const kind = e.target.value;
      state.mem = POS_ORDERS[kind].map((p) => state.perm[p]);
      pushHistory(layoutLines(kind));
      render();
    });

    $("reshape").addEventListener("change", (e) => {
      state.reshape = e.target.checked;
      render();
    });

    // Slice.
    $("slices").addEventListener("change", (e) => {
      state.slice = Number(e.target.value);
      render();
    });

    $("reset").addEventListener("click", () => { history.length = 0; render(); });
    $("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("code").textContent);
        $("copy").textContent = T.copied;
        setTimeout(() => { $("copy").textContent = T.copy; }, 1400);
      } catch (_) { /* clipboard blocked: the text is still selectable */ }
    });
  }

  // A new array: a different data source, batch or resolution is a fresh
  // `np.stack` / `np.arange`, so the log starts over from its build line and
  // the array is contiguous in its natural order -- the notebook's batch is
  // NHWC, np.arange(...).reshape(B, C, H, W) is NCHW. Keeping the old
  // transposes would print a log whose first line already has the wrong shape.
  function restart() {
    state.perm = (isPhotos() ? ORDER_PRESETS.NHWC : ORDER_PRESETS.NCHW).slice();
    state.mem = state.perm.slice();
    state.reshape = false;
    state.idx = [0, 0, 0, 0];
    history.length = 0;
    render();
  }

  function setPerm(next) {
    if (next.every((ax, p) => ax === state.perm[p])) return;
    pushHistory(transposeLines(state.perm, next));
    state.perm = next;
    render();
  }

  // Rebuilt only when the logical order or the data changes, because a
  // slider being dragged must not be replaced under the pointer -- so the
  // sizes are deliberately not in this key: in numbers mode every tick of a
  // size slider changes them, and the index sliders' `max` is refreshed
  // below without a rebuild.
  function syncControls() {
    const key = `${state.data}|${state.perm.join("")}|${PHOTOS ? 1 : 0}`;
    if (key !== controlsKey) {
      controlsKey = key;
      sliders($("sizes"), "size", () => MAX_SIDE);
      sliders($("indices"), "idx", (ax) => dims()[ax] - 1);
      $("chips").innerHTML = state.perm.map((ax) =>
        `<button type="button" data-ax="${ax}" aria-pressed="false" style="border-color:var(${AXVAR[ax]});color:var(${AXVAR[ax]})" aria-label="${LETTER[ax]} — ${T.axName[ax]}">${LETTER[ax]}</button>`
      ).join("");
      $("slices").innerHTML = [-1, ...state.perm].map((ax) => {
        const label = ax < 0 ? T.none : LETTER[ax];
        const color = ax < 0 ? "" : css(AXVAR[ax]);
        return radio("slice", String(ax), label, state.slice === ax, color);
      }).join("");
    }
    const photoMode = !!isPhotos();
    $("shape-photo").hidden = !photoMode;
    $("sizes").hidden = photoMode;
    document.querySelectorAll("#indices input").forEach((el) => {
      const ax = Number(el.dataset.ax);
      el.max = String(dims()[ax] - 1);
      el.value = String(state.idx[ax]);
      el.parentElement.querySelector(".val").textContent = String(state.idx[ax]);
    });
    document.querySelectorAll("#sizes input").forEach((el) => {
      const ax = Number(el.dataset.ax);
      el.value = String(state.size[ax]);
      el.parentElement.querySelector(".val").textContent = String(state.size[ax]);
    });
    document.querySelectorAll("#datas input").forEach((el) => {
      el.checked = el.value === state.data;
      if (el.value === "photos") el.disabled = !PHOTOS;
    });
    $("data-note").textContent = !PHOTOS ? T.dataNoteFailed
      : (photoMode ? T.dataNotePhotos : T.dataNoteNumbers);
    document.querySelectorAll("#res input").forEach((el) => { el.checked = Number(el.value) === state.res; });
    const layout = currentLayout();
    document.querySelectorAll("#layouts input").forEach((el) => { el.checked = el.value === layout; });
    $("layout-note").textContent = layout
      ? `${{ C: T.layoutNoteC, F: T.layoutNoteF, CL: T.layoutNoteCL }[layout]} ${T.layoutCopy}`
      : T.layoutNoteView;
    $("reshape").checked = state.reshape;
    document.querySelectorAll("#slices input").forEach((el) => { el.checked = Number(el.value) === state.slice; });
    const d = dims();
    $("shape-readout").innerHTML =
      `<span class="dim">${T.shapeOf} (${state.perm.map((ax) => axSpan(ax, LETTER[ax])).join(", ")}) = </span>` +
      `(${state.perm.map((ax) => axSpan(ax, d[ax])).join(", ")})`;
  }

  // ─── geometry ─────────────────────────────────────────────────────────────

  function centre() {
    const [B, C, H, W] = dims();
    return {
      cx: ((B - 1) * (W + GAP) + W - 1) / 2,
      cy: -(H - 1) / 2,
      cz: -(C - 1) * (1 + ZGAP) / 2
    };
  }
  function axisHandles() {
    const [B, C, H, W] = dims();
    const { cx, cy, cz } = centre();
    const x0 = -cx - 0.55;
    const yTop = -cy + 0.55;
    const yBot = -(H - 1) - cy - 0.55;
    const zFront = -cz + 0.55;
    const bHandle = B > 1
      ? { i: 0, o: { x: W - cx + 0.1, y: yTop, z: zFront }, d: { x: 1, y: 0, z: 0 }, len: Math.max(GAP - 0.35, 0.9) }
      : { i: 0, o: { x: x0, y: yBot - 1.05, z: zFront }, d: { x: 1, y: 0, z: 0 }, len: Math.max(W, 1.1) };
    return [
      { i: 3, o: { x: x0, y: yTop, z: zFront }, d: { x: 1, y: 0, z: 0 }, len: W },
      { i: 2, o: { x: x0, y: yTop, z: zFront }, d: { x: 0, y: -1, z: 0 }, len: H },
      { i: 1, o: { x: x0, y: yTop, z: zFront }, d: { x: 0, y: 0, z: -1 }, len: C * (1 + ZGAP) - ZGAP },
      bHandle
    ];
  }
  function cellScale(w, h) {
    const [B, C, H, W] = dims();
    const extent = Math.max((B - 1) * (W + GAP) + W, H, C * (1 + ZGAP), 2);
    return Math.min(w, h) / (extent * FIT) * view.scale;
  }
  function canvasTo(x, y, z, w, h) {
    const s = cellScale(w, h);
    const ca = Math.cos(view.yaw), sa = Math.sin(view.yaw);
    const rx = x * ca - z * sa, rz = x * sa + z * ca;
    return [
      w / 2 + (rx - rz) * 0.866 * s,
      h / 2 - 12 + ((rx + rz) * 0.5 * view.el - y) * s
    ];
  }
  function glTo(x, y, z, w, h) {
    const THREE = GL.THREE;
    const v = new THREE.Vector3(x, y, z);
    GL.group.updateMatrixWorld(true);
    v.applyMatrix4(GL.group.matrixWorld);
    v.project(GL.camera);
    return [(v.x * 0.5 + 0.5) * w, (-v.y * 0.5 + 0.5) * h];
  }

  function placeOverlays(w, h) {
    const host = $("overlays");
    host.innerHTML = "";
    const to = (x, y, z) => (mode === "gl" && GL.ready) ? glTo(x, y, z, w, h) : canvasTo(x, y, z, w, h);
    axisHandles().forEach((a) => {
      const el = document.createElement("span");
      el.className = "lab";
      el.style.color = css(AXVAR[a.i]);
      el.textContent = LETTER[a.i];
      const [px, py] = to(
        a.o.x + a.d.x * (a.len + 0.75),
        a.o.y + a.d.y * (a.len + 0.75),
        a.o.z + a.d.z * (a.len + 0.75)
      );
      el.style.left = `${px}px`;
      el.style.top = `${py}px`;
      host.appendChild(el);
    });
    const sel = VOX.find((v) => v.sel);
    if (sel && !embed) {
      const el = document.createElement("span");
      el.className = "off";
      el.textContent = String(sel.off);
      const [px, py] = to(sel.x, sel.y, sel.z);
      el.style.left = `${px}px`;
      el.style.top = `${py}px`;
      host.appendChild(el);
    }
  }

  function buildVoxels() {
    const [B, C, H, W] = dims();
    const st = strides();
    const { cx, cy, cz } = centre();
    const out = [];
    for (let b = 0; b < B; b++) {
      for (let c = 0; c < C; c++) {
        for (let h = 0; h < H; h++) {
          for (let w = 0; w < W; w++) {
            const id = [b, c, h, w];
            const off = id.reduce((s, v, i) => s + v * st[i], 0);
            const sel = id.every((v, i) => v === state.idx[i]);
            const lit = state.slice < 0 || id[state.slice] === state.idx[state.slice];
            const value = shownValueAt(id);
            out.push({
              x: b * (W + GAP) + w - cx,
              y: -h - cy,
              z: -c * (1 + ZGAP) - cz,
              color: colourAt(id, value),
              alpha: lit ? 1 : 0.15,
              sel, off, id, lit, value
            });
          }
        }
      }
    }
    return out;
  }

  // ─── the flat renderer ────────────────────────────────────────────────────

  function drawArrow(ctx, x0, y0, x1, y1, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    const ang = Math.atan2(y1 - y0, x1 - x0);
    const ah = 9;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ah * Math.cos(ang - 0.45), y1 - ah * Math.sin(ang - 0.45));
    ctx.lineTo(x1 - ah * Math.cos(ang + 0.45), y1 - ah * Math.sin(ang + 0.45));
    ctx.closePath();
    ctx.fill();
  }

  function drawFlat(voxels) {
    const canvas = $("view");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const to = (x, y, z) => canvasTo(x, y, z, w, h);
    const ca = Math.cos(view.yaw), sa = Math.sin(view.yaw);
    const sorted = voxels.slice().sort((a, b) =>
      ((a.x * sa + a.z * ca) + a.y * 0.2) - ((b.x * sa + b.z * ca) + b.y * 0.2));
    const s = cellScale(w, h);
    const half = 0.42 * s;
    const ink = css("--ink");

    sorted.forEach((v) => {
      const [px, py] = to(v.x, v.y, v.z);
      ctx.globalAlpha = v.alpha;
      ctx.fillStyle = v.color;
      ctx.strokeStyle = v.sel ? ink : mix(v.color, ink, 0.25);
      ctx.lineWidth = v.sel ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(px, py - half);
      ctx.lineTo(px + half, py - half * 0.4);
      ctx.lineTo(px + half, py + half * 0.7);
      ctx.lineTo(px, py + half * 1.15);
      ctx.lineTo(px - half, py + half * 0.7);
      ctx.lineTo(px - half, py - half * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    axisHandles().forEach((a) => {
      const color = css(AXVAR[a.i]);
      const [x0, y0] = to(a.o.x, a.o.y, a.o.z);
      const [x1, y1] = to(a.o.x + a.d.x * a.len, a.o.y + a.d.y * a.len, a.o.z + a.d.z * a.len);
      drawArrow(ctx, x0, y0, x1, y1, color);
    });
    placeOverlays(w, h);
  }

  // ─── the GL renderer ──────────────────────────────────────────────────────

  function syncGL(voxels) {
    const THREE = GL.THREE;
    const m = new THREE.Matrix4();
    const c = new THREE.Color();
    // Two meshes: a cell is either in the slice or dimmed, and instance colour
    // carries no alpha. Both materials stay constant, so nothing is allocated
    // per cell per frame.
    let nLit = 0, nDim = 0;
    voxels.forEach((v) => {
      const mesh = v.alpha < 1 ? GL.dim : GL.lit;
      const i = v.alpha < 1 ? nDim++ : nLit++;
      m.makeTranslation(v.x, v.y, v.z);
      mesh.setMatrixAt(i, m);
      mesh.setColorAt(i, c.set(v.color));
    });
    GL.lit.count = nLit;
    GL.dim.count = nDim;
    [GL.lit, GL.dim].forEach((mesh) => {
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.computeBoundingSphere();
    });
    const sel = voxels.find((v) => v.sel);
    GL.outline.visible = !!sel;
    if (sel) {
      GL.outline.position.set(sel.x, sel.y, sel.z);
      GL.outline.material.color.set(css("--ink"));
    }
    // Repointed, never rebuilt: an ArrowHelper keeps its materials on its
    // `.line` and `.cone` children, and rebuilding leaked two per axis per render.
    axisHandles().forEach((a, i) => {
      const arrow = GL.arrows[i];
      arrow.position.set(a.o.x, a.o.y, a.o.z);
      arrow.setDirection(new THREE.Vector3(a.d.x, a.d.y, a.d.z).normalize());
      arrow.setLength(a.len, 0.38, 0.22);
      arrow.setColor(new THREE.Color(css(AXVAR[a.i])));
    });
  }

  function initGL() {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
    if (!gl) return false;
    const THREE = window.THREE;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 80);
    camera.position.set(8, 6, 10);
    camera.lookAt(0, 0, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 0.65);
    key.position.set(4, 8, 6);
    scene.add(key);
    const group = new THREE.Group();
    scene.add(group);
    $("stage").appendChild(canvas);

    const box = new THREE.BoxGeometry(0.86, 0.86, 0.86);
    const instanced = (opacity) => {
      const mat = new THREE.MeshLambertMaterial({
        transparent: opacity < 1, opacity, depthWrite: opacity === 1
      });
      const mesh = new THREE.InstancedMesh(box, mat, MAX_CELLS);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.setColorAt(0, new THREE.Color("#ffffff"));   // allocates instanceColor
      mesh.count = 0;
      mesh.frustumCulled = false;
      group.add(mesh);
      return mesh;
    };
    const lit = instanced(1);
    const dim = instanced(0.15);
    const outline = new THREE.LineSegments(
      new THREE.EdgesGeometry(box),
      new THREE.LineBasicMaterial({ color: css("--ink") })
    );
    outline.visible = false;
    group.add(outline);
    const arrows = axisHandles().map(() => {
      const a = new THREE.ArrowHelper(
        new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xffffff, 0.38, 0.22);
      group.add(a);
      return a;
    });
    Object.assign(GL, { ready: true, THREE, renderer, scene, camera, group, box, lit, dim, outline, arrows });
    return true;
  }

  function setMode(next, why) {
    mode = next;
    $("view").style.display = next === "flat" ? "block" : "none";
    if (GL.renderer) GL.renderer.domElement.style.display = next === "gl" ? "block" : "none";
    $("glnote").hidden = next === "gl";
    if (why) $("glnote").textContent = T[why];
  }

  // Frame the bounding extents against whichever field of view is tighter.
  function glDistance(pitch) {
    const [B, C, H, W] = dims();
    const spanX = (B - 1) * (W + GAP) + W;
    const rXZ = 0.5 * Math.hypot(spanX, C * (1 + ZGAP)) + 1.1;
    const rY = 0.5 * H + 1.1;
    const vfov = GL.camera.fov * Math.PI / 180;
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * Math.max(GL.camera.aspect, 0.2));
    const needV = rY * Math.cos(pitch) + rXZ * Math.sin(pitch);
    const fit = Math.max(rXZ / Math.tan(hfov / 2), needV / Math.tan(vfov / 2));
    return fit * 1.12 / view.scale;
  }

  function repaint() {
    if (mode === "gl" && GL.ready) {
      const pitch = Math.atan(view.el * 0.6);
      const dist = glDistance(pitch);
      const far = dist * 3;
      if (GL.camera.far !== far) {
        GL.camera.far = far;
        GL.camera.updateProjectionMatrix();
      }
      GL.camera.position.set(
        Math.sin(view.yaw) * dist * Math.cos(pitch),
        Math.sin(pitch) * dist,
        Math.cos(view.yaw) * dist * Math.cos(pitch)
      );
      GL.camera.lookAt(0, 0, 0);
      GL.renderer.render(GL.scene, GL.camera);
      const stage = $("stage");
      placeOverlays(stage.clientWidth, stage.clientHeight);
    } else {
      drawFlat(VOX);
    }
  }

  // ─── the pictures under the stage ─────────────────────────────────────────

  function stripRow(kind, valueFn) {
    const [B, , H, W] = dims();
    const row = document.createElement("div");
    row.className = "strip-row";
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = kind === "x" ? T.stripX : T.stripY;
    row.appendChild(tag);
    for (let b = 0; b < B; b++) {
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(W, H);
      for (let h = 0; h < H; h++) {
        for (let w = 0; w < W; w++) {
          const o = (h * W + w) * 4;
          if (isPhotos()) {
            for (let c = 0; c < 3; c++) img.data[o + c] = valueFn([b, c, h, w]);
          } else {
            const v = valueFn([b, state.idx[1], h, w]);
            const rgb = parseRgb(axisFill(fastestAxis(), numel() > 1 ? v / (numel() - 1) : 0.5));
            img.data[o] = rgb[0]; img.data[o + 1] = rgb[1]; img.data[o + 2] = rgb[2];
          }
          img.data[o + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", `${kind}[${b}]`);
      row.appendChild(canvas);
    }
    return row;
  }

  function renderStrip() {
    const host = $("strip-rows");
    host.innerHTML = "";
    host.appendChild(stripRow("x", valueAt));
    const same = currentLayout() === "C";
    if (state.reshape) {
      const row = stripRow("y", yValueAt);
      if (!same) row.classList.add("wrong");
      row.querySelector(".tag").insertAdjacentHTML("beforeend",
        `<small>${same ? T.stripSame : T.stripWrong}</small>`);
      host.appendChild(row);
    }
    const sh = shape();
    const rest = state.perm.slice(1);
    const x0 = shapeText(sh.slice(1));
    if (!isPhotos()) {
      $("strip-note").textContent = T.stripNumbers(state.idx[1]);
    } else if (state.perm[0] !== 0) {
      // x[0] is not a photo at all: the batch axis is not first, so x[0] is
      // one slab of whatever axis is.
      $("strip-note").textContent = T.stripNotBatch(x0, T.axName[state.perm[0]]);
    } else if (rest.join("") === "231") {
      $("strip-note").textContent = T.stripImshow(x0);
    } else {
      // The transpose that brings x[0] to (H, W, C), whatever order it is in now.
      const t = [2, 3, 1].map((ax) => rest.indexOf(ax)).join(", ");
      $("strip-note").textContent = T.stripTranspose(x0, t);
    }
  }

  function renderRibbon(st) {
    const canvas = $("ribbon");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || 800, h = 44;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const n = BUF.length;
    const cw = w / n;
    // Identity index of the element at each memory offset, for colour and slice.
    const d = dims();
    const idAt = new Array(n);
    for (let b = 0; b < d[0]; b++)
      for (let c = 0; c < d[1]; c++)
        for (let hh = 0; hh < d[2]; hh++)
          for (let ww = 0; ww < d[3]; ww++) {
            const id = [b, c, hh, ww];
            idAt[id.reduce((s, v, i) => s + v * st[i], 0)] = id;
          }
    for (let k = 0; k < n; k++) {
      const id = idAt[k];
      const lit = state.slice < 0 || id[state.slice] === state.idx[state.slice];
      ctx.globalAlpha = lit ? 1 : 0.25;
      ctx.fillStyle = colourAt(id, BUF[k]);
      ctx.fillRect(k * cw, 10, Math.max(cw, 0.5), h - 18);
    }
    ctx.globalAlpha = 1;
    // Ticks at the slowest stride.
    const slow = st[state.mem[0]];
    ctx.strokeStyle = css("--ink-mute");
    ctx.lineWidth = 1;
    for (let k = 0; k <= n; k += slow) {
      ctx.beginPath();
      ctx.moveTo(Math.min(k * cw, w - 0.5), 2);
      ctx.lineTo(Math.min(k * cw, w - 0.5), 9);
      ctx.stroke();
    }
    // The selected element.
    const off = offsetOf(state.idx);
    ctx.strokeStyle = css("--ink");
    ctx.lineWidth = 2;
    ctx.strokeRect(off * cw - 1, 9, Math.max(cw, 2) + 2, h - 16);
    ctx.fillStyle = css("--ink");
    ctx.beginPath();
    ctx.moveTo(off * cw + cw / 2, h - 1);
    ctx.lineTo(off * cw + cw / 2 - 4, h - 7);
    ctx.lineTo(off * cw + cw / 2 + 4, h - 7);
    ctx.closePath();
    ctx.fill();
    const order = state.mem.map((ax) => `<span style="color:var(${AXVAR[ax]})">${LETTER[ax]}</span>`).join(" → ");
    $("ribbon-note").innerHTML = T.ribbonNote(`<span id="ribbon-order">${order}</span>`, n);
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", `${T.ribbon}: ${state.mem.map((ax) => LETTER[ax]).join(" ")}`);
  }

  function renderLegend() {
    const fastest = fastestAxis();
    $("axis-legend").innerHTML = LETTER.map((L, i) => {
      const mark = i === fastest ? ` <em>${T.fastest}</em>` : "";
      return `<span class="chip"><span class="swatch" style="background:var(${AXVAR[i]})"></span><b style="color:var(${AXVAR[i]})">${L}</b> ${T.axName[i]}${mark}</span>`;
    }).join("");
  }

  // ─── render ───────────────────────────────────────────────────────────────

  function render() {
    const st = strides();
    BUF = buildBuffer();
    VOX = buildVoxels();
    const off = offsetOf(state.idx);
    const fastest = fastestAxis();
    syncControls();

    $("stride-body").innerHTML = state.perm.map((ax) => {
      const fast = ax === fastest;
      return `<tr class="${fast ? "fast" : ""}"><td><span class="dot" style="background:var(${AXVAR[ax]})"></span>${axSpan(ax, LETTER[ax])}${fast ? `<span class="mark">${T.fastest}</span>` : ""}</td><td>${st[ax] * ITEMSIZE}</td><td>${st[ax]}</td></tr>`;
    }).join("");

    const terms = state.perm.map((ax) =>
      `<span class="term">(${axSpan(ax, state.idx[ax])} · ${axSpan(ax, st[ax])})</span>`
    ).join(" + ");
    $("formula").innerHTML =
      `${T.offset} = ` + state.perm.map((ax) => `${axSpan(ax, LETTER[ax])}·${axSpan(ax, `S_${LETTER[ax]}`)}`).join(" + ") +
      `<span class="eq"> = ${terms} = <b>${off}</b></span>`;

    renderCode(st, off);
    renderLegend();
    renderStrip();
    renderRibbon(st);

    $("status").textContent = T.status(off, logicalOf(state.idx),
      state.slice >= 0 ? T.sliceOf(`${LETTER[state.slice]} (${T.axName[state.slice]})`) : "");
    const base = isPhotos() ? T.stagePhotos : T.stageNumbers(LETTER[fastest]);
    const parts = [state.reshape ? T.stageReshape : base];
    if (state.slice >= 0) parts.push(T.lit(LETTER[state.slice]));
    parts.push(T.drag);
    $("stagenote").textContent = embed ? "" : parts.join(" ");

    if (mode === "gl" && GL.ready) {
      syncGL(VOX);
      const stage = $("stage");
      GL.renderer.setSize(stage.clientWidth, stage.clientHeight, false);
      GL.camera.aspect = stage.clientWidth / Math.max(stage.clientHeight, 1);
      GL.camera.updateProjectionMatrix();
    }
    repaint();
  }

  // ─── pointer, wheel, keyboard ─────────────────────────────────────────────

  function pick(clientX, clientY) {
    const canvas = mode === "gl" && GL.ready ? GL.renderer.domElement : $("view");
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const to = (x, y, z) => (mode === "gl" && GL.ready)
      ? glTo(x, y, z, rect.width, rect.height)
      : canvasTo(x, y, z, rect.width, rect.height);
    let best = null, bestD = 28;
    VOX.forEach((v) => {
      const [x, y] = to(v.x, v.y, v.z);
      const d = Math.hypot(x - px, y - py);
      if (d < bestD) { bestD = d; best = v; }
    });
    if (best) {
      state.idx = best.id.slice();
      render();
    }
  }
  function zoomBy(factor) {
    view.scale = Math.min(2.4, Math.max(0.5, view.scale * factor));
    repaint();
  }
  function orbitBy(dx, dy) {
    view.yaw += dx;
    view.el = Math.min(1.2, Math.max(0.2, view.el + dy));
    repaint();
  }

  function bindPointer() {
    const el = $("stage");
    const live = new Map();
    let pinch = 0;
    const points = () => [...live.values()];
    const spread = () => {
      const [a, b] = points();
      return Math.hypot(a.x - b.x, a.y - b.y);
    };
    el.addEventListener("pointerdown", (e) => {
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      live.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false });
      if (live.size === 2) pinch = spread();
    });
    el.addEventListener("pointermove", (e) => {
      const me = live.get(e.pointerId);
      if (!me) return;
      const dx = e.clientX - me.x, dy = e.clientY - me.y;
      if (Math.hypot(e.clientX - me.x0, e.clientY - me.y0) > 3) me.moved = true;
      me.x = e.clientX;
      me.y = e.clientY;
      if (live.size >= 2) {
        const now = spread();
        if (pinch > 0 && now > 0) zoomBy(now / pinch);
        pinch = now;
        orbitBy(0, -dy * 0.004);
        return;
      }
      orbitBy(dx * 0.01, dy * 0.006);
    });
    const release = (e, tap) => {
      const me = live.get(e.pointerId);
      if (!me) return;
      live.delete(e.pointerId);
      if (live.size < 2) pinch = 0;
      if (tap && !me.moved && !embed) pick(e.clientX, e.clientY);
    };
    el.addEventListener("pointerup", (e) => release(e, true));
    el.addEventListener("pointercancel", (e) => release(e, false));
    el.addEventListener("wheel", (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? 0.92 : 1.08);
    }, { passive: false });
    el.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.25 : 0.08;
      const moves = {
        ArrowLeft:  () => orbitBy(-step, 0),
        ArrowRight: () => orbitBy(step, 0),
        ArrowUp:    () => orbitBy(0, -step),
        ArrowDown:  () => orbitBy(0, step),
        "+":        () => zoomBy(1.12),
        "=":        () => zoomBy(1.12),
        "-":        () => zoomBy(0.89),
        Home:       () => { Object.assign(view, HOME); repaint(); }
      };
      const move = moves[e.key];
      if (!move) return;
      e.preventDefault();
      move();
    });
  }

  // ─── embed mode ───────────────────────────────────────────────────────────

  function startEmbed() {
    const open = document.createElement("a");
    open.href = location.pathname + `?lang=${lang}`;
    open.target = "_top";
    open.textContent = T.embedOpen;
    const text = document.createElement("span");
    $("embedcap").append(text, open);
    // Fill the frame: there is no panel beside the stage to leave room for.
    view.scale = 1.3;
    let step = 0;
    const apply = () => {
      state.perm = (step === 0 ? ORDER_PRESETS.NHWC : ORDER_PRESETS.NCHW).slice();
      state.reshape = step === 2;
      text.innerHTML = `<b>${T.embedSteps[step]}</b>`;
      render();
    };
    apply();
    if (reduceMotion) return;
    setInterval(() => { step = (step + 1) % 3; apply(); }, 6000);
    // A slow sway rather than a full spin: a full turn passes through the
    // angles where the three photos stack up behind one another.
    let last = 0;
    const sway = (now) => {
      if (now - last > 40) {
        last = now;
        view.yaw = HOME.yaw + 0.35 * Math.sin(now / 2600);
        repaint();
      }
      requestAnimationFrame(sway);
    };
    requestAnimationFrame(sway);
  }

  // ─── boot ─────────────────────────────────────────────────────────────────

  // Loads the vendored three.js through its module bridge and waits for the
  // `three-ready` event it fires. If the import never resolves -- a file://
  // open, a blocked request -- nothing fires and the timeout settles it.
  function whenThree(ms) {
    return new Promise((resolve, reject) => {
      if (window.THREE) return resolve();
      const timer = setTimeout(() => reject(new Error("timeout")), ms);
      window.addEventListener("three-ready", () => {
        clearTimeout(timer);
        resolve();
      }, { once: true });
      const script = document.createElement("script");
      script.type = "module";
      script.src = "vendor/three-boot.js";
      script.addEventListener("error", () => { clearTimeout(timer); reject(new Error("load")); });
      document.head.appendChild(script);
    });
  }
  function bootGL() {
    let settled = false;
    const flat = (why) => {
      if (settled) return;
      settled = true;
      setMode("flat", why);
      render();
    };
    whenThree(6000).then(() => {
      if (settled) return;
      settled = true;
      if (initGL()) setMode("gl");
      else setMode("flat", "glNoWebgl");
      render();
    }).catch(() => flat("glNoScript"));
  }

  async function loadPhotos() {
    try {
      const res = await fetch("data/photos.json");
      if (!res.ok) throw new Error(String(res.status));
      const json = await res.json();
      if (!json.photos || json.photos.length !== 3) throw new Error("shape");
      PHOTOS = json;
      $("stage").dataset.photos = String(json.photos.length);
    } catch (_) {
      PHOTOS = null;
      state.data = "numbers";
      state.perm = ORDER_PRESETS.NCHW.slice();
      state.mem = state.perm.slice();
      $("stage").dataset.photos = "0";
    }
  }

  applyCopy();
  bindPointer();
  loadPhotos().then(() => {
    buildControls();
    if (embed) {
      // The front door: the isometric canvas only, no three.js to fetch.
      setMode("flat");
      startEmbed();
    } else {
      render();
      bootGL();
    }
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });
})();
</script>
</body>
</html>
