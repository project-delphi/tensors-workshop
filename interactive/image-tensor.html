      el.className = "lab";
      el.style.color = css(role.hue + "-ink");
      el.textContent = role.label;
      const [px, py] = to(
        a.o.x + a.d.x * (a.len + 0.75),
        a.o.y + a.d.y * (a.len + 0.75),
        a.o.z + a.d.z * (a.len + 0.75)
      );
      el.style.left = `${px}px`;
      el.style.top = `${py}px`;
      host.appendChild(el);
    });
    const sel = draw.find((v) => v.sel);
    if (sel && !embed) {
      const el = document.createElement("span");
      const [px, py] = to(sel.x, sel.y, sel.z);
      if (peeking) {
        // What the click is for: the index, the sum the strides make of it,
        // and the offset that sum lands on.
        el.className = "peek";
        const terms = state.idx.map((v, p) => `${v}·${state.stride[p]}`).join(" + ");
        el.innerHTML = T.peek(state.idx.join(", "), terms, sel.off);
      } else {
        el.className = "off";
        el.textContent = String(sel.off);
      }
      el.style.left = `${px}px`;
      el.style.top = `${py}px`;
      host.appendChild(el);
    }
    drawGizmo();
  }

  // The orientation gizmo. It is drawn from the same yaw, elevation and snap
  // the stage uses, so it works under either renderer, and each arm is a
  // shortcut to looking down that axis.
  const GIZMO_ARMS = [
    { r: 3, d: [1, 0, 0], yaw: Math.PI / 2, el: 0 },
    { r: 2, d: [0, -1, 0], yaw: 0, el: 1.2 },
    { r: 1, d: [0, 0, -1], yaw: 0, el: 0 }
  ];
  function drawGizmo() {
    const svg = $("gizmo");
    if (embed) return;
    const ca = Math.cos(view.yaw), sa = Math.sin(view.yaw);
    const flat = snap.t;
    const kx = 0.866 + 0.134 * flat;
    const at = ([x, y, z]) => {
      const rx = x * ca - z * sa, rz = x * sa + z * ca;
      return [(rx - rz * (1 - flat)) * kx * 30, ((rx + rz) * 0.5 * view.el - y) * 30];
    };
    const arms = GIZMO_ARMS.map((arm) => ({ arm, role: roleAxis(arm.r), p: at(arm.d) }))
      .filter((a) => a.role);
    // Built once and then only moved. Rewriting the markup every frame would
    // drop keyboard focus in the middle of a drag.
    if (svg.dataset.arms !== arms.map((a) => a.arm.r).join(",")) {
      svg.dataset.arms = arms.map((a) => a.arm.r).join(",");
      svg.innerHTML = arms.map(({ arm }) =>
        `<g class="arm" data-arm="${arm.r}" role="button" tabindex="0">` +
        `<line x1="0" y1="0" stroke-width="3" stroke-linecap="round"></line>` +
        `<circle r="9"></circle><text text-anchor="middle"></text></g>`).join("");
    }
    arms.sort((a, b) => a.p[1] - b.p[1]);
    // Re-inserting an element is a remove and an insert, which blurs it. The
    // order really does change as the view turns -- activating an arm starts a
    // glide that reorders them -- so the restack is kept and the focus is put
    // back afterwards, rather than leaving the reader on <body>.
    const order = arms.map((a) => a.arm.r).join(",");
    const restack = svg.dataset.order !== order;
    const focused = restack && svg.contains(document.activeElement) ? document.activeElement : null;
    if (restack) svg.dataset.order = order;
    arms.forEach(({ arm, role, p }) => {
      const g = svg.querySelector(`[data-arm="${arm.r}"]`);
      const hue = css(role.hue);
      g.setAttribute("aria-label", T.gizmoArm(role.label));
      g.querySelector("line").setAttribute("x2", p[0].toFixed(1));
      g.querySelector("line").setAttribute("y2", p[1].toFixed(1));
      g.querySelector("line").setAttribute("stroke", hue);
      const circle = g.querySelector("circle");
      circle.setAttribute("cx", p[0].toFixed(1));
      circle.setAttribute("cy", p[1].toFixed(1));
      circle.setAttribute("fill", hue);
      const text = g.querySelector("text");
      text.setAttribute("x", p[0].toFixed(1));
      text.setAttribute("y", (p[1] + 3.2).toFixed(1));
      text.setAttribute("fill", inkOn(hue));
      text.textContent = role.label;
      if (restack) svg.appendChild(g);   // paint order: nearest last
    });
    if (focused) focused.focus({ preventScroll: true });
  }

  // ─── the flat renderer ────────────────────────────────────────────────────

  function drawArrow(ctx, x0, y0, x1, y1, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    const ang = Math.atan2(y1 - y0, x1 - x0);
    const ah = 9;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ah * Math.cos(ang - 0.45), y1 - ah * Math.sin(ang - 0.45));
    ctx.lineTo(x1 - ah * Math.cos(ang + 0.45), y1 - ah * Math.sin(ang + 0.45));
    ctx.closePath();
    ctx.fill();
  }

  function drawFlat(voxels) {
    const canvas = $("view");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const to = (x, y, z) => canvasTo(x, y, z, w, h);
    const ca = Math.cos(view.yaw), sa = Math.sin(view.yaw);
    const sorted = voxels.slice().sort((a, b) =>
      ((a.x * sa + a.z * ca) + a.y * 0.2) - ((b.x * sa + b.z * ca) + b.y * 0.2));
    const s = cellScale(w, h);
    const ink = css("--ink");
    // One entry per distinct fill, not per cube. The seam colour is a mix of
    // the fill with the ink, and mix() parses both strings -- which at the
    // largest batch was 98304 parses per frame, on the one render path that
    // has to redraw every cube whenever the camera moves. A photo's fills
    // come from chanFill(), so there are at most 768 of them.
    const seams = new Map();
    const seam = (fill) => {
      let c = seams.get(fill);
      if (c === undefined) { c = mix(fill, ink, 0.25); seams.set(fill, c); }
      return c;
    };
    const labels = showValues() && s >= VALUE_MIN_PX && !canReveal();
    // Face on the cubes are squares that meet: a hexagon drawn at a quarter
    // turn is a cube seen from nowhere, and the photograph would show its seams.
    const square = snap.t > 0.5;
    if (labels) { ctx.textAlign = "center"; ctx.textBaseline = "middle"; }

    sorted.forEach((v) => {
      const [px, py] = to(v.x, v.y, v.z);
      const half = s * (0.42 + 0.08 * snap.t) * (v.scale || 1);
      ctx.globalAlpha = v.alpha;
      ctx.fillStyle = v.color;
      ctx.strokeStyle = v.sel ? ink : seam(v.color);
      ctx.lineWidth = v.sel ? 2 : 1;
      ctx.beginPath();
      if (square) {
        ctx.rect(px - half, py - half, half * 2, half * 2);
      } else {
        ctx.moveTo(px, py - half);
        ctx.lineTo(px + half, py - half * 0.4);
        ctx.lineTo(px + half, py + half * 0.7);
        ctx.lineTo(px, py + half * 1.15);
        ctx.lineTo(px - half, py + half * 0.7);
        ctx.lineTo(px - half, py - half * 0.4);
        ctx.closePath();
      }
      ctx.fill();
      // Seams would show as a grid over the photograph, so the outline goes
      // once the gaps have closed -- except on the one selected cube.
      if (half >= 2 && (!square || v.sel || snap.t < 0.995 || !canReveal())) ctx.stroke();
      if (labels) {
        const text = String(v.value);
        ctx.fillStyle = inkOn(v.color);
        ctx.font = labelFont(text, half);
        ctx.fillText(text, px, py + half * (square ? 0 : 0.22));
      }
    });
    ctx.globalAlpha = 1;
    if (snap.t < 0.995) {
      axisHandles().forEach((a) => {
        const role = roleAxis(a.r);
        if (!role) return;
        const [x0, y0] = to(a.o.x, a.o.y, a.o.z);
        const [x1, y1] = to(a.o.x + a.d.x * a.len, a.o.y + a.d.y * a.len, a.o.z + a.d.z * a.len);
        drawArrow(ctx, x0, y0, x1, y1, css(role.hue));
      });
    }
    placeOverlays(w, h, voxels);
  }

  // ─── the GL renderer ──────────────────────────────────────────────────────

  const glCamera = () => (snap.t > 0.98 && GL.ortho) ? GL.ortho : GL.camera;

  // The instance buffers hold whatever list was last handed here. A drift, a
  // drag or a zoom moves the camera and not one cube, so re-composing every
  // matrix and re-parsing every colour string to say nothing changed is the
  // whole cost of those frames -- 49152 of each, at the largest batch.
  // Identity is the right test and a deep compare would not be: buildVoxels()
  // returns a fresh array whenever anything a cube shows changes (a new
  // shape, a new slice, a new theme, a step of the snap), and drawList()
  // returns a fresh one on every frame of a tween, which is exactly when the
  // buffers do have to be rewritten.
  function syncGL(voxels) {
    if (voxels === GL.synced) return;
    GL.synced = voxels;
    const THREE = GL.THREE;
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    const pos = new THREE.Vector3();
    const scl = new THREE.Vector3();
    // Two meshes: a cell is either in the slice or dimmed, and instance colour
    // carries no alpha. Both materials stay constant, so nothing is allocated
    // per cell per frame.
    let nLit = 0, nDim = 0;
    voxels.forEach((v) => { if (v.alpha < 1) nDim++; else nLit++; });
    growMeshes(Math.max(nLit, nDim));
    nLit = 0;
    nDim = 0;
    // A colour string is parsed once per distinct string, not once per cube:
    // a photo's fills are at most 768 strings, and parsing one per cube per
    // frame was most of a tween's cost at the larger sizes.
    const colour = (str) => {
      let c = GL.colours.get(str);
      if (!c) {
        if (GL.colours.size > 4096) GL.colours.clear();
        c = new THREE.Color(str);
        GL.colours.set(str, c);
      }
      return c;
    };
    const side = cubeSide() / 0.86;
    voxels.forEach((v) => {
      const mesh = v.alpha < 1 ? GL.dim : GL.lit;
      const i = v.alpha < 1 ? nDim++ : nLit++;
      const k = side * (v.scale || 1);
      pos.set(v.x, v.y, v.z);
      scl.set(k, k, k);
      m.compose(pos, q, scl);
      mesh.setMatrixAt(i, m);
      mesh.setColorAt(i, colour(v.color));
    });
    GL.lit.count = nLit;
    GL.dim.count = nDim;
    [GL.lit, GL.dim].forEach((mesh) => {
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.computeBoundingSphere();
    });
    const sel = voxels.find((v) => v.sel);
    GL.outline.visible = !!sel;
    if (sel) {
      GL.outline.position.set(sel.x, sel.y, sel.z);
      GL.outline.scale.setScalar(side * (sel.scale || 1));
      GL.outline.material.color.set(css("--ink"));
    }
    // Repointed, never rebuilt: an ArrowHelper keeps its materials on its
    // `.line` and `.cone` children, and rebuilding leaked two per axis per render.
    const handles = axisHandles();
    GL.arrows.forEach((arrow, i) => {
      const a = handles[i];
      const role = a && roleAxis(a.r);
      arrow.visible = !!role && snap.t < 0.995;
      if (!role) return;
      arrow.position.set(a.o.x, a.o.y, a.o.z);
      arrow.setDirection(new THREE.Vector3(a.d.x, a.d.y, a.d.z).normalize());
      arrow.setLength(a.len, 0.38, 0.22);
      arrow.setColor(new THREE.Color(css(role.hue)));
    });
  }

  function initGL() {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
    if (!gl) return false;
    const THREE = window.THREE;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 80);
    camera.position.set(8, 6, 10);
    camera.lookAt(0, 0, 0);
    // Face on, the perspective camera would splay the outer cubes and leave a
    // seam down every column of the photograph. The orthographic one is matched
    // to it at the plane the cubes sit on, so taking over is not a jump.
    const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 80);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 0.65);
    key.position.set(4, 8, 6);
    scene.add(key);
    const group = new THREE.Group();
    scene.add(group);
    $("stage").insertBefore(canvas, $("overlays"));

    const box = new THREE.BoxGeometry(0.86, 0.86, 0.86);
    const lit = instancedMesh(THREE, box, 1, START_CELLS);
    const dim = instancedMesh(THREE, box, 0.15, START_CELLS);
    group.add(lit, dim);
    const outline = new THREE.LineSegments(
      new THREE.EdgesGeometry(box),
      new THREE.LineBasicMaterial({ color: css("--ink") })
    );
    outline.visible = false;
    group.add(outline);
    const arrows = [0, 1, 2, 3].map(() => {
      const a = new THREE.ArrowHelper(
        new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xffffff, 0.38, 0.22);
      group.add(a);
      return a;
    });
    Object.assign(GL, { ready: true, THREE, renderer, scene, camera, ortho, group, box, lit, dim, outline, arrows,
                        cap: START_CELLS, colours: new Map(), labels: [], texCache: new Map() });
    return true;
  }

  function instancedMesh(THREE, box, opacity, cap) {
    const mat = new THREE.MeshLambertMaterial({
      transparent: opacity < 1, opacity, depthWrite: opacity === 1
    });
    const mesh = new THREE.InstancedMesh(box, mat, cap);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.setColorAt(0, new THREE.Color("#ffffff"));   // allocates instanceColor
    mesh.count = 0;
    mesh.frustumCulled = false;
    return mesh;
  }
  // An InstancedMesh cannot be resized, so a batch bigger than the buffers
  // replaces both meshes with ones the next power of two up. It only ever
  // grows: going back down to 16x16 keeps the larger buffers, which is
  // cheaper than reallocating on every change of size.
  function growMeshes(need) {
    if (need <= GL.cap) return;
    let cap = GL.cap;
    while (cap < need) cap *= 2;
    ["lit", "dim"].forEach((k) => {
      const old = GL[k];
      const next = instancedMesh(GL.THREE, GL.box, old.material.opacity, cap);
      GL.group.remove(old);
      old.dispose();
      old.material.dispose();
      GL.group.add(next);
      GL[k] = next;
    });
    GL.cap = cap;
  }

  // The value printed on a cube, as a billboard just outside its face nearest
  // the camera. A sprite is depth-tested, so a cube behind another keeps its
  // number to itself -- which an HTML overlay could not do. One texture per
  // distinct (text, colour), cached; a value is at most four characters.
  function labelTexture(text, color) {
    const THREE = GL.THREE;
    const key = `${text}|${color}`;
    let tex = GL.texCache.get(key);
    if (tex) return tex;
    if (GL.texCache.size > 2048) {
      GL.texCache.forEach((t) => t.dispose());
      GL.texCache.clear();
    }
    const cv = document.createElement("canvas");
    cv.width = cv.height = 96;
    const ctx = cv.getContext("2d");
    ctx.font = `700 ${Math.min(46, 160 / Math.max(text.length, 1))}px ${css("--mono") || "ui-monospace, monospace"}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(text, 48, 50);
    tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    GL.texCache.set(key, tex);
    return tex;
  }

  // Runs after the camera is placed, on every repaint: the labels are shown
  // only when a cell is wide enough on screen, and zooming changes that.
  function syncLabels(voxels) {
    const THREE = GL.THREE;
    let n = 0;
    if (showValues() && voxels.length && !canReveal()) {
      const stage = $("stage");
      const v0 = voxels[0];
      const [ax, ay] = glTo(v0.x, v0.y, v0.z, stage.clientWidth, stage.clientHeight);
      const [bx, by] = glTo(v0.x + 1, v0.y, v0.z, stage.clientWidth, stage.clientHeight);
      if (Math.hypot(bx - ax, by - ay) >= VALUE_MIN_PX) {
        // 0.78 clears the cube's corner (0.43 * sqrt 3) along any view direction
        // and stays short of the neighbour in front.
        const cam = glCamera().position;
        const toward = cam.clone().normalize().multiplyScalar(0.78);
        // Nearest the camera first, so if the cap is hit it is the back of the
        // pile that goes unlabelled, as in the flat renderer's paint order.
        const near = voxels.filter((v) => v.alpha >= 1);
        if (near.length > VALUE_MAX_LABELS) {
          const d2 = (v) => (v.x - cam.x) ** 2 + (v.y - cam.y) ** 2 + (v.z - cam.z) ** 2;
          near.sort((a, b) => d2(a) - d2(b));
        }
        for (const v of near) {
          if (n >= VALUE_MAX_LABELS) break;
          let sprite = GL.labels[n];
          if (!sprite) {
            sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false }));
            sprite.scale.set(0.8, 0.8, 1);
            GL.group.add(sprite);
            GL.labels[n] = sprite;
          }
          const text = String(v.value);
          const color = inkOn(v.color);
          const key = `${text}|${color}`;
          if (sprite.userData.key !== key) {
            sprite.material.map = labelTexture(text, color);
            sprite.material.needsUpdate = true;
            sprite.userData.key = key;
          }
          sprite.position.set(v.x + toward.x, v.y + toward.y, v.z + toward.z);
          sprite.visible = true;
          n++;
        }
      }
    }
    for (let i = n; i < GL.labels.length; i++) GL.labels[i].visible = false;
  }

  function setMode(next, why) {
    mode = next;
    $("view").style.display = next === "flat" ? "block" : "none";
    if (GL.renderer) GL.renderer.domElement.style.display = next === "gl" ? "block" : "none";
    $("glnote").hidden = next === "gl";
    if (why) $("glnote").textContent = T[why];
  }

  // Frame the bounding extents against whichever field of view is tighter.
  function glDistance(pitch) {
    const [B, C, H, W] = gdims();
    const spanX = (B - 1) * (W + GAP()) + W;
    const rXZ = 0.5 * Math.hypot(spanX, C * (1 + ZGAP())) + 1.1;
    const rY = 0.5 * H + 1.1;
    const vfov = GL.camera.fov * Math.PI / 180;
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * Math.max(GL.camera.aspect, 0.2));
    const needV = rY * Math.cos(pitch) + rXZ * Math.sin(pitch);
    const fit = Math.max(rXZ / Math.tan(hfov / 2), needV / Math.tan(vfov / 2));
    return fit * 1.12 / view.scale;
  }

  function repaint() {
    if (!SRC) return;
    const draw = drawList();
    // The buffer strip is part of the same animation: a copy slides its bars.
    if (anim && !embed) renderRibbon();
    if (mode === "gl" && GL.ready) {
      const pitch = Math.atan(view.el * 0.6);
      const dist = glDistance(pitch);
      const far = dist * 3;
      if (GL.camera.far !== far) {
        GL.camera.far = far;
        GL.camera.updateProjectionMatrix();
      }
      const at = [
        Math.sin(view.yaw) * dist * Math.cos(pitch),
        Math.sin(pitch) * dist,
        Math.cos(view.yaw) * dist * Math.cos(pitch)
      ];
      // The pan is a translation of the whole group, so `glTo` -- and with it
      // picking, the labels and the overlays -- follows without being told.
      GL.group.position.set(view.panX / 60, -view.panY / 60, 0);
      [GL.camera, GL.ortho].forEach((cam) => { cam.position.set(...at); cam.lookAt(0, 0, 0); });
      const height = 2 * dist * Math.tan(GL.camera.fov * Math.PI / 360);
      const width = height * GL.camera.aspect;
      Object.assign(GL.ortho, { left: -width / 2, right: width / 2, top: height / 2, bottom: -height / 2, far });
      GL.ortho.updateProjectionMatrix();
      syncGL(draw);
      syncLabels(draw);
      GL.renderer.render(GL.scene, glCamera());
      const stage = $("stage");
      placeOverlays(stage.clientWidth, stage.clientHeight, draw);
    } else {
      drawFlat(draw);
    }
  }

  // ─── the pictures under the stage ─────────────────────────────────────────

  const showValues = () => state.values && !embed;

  // Which position carries each of the four photo axes, when all four are
  // still there. A reshape that merges height into width leaves no picture to
  // draw, and this returns null to say so.
  function imageAxes() {
    if (!isPhotos()) return null;
    const b = posOfId(0), c = posOfId(1), h = posOfId(2), w = posOfId(3);
    return (b >= 0 && c >= 0 && h >= 0 && w >= 0 && state.shape[c] === 3) ? { b, c, h, w } : null;
  }
  // x reads through the strides; y reads the buffer straight through and pours
  // it into the same shape, which is what a reshape of a non-contiguous view
  // would give you.
  const readX = (L) => BUF[offsetOf(L)];
  const readY = (L) => BUF[sum(L.map((v, i) => v * cstrides(state.shape)[i]))];

  function stripRow(kind, read) {
    const row = document.createElement("div");
    row.className = "strip-row";
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = kind === "x" ? T.stripX : T.stripY;
    row.appendChild(tag);
    const ax = imageAxes();
    const L = state.idx.slice();
    const paint = (W, H, fill, label) => {
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(W, H);
      for (let h = 0; h < H; h++) {
        for (let w = 0; w < W; w++) fill(img.data, (h * W + w) * 4, h, w);
      }
      ctx.putImageData(img, 0, 0);
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", label);
      row.appendChild(canvas);
    };
    if (ax) {
      const B = state.shape[ax.b], H = state.shape[ax.h], W = state.shape[ax.w];
      for (let b = 0; b < B; b++) {
        L[ax.b] = b;
        paint(W, H, (data, o, h, w) => {
          L[ax.h] = h;
          L[ax.w] = w;
          for (let c = 0; c < 3; c++) { L[ax.c] = c; data[o + c] = read(L); }
          data[o + 3] = 255;
        }, `${kind}[${b}]`);
      }
      return row;
    }
    // No picture: the last two axes of the shape as a heatmap instead.
    const R = rank();
    const wp = R - 1, hp = R >= 2 ? R - 2 : R - 1;
    const W = state.shape[wp], H = R >= 2 ? state.shape[hp] : 1;
    const n = numel();
    paint(W, H, (data, o, h, w) => {
      L[wp] = w;
      if (R >= 2) L[hp] = h;
      // A photo byte is 0-255 whatever the element count; only np.arange runs
      // to n - 1. Normalising both the same way washed the merged photo out.
      const v = read(L);
      const t = isPhotos() ? v / 255 : (n > 1 ? v / (n - 1) : 0.5);
      const rgb = parseRgb(axisFill(fastestPos(), t));
      data[o] = rgb[0]; data[o + 1] = rgb[1]; data[o + 2] = rgb[2];
      data[o + 3] = 255;
    }, kind);
    return row;
  }

  function renderStrip() {
    const host = $("strip-rows");
    host.innerHTML = "";
    host.appendChild(stripRow("x", readX));
    const contiguous = isCContig();
    if (state.compare) {
      const row = stripRow("y", readY);
      if (!contiguous) row.classList.add("wrong");
      row.querySelector(".tag").insertAdjacentHTML("beforeend",
        `<small>${contiguous ? T.stripSame : T.stripWrong}</small>`);
      host.appendChild(row);
    }
    const ax = imageAxes();
    const x0 = shapeText(state.shape.slice(1));
    if (!isPhotos()) {
      $("strip-note").textContent = T.stripNumbers;
    } else if (!ax) {
      $("strip-note").textContent = T.stripNoImage;
    } else if (ax.b !== 0) {
      // x[0] is not a photo at all: the batch axis is not first, so x[0] is
      // one slab of whatever axis is.
      $("strip-note").textContent = T.stripNotBatch(x0, axName(0));
    } else if (ax.h === 1 && ax.w === 2 && ax.c === 3) {
      $("strip-note").textContent = T.stripImshow(x0);
    } else {
      // The transpose that brings x[0] to (H, W, C), whatever order it is in now.
      const t = [ax.h, ax.w, ax.c].map((p) => p - 1).join(", ");
      $("strip-note").textContent = T.stripTranspose(x0, t);
    }
  }

  // The buffer. A reshape and a transpose leave every bar exactly where it is
  // -- that is the point of them -- so the only thing that ever animates here
  // is a copy, and each bar slides from the offset it had to the offset it
  // now has.
  function renderRibbon() {
    const canvas = $("ribbon");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || 800, h = 44;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const n = numel();
    const cw = w / n;
    const t = anim ? easeInOut(Math.min(1, (performance.now() - anim.t0) / anim.dur)) : 1;
    ELS.forEach((el) => {
      const lit = state.slice < 0 || el.L[state.slice] === state.idx[state.slice];
      const was = anim && anim.from.get(el.src);
      const at = (was && was.off !== undefined) ? was.off + (el.off - was.off) * t : el.off;
      ctx.globalAlpha = lit ? 1 : 0.25;
      ctx.fillStyle = colourOf(el, el.raw);
      ctx.fillRect(at * cw, 10, Math.max(cw, 0.5), h - 18);
    });
    ctx.globalAlpha = 1;
    // Ticks at the slowest stride.
    const slow = Math.max(state.stride[memOrder()[0]], 1);
    ctx.strokeStyle = css("--ink-mute");
    ctx.lineWidth = 1;
    for (let k = 0; n / slow <= 96 && k <= n; k += slow) {
      ctx.beginPath();
      ctx.moveTo(Math.min(k * cw, w - 0.5), 2);
      ctx.lineTo(Math.min(k * cw, w - 0.5), 9);
      ctx.stroke();
    }
    // The selected element.
    const off = offsetOf(state.idx);
    ctx.strokeStyle = css("--ink");
    ctx.lineWidth = 2;
    ctx.strokeRect(off * cw - 1, 9, Math.max(cw, 2) + 2, h - 16);
    ctx.fillStyle = css("--ink");
    ctx.beginPath();
    ctx.moveTo(off * cw + cw / 2, h - 1);
    ctx.lineTo(off * cw + cw / 2 - 4, h - 7);
    ctx.lineTo(off * cw + cw / 2 + 4, h - 7);
    ctx.closePath();
    ctx.fill();
    const hues = axisHues();
    const order = memOrder().map((p) => `<span style="color:var(${hues[p]}-ink)">${axTag(p)}</span>`).join(" → ");
    $("ribbon-note").innerHTML = T.ribbonNote(`<span id="ribbon-order">${order}</span>`, n);
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", `${T.ribbon}: ${memOrder().map(axTag).join(" ")}`);
  }

  function renderLegend() {
    const fastest = fastestPos();
    const hues = axisHues();
    $("axis-legend").innerHTML = state.shape.map((_, p) => {
      const mark = p === fastest ? ` <em>${T.fastest}</em>` : "";
      const letter = axLetter(p);
      const name = letter ? `${T.axName[state.axisId[p]]} · ${T.posName(p)}` : "";
      return `<span class="chip"><span class="swatch" style="background:var(${hues[p]})"></span><b style="color:var(${hues[p]}-ink)">${letter || T.posName(p)}</b> ${name}${mark}</span>`;
    }).join("");
  }

  // ─── render ───────────────────────────────────────────────────────────────

  let ELS = [];

  function render() {
    // bindPointer() is installed before photos.json resolves, so a drag, a
    // click or a resize can land in that window. Without an array there is
    // nothing to draw and every geometry helper dereferences SRC.
    if (!SRC) return;
    flushCss();
    ELS = elements();
    VOX = buildVoxels();
    settleTween();
    const off = offsetOf(state.idx);
    const fastest = fastestPos();
    const hues = axisHues();
    syncControls();

    $("stride-body").innerHTML = state.shape.map((_, p) => {
      const fast = p === fastest;
      const pos = axLetter(p) ? `<span class="pos">${T.posName(p)}</span>` : "";
      return `<tr class="${fast ? "fast" : ""}"><td><span class="dot" style="background:var(${hues[p]})"></span>${axSpan(p, axTag(p))}${pos}${fast ? `<span class="mark">${T.fastest}</span>` : ""}</td><td>${state.stride[p] * ITEMSIZE}</td><td>${state.stride[p]}</td></tr>`;
    }).join("");

    const terms = state.shape.map((_, p) =>
      `<span class="term">(${axSpan(p, state.idx[p])} · ${axSpan(p, state.stride[p])})</span>`
    ).join(" + ");
    $("formula").innerHTML =
      `${T.offset} = ` + state.shape.map((_, p) => `${axSpan(p, `i_${axTag(p)}`)}·${axSpan(p, `S_${axTag(p)}`)}`).join(" + ") +
      `<span class="eq"> = ${terms} = <b>${off}</b></span>`;

    renderCode(off);
    renderLegend();
    renderStrip();
    renderRibbon();

    // What a checker can read without a screenshot: the shape, the strides,
    // whether the view is snapped flat, whether the channel planes composite
    // into a photograph, and a signature of the buffer that a view must never
    // change.
    const stage = $("stage");
    stage.dataset.shape = state.shape.join(",");
    stage.dataset.strides = state.stride.join(",");
    stage.dataset.bufsig = bufferSignature();
    stage.dataset.arrange = byPos() ? "position" : "meaning";
    stage.dataset.reveal = canReveal() ? "1" : "0";

    // Not while the size count runs: a polite region would read out every rung.
    if (!loop.on) {
      $("status").textContent = T.status(off, state.idx,
        state.slice >= 0 ? T.sliceOf(axName(state.slice)) : "");
    }
    const base = isPhotos() ? T.stagePhotos : T.stageNumbers(axTag(fastest));
    const parts = [state.compare ? T.stageReshape : base];
    if (snap.on) parts.push(canReveal() ? T.revealNote : (isPhotos() ? T.revealNo : T.snapNote));
    if (state.slice >= 0) parts.push(T.lit(axTag(state.slice)));
    if (byPos()) {
      const labels = [3, 2, 1, 0].map((r) => { const role = roleAxis(r); return role ? role.label : "—"; });
      parts.push(T.stageArranged(...labels));
    }
    parts.push(T.drag);
    $("stagenote").textContent = embed ? "" :
      (loop.on ? T.loopStage(state.res, shapeText(state.shape)) : parts.join(" "));

    if (mode === "gl" && GL.ready) {
      const box = $("stage");
      GL.renderer.setSize(box.clientWidth, box.clientHeight, false);
      GL.camera.aspect = box.clientWidth / Math.max(box.clientHeight, 1);
      GL.camera.updateProjectionMatrix();
    }
    repaint();
  }

  // Cheap and order-sensitive: two buffers agree only if every byte is in the
  // same place. A reshape or a transpose must leave this alone.
  function bufferSignature() {
    let a = 2166136261;
    for (let k = 0; k < BUFSRC.length; k++) {
      a ^= BUFSRC[k] + 1;
      a = Math.imul(a, 16777619);
    }
    return (a >>> 0).toString(36);
  }

  // ─── pointer, wheel, keyboard ─────────────────────────────────────────────

  function pick(clientX, clientY) {
    const canvas = mode === "gl" && GL.ready ? GL.renderer.domElement : $("view");
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const draw = drawList();
    const to = projector(rect.width, rect.height);
    let best = null, bestD = 28;
    draw.forEach((v) => {
      const [x, y] = to(v.x, v.y, v.z);
      const d = Math.hypot(x - px, y - py);
      if (d < bestD) { bestD = d; best = v; }
    });
    if (best) {
      state.idx = best.L.slice();
      peeking = true;
      render();
    }
  }
  function zoomBy(factor) {
    dropDrift();
    view.scale = Math.min(2.4, Math.max(0.5, view.scale * factor));
    repaint();
  }
  function panBy(dx, dy) {
    dropDrift();
    peeking = false;
    view.panX += dx;
    view.panY += dy;
    repaint();
  }
  // Rotating away from face on lets the cubes go back to being cubes.
  function orbitBy(dx, dy) {
    dropDrift();
    const left = (dx || dy) && snap.on;
    if (left) {
      snap.on = false;
      glide.active = false;
      $("snap").setAttribute("aria-pressed", "false");
      $("snap").textContent = T.snapIn;
      $("stage").dataset.snapped = "0";
    }
    if (dx || dy) peeking = false;
    view.yaw += dx;
    view.el = Math.min(1.2, Math.max(0, view.el + dy));
    if (!snap.on) setSnapT(0);
    // Leaving face on changes the stage note and the arrows as well as the
    // cubes, so the one frame that leaves it is a full render, not a repaint.
    if (left) render(); else repaint();
  }
  // The magnet: let go near enough to face on and the view closes the rest of
  // the way itself. Tested on release, never mid-drag, so a drag past the
  // angle is not caught by it.
  function maybeSnap() {
    if (!snap.on && !embed && isFaceOn()) setSnap(true);
  }

  // ─── the idle drift ───────────────────────────────────────────────────────

  // A still isometric pile does not say "this turns", so the stage sways and
  // breathes until a reader arrives, and then it is theirs. The drift yields
  // to everything: a pointer over the stage, the keyboard on it, the snap and
  // its glide, a hidden tab, and a reader who asked not to be moved.
  function driftWanted() {
    return !reduceMotion && !embed && !document.hidden &&
           !drift.hover && !drift.focus && !snap.on && !glide.active && !!SRC;
  }
  function setDrift(on) {
    clearTimeout(drift.timer);
    if (on === drift.on) return;
    const now = performance.now();
    Object.assign(drift, on ? driftStart(drift, view.yaw, view.scale, now)
                            : driftPause(drift, now));
    if (on) { drift.last = now; tick(); }
  }
  const refreshDrift = () => setDrift(driftWanted());
  // Taking hold of the view stops the drift on the same frame, rather than
  // waiting for the pointer to cross into the stage: a wheel, a key or a
  // gizmo click is a reader taking over just as much as a drag is. It is a
  // release rather than a pause, so the next stretch is seeded from the pose
  // they leave behind.
  const dropDrift = () => {
    clearTimeout(drift.timer);
    clearTimeout(originalTimer);
    stopLoop({rebuild: true});
    Object.assign(drift, driftRelease(drift, performance.now()));
  };

  // ─── the original ─────────────────────────────────────────────────────────

  // Every operation undone, and the photos shown the way the camera left
  // them: arranged by meaning, so C is in depth, and snapped flat on the front
  // face, so the three channel planes composite back into photographs. After
  // a beat the view lifts back into 3-D from there, and once that glide is
  // over the drift takes the pose it left. A reader who takes hold of the view
  // during the beat keeps it: every way of doing that goes through dropDrift(),
  // which disarms the lift. Counting numbers have no photo, so for them this
  // is the same start over, at the view the page opens on.
  let originalTimer = 0;
  const loopRes = () => PHOTOS ? PHOTOS.res.filter((r) => r <= MAX_RES) : [];
  const loopShapeAt = (r) => shapeText([photosOn().length, r, r, 3]);

  // What a checker can read while the count runs: whether it is running, which
  // rung, and the shape on it. Written from `loop` and `state`, never from a
  // frame, so a poll sees the truth while the cubes are still arriving.
  function publishLoop() {
    const d = $("stage").dataset;
    d.looping = loop.on ? "1" : "0";
    d.loopSize = loop.on ? String(state.res) : "";
    d.loopShape = loop.on ? loopShapeAt(state.res) : "";
    d.loopStep = loop.on ? `${loop.i + 1}/${loop.ladder.length}` : "";
  }
  function clearLoopNote() {
    loopTrail = [];
    $("loop-note").hidden = true;
    $("loop-note").textContent = "";
    $("stage").dataset.loopSkipped = "0";
  }
  function showLoopNote(done) {
    $("loop-note").textContent = T.loopNote(loopTrail.join(" → "), done);
    $("loop-note").hidden = false;
  }

  // The reader took hold of something while the grid was being counted up.
  // The count ends where it is and their size comes back; `rebuild: false` is
  // for a caller that is about to build the array itself.
  function stopLoop(opts) {
    clearTimeout(loopTimer);
    if (!loop.on) return;
    const r = loopInterrupt(loop);
    loop = r.state;
    state.res = r.size;
    publishLoop();
    clearLoopNote();
    if (opts && opts.rebuild) {
      anim = null;
      if (r.restore) rebuildSource();
      render();
    }
  }

  function loopTick() {
    if (!loop.on) return;
    const r = loopAt(loop, performance.now());
    loop = r.state;
    if (r.changed) {
      state.res = r.size;
      rebuildSource();
      loopTrail.push(loopShapeAt(r.size));
    }
    publishLoop();
    if (r.done) {
      // The last rung is the reader's own size, so the array on screen is
      // already the one they chose; what is left is the beat, and the lift.
      showLoopNote(true);
      render();
      $("status").textContent = T.saidLoopEnd(shapeText(state.shape));
      scheduleLift();
      return;
    }
    if (r.changed) { showLoopNote(false); render(); }
    loopTimer = setTimeout(loopTick, loopDelay(loop, performance.now()));
  }

  // After its beat the view lifts back into 3-D, and once that glide is over
  // the drift takes the pose it left.
  function scheduleLift() {
    if (reduceMotion) return;
    originalTimer = setTimeout(() => {
      setSnap(false);
      originalTimer = setTimeout(refreshDrift, SNAP_MS + 40);
    }, ORIGINAL_HOLD_MS);
  }

  function showOriginal() {
    stopLoop({rebuild: false});
    dropDrift();
    // The same source array as before, so every cube can be followed from
    // wherever the operations left it back to where it was built.
    anim = null;
    peeking = false;
    beginTween();
    // The photos are counted up through their sizes to the reader's own; the
    // numbers have no size, and a reader who asked not to be moved is told the
    // count was skipped rather than shown a jump with no explanation.
    const plan = isPhotos()
      ? loopBegin(loopRes(), state.res, reduceMotion, performance.now()) : loopIdle();
    if (plan.on) {
      loop = plan;
      state.res = plan.ladder[0];
    }
    rebuildSource();
    view.scale = HOME.scale;
    view.panX = HOME.panX;
    view.panY = HOME.panY;
    $("status").textContent = T.saidOriginal;
    if (!isPhotos()) {
      state.arrange = "position";
      Object.assign(view, HOME);
      snap.on = false;
      glide.active = false;
      setSnapT(0);
      $("stage").dataset.snapped = "0";
      $("snap").setAttribute("aria-pressed", "false");
      $("snap").textContent = T.snapIn;
      render();
      refreshDrift();
      return;
    }
    state.arrange = "meaning";
    // The front face, not whichever face is nearest: only the front one
    // composites (canReveal), and it is reached by the shorter way round.
    const front = Math.round(view.yaw / (2 * Math.PI)) * 2 * Math.PI;
    snap.on = true;
    $("snap").setAttribute("aria-pressed", "true");
    $("snap").textContent = T.snapOut;
    $("stage").dataset.snapped = "1";
    render();
    glideTo(front, 0);
    tick();
    if (plan.on) {
      loopTrail = [loopShapeAt(state.res)];
      publishLoop();
      showLoopNote(false);
      $("status").textContent = T.saidLoop(plan.ladder);
      loopTimer = setTimeout(loopTick, loopDelay(loop, performance.now()));
      return;
    }
    if (plan.skipped) {
      const note = T.saidReduced(state.res, shapeText(state.shape));
      $("loop-note").textContent = note;
      $("loop-note").hidden = false;
      $("stage").dataset.loopSkipped = "1";
      $("status").textContent = note;
    }
    scheduleLift();
  }

  function bindPointer() {
    const el = $("stage");
    const live = new Map();
    let pinch = 0;
    const points = () => [...live.values()];
    const spread = () => {
      const [a, b] = points();
      return Math.hypot(a.x - b.x, a.y - b.y);
    };
    // Hover is tracked on the wrapper, not on #stage. The legend, the snap
    // button, the arrange pair and the gizmo are siblings of #stage that sit
    // absolutely over it, so on #stage the pointer crossing onto one of them
    // is a pointerleave -- which armed the resume timer that the control's own
    // dropDrift() then cleared, and the sway never came back. The wrapper is
    // the same box as the stage (its only in-flow child), so this is the
    // reader's idea of "on the widget" and nothing else changes.
    const wrap = el.closest(".stagewrap") || el;
    // A move is what counts as arriving, not pointerenter: Chromium fires
    // enter with no movement when the element under a still cursor changes,
    // and a pointer resting here when the page loaded entered before this
    // listener existed. Neither is a reader, and the stage sways from the
    // moment the page opens; a real reader moves on the way in.
    const arrive = () => {
      if (drift.hover) return;
      drift.hover = true;
      setDrift(false);
    };
    wrap.addEventListener("pointermove", arrive);
    wrap.addEventListener("pointerleave", () => {
      drift.hover = false;
      clearTimeout(drift.timer);
      drift.timer = setTimeout(refreshDrift, DRIFT_RESUME_MS);
    });
    // The stage is tabindex="0" and takes the arrow keys, so a keyboard reader
    // must not have the view moving under them either. :focus-visible is the
    // browser's own answer to "did they arrive here by keyboard": a click
    // focuses the stage too, and that must not hold the drift off for the rest
    // of the visit once the pointer has moved away again.
    el.addEventListener("focusin", () => {
      drift.focus = el.matches(":focus-visible");
      setDrift(false);
    });
    el.addEventListener("focusout", () => {
      drift.focus = false;
      clearTimeout(drift.timer);
      drift.timer = setTimeout(refreshDrift, DRIFT_RESUME_MS);
    });
    document.addEventListener("visibilitychange", refreshDrift);
    el.addEventListener("contextmenu", (e) => { if (!embed) e.preventDefault(); });
    el.addEventListener("pointerdown", (e) => {
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      live.set(e.pointerId, {
        x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false,
        pan: e.shiftKey || e.button === 2
      });
      if (live.size === 2) pinch = spread();
    });
    el.addEventListener("pointermove", (e) => {
      const me = live.get(e.pointerId);
      if (!me) return;
      const dx = e.clientX - me.x, dy = e.clientY - me.y;
      if (Math.hypot(e.clientX - me.x0, e.clientY - me.y0) > 3) me.moved = true;
      me.x = e.clientX;
      me.y = e.clientY;
      if (live.size >= 2) {
        const now = spread();
        if (pinch > 0 && now > 0) zoomBy(now / pinch);
        pinch = now;
        orbitBy(0, -dy * 0.004);
        return;
      }
      if (me.pan) panBy(dx, dy);
      else orbitBy(dx * 0.01, dy * 0.006);
    });
    const release = (e, tap) => {
      const me = live.get(e.pointerId);
      if (!me) return;
      live.delete(e.pointerId);
      if (live.size < 2) pinch = 0;
      if (tap && !me.moved && !embed) pick(e.clientX, e.clientY);
      else if (!me.pan) maybeSnap();
    };
    el.addEventListener("pointerup", (e) => release(e, true));
    el.addEventListener("pointercancel", (e) => release(e, false));
    el.addEventListener("wheel", (e) => {
      // Ctrl or Command only: this box owns most of a phone screen and the
      // page has to stay scrollable through it.
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? 0.92 : 1.08);
    }, { passive: false });
    el.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.25 : 0.08;
      const moves = {
        ArrowLeft:  () => e.shiftKey ? panBy(-16, 0) : orbitBy(-step, 0),
        ArrowRight: () => e.shiftKey ? panBy(16, 0) : orbitBy(step, 0),
        ArrowUp:    () => e.shiftKey ? panBy(0, -16) : orbitBy(0, -step),
        ArrowDown:  () => e.shiftKey ? panBy(0, 16) : orbitBy(0, step),
        "+":        () => zoomBy(1.12),
        "=":        () => zoomBy(1.12),
        "-":        () => zoomBy(0.89),
        f:          () => setSnap(!snap.on),
        F:          () => setSnap(!snap.on),
        Escape:     () => { if (snap.on) setSnap(false); },
        Home:       () => {
          Object.assign(view, HOME);
          snap.on = false;
          glide.active = false;
          setSnapT(0);
          $("stage").dataset.snapped = "0";
          $("snap").setAttribute("aria-pressed", "false");
          $("snap").textContent = T.snapIn;
          render();
        }
      };
      const move = moves[e.key];
      if (!move) return;
      e.preventDefault();
      // Driving the view from the keyboard is the same claim on it as a drag,
      // however the focus arrived: hold the drift until the stage is left.
      drift.focus = true;
      clearTimeout(originalTimer);
      stopLoop({rebuild: true});
      move();
    });
    $("snap").addEventListener("click", () => { dropDrift(); setSnap(!snap.on); });
    const gizmoGo = (arm) => {
      const spec = GIZMO_ARMS.find((a) => a.r === Number(arm.dataset.arm));
      if (!spec) return;
      dropDrift();
      if (spec.el === 0) {
        view.yaw = spec.yaw;
        setSnap(true);
      } else {
        snap.on = false;
        $("stage").dataset.snapped = "0";
        $("snap").setAttribute("aria-pressed", "false");
        $("snap").textContent = T.snapIn;
        glideTo(spec.yaw, spec.el);
        tick();
      }
    };
    $("gizmo").addEventListener("click", (e) => {
      const arm = e.target.closest("[data-arm]");
      if (arm) gizmoGo(arm);
    });
    $("gizmo").addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const arm = e.target.closest("[data-arm]");
      if (!arm) return;
      e.preventDefault();
      gizmoGo(arm);
    });
  }

  // ─── the tabs ─────────────────────────────────────────────────────────────

  // One tab per operation, the homepage hero's pattern: arrow keys move between
  // them, and the panel ids are plain words so that `#transpose` in the URL
  // opens the page on that tab and a link to it resolves.
  function bindTabs() {
    const tabs = [...document.querySelectorAll("#tabs [role=tab]")];
    const panels = tabs.map((tab) => $(tab.getAttribute("aria-controls")));
    const show = (i, push) => {
      tabs.forEach((tab, j) => {
        const on = i === j;
        tab.setAttribute("aria-selected", String(on));
        tab.tabIndex = on ? 0 : -1;
        panels[j].hidden = !on;
      });
      // `window.`: the code log above is a `const history`, and shadows it.
      if (push) window.history.replaceState(null, "", `#${panels[i].id}`);
    };
    const fromHash = () => {
      const i = panels.findIndex((p) => p.id === location.hash.slice(1));
      if (i >= 0) show(i, false);
    };
    tabs.forEach((tab, i) => {
      tab.addEventListener("click", () => show(i, true));
      tab.addEventListener("keydown", (e) => {
        const k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!k) return;
        e.preventDefault();
        const n = (i + k + tabs.length) % tabs.length;
        show(n, true);
        tabs[n].focus();
      });
    });
    window.addEventListener("hashchange", fromHash);
    fromHash();
  }

  // ─── embed mode ───────────────────────────────────────────────────────────

  function startEmbed() {
    const text = document.createElement("span");
    $("embedcap").append(text);
    // Fill the frame: there is no panel beside the stage to leave room for.
    view.scale = 1.3;
    let step = 0;
    const apply = () => {
      rebuildSource();
      // Without the photos there is no NHWC to permute: the fallback array is
      // a rank-3 np.arange, so `posOfId(3)` is -1 and a permutation built from
      // it would hand the shape an undefined axis and a NaN element count.
      // Both later steps are about the photos anyway, so the fallback holds.
      const at = hasAllIds() ? step : 0;
      if (at >= 1) applyTranspose(ORDER_PRESETS.NCHW.map(posOfId));
      state.compare = at === 2;
      text.innerHTML = `<b>${T.embedSteps[at]}</b>`;
      render();
    };
    apply();
    if (reduceMotion) return;
    setInterval(() => { step = (step + 1) % 3; apply(); }, 6000);
    // A slow sway rather than a full spin: a full turn passes through the
    // angles where the three photos stack up behind one another.
    let last = 0, held = false, swayYaw = 0;
    const swayAt = (now) => HOME.yaw + 0.35 * Math.sin(now / 2600);
    const sway = (now) => {
      // Held still while a pointer is over it: the hero is draggable, and the
      // sway used to fight the drag. drift.hover is maintained in embed mode
      // too, by the listeners bindPointer() installs.
      if (drift.hover) held = true;
      else {
        // The sway is a function of the clock, so picking it straight back up
        // would throw the drag away in one jump the frame the pointer leaves.
        // The offset carries the reader's angle forward instead.
        if (held) { held = false; swayYaw = view.yaw - swayAt(now); }
        if (now - last > 40) {
          last = now;
          view.yaw = swayYaw + swayAt(now);
          repaint();
        }
      }
      requestAnimationFrame(sway);
    };
    requestAnimationFrame(sway);
  }

  // ─── boot ─────────────────────────────────────────────────────────────────

  // Loads the vendored three.js through its module bridge and waits for the
  // `three-ready` event it fires. If the import never resolves -- a file://
  // open, a blocked request -- nothing fires and the timeout settles it.
  function whenThree(ms) {
    return new Promise((resolve, reject) => {
      if (window.THREE) return resolve();
      const timer = setTimeout(() => reject(new Error("timeout")), ms);
      window.addEventListener("three-ready", () => {
        clearTimeout(timer);
        resolve();
      }, { once: true });
      const script = document.createElement("script");
      script.type = "module";
      script.src = "vendor/three-boot.js";
      script.addEventListener("error", () => { clearTimeout(timer); reject(new Error("load")); });
      document.head.appendChild(script);
    });
  }
  function bootGL() {
    let settled = false;
    const flat = (why) => {
      if (settled) return;
      settled = true;
      setMode("flat", why);
      render();
    };
    whenThree(6000).then(() => {
      if (settled) return;
      settled = true;
      if (initGL()) setMode("gl");
      else setMode("flat", "glNoWebgl");
      render();
    }).catch(() => flat("glNoScript"));
  }

  async function loadPhotos() {
    try {
      const res = await fetch("data/photos.json");
      if (!res.ok) throw new Error(String(res.status));
      const json = await res.json();
      if (!json.photos || json.photos.length !== 3) throw new Error("shape");
      // The meshes grow to fit, but past MAX_RES a full batch is more cubes
      // than the page can rebuild at a usable rate; a larger side added to
      // WIDGET_RES in gen_figures.py is left out until this is raised too.
      json.res = json.res.filter((r) => r <= MAX_RES);
      if (!json.res.length) throw new Error("res");
      if (!json.res.includes(state.res)) state.res = Math.max(...json.res);
      PHOTOS = json;
      // How many photos *photos.json* carried, which is what a checker asks
      // when it wants to know the fetch landed. A photo the reader adds is
      // `data-uploaded`, not a fourth here: it would make this attribute
      // answer two questions and neither of them cleanly.
      $("stage").dataset.photos = String(json.photos.length);
    } catch (_) {
      PHOTOS = null;
      state.data = "numbers";
      $("stage").dataset.photos = "0";
    }
  }

  applyCopy();
  bindTabs();
  $("snap").textContent = T.snapIn;
  loadPhotos().then(() => {
    rebuildSource();
    // Only now: a drag, a click or a snap before there is an array reaches
    // the geometry helpers, and every one of them dereferences SRC.
    bindPointer();
    buildControls();
    if (embed) {
      // The front door: the isometric canvas only, no three.js to fetch.
      setMode("flat");
      startEmbed();
    } else {
      render();
      bootGL();
      refreshDrift();
    }
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });
})();
</script>
</body>
</html>
