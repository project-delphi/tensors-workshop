<title>The audio tensor</title>

<!-- The vendored addons say `import ... from 'three'`, which only an import
     map can resolve without a bundler. It must be static and in <head>, and
     it fetches nothing until a module import resolves -- so the lazy boot
     below holds, and a page opened on a canvas scene or as the hero embed
     never pulls three.js at all. See vendor/README.md. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three-0.169.0.module.min.js",
    "three/addons/": "./vendor/three-0.169.0/examples/jsm/"
  }
}
</script>

<link rel="stylesheet" href="widget-chrome.css">
<style>
  /* The surfaces, type and frame are widget-chrome.css; this page owns its
     accent and everything on the stage. */
  :root {
    /* Sections 04 and 09 share this widget, and Appendix E is where they
       meet. The accent is 09's (gen_notebooks.ACCENTS[9] = #c2410c), because
       the factorisation scenes are its centre of gravity -- but that hex is
       4.2:1 on --sunk, under AA, which is the same trap the projection stage
       hit with #0f766e. Each theme takes the nearest shade that clears 4.5:1
       against --sunk, the darkest of the three surfaces and the one the
       readout sits on: 4.8 there and 5.5 on the page. */
    --accent: #b23a0a;
    --on-accent: #ffffff;

    /* The stage is black in every theme, for the reason the projection
       stage's is: it is a picture rather than page furniture. A spectrogram
       also wants a dark ground -- the colour ramp below starts at the stage's
       own black, so silence is the background rather than a shade near it. */
    --stage: #000000;
    --stage-chip: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="navy"]) { --accent: #fb923c; --on-accent: #1c1917; }
  }
  /* On the homepage hero's navy band. */
  :root[data-theme="navy"] { --accent: #fb923c; --on-accent: #06202f; }

  /* Ink on the stage. One set for all three themes, because the stage is
     black in all three, and measured against that black: --stage-mute is the
     weakest at 6.0:1. The roles follow the projection stage's, so a reader
     who has met one widget has met both: yellow is what the reader holds,
     purple is what comes back out, pink is where it has gone wrong. */
  :root {
    --stage-ink: #e8e8e8;
    --stage-mute: #8a8a8a;
    --v-sig: #ffd84d;    /* the waveform, the window the reader moves, the samples */
    --v-out: #c39bd3;    /* what the transform produced; what the play button plays */
    --v-res: #fc6c85;    /* anything scrambled, lossy or wrong; the rounding error */
    --v-axis: #58c4dd;   /* the axis being named; the ruler the samples snap to */
    --v-comp: #7ee787;   /* one more of something the reader is counting, where the
                            three roles above have run out; it carries no role of
                            its own, and the factorisation's fourth component is
                            the only thing using it (13.7:1 on the stage's black) */
  }

  /* Which recording is on the stage: one of the three built in, or a file the
     reader brought. The file is decoded in the page and goes nowhere. It sits
     in the transport, on the line under the buttons: `flex-basis: 100%` puts
     it there deliberately, because the select and the drop zone together are
     wider than whatever is left of the row after a play label that is a whole
     sentence on some scenes -- and a cluster that shares the line at one
     window width and wraps at the next moves under the reader's pointer. */
  .source {
    display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center;
    flex-basis: 100%; margin: 0; font-size: 0.86rem;
  }
  .source label { font-weight: 600; }
  .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .drop {
    display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer;
    padding: 0.3rem 0.7rem; border: 1px dashed var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); font-weight: 600;
  }
  .drop:hover, .drop[data-over="1"] { border-color: var(--accent); }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .source .sig { color: var(--ink-mute); font-family: var(--mono); font-size: 0.82rem; overflow-wrap: anywhere; }

  /* The scroller, the shape the projection stage keeps. align-items:start is
     load-bearing: the grid default stretches the item to full height, and
     position:sticky then has nothing left to stick to. */
  .two-pane {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    gap: 1.75rem;
    align-items: start;
    margin-top: 1.25rem;
  }
  .steps { min-width: 0; }
  .stagewrap { position: sticky; top: 1.5rem; min-width: 0; }

  /* Stacked, the stage goes *first*. The grid would put it after all nine
     sections, where a sticky picture is a picture nobody reading the first
     eight can see. */
  @media (max-width: 62rem) {
    .two-pane { display: flex; flex-direction: column; gap: 1rem; }
    /* Capped at the viewport, with the stage taking whatever the rest of the
       column leaves. Stuck to the top, anything past the fold cannot be
       scrolled to -- and the bottom of this column is the stagebar, the only
       way to the next picture. A fixed stage height was fine until the
       transport grew a second line; making the stage the flexible one means
       the bar stays reachable whatever the row above it costs, in either
       language. */
    .stagewrap {
      order: -1; top: 0; z-index: 2; padding-bottom: 0.5rem; background: var(--bg);
      display: flex; flex-direction: column;
      max-height: 100vh; max-height: 100svh;
    }
    #stage { flex: 1 1 auto; height: auto; min-height: 11rem; }
    #timeline { height: 2.6rem; flex: 0 0 auto; }
    .step { min-height: 0; padding: 1.4rem 0; }
  }

  #stage {
    position: relative; height: min(56vh, 30rem);
    background: var(--stage); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  #stage[data-gl="composer"] { cursor: grab; touch-action: pan-y; }
  #stage[data-grab] { cursor: grabbing; }
  #stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #draw, #gl { display: block; width: 100%; height: 100%; }
  #gl { position: absolute; inset: 0; }
  #gl[hidden] { display: none; }
  /* A label over the three.js stage: the same opaque chip the canvas labels
     sit on, for the same reason -- axe cannot measure contrast over a canvas. */
  .lab {
    font: 600 12px/1 var(--mono); color: var(--stage-ink); background: var(--stage-chip);
    padding: 2px 5px; border-radius: 3px; white-space: nowrap; letter-spacing: 0.01em;
  }
  .lab.mute { color: var(--stage-mute); font-weight: 500; }
  .lab.axis { color: var(--v-axis); }
  .lab.sig { color: var(--v-sig); }
  .lab.res { color: var(--v-res); }
  .lab.out { color: var(--v-out); }
  .lab.big { font-size: 14px; }
  #claim {
    position: absolute; left: 0.75rem; top: 0.6rem; margin: 0;
    font-size: 0.82rem; color: var(--stage-ink); background: var(--stage-chip);
    padding: 0.15rem 0.4rem; border-radius: 4px; font-family: var(--mono);
  }
  #glnote { position: absolute; right: 0.75rem; top: 0.6rem; margin: 0; font-size: 0.78rem; max-width: 46%;
            color: var(--stage-mute); background: var(--stage-chip); padding: 0.15rem 0.4rem; border-radius: 4px; }

  /* The whole recording, under the stage: where the scene is looking, and
     where the sound has got to. It is the frame's, not a scene's -- every
     scene is a window onto this one array, and this is the array. */
  #timeline {
    display: block; width: 100%; height: 3.5rem; margin-top: 0.5rem;
    background: var(--stage); border: 1px solid var(--line); border-radius: 8px;
    cursor: ew-resize; touch-action: pan-y;
  }
  #timeline:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #timecap { margin: 0.3rem 0 0; font-size: 0.76rem; color: var(--ink-mute); }

  .transport { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; margin-top: 0.6rem; }
  .tbuttons { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
  .transport button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 650; }
  .transport .state { font-size: 0.82rem; color: var(--ink-mute); }

  /* Eight marks in the bar, one per picture: the structure of the page at a
     glance, and a way to jump. */
  #dots { display: inline-flex; gap: 0.35rem; align-items: center; }
  .stagebar .dot {
    width: 0.8rem; height: 0.8rem; padding: 0; border-radius: 50%;
    border: 2px solid var(--ink-mute); background: transparent; cursor: pointer;
  }
  .stagebar .dot:hover { border-color: var(--accent); }
  .stagebar .dot[aria-current="step"] { background: var(--accent); border-color: var(--accent); }
  #stepnum { font: 600 0.85rem/1 var(--sans); color: var(--ink-mute); }

  .step {
    min-height: 74vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 1rem 0;
  }
  .step .anchor { display: block; height: 0; }
  .step h2 { font-size: 1.2rem; font-weight: 650; margin: 0 0 0.2rem; }
  /* The heading of the group a scene opens. The page's structure is four
     ideas in order -- the input, the transform, the effect, what factoring it
     costs -- not nine numbered steps. */
  .step .part {
    font: 600 0.8rem/1.3 var(--sans); color: var(--ink-mute);
    border-top: 1px solid var(--line); padding-top: 0.6rem; margin: 0 0 0.9rem; max-width: 36rem;
  }
  .step .kicker { margin-bottom: 0.5rem; }
  .step p, .step .body { max-width: 36rem; overflow-wrap: break-word; }
  .step.is-active h2 { color: var(--accent); }

  .controls { display: grid; gap: 0.7rem; margin: 0.9rem 0 0; max-width: 34rem; }
  .controls label { display: block; font-size: 0.85rem; font-weight: 600; }
  .controls .val { float: right; font-family: var(--mono); font-weight: 500; color: var(--ink-mute); }
  .controls input[type="range"] { width: 100%; accent-color: var(--accent); }
  .controls select { width: 100%; max-width: 22rem; }

  .readout {
    margin: 0.7rem 0 0; padding: 0.65rem 0.8rem; background: var(--sunk);
    border: 1px solid var(--line); border-radius: 8px; font-size: 0.92rem;
    min-height: 3.2rem; max-width: 36rem;
  }
  .readout b { color: var(--accent); }
  .readout .fault { color: var(--fault); font-weight: 650; }
  .shape { font-family: var(--mono); font-size: 0.86rem; }

  /* Embed mode: the homepage hero. No chrome, no sound, no fetch. The chrome
     that goes is in widget-chrome.css. */
  html.embed .steps, html.embed .stagebar, html.embed .transport,
  html.embed #timeline, html.embed #timecap,
  html.embed .readout, html.embed .source, html.embed .hint { display: none; }
  html.embed .two-pane { display: block; margin: 0; }
  html.embed .stagewrap { position: static; height: 100vh; display: flex; flex-direction: column; }
  html.embed #stage { flex: 1 1 auto; border: 0; border-radius: 0; height: auto; min-height: 0; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>

<div class="wrap">

<!-- The arithmetic, the projection stage's camera and tween machines (plain
     scripts, pinned under `npm test`), the drawing kit, then one file per
     scene in reading order. All plain scripts, so the page works from
     file://. The three opening scenes draw in three.js, which
     vendor/linalg-boot.js hands over through bootGL() below -- injected on
     the first three.js scene, so a page opened on a spectrogram scene, or as
     the hero embed, never fetches it. The transform scenes draw into the 2-D
     canvas: a spectrum and a spectrogram are pictures. -->

<script src="voice-scenes/scramble.js"></script>

<script src="voice-scenes/nmf.js"></script>

<script>
(function () {
  "use strict";
  const AC = window.AudioCore, K = window.VoiceKit, LC = window.LinalgCore;
  const $ = (id) => document.getElementById(id);

  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "es" ? "es" : "en";
  const embed = params.get("embed") === "1";
  const theme = params.get("theme");
  document.documentElement.lang = lang;
  if (embed) document.documentElement.classList.add("embed");
  if (theme === "navy") document.documentElement.dataset.theme = "navy";

  // The two recordings that ship, the tone synthesised beside them, and what
  // the embed stands in for. All are mono 48 kHz and exactly this long, so
  // every shape on every scene is the same for any of them
  // (vendor/README.md). A file the reader brings is decoded at this rate too,
  // and capped at CAP seconds.
  const RATE = 48000, SAMPLES = 237568, CAP = 8, TONE_HZ = 440;

  const T = {
    en: {
      eyebrow: "Sections 00, 04 and 09 · Appendix E",
      title: "The audio tensor",
      navHome: "← Workshop home", navNotebooks: "Notebooks",
      intro: "A sound is a list of numbers. A microphone measures the air pressure tens of thousands " +
             "of times a second, each measurement is rounded to one of a fixed set of values, and " +
             "those numbers in order are the tensor — a one-dimensional array you can listen to. " +
             "This page is nine pictures of that array, in four groups. First how air becomes " +
             "numbers: the sampling, the rounding, and the shape and dtype they are stored in. Then " +
             "how those numbers become a matrix: one window cut out of the array, the transform that " +
             "asks which frequencies are in it, and the window sliding along to make a column each " +
             "time. Then what a layout does to it, which is the one you can hear go wrong. Last, " +
             "what factoring that matrix costs: a truncated SVD that denoises best in the middle and " +
             "fails at both ends, and an NMF that gives up the best error on purpose to get parts you " +
             "can name. Each picture says what is on the stage, then asks you to predict before you " +
             "touch a control; the box under the controls is the answer, with this recording's own " +
             "numbers in it.",
      builtin: "Recording", builtinVoice: "a voice (4.9 s)", builtinBeat: "a reggaeton beat (4.9 s)",
      builtinTone: "a 440 Hz tone (4.9 s)", builtinFile: "your own file",
      drop: "Drop an audio file here, or choose one",
      sigVoice: "voice.wav · 48 kHz · 4.949 s", sigBeat: "beat.wav · 48 kHz · 4.949 s",
      sigTone: "a 440 Hz sine · synthesised here · 48 kHz · 4.949 s",
      sigFile: (name, secs, capped) => name + " · decoded at 48 kHz · " + secs.toFixed(2) + " s" +
               (capped ? " (the first " + CAP + " s)" : "") + " · stays in this tab",
      sigStandIn: "a synthesised stand-in",
      decodeFailed: "That file could not be decoded as audio, so the recording stayed as it was.",
      beatFailed: "The clip could not be loaded, so the recording stayed as it was.",
      reset: "Reset this picture", home: "Home view", glow: "Glow",
      motion: "Pause motion", motionOn: "Resume motion",
      prev: "◀ Back", next: "Next ▶",
      stepOf: (i, n) => i + " of " + n,
      stepName: (i, n, h) => i + " of " + n + ": " + h,

    },

      stepOf: (i, n) => i + " de " + n,
      stepName: (i, n, h) => i + " de " + n + ": " + h,
      hint: "Arrastra para girar · rueda para acercar · teclas + / − · el cursor pausa el movimiento.",

      about1: "Cada número de esta página se calcula en el navegador a partir de la grabación que hay " +

      about2: "Acompaña a la sección 00 (qué es un tensor), a la 04 (disposición y cambio de forma) y a " +
              "la 09 (factorizaciones), con el trabajo para casa del Apéndice E. Cada imagen tiene su " +
              "propia dirección (#sample, #quantize, #array, #frame, #spectrum, #window, #scramble, " +
              "#lowrank, #nmf) y los cuadernos enlazan a la que están enseñando. La voz es la muestra CC0 de Bart Massey; " +
              "el ritmo es el <a href='https://freesound.org/people/c0mp0s3r/sounds/177422/'>Reggaeton " +
              "groove</a> CC0 de c0mp0s3r en Freesound; el tono es aritmética.",
      turn: "Arrastra o usa las flechas para girar; usa la rueda o más y menos para acercar. El cursor pausa el movimiento."
    }
  }[lang];

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const nf = (n) => n.toLocaleString(lang === "es" ? "es" : "en");

  // ------------------------------------------------------------ the audio
  // One AudioContext, built on the first press of a transport button and
  // never before: a context created at load starts suspended under every
  // browser's autoplay policy, and the hero embed must not create one at all.
  //
  // A control moved while something is playing swaps the sound in place --
  // the same moment in the clip, with the new rate, bit depth or window --
  // which is the whole reason this stage has a transport at all. Each source
  // is generation-tagged, so a stale source ending after a swap cannot put
  // the transport back while its replacement is still playing.
  let actx = null, playing = null, generation = 0, swapTimer = 0;
  const SWAP_MS = 120;

  const audio = {
    get ready() { return actx !== null; },
    get on() { return playing !== null; },
    resume() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    },
    // `offset` is seconds into the new buffer: 0 from the play button, and
    // wherever the old one had got to when a control swapped it.
    start(samples, what, offset) {
      if (embed || !signal.loaded || !samples || !samples.length) return;
      const c = this.resume();
      this.stop();
      // The arithmetic runs at the recording's rate. The buffer is built at
      // that rate and Web Audio resamples it on the way out if the device runs
      // at another; decoding through the live context instead would resample
      // first and change the matrix's shape.
      const buf = c.createBuffer(1, samples.length, signal.rate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < samples.length; i++) ch[i] = Math.max(-1, Math.min(1, samples[i]));
      const src = c.createBufferSource();
      src.buffer = buf;
      src.connect(c.destination);
      const mine = ++generation;
      // Ending on its own is the common case -- these clips are five seconds
      // -- and it has to put the transport back the way the stop button does.
      src.onended = () => {
        if (!playing || playing.gen !== mine) return;
        playing = null;
        $("playstate").textContent = T.idle;
        changed();
      };
      const at = Math.max(0, Math.min(offset || 0, buf.duration - 1e-3));
      src.start(0, at);
      // startedAt is back-dated by the offset, so head() stays continuous
      // across a swap and the playhead does not jump.
      playing = {src: src, gen: mine, what: what, startedAt: c.currentTime - at};
      $("playstate").textContent = T.playing(what);
      changed();
    },
    play(samples, what) { this.start(samples, what, 0); },
    stop() {
      clearTimeout(swapTimer);
      if (playing) {
        // Clear the handler first: a deliberate stop must not also run the
        // "nothing playing" path a second time from the callback.
        playing.src.onended = null;
        try { playing.src.stop(); } catch (e) { /* already ended */ }
        playing = null;
      }
    },
    // Seconds into the clip, for the playhead every picture draws. Not an
    // AnalyserNode: that would hand back a snapshot of the output mix at the
    // device rate, which is a different array from the one on the stage.
    head() { return playing && actx ? actx.currentTime - playing.startedAt : -1; }
  };

  // A control moved while the sound is on: re-render what this scene plays
  // and pick it up where the last one had got to. Debounced, because
  // rebuilding a spectrogram's inverse on every pixel of a drag would stall
  // the drag itself.
  function swapAudio(scene) {
    if (!playing || !scene.audio) return;
    clearTimeout(swapTimer);
    swapTimer = setTimeout(() => {
      if (!playing) return;
      const at = audio.head();
      const out = scene.audio(contextFor(scene));
      if (!out) return;
      audio.start(out.samples, out.what, at);
    }, SWAP_MS);
  }

  // ---------------------------------------------------------- the signal
  // The page fetches the voice once. The hero embed never does: it is a
  // still picture on a landing page, and half a megabyte is not what that is
  // worth. It draws the same scene from a stand-in of exactly the recording's
  // length and rate, so every shape on screen is the shape the full page
  // shows -- the picture is honest about the arithmetic, and says in its
  // caption that it is a picture. The beat is fetched on first choice, never
  // before; the tone is arithmetic and fetches nothing; and a file the reader
  // drops is decoded here and kept here.
  const signal = {samples: null, rate: RATE, loaded: false, failed: false, stand_in: false,
                  source: "voice", name: ""};

  function useSignal(samples, rate, source, name) {
    signal.samples = samples;
    signal.rate = rate;
    signal.loaded = true;
    signal.source = source;
    signal.name = name;
    signal.stand_in = source === "standin";
    $("signame").textContent =
      source === "voice" ? T.sigVoice : source === "beat" ? T.sigBeat
      : source === "tone" ? T.sigTone
      : source === "standin" ? T.sigStandIn : name;
  }

  function fetchWav(which) {
    return fetch("vendor/" + which + ".wav")
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then((b) => AC.decodeWav(new Uint8Array(b)));
  }

  function loadSignal() {
    if (embed) {
      useSignal(K.demoSignal(SAMPLES, RATE), RATE, "standin", "");
      return Promise.resolve();
    }
    return fetchWav("voice")
      .then((wav) => useSignal(wav.samples, wav.rate, "voice", "voice.wav"))
      .catch(() => {
        // A reader with no recording still gets every lesson but the sound,
        // which is better than an empty stage that blames their browser.
        useSignal(K.demoSignal(SAMPLES, RATE), RATE, "standin", "");
        signal.failed = true;
      });
  }

  // Everything derived from the old recording is stale: every scene starts
  // again from its opening state, and the three.js scenes rebuild their
  // buffers on the next frame because their keys no longer match.
  function resignal() {
    audio.stop();
    $("playstate").textContent = T.idle;
    strip.key = null;
    for (const s of scenes) {
      const c = ctxFor.get(s.id);
      if (!c) continue;
      c.state = {};
      c.cache = {};
      s.init(c);
      if (c.gl && s.resignal) s.resignal(c);
      buildControls(s);
    }
    changed();
  }

  function loadBuiltin(which) {
    if (which === signal.source) return;
    if (which === "tone") {
      useSignal(AC.tone(SAMPLES, RATE, TONE_HZ), RATE, "tone", "tone");
      resignal();
      return;
    }
    $("playstate").textContent = T.loading;
    fetchWav(which)
      .then((wav) => { useSignal(wav.samples, wav.rate, which, which + ".wav"); resignal(); })
      .catch(() => {
        $("playstate").textContent = T.beatFailed;
        $("builtin").value = signal.source;
      });
  }

  // A file the reader dropped, decoded in the page. Through an *offline*
  // context at the recording's rate: no autoplay policy applies to one,
  // nothing plays, the live context is still only ever built by the first
  // press of Play, and every scene keeps one rate. A decoder resamples
  // silently and does not say what the file's own rate was, so the label
  // says "decoded at 48 kHz" rather than pretending to know.
  function loadFile(file) {
    if (!file) return;
    $("playstate").textContent = T.loading;
    file.arrayBuffer()
      .then((buf) => new OfflineAudioContext(1, 1, RATE).decodeAudioData(buf))
      .then((ab) => {
        const n = Math.min(ab.length, CAP * RATE);
        const out = new Float64Array(n);
        for (let c = 0; c < ab.numberOfChannels; c++) {
          const ch = ab.getChannelData(c);
          for (let i = 0; i < n; i++) out[i] += ch[i] / ab.numberOfChannels;
        }
        if (n < 4096) throw new Error("too short");
        useSignal(out, RATE, "file", T.sigFile(file.name, n / RATE, ab.length > n));
        $("builtin").value = "file";
        resignal();
      })
      .catch(() => { $("playstate").textContent = T.decodeFailed; });
  }

  // ---------------------------------------------------------- the scenes
  const scenes = window.VoiceScenes.list();
  if (!scenes.length) throw new Error("voice-stage: no scenes registered");
  for (const s of scenes) {
    // A scene with no section would register, build its controls into
    // nothing and never be reachable. Say so at boot rather than at the
    // first scroll.
    if (!$("step-" + s.id)) throw new Error("voice-stage: no section for scene " + s.id);
  }
  let active = scenes[0];
  let step = 0;
  const ctxFor = new Map();
  const byId = (id) => scenes.find((s) => s.id === id);

  const canvas = $("draw"), stage = $("stage");
  const g = canvas.getContext("2d");

  // The pausable clock. Wall time would jump on resume, so every scene that
  // moves takes its time from here. Held by the button, by a pointer over a
  // three.js scene, by keyboard focus on it, and by a hidden tab.
  const motion = {manual: reduceMotion, over: false, focus: false, held: false, heldAt: 0, offset: 0};
  const now = () => (motion.held ? motion.heldAt : performance.now()) - motion.offset;
  function refreshMotion() {
    // Only a three.js picture is held by a resting pointer, and in a
    // scroller the picture changes under one: derived here rather than
    // latched at pointerenter, which left the clock held on a flat scene
    // and skipped its entrance.
    motion.hover = motion.over && !!active.gl;
    const hold = motion.manual || motion.hover || motion.focus || document.hidden;
    const t = performance.now();
    if (hold && !motion.held) motion.heldAt = t;
    if (!hold && motion.held) motion.offset += t - motion.heldAt;
    motion.held = hold;
    stage.dataset.paused = hold ? "1" : "0";
    refreshDrift();
  }

  function contextFor(scene) {
    if (ctxFor.has(scene.id)) return ctxFor.get(scene.id);
    const c = {
      AC, K, LC, lang, embed, reduceMotion,
      get rate() { return signal.rate; },
      state: {},
      cache: {},
      stage, canvas,
      get g() { return g; },
      get W() { return canvas.width / dpr; },
      get H() { return canvas.height / dpr; },
      get aspect() { return canvas.width / Math.max(1, canvas.height); },
      get copy() { return scene.copy[lang]; },
      get signal() { return signal.samples; },
      get standIn() { return signal.stand_in; },
      get source() { return signal.source; },
      colour: (token) => K.css(token),
      now, get instant() { return motion.held || reduceMotion; },
      play: (s, what) => audio.play(s, what),
      stop: () => audio.stop(),
      head: () => audio.head(),
      changed,
      setControls: (vals) => setControls(scene, vals),
      // A scene's own control element, by the id it declared: the frame
      // prefixes them with the scene, because the same name lives in nine
      // sections now.
      control: (id) => $("c-" + scene.id + "-" + id),
      // The three.js side, filled by bootGL(). `gl` is what build() returned.
      get THREE() { return window.THREE; },
      get AD() { return window.THREE_ADDONS; },
      get glReady() { return GL.ready; },
      gl: null,
      shownView: () => shownView(scene.id),
      label: (text, cls) => K.label2d(text, cls)
    };
    ctxFor.set(scene.id, c);
    return c;
  }

  // ------------------------------------------------------- the controls
  // Scenes declare controls; the frame builds them into that scene's own
  // section, labels them from the scene's copy in the page's language, and
  // hands back plain values. Nothing here knows what a control means.
  function buildControls(scene) {
    const host = $("ctl-" + scene.id);
    host.textContent = "";
    const ctx = contextFor(scene);
    const copy = scene.copy[lang];
    (scene.controls || []).forEach((spec) => {
      const wrap = document.createElement("label");
      const val = document.createElement("span");
      val.className = "val";
      wrap.appendChild(val);
      const name = document.createElement("span");
      name.textContent = (copy.controls && copy.controls[spec.id]) || spec.id;
      wrap.appendChild(name);

      let input;
      if (spec.type === "select") {
        input = document.createElement("select");
        // `available` lets a scene narrow the list to what is legal right now
        // -- the components a rank actually has -- so an option that would
        // blank the picture is never offered.
        (spec.available ? spec.available(ctx) : spec.options).forEach((o) => {
          const opt = document.createElement("option");
          opt.value = o;
          opt.textContent = (copy.options && copy.options[spec.id] && copy.options[spec.id][o]) || o;
          input.appendChild(opt);
        });
        input.value = String(ctx.state[spec.id]);
      } else {
        input = document.createElement("input");
        input.type = "range";
        input.min = spec.min; input.max = spec.max; input.step = spec.step || 1;
        input.value = String(ctx.state[spec.id]);
      }
      input.id = "c-" + scene.id + "-" + spec.id;
      input.autocomplete = "off";
      // One control can change what another one's label says -- the hop
      // decides how many seconds a window position is -- so every label is
      // re-formatted from `changed()`, after the scene has derived from the
      // new value, rather than only the control that fired.
      input.addEventListener("input", () => {
        ctx.state[spec.id] = spec.type === "select" ? input.value : Number(input.value);
        // A control moved is the reader taking hold: the drift restarts from
        // wherever the camera is once they let go.
        dropDrift();
        // The scene this control belongs to is the one being read now, even
        // if the scroll has not caught up.
        if (active !== scene) showScene(scene, false);
        changed();
        swapAudio(scene);
      });
      val.textContent = spec.fmt ? spec.fmt(ctx.state[spec.id], ctx) : "";
      wrap.appendChild(input);
      host.appendChild(wrap);
    });
  }

  function rebuildLabels(scene) {
    const ctx = contextFor(scene), copy = scene.copy[lang];
    (scene.controls || []).forEach((spec) => {
      const input = $("c-" + scene.id + "-" + spec.id);
      if (!input) return;
      if (spec.type === "select" && spec.available) {
        const want = spec.available(ctx);
        const have = Array.from(input.options).map((o) => o.value);
        if (want.join(",") !== have.join(",")) {
          input.textContent = "";
          want.forEach((o) => {
            const opt = document.createElement("option");
            opt.value = o;
            opt.textContent = (copy.options && copy.options[spec.id] && copy.options[spec.id][o]) || o;
            input.appendChild(opt);
          });
          input.value = String(ctx.state[spec.id]);
        }
      }
      const val = input.parentNode.querySelector(".val");
      if (val) val.textContent = spec.fmt ? spec.fmt(ctx.state[spec.id], ctx) : "";
    });
  }

  function setControls(scene, vals) {
    const ctx = contextFor(scene);
    Object.keys(vals).forEach((k) => {
      ctx.state[k] = vals[k];
      const input = $("c-" + scene.id + "-" + k);
      if (input) input.value = String(vals[k]);
    });
    rebuildLabels(scene);
    changed();
    swapAudio(scene);
  }

  // -------------------------------------------------------- the readout
  // Written from the controls' values, never from anything eased, and only
  // when something changed -- rewriting it every frame destroys a reader's
  // selection and makes the browser check race the animation.
  const written = new Set();

  function changed() {
    const ctx = contextFor(active);
    // Whatever the control changed, the scene derives from it before anything
    // is written down. Without this the readout and the data-* attributes are
    // written from the state the last frame left behind: changing the hop
    // reported the old hop until the next repaint, so the browser check and
    // the reader both read a number that was already wrong.
    if (signal.loaded && active.sync) active.sync(ctx);
    const r = (signal.loaded ? active.readout(ctx) : null) || {};
    $("read-" + active.id).innerHTML = r.html || "";
    const aria = ctx.copy.aria(ctx) || "";
    stage.setAttribute("aria-label", active.gl && GL.ready && !embed ? aria + " " + T.turn : aria);

    const data = Object.assign({scene: active.id}, r.data || {});
    data.playing = playing ? "1" : "0";
    data.standin = signal.stand_in ? "1" : "0";
    data.signal = signal.source;
    // Only the keys a readout wrote last time are pruned. Clearing the whole
    // dataset took `data-ready` and `data-paused` with it -- they are the
    // frame's, not the scene's, and the first control a reader touched made
    // the stage stop saying whether it was ready or paused.
    written.forEach((k) => { if (!(k in data)) delete stage.dataset[k]; });
    written.clear();
    Object.keys(data).forEach((k) => {
      stage.dataset[k] = String(data[k]);
      written.add(k);
    });
    rebuildLabels(active);
    labelPlay();
    strip.dirty = true;
    paint();
  }

  // What the play button will play, said before it is pressed. Cheap, because
  // it is rewritten on every control change; `audio()` is the expensive one
  // and runs only when the button is pressed or a swap is due.
  function labelPlay() {
    const ctx = contextFor(active);
    // The buttons, not the row: the row also holds the recording picker,
    // which belongs to the frame and stays whatever the scene can play.
    $("tbuttons").hidden = !!embed || !active.audio;
    if (!active.audio) return;
    const what = active.playLabel ? active.playLabel(ctx) : "";
    $("play").textContent = what ? T.playWhat(what) : T.play;
  }

  // ------------------------------------------------------------ painting
  let dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    const t = $("timeline");
    const tr = t.getBoundingClientRect();
    t.width = Math.max(1, Math.round(tr.width * dpr));
    t.height = Math.max(1, Math.round(tr.height * dpr));
    strip.dpr = dpr;
    strip.key = null;
    strip.dirty = true;
    resizeGL();
    paint();
  }

  // Which surface is live: the three.js canvas for a three.js scene once the
  // modules are in, the 2-D canvas otherwise -- including for a three.js
  // scene's twin while the modules load, or forever if they never do.
  const glLive = () => !!(active.gl && GL.ready && !embed);

  function paint() {
    const ctx = contextFor(active);
    if (signal.loaded && active.sync) active.sync(ctx);
    const live = glLive();
    $("gl").hidden = !live;
    canvas.style.display = live ? "none" : "block";
    // The CSS2D labels are HTML over the stage, not pixels in it, so a 2-D
    // picture does not paint over them: the sampling scene's axis chips sat
    // on top of the spectrum until this hid the layer with its canvas.
    if (GL.lab) GL.lab.domElement.style.display = live ? "" : "none";
    if (live) {
      renderGL();
    } else {
      stage.dataset.gl = "none";
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = K.css("--stage");
      g.fillRect(0, 0, ctx.W, ctx.H);
      if (!signal.loaded) {
        K.label(g, T.loading, 14, 14, K.css("--stage-mute"));
        return;
      }
      active.draw(ctx);
    }
    if (strip.dirty) drawStrip();
  }

  // ----------------------------------------------------- the timeline
  // The whole recording, under the stage, drawn by the frame rather than by
  // a scene: every picture on this page is a window onto one array, and this
  // is the array. The waveform is cached per signal and per size, because it
  // is a min/max pass over 237,568 samples and the playhead moves sixty times
  // a second over the top of it.
  const strip = {canvas: null, key: null, dpr: 1, dirty: true, drag: false};

  function drawStrip() {
    if (embed || !signal.loaded) return;
    const t = $("timeline");
    const tg = t.getContext("2d");
    const w = t.width / dpr, h = t.height / dpr;
    tg.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ctx = contextFor(active);
    const region = active.region ? active.region(ctx) : null;
    // A scene that loops one frame is not playing the recording, so a
    // playhead sweeping this strip would point at seconds of audio nobody
    // is hearing. Those scenes draw their own, across the frame.
    const head = active.loopAudio ? -1 : audio.head();
    K.timeline(tg, strip, signal.samples, signal.source + ":" + active.id,
               {x: 0, y: 0, w: w, h: h}, region,
               head >= 0 ? head * signal.rate : -1,
               {bg: K.css("--stage"), wave: K.css("--v-sig"),
                band: "rgba(88, 196, 221, 0.22)", bandLine: K.css("--v-axis"),
                head: K.css("--v-out")});
    const secs = signal.samples.length / signal.rate;
    const r = region || {i0: 0, i1: signal.samples.length};
    t.setAttribute("aria-label", T.timeAria(secs, r.i0 / signal.rate, r.i1 / signal.rate));
    strip.dirty = false;
  }

  // Dragging the strip moves the scene's position control, where it has one.
  function stripTo(clientX) {
    if (!active.posControl || !signal.loaded) return;
    const t = $("timeline");
    const box = t.getBoundingClientRect();
    const u = Math.max(0, Math.min(1, (clientX - box.left) / Math.max(1, box.width)));
    // Onto whatever range the control declares: most scenes walk a position
    // from 0 to 1000, the array walks an index into 237 568 numbers.
    const input = $("c-" + active.id + "-" + active.posControl);
    if (!input) return;
    const lo = Number(input.min) || 0, hi = Number(input.max);
    setControls(active, {[active.posControl]: Math.round(lo + u * (hi - lo))});
  }

  function bindStrip() {
    const t = $("timeline");
    t.addEventListener("pointerdown", (e) => {
      if (!active.posControl) return;
      try { t.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      strip.drag = true;
      stripTo(e.clientX);
    });
    t.addEventListener("pointermove", (e) => { if (strip.drag) stripTo(e.clientX); });
    const release = () => { strip.drag = false; };
    t.addEventListener("pointerup", release);
    t.addEventListener("pointercancel", release);
    t.addEventListener("keydown", (e) => {
      if (!active.posControl) return;
      const ctx = contextFor(active);
      const input = $("c-" + active.id + "-" + active.posControl);
      if (!input) return;
      const lo = Number(input.min) || 0, hi = Number(input.max);
      const at = Number(ctx.state[active.posControl]) || 0;
      const d = (hi - lo) * (e.shiftKey ? 0.1 : 0.02);
      const moves = {ArrowLeft: -d, ArrowRight: d, Home: lo - at, End: hi - at};
      if (!(e.key in moves)) return;
      e.preventDefault();
      setControls(active, {[active.posControl]: Math.round(Math.max(lo, Math.min(hi, at + moves[e.key])))});
    });
  }

  // How often a scene doing its own work is allowed to rewrite the readout.
  // Not every frame: rewriting it per frame destroys a reader's selection and
  // makes the browser check race the picture, which is why control changes are
  // the only other thing that writes it.
  const PROGRESS_MS = 200;
  let wasBusy = false, lastProgress = 0, wasPlaying = false;

  function frame() {
    const ctx = contextFor(active);
    // `busy` is work that has to finish -- a factorisation running in bands --
    // and it keeps going under reduced motion and under a paused clock,
    // because pausing is about movement rather than about arithmetic. Only
    // `animates` is gated on the motion switch.
    const busy = active.busy ? active.busy(ctx) : false;
    const moving = active.animates ? active.animates(ctx) && !motion.held : false;
    const sounding = audio.head() >= 0;
    const t = performance.now();
    // A scene that advances itself has to be able to say so. `paint()` alone
    // redraws the canvas and leaves the readout and every data-* attribute
    // frozen at whatever the last control change wrote, so a factorisation
    // would finish with the stage still reporting that it had not started.
    const finished = wasBusy && !busy;
    if (finished || (busy && t - lastProgress > PROGRESS_MS)) {
      lastProgress = t;
      changed();
    } else if (glLive()) {
      // The three.js path repaints every frame on its own: the camera drifts,
      // the entrance plays, the beads ease onto the ruler.
      renderGL();
      if (sounding) strip.dirty = true;
    } else if (busy || moving || sounding) {
      paint();
    }
    // The playhead is on the strip whichever surface the picture is drawn on,
    // and the strip has to go back to still once the sound stops.
    if (sounding || wasPlaying !== sounding) { strip.dirty = true; drawStrip(); }
    wasPlaying = sounding;
    wasBusy = busy;
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------- the three.js stage
  // The frame owns one renderer, one composer (render pass, bloom, output)
  // and one CSS2D label layer, re-pointed at whichever three.js scene is on
  // the stage -- the shape linalg-stage.html keeps. Booted lazily, on the
  // first three.js scene shown, so the spectrogram scenes and the hero embed
  // never fetch the modules.
  const GL = {ready: false, wanted: false, note: null, glow: true, budget: true, frames: [],
              renderer: null, composer: null, pass: null, bloom: null, lab: null, stamp: ""};
  const STAGE = {target: null, canvas: null};

  function whenThree(ms) {
    return new Promise((resolve, reject) => {
      if (window.THREE && window.THREE_ADDONS) return resolve();
      const timer = setTimeout(() => reject(new Error("timeout")), ms);
      addEventListener("three-ready", () => { clearTimeout(timer); resolve(); }, {once: true});
      const s = document.createElement("script");
      s.type = "module";
      s.src = "vendor/linalg-boot.js";
      s.onerror = () => { clearTimeout(timer); reject(new Error("load")); };
      document.head.appendChild(s);
    });
  }

  function glNote(why) {
    const note = $("glnote");
    GL.note = why;
    if (why) { note.textContent = T[why]; note.hidden = false; }
    else note.hidden = true;
  }

  function bootGL() {
    if (GL.wanted || embed) return;
    GL.wanted = true;
    whenThree(6000).then(() => {
      if (initGL()) {
        glNote(null);
        resize();
        showScene(active, false);
        refreshDrift();
      } else glNote("glNoWebgl");
    }).catch(() => glNote("glNoScript"));
  }

  function initGL() {
    const THREE = window.THREE, AD = window.THREE_ADDONS;
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({canvas: $("gl"), antialias: true, alpha: false});
    } catch (e) { return false; }
    if (!renderer || !renderer.getContext()) return false;

    // The stage's own black, in the working (linear) space the composer's
    // render target clears in.
    STAGE.canvas = new THREE.Color(K.css("--stage"));
    STAGE.target = STAGE.canvas.clone().convertSRGBToLinear();
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.localClippingEnabled = true;
    renderer.setClearColor(STAGE.target, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    GL.renderer = renderer;

    GL.lab = new AD.CSS2DRenderer();
    GL.lab.domElement.style.position = "absolute";
    GL.lab.domElement.style.top = "0";
    GL.lab.domElement.style.left = "0";
    GL.lab.domElement.style.pointerEvents = "none";
    GL.lab.domElement.style.overflow = "hidden";
    stage.insertBefore(GL.lab.domElement, $("claim"));

    const composer = new AD.EffectComposer(renderer);
    GL.pass = new AD.RenderPass(new THREE.Scene(), new THREE.PerspectiveCamera());
    composer.addPass(GL.pass);
    // Strength a touch under the projection stage's: the beads are small
    // and many, and a wide halo turns a row of them into a bar.
    GL.bloom = new AD.UnrealBloomPass(new THREE.Vector2(1, 1), 0.4, 0.3, 0.82);
    composer.addPass(GL.bloom);
    // Last, always: without it the composer bypasses outputColorSpace.
    composer.addPass(new AD.OutputPass());
    GL.composer = composer;
    GL.ready = true;
    return true;
  }

  // How far back the camera sits for the scene's content to fit vertically.
  const fit = (P) => P.content / Math.tan(P.fov * Math.PI / 360);

  function resizeGL() {
    if (!GL.ready) return;
    const r = stage.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    GL.renderer.setSize(w, h, false);
    GL.composer.setSize(w, h);
    GL.bloom.setSize(w, h);
    GL.lab.setSize(w, h);
    for (const s of scenes) {
      const c = ctxFor.get(s.id);
      if (!c || !c.gl) continue;
      c.gl.cam.aspect = w / h;
      c.gl.cam.updateProjectionMatrix();
    }
  }

  // Where each three.js scene is looked at from: one pair of angles per
  // scene, kept while the reader is on another picture, and the truth about
  // the camera. What is drawn may be an eased version of it (shownView).
  const views = {};
  const viewOf = (id) => {
    if (!views[id]) {
      const s = byId(id);
      views[id] = LC.orbitView(s.pose.home.az, s.pose.home.el);
    }
    return views[id];
  };

  // A scene turning into place on a scene change, and Home.
  const glide = {active: false, scene: null, az: null, el: null};
  function glideTo(id, fromAz, fromEl, toAz, toEl, ms) {
    if (reduceMotion || motion.held) { glide.active = false; return; }
    const t = now();
    if (glide.active && glide.scene === id) {
      glide.az = LC.retarget(glide.az, toAz, t, ms);
      glide.el = LC.retarget(glide.el, toEl, t, ms);
    } else {
      glide.az = LC.tweenStart(fromAz, toAz, t, ms);
      glide.el = LC.tweenStart(fromEl, toEl, t, ms);
    }
    glide.scene = id;
    glide.active = true;
  }
  function shownView(id) {
    const v = viewOf(id);
    if (!glide.active || glide.scene !== id) return v;
    const t = now();
    const a = LC.tweenAt(glide.az, t), e = LC.tweenAt(glide.el, t);
    if (a.done && e.done) { glide.active = false; refreshDrift(); return v; }
    return {az: a.value, el: e.value, dolly: v.dolly};
  }

  // The idle drift: the stage sways until someone reaches for it. The shape
  // of a stretch and the transitions between them are linalg-core's, pinned
  // under npm test; this is the clock and the flags that hold it off.
  const drift = Object.assign(LC.driftIdle(), {});
  const driftWanted = () =>
    !reduceMotion && !embed && !document.hidden && !motion.held && !glide.active && glLive();
  function setDrift(on) {
    if (on === drift.on) return;
    const t = performance.now();
    Object.assign(drift, on ? LC.driftStart(drift, viewOf(active.id), t) : LC.driftPause(drift, t));
  }
  const refreshDrift = () => setDrift(driftWanted());
  const dropDrift = () => { Object.assign(drift, LC.driftRelease(drift, performance.now())); };

  function takeView(id) {
    const from = shownView(id);
    glide.active = false;
    return {az: from.az, el: from.el, dolly: from.dolly};
  }
  function orbitBy(dAz, dEl) {
    if (!glLive()) return;
    dropDrift();
    views[active.id] = LC.orbitBy(takeView(active.id), dAz, dEl, active.pose.limits);
    stampCam();
  }
  function dollyBy(factor) {
    if (!glLive()) return;
    dropDrift();
    views[active.id] = LC.orbitDolly(takeView(active.id), factor, active.pose.limits);
    stampCam();
  }
  function homeView() {
    if (!glLive()) return;
    dropDrift();
    const from = shownView(active.id);
    const home = active.pose.home;
    views[active.id] = LC.orbitView(home.az, home.el);
    glideTo(active.id, from.az, from.el, home.az, home.el, 600);
    stampCam();
  }

  // The pose on the stage as numbers, for the browser check. Written only
  // when it changes, because it is touched sixty times a second.
  function stampCam() {
    const v = viewOf(active.id);
    const at = v.az.toFixed(2) + "," + v.el.toFixed(2) + "," + v.dolly.toFixed(2);
    if (GL.stamp !== at) { GL.stamp = at; stage.dataset.cam = at; }
  }

  function applyCamera(ctx) {
    const P = active.pose;
    if (drift.on && !glide.active) {
      Object.assign(viewOf(active.id), LC.driftPose(drift, performance.now() - drift.t0, P.limits));
    }
    const target = P.target || [0, 0, 0];
    const eye = LC.orbitEye(target, fit(P), shownView(active.id));
    const cam = ctx.gl.cam;
    cam.up.set(0, 1, 0);
    cam.position.set(eye[0], eye[1], eye[2]);
    cam.lookAt(target[0], target[1], target[2]);
    stampCam();
  }

  function renderGL() {
    const ctx = contextFor(active);
    if (!ctx.gl) {
      ctx.gl = active.build(ctx);
      resizeGL();
    }
    // The CSS2D layer keeps the last scene's elements until told otherwise:
    // the array's value chips were still on the stage under the sampling
    // scene until this cleared them.
    if (GL.labScene !== active.id) {
      GL.labScene = active.id;
      GL.lab.domElement.replaceChildren();
    }
    const t0 = performance.now();
    applyCamera(ctx);
    active.render(ctx, ctx.gl);
    GL.pass.scene = ctx.gl.scene;
    GL.pass.camera = ctx.gl.cam;
    GL.bloom.enabled = GL.glow && !reduceMotion && GL.budget;
    GL.composer.render();
    GL.lab.render(ctx.gl.scene, ctx.gl.cam);
    stage.dataset.gl = "composer";

    // Bloom's cost is a property of the device, not a preference. Measure the
    // first stretch of frames that ran the bloom pass and stand down if they
    // are not making budget.
    if (GL.bloom.enabled && GL.frames.length < 60) {
      GL.frames.push(performance.now() - t0);
      if (GL.frames.length === 60) {
        const med = GL.frames.slice().sort((a, b) => a - b)[30];
        if (med > 24) {
          GL.budget = false;
          $("glow").checked = false;
          GL.glow = false;
          glNote("glSlow");
        }
      }
    }
  }

  // The reader's hand on a three.js scene: drag to orbit, wheel and keys to
  // dolly, hover and focus to hold the drift. Never bound in embed mode.
  function bindStage() {
    let live = null;
    stage.addEventListener("pointerenter", () => { motion.over = true; refreshMotion(); });
    stage.addEventListener("pointerleave", () => { motion.over = false; refreshMotion(); });
    stage.addEventListener("focusin", () => { motion.focus = stage.matches(":focus-visible") && !!active.gl; refreshMotion(); });
    stage.addEventListener("focusout", () => { motion.focus = false; refreshMotion(); });
    document.addEventListener("visibilitychange", refreshMotion);

    stage.addEventListener("pointerdown", (e) => {
      if (!glLive()) return;
      try { stage.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      live = {id: e.pointerId, x: e.clientX, y: e.clientY};
      stage.dataset.grab = "1";
    });
    stage.addEventListener("pointermove", (e) => {
      if (!live || e.pointerId !== live.id) return;
      const dx = e.clientX - live.x, dy = e.clientY - live.y;
      live.x = e.clientX; live.y = e.clientY;
      orbitBy(-dx * 0.008, dy * 0.005);
    });
    const release = (e) => {
      if (!live || e.pointerId !== live.id) return;
      live = null;
      delete stage.dataset.grab;
    };
    stage.addEventListener("pointerup", release);
    stage.addEventListener("pointercancel", release);
    stage.addEventListener("wheel", (e) => {
      if (!glLive() || e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault();
      const pixels = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? stage.clientHeight : 1);
      dollyBy(Math.exp(Math.max(-0.35, Math.min(0.35, pixels * 0.0015))));
    }, {passive: false});
    stage.addEventListener("keydown", (e) => {
      if (!glLive() || e.ctrlKey || e.metaKey || e.altKey) return;
      const d = e.shiftKey ? 0.3 : 0.1;
      const moves = {
        ArrowLeft: () => orbitBy(d, 0), ArrowRight: () => orbitBy(-d, 0),
        ArrowUp: () => orbitBy(0, -d), ArrowDown: () => orbitBy(0, d),
        "+": () => dollyBy(0.9), "=": () => dollyBy(0.9), "-": () => dollyBy(1.11),
        Home: () => homeView()
      };
      const move = moves[e.key];
      if (!move) return;
      e.preventDefault();
      motion.focus = true;
      refreshMotion();
      move();
    });
  }

  // -------------------------------------------------------------- scenes
  // The copy is written once, at boot. Only the stage's own furniture -- the
  // claim card, the chrome that belongs to a three.js picture -- changes when
  // the reader moves from one picture to the next, because in a scroller that
  // happens on every scroll settle.
  function fillText() {
    let group = null;
    scenes.forEach((s) => {
      const c = s.copy[lang];
      $("k-" + s.id).textContent = c.k;
      $("h-" + s.id).textContent = c.h;
      $("con-" + s.id).innerHTML = c.concept || "";
      $("con-" + s.id).dataset.label = T.concept;
      $("body-" + s.id).innerHTML = c.b;
      $("pr-" + s.id).textContent = c.predict || "";
      // The heading of the group this scene opens, above its kicker.
      if (s.part && s.part[lang] !== group) {
        group = s.part[lang];
        const part = document.createElement("p");
        part.className = "part";
        part.textContent = group;
        $("k-" + s.id).before(part);
      }
    });
    const dots = $("dots");
    dots.replaceChildren();
    scenes.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "dot";
      b.setAttribute("aria-label", T.stepName(i + 1, scenes.length, s.copy[lang].h));
      b.addEventListener("click", () => goTo(i, true));
      dots.appendChild(b);
    });
  }

  const arrived = new Set();

  // The reader is now looking at this picture. Called by the scroll watcher,
  // by the bar, by a hash and by a control in a section that is not the
  // active one -- so everything expensive here is behind a change of scene.
  function showScene(scene, scroll) {
    const was = active;
    const isNew = was !== scene;
    if (isNew) {
      // Only a real change of picture stops the sound. In a scroller this
      // runs on every scroll settle, and stopping there would cut the clip
      // off whenever the page moved under the reader.
      audio.stop();
      $("playstate").textContent = T.idle;
    }
    active = scene;
    step = scenes.indexOf(scene);
    $("claim").textContent = scene.copy[lang].claim;
    scenes.forEach((s, j) => $("step-" + s.id).classList.toggle("is-active", j === step));
    Array.from($("dots").children).forEach((d, j) => {
      if (j === step) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    $("prev").disabled = step === 0;
    $("next").disabled = step === scenes.length - 1;
    $("stepnum").textContent = T.stepOf(step + 1, scenes.length);
    if (isNew) $("status").textContent = scene.copy[lang].h;

    const ctx = contextFor(scene);
    // The three.js chrome only where there is a three.js picture to act on.
    const three = !!scene.gl && !embed;
    $("home").hidden = !three;
    $("glow-wrap").hidden = !three;
    $("hint").hidden = !three;
    $("glnote").hidden = !(three && GL.note);
    if (three) bootGL();
    if (three && GL.ready) {
      // A scene turning into place, and its own entrance, once. The drift
      // starts again from the pose the reader is now looking at.
      if (isNew || !arrived.has(scene.id)) {
        const v = viewOf(scene.id);
        dropDrift();
        const from = LC.orbitClamp({az: v.az - 0.3, el: v.el - 0.08, dolly: v.dolly}, scene.pose.limits);
        glideTo(scene.id, from.az, from.el, v.az, v.el, 900);
      }
    }
    // A 2-D picture has an entrance too -- the spectrogram filling in column
    // by column -- and it plays the first time the reader reaches it,
    // whichever surface it is drawn on.
    if (!arrived.has(scene.id) && !ctx.instant && scene.arrive && (!three || GL.ready)) {
      arrived.add(scene.id);
      scene.arrive(ctx);
    }
    strip.key = null;
    strip.dirty = true;
    changed();
    refreshMotion();
    if (scroll) {
      $("step-" + scene.id).scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "center"});
    }
  }

  const goTo = (i, scroll) =>
    showScene(scenes[Math.max(0, Math.min(scenes.length - 1, i))], scroll);

  // Which picture the reader is looking at: whichever section crosses a thin
  // band through the middle of the viewport. pickActive() owns the two cases
  // that flicker -- nothing in the band, and two things in it.
  function watchSteps() {
    let queued = false;
    const settle = () => {
      queued = false;
      const rects = scenes.map((s) => {
        const r = $("step-" + s.id).getBoundingClientRect();
        return {top: r.top, bottom: r.bottom};
      });
      const band = innerHeight / 2;
      const next = LC.pickActive(rects, band - 50, band + 50, step);
      if (next >= 0 && next !== step) showScene(scenes[next], false);
    };
    const kick = () => { if (!queued) { queued = true; requestAnimationFrame(settle); } };
    const io = new IntersectionObserver(kick, {threshold: [0, 0.25, 0.5, 0.75, 1]});
    scenes.forEach((s) => io.observe($("step-" + s.id)));
    addEventListener("scroll", kick, {passive: true});
    kick();
  }

  // ----------------------------------------------------------- the chrome
  $("site-home").textContent = T.navHome;
  $("site-home").href = lang === "es" ? "../es/index.html" : "../index.html";
  $("site-notebooks").textContent = T.navNotebooks;
  $("site-notebooks").href = lang === "es" ? "../es/notebooks.html" : "../notebooks.html";
  $("eyebrow").textContent = T.eyebrow;
  $("title").textContent = T.title;
  $("intro").textContent = T.intro;
  $("builtin-label").textContent = T.builtin;
  $("builtin").options[0].textContent = T.builtinVoice;
  $("builtin").options[1].textContent = T.builtinBeat;
  $("builtin").options[2].textContent = T.builtinTone;
  $("builtin").options[3].textContent = T.builtinFile;
  $("drop-text").textContent = T.drop;
  $("reset").textContent = T.reset;
  $("home").textContent = T.home;
  $("glow-label").textContent = T.glow;
  $("hint").textContent = T.hint;
  $("prev").textContent = T.prev;
  $("next").textContent = T.next;
  $("timecap").textContent = T.timecap;
  $("motion").textContent = reduceMotion ? T.motionOn : T.motion;
  $("motion").setAttribute("aria-pressed", String(reduceMotion));
  $("play").textContent = T.play;
  $("stop").textContent = T.stop;
  $("playstate").textContent = T.idle;
  $("h-about").textContent = T.aboutH;
  $("about-1").textContent = T.about1;
  $("about-2").innerHTML = T.about2;
  document.title = T.title;

  if (embed) {
    const cap = $("embedcap");
    const b = document.createElement("b");
    b.textContent = T.embedCap;
    cap.appendChild(b);
  }

  $("reset").addEventListener("click", () => {
    const ctx = contextFor(active);
    audio.stop();
    $("playstate").textContent = T.idle;
    if (active.reset) active.reset(ctx);
    buildControls(active);
    homeView();
    changed();
  });
  $("home").addEventListener("click", () => homeView());
  $("prev").addEventListener("click", () => goTo(step - 1, true));
  $("next").addEventListener("click", () => goTo(step + 1, true));
  $("glow").addEventListener("change", (e) => {
    GL.glow = e.target.checked;
    if (GL.glow) {
      GL.budget = true;
      GL.frames = [];
      if (GL.note === "glSlow") glNote(null);
    }
  });

  $("motion").addEventListener("click", () => {
    motion.manual = !motion.manual;
    $("motion").setAttribute("aria-pressed", String(motion.manual));
    $("motion").textContent = motion.manual ? T.motionOn : T.motion;
    refreshMotion();
  });

  $("play").addEventListener("click", () => {
    const ctx = contextFor(active);
    if (!active.audio) return;
    const out = active.audio(ctx);
    if (!out) return;
    audio.play(out.samples, out.what);
    $("status").textContent = T.playing(out.what);
  });

  $("stop").addEventListener("click", () => {
    audio.stop();
    $("playstate").textContent = T.idle;
    changed();
  });

  $("builtin").addEventListener("change", (e) => loadBuiltin(e.target.value));
  $("file").addEventListener("change", (e) => { loadFile(e.target.files[0]); e.target.value = ""; });
  // The stage takes a drop too, so the file can land on the picture it will
  // become. Both drop targets say so while a file is over them.
  for (const el of [$("drop"), stage]) {
    el.addEventListener("dragover", (e) => {
      if (embed) return;
      e.preventDefault();
      $("drop").dataset.over = "1";
    });
    el.addEventListener("dragleave", () => { delete $("drop").dataset.over; });
    el.addEventListener("drop", (e) => {
      if (embed) return;
      e.preventDefault();
      delete $("drop").dataset.over;
      loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
    });
  }

  window.addEventListener("resize", resize);
  // A hash that changes on a page already open -- a link followed from a
  // notebook in the same tab, or an edited address bar -- is the same
  // request as opening on it. Not in embed mode: a hero card has no
  // scroller, and a hash arriving there would strand it on a picture its
  // caption does not describe.
  if (!embed) addEventListener("hashchange", () => {
    const s = byId((location.hash || "").replace("#", ""));
    if (s) showScene(s, true);
  });

  fillText();
  resize();
  stage.dataset.scene = scenes[0].id;
  refreshMotion();
  if (!embed) { bindStage(); bindStrip(); }
  loadSignal().then(() => {
    if (signal.failed) $("playstate").textContent = T.failed;
    // Every scene seeds its state and builds its controls now: in a scroller
    // all nine sections are on the page at once, and a section whose
    // controls appeared only once it had been scrolled to would be a page
    // that changes shape under the reader.
    for (const s of scenes) { s.init(contextFor(s)); buildControls(s); }
    // The hero gets the spectrogram picture, drawn from the stand-in and
    // with no three.js: its caption describes that picture.
    const wanted = embed ? byId("window") : byId((location.hash || "").replace("#", ""));
    showScene(wanted || scenes[0], false);
    stage.dataset.ready = "1";
    if (!embed) {
      watchSteps();
      if (wanted) $("step-" + wanted.id).scrollIntoView({block: "center"});
    }
    requestAnimationFrame(frame);
  });
})();
</script>

</body>
</html>
