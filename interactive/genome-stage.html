<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA to an edit</title>

<!-- The vendored addons say `import ... from 'three'`, which only an import
     map can resolve without a bundler. It must be static and in <head>, and
     it fetches nothing until a module import resolves -- so the lazy boot
     below holds, and a page opened on a flat scene or as the hero embed never
     pulls three.js at all. See vendor/README.md. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three-0.169.0.module.min.js",
    "three/addons/": "./vendor/three-0.169.0/examples/jsm/"
  }
}
</script>

<link rel="stylesheet" href="widget-chrome.css">
<style>
  /* The surfaces, type and frame are widget-chrome.css; this page owns its
     accent and everything on the stage. --stage, --stage-chip, --stage-ink
     and --stage-mute are shared there -- this page never redeclares them. */
  :root {
    --accent: #3730a3;   /* 9.9:1 on white */
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="navy"]) { --accent: #a5b4fc; --on-accent: #1e1b4b; } /* 8.5:1 */
  }
  /* On the homepage hero's navy band. */
  :root[data-theme="navy"] { --accent: #a5b4fc; --on-accent: #1e1b4b; } /* 7.6:1 */

  /* The roles this stage's pictures use, over the shared stage ink. Every one
     is measured against --stage-chip's black, which is what every label on
     the stage sits on; the weakest is --gb-t at 7.6:1.

     The four bases keep one colour each everywhere -- a bead on the helix, a
     column of the one-hot matrix, a chip in a strip, a letter pointed at in
     an equation -- because the reader has to be able to follow one base from
     the picture into the numbers without a legend. They are never the only
     thing carrying a meaning: every chip also shows its letter. */
  :root {
    --gb-a: #4ade80;     /* A */
    --gb-c: #60a5fa;     /* C */
    --gb-g: #fbbf24;     /* G */
    --gb-t: #f87171;     /* T, and U after transcription */
    --gn-aa: #c4b5fd;    /* a residue, and the protein chain */
    --gn-hit: #6fe0c6;   /* a position that matches; a window that scores */
    --gn-miss: #fb7185;  /* a position that does not */
    --gn-mask: #a3a3a3;  /* masked out: the motif is not there */
    --gn-core: #f0abfc;  /* the code table; a contraction's result */
    --gn-rna: #5eead4;   /* the transcript, against the DNA it came from */
  }

  /* The same four hues as page text rather than stage ink: the readout and
     the prose sit on --bg, not on the stage's black, so the stage values
     would fail there. Light needs them darker, dark and navy lighter. */
  :root {
    --gb-a-ink: #15803d; --gb-c-ink: #1d4ed8;   /* 5.0:1, 6.7:1 on white */
    --gb-g-ink: #a16207; --gb-t-ink: #b91c1c;   /* 4.9:1, 6.5:1 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="navy"]) {
      --gb-a-ink: #4ade80; --gb-c-ink: #93c5fd;  /* 9.7:1, 9.4:1 */
      --gb-g-ink: #fbbf24; --gb-t-ink: #fca5a5;  /* 10.2:1, 8.9:1 */
    }
  }
  :root[data-theme="navy"] {
    --gb-a-ink: #4ade80; --gb-c-ink: #93c5fd;    /* 8.7:1, 8.4:1 */
    --gb-g-ink: #fbbf24; --gb-t-ink: #fca5a5;    /* 9.1:1, 8.0:1 */
  }

  /* The scroller. align-items:start is load-bearing: the grid default
     stretches the item to full height, and position:sticky then has nothing
     left to stick to. */
  .two-pane {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr);
    gap: 2rem;
    align-items: start;
    margin-top: 1.25rem;
  }
  .steps { min-width: 0; }
  .stagewrap { position: sticky; top: 1.5rem; min-width: 0; }

  @media (max-width: 62rem) {
    .two-pane { display: flex; flex-direction: column; gap: 1rem; }
    .stagewrap {
      order: -1; top: 0; z-index: 2; padding-bottom: 0.5rem; background: var(--bg);
      display: flex; flex-direction: column;
      max-height: 100vh; max-height: 100svh;
    }
    #stage { flex: 1 1 auto; aspect-ratio: auto; max-height: none; min-height: 12rem; }
    .step { min-height: 0; padding: 1.4rem 0; }
    #rail .stop { font-size: 0.72rem; padding: 0.2rem 0.5rem; }
  }

  /* The stage is the shape of the board the flat scenes are laid out on,
     820 x 500, so a flat picture fills it edge to edge instead of sitting in
     a letterbox; the ceiling keeps the dock and the bar on a short screen,
     where the rail, ribbon, dock and bar need about 22rem between them. */
  #stage {
    position: relative; aspect-ratio: 820 / 500; max-height: min(56vh, calc(100vh - 22rem));
    background: var(--stage); border: 1px solid var(--line);
    border-radius: 10px 10px 0 0; overflow: hidden;
  }
  #stage[data-turns="1"] { cursor: grab; touch-action: pan-y; }
  #stage[data-grab] { cursor: grabbing; }
  #stage[data-hover]:not([data-grab]) { cursor: pointer; }
  #stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #draw, #gl { display: block; width: 100%; height: 100%; }
  #gl { position: absolute; inset: 0; }
  #gl[hidden] { display: none; }
  /* A flat inset over a three.js picture -- the grid of distances under the
     fold -- on the same board the twin is drawn on, so one drawing serves
     both surfaces. Only its pickable pieces take the pointer: everywhere
     else a drag still turns the picture underneath. */
  #hud { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
  #hud[hidden] { display: none; }
  #hud [data-pick] { pointer-events: auto; }
  /* A label over the three.js stage: the same opaque chip the SVG labels sit
     on, for the same reason -- axe cannot measure contrast over a canvas. */
  .lab {
    font: 600 13px/1 var(--mono); color: var(--stage-ink); background: var(--stage-chip);
    padding: 3px 6px; border-radius: 4px; white-space: nowrap; letter-spacing: 0.01em;
  }
  .lab.mute { color: var(--stage-mute); font-weight: 500; }
  .lab.ba { color: var(--gb-a); }
  .lab.bc { color: var(--gb-c); }
  .lab.bg { color: var(--gb-g); }
  .lab.bt { color: var(--gb-t); }
  .lab.aa { color: var(--gn-aa); }
  .lab.hit { color: var(--gn-hit); }
  .lab.miss { color: var(--gn-miss); }
  .lab.mask { color: var(--gn-mask); }
  .lab.core { color: var(--gn-core); }
  .lab.rna { color: var(--gn-rna); }
  .lab.big { font-size: 16px; }
  .lab.small { font-size: 11px; font-weight: 500; }
  .lab.lit { outline: 1px solid currentColor; }
  #claim {
    position: absolute; left: 0.75rem; top: 0.6rem; margin: 0; max-width: 62%;
    font-size: 0.88rem; font-weight: 600; color: var(--stage-ink); background: var(--stage-chip);
    padding: 0.15rem 0.4rem; border-radius: 4px; font-family: var(--mono);
  }
  /* Two chips on one line growing towards each other. Overlapping absolute
     boxes never make the page scroll, so no check would catch them meeting;
     the widths are what stop it. */
  #shapebadge {
    position: absolute; right: 0.75rem; top: 0.6rem; margin: 0; max-width: 34%;
    font-size: 0.82rem; color: var(--stage-ink); background: var(--stage-chip);
    padding: 0.15rem 0.4rem; border-radius: 4px; font-family: var(--mono);
  }
  /* A line the scene can say under its picture, from the controls: the three
     addresses of one entry, the cell a rebuild misses by most. */
  #stagecap {
    position: absolute; left: 0.75rem; bottom: 0.6rem; margin: 0; max-width: 60%;
    font-size: 0.78rem; color: var(--stage-ink); background: var(--stage-chip);
    padding: 0.15rem 0.4rem; border-radius: 4px; font-family: var(--mono);
  }
  #glnote { position: absolute; right: 0.75rem; bottom: 0.6rem; margin: 0; font-size: 0.78rem; max-width: 36%;
            color: var(--stage-mute); background: var(--stage-chip); padding: 0.15rem 0.4rem; border-radius: 4px; }
  /* What is under the pointer. aria-hidden: it follows the mouse, and every
     fact it names is also in the readout or reachable by a control. */
  #tip {
    position: absolute; left: 0; top: 0; margin: 0; pointer-events: none; z-index: 3;
    font: 600 0.78rem/1.25 var(--mono); color: var(--stage-ink); background: var(--stage-chip);
    border: 1px solid var(--stage-mute); padding: 0.2rem 0.45rem; border-radius: 4px;
    white-space: nowrap;
  }

  /* The rail: the nine pictures by name, in the order the gene goes through
     them, with a gap where a new part opens. The names are the pictures' own
     addresses (#transcribe, #search), so the map and the links agree. */
  #rail { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; margin: 0 0 0.55rem; }
  #rail .stop {
    font: 600 0.78rem/1.2 var(--sans); color: var(--ink-mute); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 0.24rem 0.7rem;
  }
  #rail .stop.opens { margin-left: 0.7rem; }
  #rail .stop:hover { border-color: var(--accent); color: var(--accent); }
  #rail .stop[aria-current="step"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #stepnum { font: 600 0.85rem/1 var(--sans); color: var(--ink-mute); }

  /* The ribbon: the whole gene, 180 bases, one tick each, under every
     picture. The bright stretch is what the picture above is looking at, so
     the same molecule is on screen from the first scene to the last and only
     the lens moves. aria-hidden: it names nothing the readout does not, and
     every place it can send a reader a control can too. */
  #ribbon {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.6rem;
    background: var(--stage); border: 1px solid var(--line); border-top: 0;
    border-radius: 0 0 10px 10px; padding: 0.3rem 0.75rem 0.4rem;
    font: 500 0.72rem/1 var(--mono); color: var(--stage-mute);
  }
  #ribbon svg { display: block; width: 100%; height: 22px; cursor: pointer; touch-action: none; }
  #ribbon .lens-cap { color: var(--stage-ink); min-width: 6.5em; text-align: right; }
  html.embed #ribbon, html.embed #rail, html.embed #hud { display: none; }

  /* A new picture fades in rather than cutting. data-easing stays "1" until
     it has, so nothing measures a half-faded label. */
  @media (prefers-reduced-motion: no-preference) {
    #stage.swap #draw, #stage.swap #gl { animation: stage-in 260ms ease-out; }
  }
  @keyframes stage-in { from { opacity: 0; } to { opacity: 1; } }

  .step {
    min-height: 74vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 1rem 0;
  }
  .step .anchor { display: block; height: 0; }
  .step h2 { font-size: 1.2rem; font-weight: 650; margin: 0 0 0.2rem; }
  /* The heading of the group a scene opens. The page is five ideas in
     order -- a sequence, transcription, translation, the fold, the search --
     not nine numbered steps. */
  .step .part {
    font: 600 0.8rem/1.3 var(--sans); color: var(--ink-mute);
    border-top: 1px solid var(--line); padding-top: 0.6rem; margin: 0 0 0.9rem; max-width: 36rem;
  }
  .step .kicker { margin-bottom: 0.5rem; }
  .step p, .step .body { max-width: 36rem; overflow-wrap: break-word; }
  .step.is-active h2 { color: var(--accent); }

  .controls { display: grid; gap: 0.7rem; margin: 0.9rem 0 0; max-width: 34rem; }
  .controls label { display: block; font-size: 0.85rem; font-weight: 600; }
  .controls .val { float: right; font-family: var(--mono); font-weight: 500; color: var(--ink-mute); }
  .controls input[type="range"] { width: 100%; accent-color: var(--accent); }
  .controls select { width: 100%; max-width: 22rem; }
  .controls .playrow { display: flex; align-items: end; gap: 0.6rem; }
  /* Four across under this stage: a picture with a play button has four
     controls, and a second row of them would push the readout out of the dock. */
  .dock .controls { grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); align-items: end; }
  .controls button.play { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 650; }

  .readout {
    margin: 0.7rem 0 0; padding: 0.65rem 0.8rem; background: var(--sunk);
    border: 1px solid var(--line); border-radius: 8px; font-size: 0.92rem;
    min-height: 3.2rem; max-width: 36rem;
  }
  .readout b { color: var(--accent); }
  .shape { font-family: var(--mono); font-size: 0.86rem; }

  /* Display notation. The <math> is static in the section: it is the same in
     both languages, and check_links.py reads the static HTML. Only the caption
     under it is translated. A letter the reader can point at carries
     [data-hl]; hovering or focusing it lights the piece it names on the stage
     -- the fibre along that axis, the factor plate, the core -- on both
     surfaces, which is what connects a letter to the thing it stands for. */
  .eq {
    margin: 0.9rem 0 0; padding: 0.7rem 0.8rem; background: var(--sunk);
    border: 1px solid var(--line); border-radius: 8px; max-width: 36rem;
  }
  /* `contain: inline-size` keeps a formula wider than the column from
     reporting its own min-content up through the layout, which is what took
     the audio stage past 390px; the box scrolls instead, and is focusable
     because axe requires a scrollable region to be reachable. */
  .eqscroll { overflow-x: auto; contain: inline-size; }
  .eq math { font-size: 1.05rem; color: var(--ink);
             font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif; }
  .eq math + math { margin-top: 0.4rem; }
  .eqcap { margin: 0.55rem 0 0; font-size: 0.82rem; color: var(--ink-mute); }
  /* Colour is never the only carrier: the affordance is a dashed underline,
     and the lit state adds a tint behind it as well as changing it. */
  .eq [data-hl] { cursor: help; border-bottom: 1px dashed var(--ink-mute); border-radius: 2px; }
  .eq [data-hl]:hover, .eq [data-hl].is-lit {
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    border-bottom: 1px solid var(--accent);
  }
  .eq [data-hl]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* The NumPy under each picture, written by changed() because every number
     in it comes from the controls. One copy of the code for both languages;
     only the `#` comments are translated. */
  .np { margin: 0.9rem 0 0; max-width: 36rem; }
  .nplabel {
    margin: 0 0 0.3rem; font: 600 0.75rem/1.3 var(--sans);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute);
  }
  .np pre { margin: 0; contain: inline-size; border: 1px solid var(--line); font-size: 0.72rem; }
  .np pre:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .step .body code, .readout code { font: 500 0.85em/1 var(--mono); }

  /* Embed mode: the homepage hero. No chrome, no scroller, no three.js. */
  html.embed .steps, html.embed .stagebar, html.embed .readout, html.embed #shapebadge,
  html.embed #stagecap, html.embed .hint { display: none; }
  html.embed .two-pane { display: block; margin: 0; }
  html.embed .stagewrap { position: static; height: 100vh; display: flex; flex-direction: column; }
  html.embed #stage { flex: 1 1 auto; border: 0; border-radius: 0; aspect-ratio: auto; max-height: none; min-height: 0; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <nav class="site-nav" aria-label="Site">
      <a class="site-home" id="site-home" href="../index.html">← Workshop home</a>
      <a id="site-interactive" href="../interactive.html">Interactive</a>
      <a id="site-notebooks" href="../notebooks.html">Notebooks</a>
    </nav>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p id="intro"></p>
  </header>

  <div class="two-pane">

    <!-- One section per scene, in reading order. The anchor spans and the
         <math> are static because check_links.py reads the static HTML:
         without them every #codons and #search in the handbooks and
         notebooks is a link to a fragment that does not resolve. -->
    <div class="steps" id="steps">

      <section class="step" id="step-bases" aria-labelledby="h-bases">
        <span class="anchor" id="bases"></span>
        <p class="kicker" id="k-bases"></p>
        <h2 id="h-bases"></h2>
        <p class="predict" id="pr-bases"></p>
        <p class="concept" id="con-bases"></p>
        <div class="body" id="body-bases"></div>
        <div class="eq">
          <div class="eqscroll" tabindex="0" role="group" aria-labelledby="eqcap-bases">
            <math display="block">
              <mrow><mi>X</mi><mo>&#x2208;</mo><msup><mrow><mo stretchy="false">{</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo stretchy="false">}</mo></mrow><mrow><mrow data-hl="pos" tabindex="0"><mi>L</mi></mrow><mo>&#xD7;</mo><mrow data-hl="base" tabindex="0"><mn>4</mn></mrow></mrow></msup></mrow>
            </math>
            <math display="block">
              <mrow><munder><mo>&#x2211;</mo><mrow><mrow data-hl="base" tabindex="0"><mi>b</mi></mrow></mrow></munder><mi>X</mi><mo stretchy="false">[</mo><mrow data-hl="pos" tabindex="0"><mi>&#x2113;</mi></mrow><mo>,</mo><mrow data-hl="base" tabindex="0"><mi>b</mi></mrow><mo stretchy="false">]</mo><mo>=</mo><mn>1</mn></mrow>
            </math>
          </div>
          <p class="eqcap" id="eqcap-bases"></p>
        </div>
        <div class="np">
          <p class="nplabel" id="nplab-bases"></p>
          <pre id="np-bases" tabindex="0" role="region" aria-labelledby="nplab-bases"><code></code></pre>
        </div>
        <div class="controls" id="ctl-bases"></div>
        <p class="readout" id="read-bases"></p>
      </section>

      <section class="step" id="step-window" aria-labelledby="h-window">
        <span class="anchor" id="window"></span>
        <p class="kicker" id="k-window"></p>
        <h2 id="h-window"></h2>
        <p class="predict" id="pr-window"></p>
        <p class="concept" id="con-window"></p>
        <div class="body" id="body-window"></div>
        <div class="eq">
          <div class="eqscroll" tabindex="0" role="group" aria-labelledby="eqcap-window">
            <math display="block">
              <mrow><mi>W</mi><mo>&#x2208;</mo><msup><mi>&#x211D;</mi><mrow><mrow data-hl="win" tabindex="0"><mi>N</mi></mrow><mo>&#xD7;</mo><mrow data-hl="pos" tabindex="0"><mi>L</mi></mrow><mo>&#xD7;</mo><mrow data-hl="base" tabindex="0"><mn>4</mn></mrow></mrow></msup></mrow>
            </math>
            <math display="block">
              <mrow><mi>W</mi><mo stretchy="false">[</mo><mrow data-hl="win" tabindex="0"><mi>w</mi></mrow><mo>,</mo><mrow data-hl="pos" tabindex="0"><mi>&#x2113;</mi></mrow><mo>,</mo><mrow data-hl="base" tabindex="0"><mi>b</mi></mrow><mo stretchy="false">]</mo><mo>=</mo><mi>X</mi><mo stretchy="false">[</mo><mrow data-hl="win" tabindex="0"><mi>w</mi></mrow><mo>+</mo><mrow data-hl="pos" tabindex="0"><mi>&#x2113;</mi></mrow><mo>,</mo><mrow data-hl="base" tabindex="0"><mi>b</mi></mrow><mo stretchy="false">]</mo></mrow>
            </math>
          </div>
          <p class="eqcap" id="eqcap-window"></p>
        </div>
        <div class="np">
          <p class="nplabel" id="nplab-window"></p>
          <pre id="np-window" tabindex="0" role="region" aria-labelledby="nplab-window"><code></code></pre>
        </div>
        <div class="controls" id="ctl-window"></div>
        <p class="readout" id="read-window"></p>
      </section>

      <section class="step" id="step-transcribe" aria-labelledby="h-transcribe">
        <span class="anchor" id="transcribe"></span>
        <p class="kicker" id="k-transcribe"></p>
        <h2 id="h-transcribe"></h2>
        <p class="predict" id="pr-transcribe"></p>
        <p class="concept" id="con-transcribe"></p>
        <div class="body" id="body-transcribe"></div>
        <div class="eq">
          <div class="eqscroll" tabindex="0" role="group" aria-labelledby="eqcap-transcribe">
            <math display="block">
              <mrow><mi>Y</mi><mo stretchy="false">[</mo><mrow data-hl="pos" tabindex="0"><mi>&#x2113;</mi></mrow><mo>,</mo><mrow data-hl="rna" tabindex="0"><mi>c</mi></mrow><mo stretchy="false">]</mo><mo>=</mo><munder><mo>&#x2211;</mo><mrow><mrow data-hl="base" tabindex="0"><mi>b</mi></mrow></mrow></munder><mi>X</mi><mo stretchy="false">[</mo><mrow data-hl="pos" tabindex="0"><mi>&#x2113;</mi></mrow><mo>,</mo><mrow data-hl="base" tabindex="0"><mi>b</mi></mrow><mo stretchy="false">]</mo><mo>&#x22C5;</mo><mi>M</mi><mo stretchy="false">[</mo><mrow data-hl="base" tabindex="0"><mi>b</mi></mrow><mo>,</mo><mrow data-hl="rna" tabindex="0"><mi>c</mi></mrow><mo stretchy="false">]</mo></mrow>
            </math>
          </div>
          <p class="eqcap" id="eqcap-transcribe"></p>
        </div>
        <div class="np">
          <p class="nplabel" id="nplab-transcribe"></p>
          <pre id="np-transcribe" tabindex="0" role="region" aria-labelledby="nplab-transcribe"><code></code></pre>
        </div>
        <div class="controls" id="ctl-transcribe"></div>
        <p class="readout" id="read-transcribe"></p>
      </section>

      <section class="step" id="step-codons" aria-labelledby="h-codons">
        <span class="anchor" id="codons"></span>
        <p class="kicker" id="k-codons"></p>
        <h2 id="h-codons"></h2>
        <p class="predict" id="pr-codons"></p>
        <p class="concept" id="con-codons"></p>
        <div class="body" id="body-codons"></div>
        <div class="eq">
          <div class="eqscroll" tabindex="0" role="group" aria-labelledby="eqcap-codons">
            <math display="block">
              <mrow><mi>C</mi><mo>&#x2208;</mo><msup><mi>&#x211D;</mi><mrow><mrow data-hl="codon" tabindex="0"><mi>N</mi></mrow><mo>&#xD7;</mo><mn>3</mn><mo>&#xD7;</mo><mrow data-hl="base" tabindex="0"><mn>4</mn></mrow></mrow></msup></mrow>

              "genome-scenes/README.md dice de d\u00f3nde sale cada uno.",
      about2: "Esta es una p\u00e1gina sobre c\u00f3mo se representan los datos de secuencia, no una " +
              "herramienta para dise\u00f1ar nada: te ense\u00f1a cu\u00e1l es la aritm\u00e9tica, " +
              "sobre un tramo corto de un solo gen, y la gu\u00eda que buscan sus im\u00e1genes de " +
              "b\u00fasqueda est\u00e1 cortada de ese mismo tramo. Acompa\u00f1a a la secci\u00f3n 04 " +
              "(reorganizar) y a la 06 (einsum), con el trabajo para casa del Ap\u00e9ndice G. Cada " +
              "imagen tiene su propia direcci\u00f3n (#bases, #window, #transcribe, #codons, " +
              "#translate, #protein, #fold, #search, #batch) y los cuadernos enlazan a la que " +
              "est\u00e1n ense\u00f1ando.",
      turn: "Arrastra o usa las flechas para girar; usa la rueda o m\u00e1s y menos para acercar. El cursor pausa el movimiento."
    }
  }[lang];

  // -------------------------------------------------------------- the data
  // Nothing is fetched. The 180 bases, the protein they translate to and the
  // code table are literals in genome-core.js -- small enough to read in the
  // source, and pinned by tests/genome_core.test.cjs against the deposited
  // record. So the gate every draw below checks is true from the first frame:
  // there is no stand-in, no failure note and no second state to reason
  // about. The taxi stage this frame came from needs all three because it
  // fetches its tensor; this one does not, and carrying them anyway would be
  // three dead branches nothing could ever exercise.
  const seq = GC.CDS;

  // -------------------------------------------------------------- scenes
  const scenes = window.GenomeScenes.list();
  // Set once the controls exist (step-dock.js); null in embed mode, where
  // there are no controls to show.
  let dock = null;
  if (!scenes.length) throw new Error("genome-stage: no scenes registered");
  for (const s of scenes) {
    if (!$("step-" + s.id)) throw new Error("genome-stage: no section for scene " + s.id);
  }
  let active = scenes[0];
  let step = 0;
  // Which piece the reader is pointing at in a display equation, and which
  // one under the pointer on the stage. Frame state, not a scene's: neither
  // may rewrite a readout, because a hover that moved text under the cursor
  // would be a page that fights its reader.
  let hl = null, hover = null;
  const ctxFor = new Map();
  const byId = (id) => scenes.find((s) => s.id === id);

  const stage = $("stage"), svg = $("draw");
  const BOARD_H = 500;

  // The pausable clock the drift and the camera glide run on. Held by the
  // button, by a pointer over a three.js scene, by keyboard focus on it, and
  // by a hidden tab. Geometry eases on real time instead -- a reader who
  // clicks a voxel has the pointer over the stage, and a picture that froze
  // mid-move whenever the pointer was on it would look broken.
  const motion = {manual: reduceMotion, over: false, focus: false, held: false, heldAt: 0, offset: 0};
  const now = () => (motion.held ? motion.heldAt : performance.now()) - motion.offset;
  function refreshMotion() {
    motion.hover = motion.over && !!active.gl;
    const hold = motion.manual || motion.hover || motion.focus || document.hidden;
    const t = performance.now();
    if (hold && !motion.held) motion.heldAt = t;
    if (!hold && motion.held) motion.offset += t - motion.heldAt;
    motion.held = hold;
    stage.dataset.paused = hold ? "1" : "0";
    refreshDrift();
  }

  function contextFor(scene) {
    if (ctxFor.has(scene.id)) return ctxFor.get(scene.id);
    const c = {
      GC, K, LC, lang, embed, reduceMotion,
      seq,
      state: {},
      cache: {},
      svg, stage,
      get copy() { return scene.copy[lang]; },
      colour: (token) => K.css(token),
      // The piece named by the equation letter under the pointer, and the key
      // of whatever is under it on the stage. A scene reads both in draw() and
      // render(); nothing it writes into a readout may depend on either.
      get hl() { return hl; },
      get hover() { return hover; },
      // Real time, for geometry that eases. `instant` is true under reduced
      // motion or the pause button: a scene then snaps to its target.
      now: () => performance.now(),
      get instant() { return reduceMotion || motion.manual; },
      changed,
      setControls: (vals) => setControls(scene, vals),
      control: (id) => $("c-" + scene.id + "-" + id),
      get aspect() {
        const r = stage.getBoundingClientRect();
        return Math.max(0.2, r.width / Math.max(1, r.height));
      },
      // The three.js side, filled by bootGL(). `gl` is what build() returned.
      get THREE() { return window.THREE; },
      get AD() { return window.THREE_ADDONS; },
      get glReady() { return GL.ready; },
      gl: null,
      // The view this scene is drawn from right now -- the reader's orbit,
      // eased by a glide, reshaped by the scene's own framing -- as a screen
      // basis. The flat twin projects through it, so a drag turns the twin
      // exactly as it turns the three.js picture.
      view: () => framedView(scene),
      basis: () => K.viewBasis(framedView(scene), sceneTarget(scene)),
      // A projection fitted into `box` at the scale the home view would get,
      // shrunk further only if the current view needs more room: the twin
      // holds still under a small turn rather than breathing, and never
      // leaves the viewBox.
      projector: (points, box) => {
        const B = K.viewBasis(framedView(scene), sceneTarget(scene));
        const P0 = K.projector(points, K.viewBasis(homeFramed(scene), sceneTarget(scene)), box);
        const P1 = K.projector(points, B, box);
        return P1.s <= P0.s ? P1 : K.projector(points, B, shrinkBox(box, P0.s, P1.s));
      },
      label: (text, cls) => K.label2d(text, cls),
      // Where a twin may draw: the board less the claim chip at the top and
      // the caption at the bottom.
      box: () => {
        const vb = (svg.getAttribute("viewBox") || "0 0 820 500").split(/\s+/).map(Number);
        const I = insetOf(scene);
        return [40 + 740 * I.left, 58 + (vb[3] - 88) * I.top, 780 - 740 * I.right, vb[3] - 30 - (vb[3] - 88) * I.bottom];
      },
      // The board the inset is drawn on: the twin's own, so a HUD laid out
      // against its height sits where the twin left room for it.
      board: () => ({w: 820, h: active.gl ? twinHeight() : BOARD_H})
    };
    ctxFor.set(scene.id, c);
    return c;
  }
  // The share of the stage a scene keeps clear for its inset (pose.inset:
  // fractions of the width and height). The camera and the twin both frame
  // the picture in what is left.
  const NO_INSET = {left: 0, right: 0, top: 0, bottom: 0};
  const insetOf = (scene) => Object.assign({}, NO_INSET, (scene.pose && scene.pose.inset) || {});

  // A box around the same centre whose fitted scale is `want` rather than the
  // `got` it would give -- the current view fits at the home view's scale.
  function shrinkBox(box, want, got) {
    const k = want / got;
    const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
    const hw = (box[2] - box[0]) / 2 * k, hh = (box[3] - box[1]) / 2 * k;
    return [cx - hw, cy - hh, cx + hw, cy + hh];
  }

  // ------------------------------------------------------- the controls
  // Scenes declare controls; the frame builds them into that scene's own
  // section, labels them from the scene's copy in the page's language, and
  // hands back plain values. A `play` control is a button that walks another
  // control of the same scene from its minimum to its maximum.
  function buildControls(scene) {
    const host = $("ctl-" + scene.id);
    host.textContent = "";
    const ctx = contextFor(scene);
    const copy = scene.copy[lang];
    (scene.controls || []).forEach((spec) => {
      if (spec.type === "play") {
        const row = document.createElement("div");
        row.className = "playrow";
        const b = document.createElement("button");
        b.type = "button";
        b.className = "play";
        b.id = "c-" + scene.id + "-" + spec.id;
        b.textContent = (copy.controls && copy.controls[spec.id]) || spec.id;
        b.addEventListener("click", () => togglePlay(scene, spec));
        row.appendChild(b);
        host.appendChild(row);
        return;
      }
      const wrap = document.createElement("label");
      const val = document.createElement("span");
      val.className = "val";
      wrap.appendChild(val);
      const name = document.createElement("span");
      name.textContent = (copy.controls && copy.controls[spec.id]) || spec.id;
      wrap.appendChild(name);

      let input;
      if (spec.type === "select") {
        input = document.createElement("select");
        // `available` narrows the list to what is legal right now -- the core
        // entries the ranks actually have -- so an option that would blank
        // the picture is never offered.
        (spec.available ? spec.available(ctx) : spec.options).forEach((o) => {
          const opt = document.createElement("option");
          opt.value = o;
          opt.textContent = optionLabel(copy, spec, o, ctx);
          input.appendChild(opt);
        });
        input.value = String(ctx.state[spec.id]);
      } else {
        input = document.createElement("input");
        input.type = "range";
        input.min = spec.min; input.max = spec.max; input.step = spec.step || 1;
        input.value = String(ctx.state[spec.id]);
      }
      input.id = "c-" + scene.id + "-" + spec.id;
      input.autocomplete = "off";
      input.addEventListener("input", () => {
        ctx.state[spec.id] = spec.type === "select" ? input.value : Number(input.value);
        // A hand on the control the player is walking takes it back.
        if (player && player.scene === scene && player.spec.target === spec.id) stopPlay();
        dropDrift();
        if (active !== scene) showScene(scene, false);
        changed();
      });
      val.textContent = spec.fmt ? spec.fmt(ctx.state[spec.id], ctx) : "";
      wrap.appendChild(input);
      host.appendChild(wrap);
    });
  }

  function optionLabel(copy, spec, o, ctx) {
    const table = copy.options && copy.options[spec.id];
    if (typeof table === "function") return table(o, ctx);
    return (table && table[o]) || o;
  }

  function rebuildLabels(scene) {
    const ctx = contextFor(scene), copy = scene.copy[lang];
    (scene.controls || []).forEach((spec) => {
      const input = $("c-" + scene.id + "-" + spec.id);
      if (!input || spec.type === "play") return;
      if (spec.type === "select" && spec.available) {
        const want = spec.available(ctx);
        const have = Array.from(input.options).map((o) => o.value);
        if (want.join(",") !== have.join(",")) {
          input.textContent = "";
          want.forEach((o) => {
            const opt = document.createElement("option");
            opt.value = o;
            opt.textContent = optionLabel(copy, spec, o, ctx);
            input.appendChild(opt);
          });
        }
        input.value = String(ctx.state[spec.id]);
      }
      const val = input.parentNode.querySelector(".val");
      if (val) val.textContent = spec.fmt ? spec.fmt(ctx.state[spec.id], ctx) : "";
    });
  }

  function setControls(scene, vals) {
    const ctx = contextFor(scene);
    Object.keys(vals).forEach((k) => {
      ctx.state[k] = vals[k];
      const input = $("c-" + scene.id + "-" + k);
      if (input) input.value = String(vals[k]);
    });
    rebuildLabels(scene);
    if (scene === active) changed();
  }

  // ----------------------------------------------------------- the player
  // One control walking another. It steps through setControls(), so every
  // value it passes is a value the readout is written from, and it publishes
  // data-playing while it runs. It stops on a change of picture, on a hand on
  // the control it is walking, and at the end.
  let player = null;
  // A slider's top can move with another control (the helix's base with the
  // number of pairs drawn), so the player reads it off the slider itself.
  function liveMax(scene, target) {
    const input = $("c-" + scene.id + "-" + target.id);
    const m = input ? Number(input.max) : NaN;
    return Number.isFinite(m) ? Math.min(target.max, m) : target.max;
  }
  function togglePlay(scene, spec) {
    if (player) { const same = player.scene === scene && player.spec === spec; stopPlay(); if (same) return; }
    const ctx = contextFor(scene);
    const target = (scene.controls || []).find((c) => c.id === spec.target);
    if (!target) return;
    if (active !== scene) showScene(scene, false);
    const lo = target.min, hi = liveMax(scene, target);
    let from = Number(ctx.state[spec.target]);
    if (from >= hi) from = lo;
    if (ctx.instant) { setControls(scene, {[spec.target]: hi}); return; }
    setControls(scene, {[spec.target]: from});
    player = {scene, spec, target, t0: performance.now(), from};
    stage.dataset.playing = "1";
    $("c-" + scene.id + "-" + spec.id).textContent = T.pause;
  }
  function stopPlay() {
    if (!player) return;
    const b = $("c-" + player.scene.id + "-" + player.spec.id);
    if (b) b.textContent = player.scene.copy[lang].controls[player.spec.id];
    player = null;
    stage.dataset.playing = "0";
  }
  function stepPlay() {
    if (!player || player.scene !== active) return;
    const ctx = contextFor(active);
    const {spec, target} = player;
    const stepSize = target.step || 1;
    const raw = player.from + (spec.rate || 30) * (performance.now() - player.t0) / 1000;
    const hi = liveMax(active, target);
    const v = Math.min(hi, target.min + Math.floor((raw - target.min) / stepSize + 1e-9) * stepSize);
    if (v !== ctx.state[spec.target]) setControls(active, {[spec.target]: v});
    if (v >= hi) stopPlay();
  }

  // -------------------------------------------------------- the readout
  // Written from the controls' values, never from anything eased, and only
  // when something changed -- rewriting it every frame destroys a reader's
  // selection and makes the browser check race the animation.
  const written = new Set();

  let swapUntil = 0;

  function changed() {
    const ctx = contextFor(active);
    // Whatever the control changed, the scene derives from it before
    // anything is written down or painted.
    if (active.sync) active.sync(ctx);
    const r = active.readout(ctx) || {};
    $("read-" + active.id).innerHTML = r.html || "";
    // The NumPy for this picture, at the controls' own values.
    if (active.code) {
      const lines = active.code(ctx);
      $("np-" + active.id).firstChild.textContent = lines.join("\n");
    }
    $("claim").textContent = r.claim || active.copy[lang].claim;
    const cap = $("stagecap");
    cap.textContent = r.caption || "";
    cap.hidden = !cap.textContent;

    let sh = "";
    {
      sh = active.shape ? active.shape(ctx)
         : (r.data && r.data.shape ? "[" + String(r.data.shape).split(",").join(", ") + "]" : "");
    }
    const badge = $("shapebadge");
    badge.textContent = sh ? T.shape + " " + sh : "";
    badge.hidden = !sh;
    if (sh) stage.dataset.tensorshape = sh; else delete stage.dataset.tensorshape;

    drawRibbon(r.lens);

    const aria = ctx.copy.aria ? ctx.copy.aria(ctx) : "";
    stage.setAttribute("aria-label", active.gl && GL.ready && !embed ? aria + " " + T.turn : aria);

    // Only the keys a readout wrote last time are pruned: data-gl, data-cam,
    // data-hl, data-hover, data-playing, data-easing, data-paused and
    // data-ready are the frame's, and a readout must never write one of them.
    const data = Object.assign({scene: active.id}, r.data || {});
        written.forEach((k) => { if (!(k in data)) delete stage.dataset[k]; });
    written.clear();
    Object.keys(data).forEach((k) => {
      stage.dataset[k] = String(data[k]);
      written.add(k);
    });
    rebuildLabels(active);
    paint();
    drawHud();
    stampEasing();
  }

  // The inset, on whichever surface is live. Drawn when something changed --
  // the controls, the pointer, a letter pointed at -- never per frame.
  function drawHud() {
    const hud = $("hud");
    const on = !!active.hud && !embed;
    // An SVG element has no `hidden` property, only the attribute.
    hud.toggleAttribute("hidden", !on);
    if (!on) { if (hud.firstChild) hud.textContent = ""; return; }
    const ctx = contextFor(active);
    const b = ctx.board();
    hud.setAttribute("viewBox", "0 0 " + b.w + " " + b.h);
    hud.textContent = "";
    active.hud(ctx, hud);
  }

  // ------------------------------------------------------------ the ribbon
  // One tick per base of the gene, built once; the lens is the stretch the
  // picture above is looking at, written by changed() from the scene's
  // readout ({a, b} half-open, in bases; `done` a second, dimmer stretch;
  // `mark` one base). A press or a drag on it asks the scene to look there
  // (scene.seek), which goes through setControls like any other hand on a
  // control -- so the ribbon is one more way to move a slider, never a second
  // source of state.
  const RIB = {w: 720, h: 22, built: false, lens: null, done: null, mark: null, ticks: []};
  function buildRibbon() {
    const el = $("ribbon-svg"), n = seq.length, tw = RIB.w / n;
    $("ribbon-name").textContent = T.ribbon;
    RIB.done = K.el("rect", {x: 0, y: 3, width: 0, height: RIB.h - 6, fill: K.css("--stage-ink"), "fill-opacity": 0.1});
    el.appendChild(RIB.done);
    for (let i = 0; i < n; i++) {
      const t = K.el("rect", {
        x: (i * tw + 0.5).toFixed(2), y: 6, width: Math.max(1, tw - 1).toFixed(2), height: RIB.h - 12,
        fill: K.css(K.BASE_TOKEN[seq[i]]), "fill-opacity": 0.38
      });
      RIB.ticks.push(t);
      el.appendChild(t);
    }
    RIB.lens = K.el("rect", {x: 0, y: 1.5, width: 0, height: RIB.h - 3, rx: 2, fill: "none",
                             stroke: K.css("--gn-hit"), "stroke-width": 1.6});
    el.appendChild(RIB.lens);
    RIB.mark = K.el("path", {d: "", fill: K.css("--stage-ink")});
    el.appendChild(RIB.mark);
    RIB.built = true;

    let held = false;
    const at = (e) => {
      const r = el.getBoundingClientRect();
      return Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - r.left) / Math.max(1, r.width)) * n)));
    };
    const seek = (e) => {
      if (!active.seek) return;
      dropDrift();
      active.seek(contextFor(active), at(e));
    };
    el.addEventListener("pointerdown", (e) => {
      held = true;
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      seek(e);
    });
    el.addEventListener("pointermove", (e) => { if (held) seek(e); });
    const up = () => { held = false; };
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  }
  function drawRibbon(lens) {
    if (embed) return;
    if (!RIB.built) buildRibbon();
    const n = seq.length, tw = RIB.w / n;
    const L = lens || {a: 0, b: n};
    const a = Math.max(0, Math.min(n, L.a)), b = Math.max(a, Math.min(n, L.b));
    RIB.ticks.forEach((t, i) => {
      const op = i >= a && i < b ? "1" : (L.done && i >= L.done[0] && i < L.done[1] ? "0.62" : "0.38");
      if (t.getAttribute("fill-opacity") !== op) t.setAttribute("fill-opacity", op);
    });
    RIB.lens.setAttribute("x", Math.max(0.8, a * tw - 0.6).toFixed(2));
    RIB.lens.setAttribute("width", Math.max(3, Math.min(RIB.w - 0.8, b * tw + 0.6) - Math.max(0.8, a * tw - 0.6)).toFixed(2));
    if (L.done) {
      RIB.done.setAttribute("x", (L.done[0] * tw).toFixed(2));
      RIB.done.setAttribute("width", Math.max(0, (L.done[1] - L.done[0]) * tw).toFixed(2));
    } else RIB.done.setAttribute("width", 0);
    if (L.mark !== undefined && L.mark !== null) {
      const x = (L.mark + 0.5) * tw;
      RIB.mark.setAttribute("d", "M" + (x - 3.5).toFixed(2) + " 0L" + (x + 3.5).toFixed(2) + " 0L" + x.toFixed(2) + " 5.5Z");
    } else RIB.mark.setAttribute("d", "");
    $("ribbon-cap").textContent = T.lens(a, b);
    $("ribbon-svg").style.cursor = active.seek ? "pointer" : "default";
  }

  // Whether the picture is still on its way to what the controls say --
  // geometry easing, the helix turning, a camera glide. The frame's own
  // attribute, so the browser check can wait for the picture to arrive
  // rather than for a number of milliseconds that is enough on one machine.
  // Stamped straight after a change as well as every frame: a check that
  // read it between the change and the next frame would see the old "0".
  function stampEasing() {
    const ctx = contextFor(active);
    const swapping = performance.now() < swapUntil;
    if (!swapping && stage.classList.contains("swap")) stage.classList.remove("swap");
    const moving = !!(active.animates && active.animates(ctx)) || glide.active || swapping;
    const v = moving ? "1" : "0";
    if (stage.dataset.easing !== v) stage.dataset.easing = v;
  }

  // ------------------------------------------------------------ painting
  // Which surface is live: the three.js canvas for a three.js scene once the
  // modules are in, the SVG otherwise -- including for a three.js scene's
  // twin while the modules load, or forever if they never do.
  const glLive = () => !!(active.gl && GL.ready && !embed);

  function paint() {
    const live = glLive();
    $("gl").hidden = !live;
    svg.style.display = live ? "none" : "block";
    // The CSS2D labels are HTML over the stage, not pixels in it, so the SVG
    // does not paint over them: hide the layer with its canvas.
    if (GL.lab) GL.lab.domElement.style.display = live ? "" : "none";
    if (live) {
      renderGL();
    } else {
      stage.dataset.gl = "none";
      svg.textContent = "";
      // A 2-D scene is laid out on a fixed 820 x 500 board, which is the
      // shape the stage itself takes. A three.js scene's twin is fitted, not
      // laid out, so it takes a board the shape of whatever the stage is --
      // the hero embed's still is one of these, and letterboxed into a fixed
      // board it was a picture a third of the frame.
      const H = active.gl ? twinHeight() : BOARD_H;
      const vb = "0 0 820 " + H;
      if (svg.getAttribute("viewBox") !== vb) svg.setAttribute("viewBox", vb);
      active.draw(contextFor(active));
    }
  }
  function twinHeight() {
    const r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return BOARD_H;
    return Math.max(420, Math.min(900, Math.round(820 * r.height / r.width)));
  }

  // Pointing at a letter in an equation lights the piece it names. This never
  // calls changed(): the readout is written from the controls. It repaints and
  // publishes data-hl, which is the frame's own attribute.
  function lightToken(token, on) {
    const next = on ? token : (hl === token ? null : hl);
    if (next === hl) return;
    hl = next;
    if (hl) stage.dataset.hl = hl; else delete stage.dataset.hl;
    document.querySelectorAll(".eq [data-hl]").forEach((el) => {
      el.classList.toggle("is-lit", !!hl && el.dataset.hl === hl);
    });
    if (!glLive()) paint();
    drawHud();
  }

  function bindEquations() {
    document.querySelectorAll(".eq [data-hl]").forEach((el) => {
      const token = el.dataset.hl;
      el.addEventListener("pointerenter", () => lightToken(token, true));
      el.addEventListener("pointerleave", () => lightToken(token, false));
      el.addEventListener("focus", () => lightToken(token, true));
      el.addEventListener("blur", () => lightToken(token, false));
    });
  }

  let wasMoving = false;
  function frame() {
    const ctx = contextFor(active);
    stepPlay();
    // `animates` is a picture still easing towards its controls. On the flat
    // path that costs a repaint per frame only while it is true; the three.js
    // path repaints every frame anyway, for the drift and the glide.
    const moving = active.animates ? active.animates(ctx) : false;
    if (glLive()) renderGL();
    // One paint more than `moving` asks for: a picture that says it has
    // arrived on this frame was last painted on the one before, a hair short.
    else if (moving || glide.active || wasMoving) paint();
    wasMoving = moving || glide.active;
    stampEasing();
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------- the three.js stage
  // One renderer, one composer (render pass, bloom, output) and one CSS2D
  // label layer, re-pointed at whichever three.js scene is on the stage --
  // the shape linalg-stage.html and voice-stage.html keep. Booted lazily, on
  // the first three.js scene shown.
  const GL = {ready: false, wanted: false, note: null, glow: true, budget: true, frames: [],
              renderer: null, composer: null, pass: null, bloom: null, lab: null, stamp: "",
              ray: null, labScene: null};
  const STAGE = {target: null, canvas: null};

  function whenThree(ms) {
    return new Promise((resolve, reject) => {
      if (window.THREE && window.THREE_ADDONS) return resolve();
      const timer = setTimeout(() => reject(new Error("timeout")), ms);
      addEventListener("three-ready", () => { clearTimeout(timer); resolve(); }, {once: true});
      const s = document.createElement("script");
      s.type = "module";
      s.src = "vendor/linalg-boot.js";
      s.onerror = () => { clearTimeout(timer); reject(new Error("load")); };
      document.head.appendChild(s);
    });
  }

  function glNote(why) {
    const note = $("glnote");
    GL.note = why;
    if (why && active.gl) { note.textContent = T[why]; note.hidden = false; }
    else note.hidden = true;
  }

  function bootGL() {
    if (GL.wanted || embed) return;
    GL.wanted = true;
    whenThree(6000).then(() => {
      if (initGL()) {
        glNote(null);
        resizeGL();
        showScene(active, false);
        refreshDrift();
      } else glNote("glNoWebgl");
    }).catch(() => glNote("glNoScript"));
  }

  function initGL() {
    const THREE = window.THREE, AD = window.THREE_ADDONS;
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({canvas: $("gl"), antialias: true, alpha: false});
    } catch (e) { return false; }
    if (!renderer || !renderer.getContext()) return false;

    STAGE.canvas = new THREE.Color(K.css("--stage"));
    STAGE.target = STAGE.canvas.clone().convertSRGBToLinear();
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setClearColor(STAGE.target, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    GL.renderer = renderer;

    GL.lab = new AD.CSS2DRenderer();
    GL.lab.domElement.style.position = "absolute";
    GL.lab.domElement.style.top = "0";
    GL.lab.domElement.style.left = "0";
    GL.lab.domElement.style.pointerEvents = "none";
    GL.lab.domElement.style.overflow = "hidden";
    stage.insertBefore(GL.lab.domElement, $("claim"));

    const composer = new AD.EffectComposer(renderer);
    GL.pass = new AD.RenderPass(new THREE.Scene(), new THREE.PerspectiveCamera());
    composer.addPass(GL.pass);
    // The voxels are drawn under the threshold on purpose: only the picked
    // cell, the lit core entry and the fibres' frames are bright enough to
    // bloom, so 24 Manhattan voxels in a row do not merge into one bar.
    GL.bloom = new AD.UnrealBloomPass(new THREE.Vector2(1, 1), 0.45, 0.35, 0.8);
    composer.addPass(GL.bloom);
    // Last, always: without it the composer bypasses outputColorSpace.
    composer.addPass(new AD.OutputPass());
    GL.composer = composer;
    GL.ray = new THREE.Raycaster();
    GL.ready = true;
    return true;
  }

  function resizeGL() {
    if (!GL.ready) return;
    const r = stage.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    GL.renderer.setSize(w, h, false);
    GL.composer.setSize(w, h);
    GL.bloom.setSize(w, h);
    GL.lab.setSize(w, h);
    for (const s of scenes) {
      const c = ctxFor.get(s.id);
      if (!c || !c.gl) continue;
      c.gl.cam.aspect = w / h;
      c.gl.cam.updateProjectionMatrix();
    }
  }

  // Where each three.js scene is looked at from: one pair of angles per
  // scene, kept while the reader is on another picture. What is drawn may be
  // an eased version of it (shownView), reshaped by the scene (framedView).
  const views = {};
  const viewOf = (id) => {
    if (!views[id]) {
      const s = byId(id);
      views[id] = LC.orbitView(s.pose.home.az, s.pose.home.el);
    }
    return views[id];
  };

  const glide = {active: false, scene: null, az: null, el: null};
  function glideTo(id, fromAz, fromEl, toAz, toEl, ms) {
    if (reduceMotion || motion.held) { glide.active = false; return; }
    const t = now();
    if (glide.active && glide.scene === id) {
      glide.az = LC.retarget(glide.az, toAz, t, ms);
      glide.el = LC.retarget(glide.el, toEl, t, ms);
    } else {
      glide.az = LC.tweenStart(fromAz, toAz, t, ms);
      glide.el = LC.tweenStart(fromEl, toEl, t, ms);
    }
    glide.scene = id;
    glide.active = true;
  }
  function shownView(id) {
    const v = viewOf(id);
    if (!glide.active || glide.scene !== id) return v;
    const t = now();
    const a = LC.tweenAt(glide.az, t), e = LC.tweenAt(glide.el, t);
    if (a.done && e.done) { glide.active = false; refreshDrift(); return v; }
    return {az: a.value, el: e.value, dolly: v.dolly};
  }
  // A scene may reshape the view it is drawn from -- the protein chain
  // levels the camera onto its property axes -- without touching the reader's
  // own orbit, so coming back gives them the view they left.
  function framedView(scene) {
    const v = shownView(scene.id);
    return scene.framing ? scene.framing(contextFor(scene), v) : v;
  }
  function homeFramed(scene) {
    const H = LC.orbitView(scene.pose.home.az, scene.pose.home.el);
    return scene.framing ? scene.framing(contextFor(scene), H) : H;
  }
  // What the camera looks at: the middle of the scene's own bounds, so a
  // picture that grows one way (a helix lengthening, a strand of windows)
  // stays centred on the stage.
  function sceneTarget(scene) {
    const ctx = contextFor(scene);
    if (scene.pose.target) return scene.pose.target;
    if (!scene.bounds) return [0, 0, 0];
    const b = scene.bounds(ctx);
    return [(b.min[0] + b.max[0]) / 2, (b.min[1] + b.max[1]) / 2, (b.min[2] + b.max[2]) / 2];
  }

  // The idle drift: the stage sways until someone reaches for it. The shape
  // of a stretch and the transitions between them are linalg-core's.
  const drift = Object.assign(LC.driftIdle(), {});
  const driftWanted = () =>
    !reduceMotion && !embed && !document.hidden && !motion.held && !glide.active && glLive() &&
    !(active.still && active.still(contextFor(active)));
  function setDrift(on) {
    if (on === drift.on) return;
    const t = performance.now();
    Object.assign(drift, on ? LC.driftStart(drift, viewOf(active.id), t) : LC.driftPause(drift, t));
  }
  const refreshDrift = () => setDrift(driftWanted());
  const dropDrift = () => { Object.assign(drift, LC.driftRelease(drift, performance.now())); };

  // Read the pose, then let go of the drift -- in that order. shownView() is
  // where a glide that has just ended hands the view back to the drift
  // (refreshDrift), seeding it from the pose *before* this gesture. Releasing
  // first and reading second restarted the drift on that stale seed, and the
  // next frame's drift pose overwrote the reader's zoom or turn. On a busy
  // machine, with no frame between a glide's end and the click, it did.
  function takeView(id) {
    const from = shownView(id);
    glide.active = false;
    return {az: from.az, el: from.el, dolly: from.dolly};
  }
  // Turning works on both surfaces: the flat twin projects through the same
  // view. Moving closer is the three.js picture's alone -- the twin is fitted
  // to the viewBox, and a twin that could be zoomed past it would be a
  // picture SVG silently stops painting.
  function orbitBy(dAz, dEl) {
    if (!active.gl || embed) return;
    const from = takeView(active.id);
    dropDrift();
    views[active.id] = LC.orbitBy(from, dAz, dEl, active.pose.limits);
    stampCam();
    if (!glLive()) paint();
  }
  function dollyBy(factor) {
    if (!glLive()) return;
    const from = takeView(active.id);
    dropDrift();
    views[active.id] = LC.orbitDolly(from, factor, active.pose.limits);
    stampCam();
  }
  function homeView() {
    if (!active.gl) return;
    const from = shownView(active.id);
    dropDrift();
    const home = active.pose.home;
    views[active.id] = LC.orbitView(home.az, home.el);
    glideTo(active.id, from.az, from.el, home.az, home.el, 600);
    stampCam();
    if (!glLive()) paint();
  }

  function stampCam() {
    if (!active.gl) { if (stage.dataset.cam) delete stage.dataset.cam; GL.stamp = ""; return; }
    const v = viewOf(active.id);
    const at = v.az.toFixed(2) + "," + v.el.toFixed(2) + "," + v.dolly.toFixed(2);
    if (GL.stamp !== at) { GL.stamp = at; stage.dataset.cam = at; }
  }

  // How far back the camera sits: far enough that the scene's own bounds,
  // seen from its home view, fit the stage at its current aspect -- the same
  // fit the twin makes -- so a slider that grows the picture moves the camera
  // back rather than cropping it.
  function fitDistance(ctx, scene) {
    const P = scene.pose;
    const b = scene.bounds(ctx);
    const target = sceneTarget(scene);
    const B = K.viewBasis(homeFramed(scene), target);
    // The exact perspective bound: a corner `z` nearer the camera than the
    // target, `u` across and `v` up, is inside the frustum when the eye is at
    // least z + |u| / tan(half-fov-x) and z + |v| / tan(half-fov-y) away.
    const I = insetOf(scene);
    const full = Math.tan(P.fov * Math.PI / 360);
    const ty = full * (1 - I.top - I.bottom), tx = full * ctx.aspect * (1 - I.left - I.right);
    const m = P.margin || 1.08;
    let dist = 0;
    for (const p of K.corners(b.min, b.max)) {
      const d = [p[0] - target[0], p[1] - target[1], p[2] - target[2]];
      const u = d[0] * B.right[0] + d[1] * B.right[1] + d[2] * B.right[2];
      const v = d[0] * B.up[0] + d[1] * B.up[1] + d[2] * B.up[2];
      const z = d[0] * B.fwd[0] + d[1] * B.fwd[1] + d[2] * B.fwd[2];
      dist = Math.max(dist, z + m * Math.abs(u) / tx, z + m * Math.abs(v) / ty);
    }
    return dist;
  }

  function applyCamera(ctx) {
    const P = active.pose;
    if (drift.on && !glide.active) {
      Object.assign(viewOf(active.id), LC.driftPose(drift, performance.now() - drift.t0, P.limits));
    }
    const target = sceneTarget(active);
    const eye = LC.orbitEye(target, fitDistance(ctx, active), framedView(active));
    const cam = ctx.gl.cam;
    cam.up.set(0, 1, 0);
    cam.position.set(eye[0], eye[1], eye[2]);
    cam.lookAt(target[0], target[1], target[2]);
    // Slide the view so the picture sits in the middle of what its inset
    // leaves free, rather than under it.
    const I = insetOf(active);
    if (I.left || I.right || I.top || I.bottom) {
      const r = stage.getBoundingClientRect();
      const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      cam.setViewOffset(w, h, (I.right - I.left) / 2 * w, (I.bottom - I.top) / 2 * h, w, h);
    }
    stampCam();
  }

  function renderGL() {
    const ctx = contextFor(active);
    if (!ctx.gl) {
      ctx.gl = active.build(ctx);
      resizeGL();
    }
    if (GL.labScene !== active.id) {
      GL.labScene = active.id;
      GL.lab.domElement.replaceChildren();
    }
    const t0 = performance.now();
    applyCamera(ctx);
    active.render(ctx, ctx.gl);
    GL.pass.scene = ctx.gl.scene;
    GL.pass.camera = ctx.gl.cam;
    GL.bloom.enabled = GL.glow && !reduceMotion && GL.budget;
    GL.composer.render();
    GL.lab.render(ctx.gl.scene, ctx.gl.cam);
    stage.dataset.gl = "composer";

    if (GL.bloom.enabled && GL.frames.length < 60) {
      GL.frames.push(performance.now() - t0);
      if (GL.frames.length === 60) {
        const med = GL.frames.slice().sort((a, b) => a - b)[30];
        if (med > 24) {
          GL.budget = false;
          $("glow").checked = false;
          GL.glow = false;
          glNote("glSlow");
        }
      }
    }
  }

  // ------------------------------------------------------ the reader's hand
  // What is under the pointer: a key the scene wrote on an SVG element
  // (data-pick), or one it maps a three.js instance to (gl.pick). Hover
  // publishes data-hover and a tip and repaints; a click that did not move
  // is a pick, and the scene turns it into control values.
  function pickAt(clientX, clientY, target) {
    const piece = target && target.closest ? target.closest("[data-pick]") : null;
    if (piece && $("hud").contains(piece)) return piece.getAttribute("data-pick");
    if (glLive()) {
      const ctx = contextFor(active);
      const gl = ctx.gl;
      if (!gl || !gl.pick || !gl.pick.length) return null;
      const r = stage.getBoundingClientRect();
      const ndc = new window.THREE.Vector2(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
      GL.ray.setFromCamera(ndc, gl.cam);
      const hits = GL.ray.intersectObjects(gl.pick.map((p) => p.mesh), false);
      if (!hits.length) return null;
      const h = hits[0];
      const p = gl.pick.find((q) => q.mesh === h.object);
      return p ? p.key(h.instanceId) : null;
    }
    return piece && svg.contains(piece) ? piece.getAttribute("data-pick") : null;
  }

  function setHover(key, clientX, clientY) {
    const tip = $("tip");
    const ctx = contextFor(active);
    const text = key && active.tip ? active.tip(ctx, key) : "";
    if (key !== hover) {
      hover = key;
      if (hover) stage.dataset.hover = hover; else delete stage.dataset.hover;
      if (!glLive()) paint();
      drawHud();
    }
    if (!text) { tip.hidden = true; return; }
    tip.textContent = text;
    tip.hidden = false;
    const r = stage.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = clientX - r.left + 14, y = clientY - r.top + 14;
    if (x + w > r.width - 6) x = clientX - r.left - w - 14;
    if (y + h > r.height - 6) y = clientY - r.top - h - 14;
    tip.style.transform = "translate(" + Math.max(4, x) + "px," + Math.max(4, y) + "px)";
  }

  function bindStage() {
    let live = null, down = null, queued = null;
    // A pointer that *moves* over the stage holds the drift; pointerenter
    // alone does not. Chromium fires enter without any movement when the
    // element under a still cursor changes -- the WebGL canvas arriving on
    // boot is one -- and a pointer resting there when the page loaded
    // entered before any listener existed. Neither is a reader reaching for
    // the view, and the stage is meant to be moving from the moment the page
    // opens; any real reader moves on the way in, so a move is the signal.
    const hovered = () => { if (!motion.over) { motion.over = true; refreshMotion(); } };
    stage.addEventListener("pointermove", hovered);
    stage.addEventListener("pointerleave", () => {
      motion.over = false; refreshMotion();
      setHover(null, 0, 0);
    });
    stage.addEventListener("focusin", () => { motion.focus = stage.matches(":focus-visible") && !!active.gl; refreshMotion(); });
    stage.addEventListener("focusout", () => { motion.focus = false; refreshMotion(); });
    document.addEventListener("visibilitychange", refreshMotion);

    stage.addEventListener("pointerdown", (e) => {
      down = {x: e.clientX, y: e.clientY, t: performance.now(), target: e.target};
      if (!active.gl) return;
      try { stage.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      live = {id: e.pointerId, x: e.clientX, y: e.clientY};
      stage.dataset.grab = "1";
    });
    stage.addEventListener("pointermove", (e) => {
      if (live && e.pointerId === live.id) {
        const dx = e.clientX - live.x, dy = e.clientY - live.y;
        live.x = e.clientX; live.y = e.clientY;
        if (Math.abs(dx) + Math.abs(dy) > 0) orbitBy(-dx * 0.008, dy * 0.005);
        return;
      }
      // Hover, throttled to one pick per frame: a raycast per pointer event
      // is several per frame on a fast mouse.
      if (!queued) {
        requestAnimationFrame(() => {
          const q = queued; queued = null;
          if (!q) return;
          setHover(pickAt(q.x, q.y, q.target), q.x, q.y);
        });
      }
      queued = {x: e.clientX, y: e.clientY, target: e.target};
    });
    const release = (e) => {
      const wasLive = live && e.pointerId === live.id;
      if (wasLive) { live = null; delete stage.dataset.grab; }
      if (!down || e.type === "pointercancel") { down = null; return; }
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      const quick = performance.now() - down.t < 400;
      const target = down.target;
      down = null;
      if (moved >= 5 || !quick || !active.pick) return;
      // Picked from where the press began: on the flat path the element under
      // a captured pointer is the stage, not the voxel.
      const key = pickAt(e.clientX, e.clientY, target);
      if (!key) return;
      dropDrift();
      active.pick(contextFor(active), key);
    };
    stage.addEventListener("pointerup", release);
    stage.addEventListener("pointercancel", release);
    stage.addEventListener("wheel", (e) => {
      if (!glLive() || e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault();
      const pixels = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? stage.clientHeight : 1);
      dollyBy(Math.exp(Math.max(-0.35, Math.min(0.35, pixels * 0.0015))));
    }, {passive: false});
    stage.addEventListener("keydown", (e) => {
      if (!active.gl || e.ctrlKey || e.metaKey || e.altKey) return;
      const d = e.shiftKey ? 0.3 : 0.1;
      const moves = {
        ArrowLeft: () => orbitBy(d, 0), ArrowRight: () => orbitBy(-d, 0),
        ArrowUp: () => orbitBy(0, -d), ArrowDown: () => orbitBy(0, d),
        "+": () => dollyBy(0.9), "=": () => dollyBy(0.9), "-": () => dollyBy(1.11),
        Home: () => homeView()
      };
      const move = moves[e.key];
      if (!move) return;
      e.preventDefault();
      motion.focus = true;
      refreshMotion();
      move();
    });
  }

  // ----------------------------------------------------------- the chrome
  function fillText() {
    let group = null;
    scenes.forEach((s) => {
      const c = s.copy[lang];
      $("k-" + s.id).textContent = c.k;
      $("h-" + s.id).textContent = c.h;
      $("con-" + s.id).innerHTML = c.concept || "";
      $("con-" + s.id).dataset.label = T.concept;
      $("body-" + s.id).innerHTML = c.b;
      $("pr-" + s.id).textContent = c.predict || "";
      const cap = document.getElementById("eqcap-" + s.id);
      if (cap) cap.textContent = c.eqcap || "";
      const np = document.getElementById("np-" + s.id);
      if (np) {
        np.parentNode.hidden = !s.code;
        $("nplab-" + s.id).textContent = T.code;
      }
      if (s.part && s.part[lang] !== group) {
        group = s.part[lang];
        const part = document.createElement("p");
        part.className = "part";
        part.textContent = group;
        $("k-" + s.id).before(part);
      }
    });
    const rail = $("rail");
    rail.setAttribute("aria-label", T.rail);
    rail.replaceChildren();
    scenes.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "stop" + (s.part && i > 0 ? " opens" : "");
      b.textContent = s.copy[lang].tab || s.id;
      b.title = s.copy[lang].h;
      b.addEventListener("click", () => goTo(i, true));
      rail.appendChild(b);
    });
  }

  const arrived = new Set();

  // The reader is now looking at this picture. Called by the scroll watcher,
  // by the bar, by a hash and by a control in a section that is not the
  // active one -- so everything expensive here is behind a change of scene.
  function showScene(scene, scroll) {
    const isNew = active !== scene;
    if (isNew) { stopPlay(); setHover(null, 0, 0); }
    active = scene;
    step = scenes.indexOf(scene);
    scenes.forEach((s, j) => $("step-" + s.id).classList.toggle("is-active", j === step));
    if (dock) dock.show("step-" + scene.id);
    Array.from($("rail").children).forEach((d, j) => {
      if (j === step) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    if (isNew && !reduceMotion && !embed) {
      stage.classList.remove("swap");
      void stage.offsetWidth;          // restart the fade if one was running
      stage.classList.add("swap");
      swapUntil = performance.now() + 280;
    }
    $("prev").disabled = step === 0;
    $("next").disabled = step === scenes.length - 1;
    $("stepnum").textContent = T.stepOf(step + 1, scenes.length);
    if (isNew) $("status").textContent = scene.copy[lang].h;

    const ctx = contextFor(scene);
    const three = !!scene.gl && !embed;
    stage.dataset.turns = three ? "1" : "0";
    $("home").hidden = !three;
    $("glow-wrap").hidden = !(three && GL.ready);
    $("hint").hidden = false;
    $("hint").textContent = three ? T.hint : T.hintFlat;
    glNote(GL.note);
    if (three) bootGL();
    if (three && GL.ready && (isNew || !arrived.has(scene.id))) {
      const v = viewOf(scene.id);
      dropDrift();
      const from = LC.orbitClamp({az: v.az - 0.3, el: v.el - 0.08, dolly: v.dolly}, scene.pose.limits);
      glideTo(scene.id, from.az, from.el, v.az, v.el, 900);
    }
    // An entrance plays the first time the reader reaches the picture, on
    // whichever surface it is drawn -- but a three.js scene waits for its
    // modules, so the entrance is not spent on a twin nobody will see again.
    const ready = !three || GL.ready || GL.note;
    if (ready && !arrived.has(scene.id) && !ctx.instant && scene.arrive) {
      arrived.add(scene.id);
      scene.arrive(ctx);
    }
    stampCam();
    changed();
    refreshMotion();
    if (scroll) {
      $("step-" + scene.id).scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "center"});
    }
  }

  const goTo = (i, scroll) =>
    showScene(scenes[Math.max(0, Math.min(scenes.length - 1, i))], scroll);

  function watchSteps() {
    let queued = false;
    const settle = () => {
      queued = false;
      const rects = scenes.map((s) => {
        const r = $("step-" + s.id).getBoundingClientRect();
        return {top: r.top, bottom: r.bottom};
      });
      const band = innerHeight / 2;
      const next = LC.pickActive(rects, band - 50, band + 50, step);
      if (next >= 0 && next !== step) showScene(scenes[next], false);
    };
    const kick = () => { if (!queued) { queued = true; requestAnimationFrame(settle); } };
    const io = new IntersectionObserver(kick, {threshold: [0, 0.25, 0.5, 0.75, 1]});
    scenes.forEach((s) => io.observe($("step-" + s.id)));
    addEventListener("scroll", kick, {passive: true});
    kick();
  }

  $("site-home").textContent = T.navHome;
  $("site-home").href = lang === "es" ? "../es/index.html" : "../index.html";
  $("site-interactive").textContent = T.navInteractive;
  $("site-interactive").href = lang === "es" ? "../es/interactive.html" : "../interactive.html";
  $("site-notebooks").textContent = T.navNotebooks;
  $("site-notebooks").href = lang === "es" ? "../es/notebooks.html" : "../notebooks.html";
  $("eyebrow").textContent = T.eyebrow;
  $("title").textContent = T.title;
  $("intro").textContent = T.intro;
  $("reset").textContent = T.reset;
  $("home").textContent = T.home;
  $("glow-label").textContent = T.glow;
  $("prev").textContent = T.prev;
  $("next").textContent = T.next;
  $("motion").textContent = reduceMotion ? T.motionOn : T.motion;
  $("motion").setAttribute("aria-pressed", String(reduceMotion));
  $("h-about").textContent = T.aboutH;
  $("about-1").textContent = T.about1;
  $("about-2").innerHTML = T.about2;
  document.title = T.title;

  if (embed) {
    const cap = $("embedcap");
    const b = document.createElement("b");
    b.textContent = T.embedCap;
    cap.appendChild(b);
  }

  $("reset").addEventListener("click", () => {
    const ctx = contextFor(active);
    stopPlay();
    if (active.reset) active.reset(ctx); else active.init(ctx);
    buildControls(active);
    homeView();
    changed();
  });
  $("home").addEventListener("click", () => homeView());
  $("prev").addEventListener("click", () => goTo(step - 1, true));
  $("next").addEventListener("click", () => goTo(step + 1, true));
  $("glow").addEventListener("change", (e) => {
    GL.glow = e.target.checked;
    if (GL.glow) {
      GL.budget = true;
      GL.frames = [];
      if (GL.note === "glSlow") glNote(null);
    }
  });
  $("motion").addEventListener("click", () => {
    motion.manual = !motion.manual;
    $("motion").setAttribute("aria-pressed", String(motion.manual));
    $("motion").textContent = motion.manual ? T.motionOn : T.motion;
    refreshMotion();
  });

  window.addEventListener("resize", () => { resizeGL(); if (!glLive()) paint(); drawHud(); });
  if (!embed) addEventListener("hashchange", () => {
    const s = byId((location.hash || "").replace("#", ""));
    if (s) showScene(s, true);
  });

  fillText();
  stage.dataset.scene = scenes[0].id;
  stage.dataset.playing = "0";
  refreshMotion();
  if (!embed) { bindStage(); bindEquations(); }

  {
    for (const s of scenes) { s.init(contextFor(s)); buildControls(s); }
    if (!embed) dock = StepDock.mount("dock", scenes.map((s) => "step-" + s.id), ".controls, .readout", "(min-width: 62.01rem)");
    const wanted = embed ? byId("codons") : byId((location.hash || "").replace("#", ""));
    showScene(wanted || scenes[0], false);
    stage.dataset.ready = "1";
    if (!embed) {
      watchSteps();
      if (wanted) $("step-" + wanted.id).scrollIntoView({block: "center"});
    }
    requestAnimationFrame(frame);
  }
})();
</script>

</body>
</html>
