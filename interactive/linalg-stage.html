<title>Projection and the SVD</title>

<!-- The vendored addons say `import ... from 'three'`, which a browser can
     only resolve with an import map, a bundler or a service worker. There is
     no bundler here, so: this map. It must be static and in <head> -- a map
     has to precede the first module resolution and there is one per document
     -- but it fetches nothing on its own, so the lazy boot below still holds
     and embed mode never pulls three.js at all. See vendor/README.md. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three-0.169.0.module.min.js",
    "three/addons/": "./vendor/three-0.169.0/examples/jsm/"
  }
}
</script>

<link rel="stylesheet" href="widget-chrome.css">
<style>
  /* Computer Modern, vendored (vendor/README.md), for the stage's labels
     only: the look this stage takes is a Manim frame, and its type is most
     of the look. Never from a CDN -- the browser check aborts every
     off-origin request, so a CDN font would silently test as Times. */
  @font-face {
    font-family: "CMU Serif";
    src: url("vendor/cmu-serif/cmu-serif-500-roman.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "CMU Serif";
    src: url("vendor/cmu-serif/cmu-serif-500-italic.woff2") format("woff2");
    font-weight: 500; font-style: italic; font-display: swap;
  }

  /* The surfaces, type and frame are widget-chrome.css; this page owns its
     accent and everything on the stage. */
  :root {
    /* Sections 07 and 09 share this widget. Its centre of gravity is
       conditioning and the SVD, which is 09, but 07 is where the projection
       is taught and comes first, so the accent is 07's teal
       (gen_notebooks.ACCENTS[7] = #0d9488). That hex is 3.6:1 on this
       background and so never appears as text: each theme takes the nearest
       shade that clears 4.5:1, exactly as the image tensor visualizer does with
       section 04's green. The surface to tune against is --sunk rather than
       --bg -- the readout sits on it, and it is the darkest of the three --
       which is what moved this from #0f766e (4.4:1 on --sunk, and axe caught
       it) to a shade that clears 5.1 there and 5.8 on the page. */
    --accent: #0e6b63;
    --on-accent: #ffffff;

    /* --stage, --stage-chip, --stage-ink and --stage-mute are shared, in
       widget-chrome.css: every stage is the same black picture frame, and
       two copies of four tokens had already been written out twice. */
    --stage-serif: "CMU Serif", "Latin Modern Roman", "Times New Roman", Times, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="navy"]) {
      --accent: #2dd4bf;
      --on-accent: #1c1917;
    }
  }
  /* On the homepage hero's navy band. */
  :root[data-theme="navy"] {
    --accent: #5eead4;
    --on-accent: #06202f;
  }

  /* The roles this stage's pictures use, over the shared stage ink. The
     hues are Manim's, one role each: yellow is the vector the reader holds,
     purple is where the matrix sends it. Measured against the stage's black
     chip, they run from 10 to 18:1. */
  :root {
    --v-y: #ffd84d;      /* the input: y, x, the reader's vector */
    --v-out: #c39bd3;    /* the output: A x, M x */
    --v-yhat: #58c4dd;   /* the projection, the left singular vectors */
    --v-res: #fc6c85;    /* the residual, and anything that has gone wrong */
    --v-basis: #83c167;  /* the columns of X, the right singular vectors, eigenvectors */
  }

  /* align-items:start is load-bearing. The grid default stretches the item to
     full height, and position:sticky then has nothing left to stick to --
     which is the quietest way a two-pane scrolling layout fails. */
  .two-pane {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr);
    gap: 1.75rem;
    align-items: start;
    margin-top: 1.5rem;
  }
  .steps { min-width: 0; }
  .stagewrap { position: sticky; top: 1.5rem; min-width: 0; }

  @media (max-width: 56rem) {
    .two-pane { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
    .stagewrap { top: 0; z-index: 2; padding-bottom: 0.5rem; background: var(--bg); }
    #stage { height: 44vh; }
  }

  #stage {
    position: relative;
    height: min(68vh, 44rem);
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }
  #stage[data-grab] { cursor: grabbing; }
  /* The hero is a still frame, and bindStage() is never called there. */
  html.embed #stage { cursor: default; }
  #stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #stage canvas, #stage svg { display: block; width: 100%; height: 100%; }
  #flat { position: absolute; inset: 0; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  /* An opaque chip, not a translucent one: axe cannot resolve contrast against
     a see-through background over a <canvas> and reports "incomplete", which
     is neither a pass nor a check. Opaque gives it two colours to compare --
     and on a black stage the black chip is not there to see. */
  .lab {
    position: absolute; transform: translate(-50%, -50%);
    font: italic 500 17px/1 var(--stage-serif); letter-spacing: 0.01em;
    color: var(--stage-ink); background: var(--stage-chip);
    padding: 2px 5px; border-radius: 3px; white-space: nowrap;
  }
  /* A column vector between brackets, the way the frame this look comes from
     writes "Input" and "Output" beside its arrows. The brackets are borders
     with corner ticks rather than glyphs, which no two fonts draw at one
     height. Numbers upright; the caption upright and small. */
  .mat-lab { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 6px; }
  .mat-cap { font-style: normal; font-size: 14px; }
  .mat-box { position: relative; display: inline-block; padding: 3px 9px; }
  .mat-box::before, .mat-box::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 5px;
    border: 1.5px solid currentColor;
  }
  .mat-box::before { left: 0; border-right: 0; }
  .mat-box::after { right: 0; border-left: 0; }
  .mat-col { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-style: normal; font-size: 15px; line-height: 1.15; }
  /* The two viewports the SVD portal renders into, named. The flat path draws
     the same furniture inside its SVG. */
  #panes { position: absolute; inset: 0; pointer-events: none; }
  .pane-rule {
    position: absolute; left: 50%; top: 8%; bottom: 8%; width: 1px;
    background: var(--stage-mute); opacity: 0.25;
  }
  .pane-cap {
    position: absolute; bottom: 5%; transform: translateX(-50%);
    font: italic 500 0.95rem/1 var(--stage-serif); color: var(--stage-mute);
  }
  #cap-in { left: 25%; }
  #cap-out { left: 75%; }

  /* The title card: the step's claim, as a line of maths in the frame's own
     serif, top left. The note is the running commentary, top right, small. */
  #stagetitle {
    position: absolute; left: 1rem; top: 0.75rem; margin: 0; max-width: 58%;
    font: italic 500 1.35rem/1.25 var(--stage-serif); color: var(--stage-ink);
    letter-spacing: 0.01em; pointer-events: none; overflow-wrap: break-word;
  }
  #stagenote {
    position: absolute; right: 0.9rem; top: 0.85rem; margin: 0; max-width: 38%;
    text-align: right;
    font: 500 0.8rem/1.35 var(--sans); color: var(--stage-mute);
    pointer-events: none; overflow-wrap: break-word;
  }
  @media (prefers-reduced-motion: no-preference) {
    #stagetitle { animation: title-in 500ms ease-out; }
    @keyframes title-in { from { opacity: 0; transform: translateY(-4px); } }
  }

  /* Step 7's failure, on the stage. It is written by the arithmetic -- the
     values in it are the ones the readout computed -- and shown only while
     data-f32 says the two columns rounded together. */
  #fault {
    position: absolute; left: 50%; bottom: 25%; transform: translateX(-50%);
    margin: 0; padding: 0.55rem 0.9rem; border: 1px solid var(--v-res);
    border-radius: 6px; background: var(--stage-chip); color: var(--v-res);
    font: 600 0.9rem/1.5 var(--mono); white-space: pre; pointer-events: none;
    max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  #fault[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    #fault { animation: fault-in 240ms ease-out; }
    @keyframes fault-in { from { opacity: 0; transform: translate(-50%, 6px); } }
  }

  #comparison {
    position: absolute; left: 1rem; right: 1rem; bottom: 0.8rem;
    padding: 0.6rem 0.8rem; background: var(--stage-chip);
    border: 1px solid var(--stage-mute); border-radius: 6px;
    color: var(--stage-ink); font: 500 0.85rem/1.5 var(--sans);
    pointer-events: none;
  }
  #comparison[hidden] { display: none; }
  .coefficient { display: grid; grid-template-columns: 3rem 1fr 5rem; gap: 0.5rem; align-items: center; }
  .coefficient-track { position: relative; height: 0.65rem; background: #202020; }
  .coefficient-track::after { content: ""; position: absolute; left: 50%; height: 100%; border-left: 1px solid var(--stage-ink); }
  .coefficient-bar { position: absolute; height: 100%; }
  #gesture-hint { max-width: 48rem; }
  html.embed #gesture-hint { display: none; }

  #stepnum { font: 600 0.85rem/1 var(--sans); color: var(--ink-mute); }
  /* Eight marks, one per step: the structure of the page at a glance, and a
     way to jump. The live one is filled; the rest are rings. */
  #dots { display: inline-flex; gap: 0.35rem; align-items: center; }
  .stagebar .dot {
    width: 0.8rem; height: 0.8rem; padding: 0; border-radius: 50%;
    border: 2px solid var(--ink-mute); background: transparent; cursor: pointer;
  }
  .stagebar .dot:hover { border-color: var(--accent); }
  .stagebar .dot[aria-current="step"] { background: var(--accent); border-color: var(--accent); }

  .step {
    min-height: 82vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 1rem 0;
  }
  .step .anchor { display: block; height: 0; }
  .step h2 { font-size: 1.2rem; font-weight: 650; margin: 0 0 0.2rem; }
  /* The heading of the group a scene opens (what least squares draws, what
     the SVD says, where the arithmetic fails): the page's structure is three
     ideas meeting, not eight numbered steps. */
  .step .part { font: 600 0.8rem/1.3 var(--sans); color: var(--ink-mute); border-top: 1px solid var(--line); padding-top: 0.6rem; margin: 0 0 0.9rem; max-width: 36rem; }
  .step .kicker { margin-bottom: 0.5rem; }
  .step p { max-width: 36rem; overflow-wrap: break-word; }
  /* The concept box and the predict-first line are widget-chrome.css; the
     concept's label is written by fillText() in the page's language. */
  .step .concept .cite { color: var(--ink-mute); font-size: 0.85em; white-space: nowrap; }
  .ctl label .live {
    float: right; font-family: var(--mono); font-weight: 500; color: var(--ink-mute);
  }
  .step.is-active h2 { color: var(--accent); }

  .ctl { margin: 1rem 0 0.4rem; max-width: 34rem; }
  .ctl.presets { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .ctl + .ctl { margin-top: 0.5rem; }
  .ctl label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem; }
  .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  /* Three sliders in a row, for the three singular values. */
  .ctl.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; }
  .ctl.row label { font-family: var(--mono); font-weight: 500; }
  .readout {
    margin: 0.7rem 0 0; padding: 0.7rem 0.85rem;
    background: var(--sunk); border: 1px solid var(--line); border-radius: 8px;
    font: 500 0.9rem/1.6 var(--sans); color: var(--ink);
    white-space: pre-wrap;
    overflow-x: auto;
  }
  /* A sentence with numbers in it: the numbers are set in the mono, and the
     one the slider changed is the accent. */
  .readout code { font: 500 0.85em/1 var(--mono); }
  .readout b { color: var(--accent); font-family: var(--mono); font-size: 0.85em; }
  .readout i { color: var(--fault); font-style: normal; font-weight: 600; }

  /* Matrices as inline SVG rather than a table: see LinalgKit.drawMatrixSvg. */
  .mat { display: block; width: 100%; max-width: 15rem; margin: 0.8rem 0; }
  .mat text { font: 500 13px var(--mono); fill: var(--ink); }
  .mat path { stroke: var(--ink-mute); stroke-width: 1.4; fill: none; }

  /* Embed mode: the stage alone on the hero's navy, no three.js, one caption.
     The SVD portal's still frame is an SVG, so the 330px card stays legible
     and cannot overflow. The chrome that goes is in widget-chrome.css. */
  html.embed .steps, html.embed .stagebar, html.embed #glnote { display: none; }
  /* The running note sits top right of a stage that is normally twice this
     wide; in a hero card it wraps back across the input pane's y axis. The
     caption under the frame says the same thing, so the note goes. */
  html.embed #stagenote { display: none; }
  html.embed .two-pane { display: block; margin: 0; }
  html.embed .stagewrap { position: static; display: flex; flex-direction: column; height: 100vh; }
  html.embed #stage { flex: 1 1 auto; min-height: 0; height: auto; border: 0; border-radius: 0; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <nav class="site-nav" aria-label="Site">
      <a class="site-home" id="site-home" href="../index.html">← Workshop home</a>

  <div class="two-pane">

    <!-- One section per scene, in step order. Each carries its own controls;

         EN/ES tables (linalg-scenes/*.js). -->
    <div class="steps" id="steps">

      <section class="step" id="step-1" aria-labelledby="h-1">

        <p class="kicker" id="k-1"></p>
        <h2 id="h-1"></h2>
        <p class="concept" id="con-1"></p>
        <div id="body-1"></div>
        <svg class="mat" id="mat-1" viewBox="0 0 200 84" role="img" aria-labelledby="mat-1-t">

        </svg>
        <p class="predict" id="pr-1"></p>
        <div class="ctl">
          <label for="tilt" id="tilt-label"></label>
          <input type="range" autocomplete="off" id="tilt" min="0" max="600" value="400" step="5">
        </div>
        <p class="readout" id="read-1"></p>
      </section>

      <section class="step" id="step-2" aria-labelledby="h-2">
        <span class="anchor" id="wide"></span>
        <p class="kicker" id="k-2"></p>
        <h2 id="h-2"></h2>
        <p class="concept" id="con-2"></p>
        <div id="body-2"></div>
        <svg class="mat" id="mat-2" viewBox="0 0 200 84" role="img" aria-labelledby="mat-2-t">
          <title id="mat-2-t"></title>
        </svg>
        <p class="predict" id="pr-2"></p>
        <div class="ctl">
          <label for="sphere" id="sphere-label"></label>

      <section class="step" id="step-3" aria-labelledby="h-3">

        <h2 id="h-3"></h2>
        <p class="concept" id="con-3"></p>
        <div id="body-3"></div>
        <p class="predict" id="pr-3"></p>

      <section class="step" id="step-5" aria-labelledby="h-5">

    <p class="fallback" id="glnote" hidden></p>
  </aside>

</div>

<!-- The arithmetic, the drawing kit, then one file per scene in step order.
     All plain scripts, so the page works from file:// and Node can pin the
     core under `npm test`. The vendored three.js and its addons
     (vendor/linalg-boot.js) are injected by bootGL() below rather than
     written here, so embed mode -- the hero -- never fetches them. -->
<script src="linalg-core.js"></script>
<script src="linalg-kit.js"></script>
<script src="linalg-scenes/projection.js"></script>
<script src="linalg-scenes/wide.js"></script>
<script src="linalg-scenes/collapse.js"></script>
<script src="linalg-scenes/portal.js"></script>
<script src="linalg-scenes/ellipsoid.js"></script>
<script src="linalg-scenes/eigen.js"></script>
<script src="linalg-scenes/collinear.js"></script>
<script src="linalg-scenes/precision.js"></script>
<script>
(function () {
  "use strict";

  const LC = window.LinalgCore;
  const K = window.LinalgKit;

  // ─── copy ─────────────────────────────────────────────────────────────────
  //
  // The page's own. Each step's is in its scene file, beside the picture it
  // describes, in both languages.

  const EN = {
    title: "Projection and the SVD",
    navHome: "← Workshop home",
    navInteractive: "Interactive",
    navNotebooks: "Notebooks",
    eyebrow: "Sections 07, 08 and 09 · projection and the SVD",
    lead: "This page is eight pictures of one problem: solving A x = b, or fitting y ≈ X β, when the matrix is not a well-behaved square. They are separate ideas that meet in that problem, in three groups. First, what least squares draws: a tall matrix cannot reach every target, a wide one reaches it in too many ways, and a square one can flatten a dimension on the way, which is where projection, the pseudoinverse and the determinant come from. Then, what the SVD says: what any matrix does to a circle and a sphere, and the directions a square matrix leaves alone. Last, where the arithmetic fails: predictors that nearly agree, and a number format that cannot tell them apart. Each picture says what is on the stage, then asks you to predict before you touch a control; the box under the controls is the answer, with the numbers in it.",
    prev: "◀ Back", next: "Next ▶",
    stepOf: (i, n) => `${i} of ${n}`,
    stepName: (i, n, h) => `${i} of ${n}: ${h}`,
    reset: "Reset example", pause: "Pause motion", resume: "Resume motion",
    hint: "Drag to rotate · scroll to zoom · + / − keys · hover to pause. Scroll beside the frame to move between pictures.",
    home: "Home view", glow: "Glow",
    zoomIn: "Zoom in", zoomOut: "Zoom out",
    aboutH: "About this page",
    about1: "Every number on this page is computed in the browser from the matrices shown — the projection, the singular values, the condition number, the eigenvectors, the float32 rounding. Nothing is drawn to a stored answer, and nothing lights up because it was listed.",
    about2: "It accompanies section 07 (inverses and the pseudoinverse), section 08 (eigenvectors, by power iteration) and section 09 (matrix factorizations). Each picture has its own address — #projection, #wide, #collapse, #portal, #ellipsoid, #eigen, #collinear, #precision — and the notebooks link to the one they are teaching. The concept line under each heading states the definition the way chapter 2 of Goodfellow, Bengio and Courville's <a href='https://www.deeplearningbook.org/contents/linear_algebra.html'>Deep Learning</a> does, with its section number (§4.1 and §4.2 for the two failure pictures), so the stage and the workshop's pre-work can be read together.",
    concept: "Concept",
    glNoScript: "Three-dimensional view unavailable, so the stage is drawing flat diagrams instead. Every number and every relationship is the same.",
    glNoWebgl: "This browser reports no WebGL, so the stage is drawing flat diagrams instead. Every number and every relationship is the same.",
    glSlow: "Glow is off: this device was not keeping up with it. Re-tick the box to try again.",
    embedCap: "Right singular vectors in, left singular vectors out.",
    // Appended to whichever scene is on the stage, and only where the stage can
    // actually be taken hold of: the hero embeds this page as a still frame and
    // binds nothing, so a label promising a drag there would be a lie.
    turn: "Drag or use arrow keys to rotate; scroll or use plus and minus to zoom. Hover pauses motion."
  };

  const ES = {
    title: "Proyección y la SVD",
    navHome: "← Inicio del taller",
    navInteractive: "Interactivo",
    navNotebooks: "Cuadernos",
    eyebrow: "Secciones 07, 08 y 09 · proyección y la SVD",
    lead: "Esta página son ocho imágenes de un mismo problema: resolver A x = b, o ajustar y ≈ X β, cuando la matriz no es un cuadrado bien portado. Son ideas distintas que se encuentran en ese problema, en tres grupos. Primero, lo que dibujan los mínimos cuadrados: una matriz alta no alcanza cualquier objetivo, una ancha lo alcanza de demasiadas maneras, y una cuadrada puede aplastar una dimensión por el camino, que es de donde salen la proyección, la pseudoinversa y el determinante. Después, lo que dice la SVD: qué le hace cualquier matriz a una circunferencia y a una esfera, y qué direcciones deja en paz una matriz cuadrada. Por último, dónde falla la aritmética: predictores que casi coinciden y un formato numérico que no los distingue. Cada imagen dice qué hay en el escenario y luego te pide una predicción antes de tocar un control; la caja bajo los controles es la respuesta, con los números dentro.",
    prev: "◀ Atrás", next: "Siguiente ▶",
    stepOf: (i, n) => `${i} de ${n}`,
    stepName: (i, n, h) => `${i} de ${n}: ${h}`,
    reset: "Reiniciar ejemplo", pause: "Pausar movimiento", resume: "Reanudar movimiento",
    hint: "Arrastra para girar · rueda para acercar · teclas + / − · pasa el cursor para pausar. Desplázate junto al marco para cambiar de imagen.",
    home: "Vista inicial", glow: "Brillo",
    zoomIn: "Acercar", zoomOut: "Alejar",
    aboutH: "Sobre esta página",
    about1: "Cada número de esta página se calcula en el navegador a partir de las matrices que se muestran: la proyección, los valores singulares, el número de condición, los autovectores, el redondeo a float32. Nada se dibuja sobre una respuesta guardada, y nada se ilumina por estar en una lista.",
    about2: "Acompaña a la sección 07 (inversas y pseudoinversa), a la 08 (autovectores, por iteración de potencias) y a la 09 (factorizaciones matriciales). Cada imagen tiene su propia dirección (#projection, #wide, #collapse, #portal, #ellipsoid, #eigen, #collinear, #precision) y los cuadernos enlazan al que están enseñando. La línea de concepto bajo cada título enuncia la definición como lo hace el capítulo 2 de <a href='https://www.deeplearningbook.org/contents/linear_algebra.html'>Deep Learning</a>, de Goodfellow, Bengio y Courville, con su número de sección (§4.1 y §4.2 para las dos imágenes de fallo), para que el escenario y el trabajo previo del taller se lean juntos.",
    concept: "Concepto",
    glNoScript: "La vista tridimensional no está disponible, así que el escenario dibuja diagramas planos. Todos los números y todas las relaciones son los mismos.",
    glNoWebgl: "Este navegador no reporta WebGL, así que el escenario dibuja diagramas planos. Todos los números y todas las relaciones son los mismos.",
    glSlow: "El brillo está desactivado: este dispositivo no iba al ritmo. Vuelve a marcar la casilla para intentarlo otra vez.",
    embedCap: "Entran vectores singulares derechos, salen izquierdos.",
    turn: "Arrastra o usa las flechas para girar; usa la rueda o más y menos para acercar. El cursor pausa el movimiento."
  };

  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "es" ? "es" : "en";
  const embed = params.get("embed") === "1";
  const theme = params.get("theme");
  const T = lang === "es" ? ES : EN;
  document.documentElement.lang = lang;
  document.title = T.title;
  if (embed) document.documentElement.classList.add("embed");
  if (theme === "navy") document.documentElement.dataset.theme = "navy";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = (id) => document.getElementById(id);
  const css = K.css;

  // ─── the steps ────────────────────────────────────────────────────────────
  //
  // One per registered scene, in registration order, which is the order of
  // the <script src> lines above. A scene's step number, section and camera
  // pose all come from the scene; the page adds nothing a scene did not say.
  const SCENES = window.LinalgScenes.list();
  const BY_ID = {};
  SCENES.forEach((s) => { BY_ID[s.id] = s; });
  const turnable = (text) => (embed ? text : text + " " + T.turn);
  const STEPS = SCENES.map((s) => ({id: s.step, el: s.section, scene: s.id,
                                    aria: () => turnable(s.copy[lang].aria)}));
  const POSE = {};
  SCENES.forEach((s) => { POSE[s.id] = s.pose; });

  const state = {
    step: 0,
    glow: true,
    mode: "flat",    // "flat" (svg) or "gl"
    // Where each scene is being looked at from. One pair of angles per scene,
    // kept while the reader is away from it, and the truth about the camera:
    // the drift seeds itself from here and the browser check reads it off the
    // stage. What is *drawn* may be an eased version of it -- see shownView().
    views: {}
  };
  SCENES.forEach((s) => { state.views[s.id] = LC.orbitView(s.pose.home.az, s.pose.home.el); });

  // A shared animation clock freezes entrances, tweens and camera glides
  // together. Resume continues from the held frame, without a wall-time jump.
  const motion = {held: false, manual: false, offset: 0, since: 0};
  const sceneNow = () => (motion.held ? motion.since : performance.now()) - motion.offset;
  function refreshMotion() {
    const hold = motion.manual || drift.hover || drift.focus || document.hidden;
    const now = performance.now();
    if (hold && !motion.held) motion.since = now;
    if (!hold && motion.held) motion.offset += now - motion.since;
    motion.held = hold;
    $("stage").dataset.paused = String(hold);
    refreshDrift();
  }

  // What a scene is handed, once, and keeps. The page owns the clock, the
  // DOM, the composer and the CSS2D layers; a scene owns its objects.
  const CTX = {};
  SCENES.forEach((s) => {
    CTX[s.id] = {
      LC, K, $, css, lang, reduceMotion, embed,
      now: sceneNow,
      get instant() { return reduceMotion || motion.held || state.mode !== "gl"; },
      T: s.copy[lang],
      state: {},
      flat: $("flat"), stage: $("stage"),
      get THREE() { return window.THREE; },
      get AD() { return window.THREE_ADDONS; },
      stageColour: () => STAGE.target,
      shownView: () => shownView(s.id),
      viewBasis: () => viewBasis(s.id),
      place: (list) => K.placeLabels(list, $("stage"), $("flat"), $("labels")),
      setControls: (values) => {
        for (const [id, value] of Object.entries(values)) {
          $(id).value = String(value);
          $(id).dispatchEvent(new Event("input", {bubbles: true}));
        }
      },
      // A control moved. The GL path repaints on its own; the flat one draws
      // when it is told to; the readout is rewritten either way.
      changed: () => { if (state.mode !== "gl") draw(); else readouts(); }
    };
    // A control tied to what it moves: see LinalgKit.bindSlider.
    CTX[s.id].bindSlider = (id, opts) => K.bindSlider(CTX[s.id], id, opts);
  });

  // ─── text ─────────────────────────────────────────────────────────────────

  function fillText() {
    $("title").textContent = T.title;
    $("site-home").textContent = T.navHome;
    $("site-home").href = lang === "es" ? "../es/index.html" : "../index.html";
    $("site-interactive").textContent = T.navInteractive;
    $("site-interactive").href = lang === "es" ? "../es/interactive.html" : "../interactive.html";
    $("site-notebooks").textContent = T.navNotebooks;
    $("site-notebooks").href = lang === "es" ? "../es/notebooks.html" : "../notebooks.html";
    $("eyebrow").textContent = T.eyebrow;
    $("lead").textContent = T.lead;
    $("prev").textContent = T.prev;
    $("next").textContent = T.next;
    $("glow-label").textContent = T.glow;
    $("home").textContent = T.home;
    $("reset").textContent = T.reset;
    $("motion").textContent = T.pause;
    $("gesture-hint").textContent = T.hint;
    $("zoom-in").textContent = T.zoomIn;
    $("zoom-out").textContent = T.zoomOut;
    $("h-about").textContent = T.aboutH;
    $("about-1").textContent = T.about1;
    $("about-2").innerHTML = T.about2;

    for (const s of SCENES) {
      const c = s.copy[lang];
      $("k-" + s.step).textContent = c.k;
      if (s.part) {
        // The scene opens one of the three groups: its heading goes above the kicker.
        const part = document.createElement("p");
        part.className = "part";
        part.textContent = s.part[lang];
        $("k-" + s.step).before(part);
      }
      $("h-" + s.step).textContent = c.h;
      $("con-" + s.step).innerHTML = c.concept || "";
      $("con-" + s.step).dataset.label = T.concept;
      $("body-" + s.step).innerHTML = c.b;
      $("pr-" + s.step).textContent = c.predict || "";
      for (const id in (c.controls || {})) $(id + "-label").textContent = c.controls[id];
      for (const id in (c.buttons || {})) $(id).textContent = c.buttons[id];
      if (s.presets) {
        const group = document.createElement("div");
        group.className = "ctl presets";
        for (const preset of s.presets) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = preset[lang];
          button.addEventListener("click", () => CTX[s.id].setControls(preset.values()));
          group.appendChild(button);
        }
        $("read-" + s.step).before(group);
      }
      const mt = $("mat-" + s.step + "-t");
      if (mt && c.matTitle) mt.textContent = c.matTitle;
    }
    // One mark per step, in the bar.
    const dots = $("dots");
    dots.replaceChildren();
    SCENES.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "dot";
      b.setAttribute("aria-label", T.stepName(i + 1, SCENES.length, s.copy[lang].h));
      b.addEventListener("click", () => setStep(i, true));
      dots.appendChild(b);
    });
  }

  // ─── where each scene is looked at from ───────────────────────────────────
  //
  // Every scene orbits from the same two angles about the same world up, so
  // nothing on the stage ever rolls. What differs is how far each may be
  // turned, which its pose's limits say.

  // A scene turning into place after a step change, and a reader pressing Home.
  // The tween is linalg-core's, retargeted rather than restarted, so scrolling
  // quickly through the steps does not make the stage jump backwards.
  const glide = {active: false, scene: null, az: null, el: null};

  function glideTo(scene, fromAz, fromEl, toAz, toEl, ms) {
    // Nothing eases in the flat path: it draws when it is told to rather than
    // every frame, so a tween there would stop wherever the last draw left it.
    if (reduceMotion || motion.held || state.mode !== "gl") { glide.active = false; return; }
    const now = sceneNow();
    if (glide.active && glide.scene === scene) {
      glide.az = LC.retarget(glide.az, toAz, now, ms);
      glide.el = LC.retarget(glide.el, toEl, now, ms);
    } else {
      glide.az = LC.tweenStart(fromAz, toAz, now, ms);
      glide.el = LC.tweenStart(fromEl, toEl, now, ms);
    }
    glide.scene = scene;
    glide.active = true;
  }

  // The camera the stage is showing: the stored view, or the eased one while a
  // scene is turning into place.
  function shownView(scene) {
    const v = state.views[scene];
    if (!glide.active || glide.scene !== scene) return v;
    const now = sceneNow();
    const a = LC.tweenAt(glide.az, now), e = LC.tweenAt(glide.el, now);
    // The glide holds the drift off while it runs, so the frame it ends on is
    // the frame that has to offer the drift back.
    if (a.done && e.done) { glide.active = false; refreshDrift(); return v; }
    return {az: a.value, el: e.value, dolly: v.dolly};
  }

  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1],
                           a[2] * b[0] - a[0] * b[2],
                           a[0] * b[1] - a[1] * b[0]];
  const unit = (a) => LC.scale(a, 1 / (LC.norm(a) || 1));

  // An orthonormal screen basis for the flat path, derived from the same view
  // the GL camera takes. Orthographic rather than perspective: what the
  // fallback loses is the foreshortening, not the orbit.
  function viewBasis(scene) {
    const P = POSE[scene];
    const fwd = LC.orbitDir(shownView(scene));
    let right = cross(LC.UP, fwd);
    if (LC.norm(right) < 1e-6) right = [1, 0, 0];
    right = unit(right);
    return {right: right, up: cross(fwd, right), target: P.target};
  }

  // ─── the reader's hand on the stage ───────────────────────────────────────
  //
  // The stage sways until someone reaches for it, and is theirs the moment they
  // do -- the same bargain the image tensor visualizer strikes, gated the same way.
  // linalg-core owns the shape of a stretch of drift and the transitions
  // between them; everything here is the clock, the pointer and the flags
  // that hold it off.
  const drift = Object.assign(LC.driftIdle(), {hover: false, focus: false, timer: 0});

  function driftWanted() {
    return !reduceMotion && !embed && !document.hidden &&
           !motion.held && !drift.hover && !drift.focus && !glide.active &&
           state.mode === "gl" && GL.ready;
  }
  function setDrift(on) {
    clearTimeout(drift.timer);
    if (on === drift.on) return;
    const now = performance.now();
    Object.assign(drift, on
      ? LC.driftStart(drift, state.views[STEPS[state.step].scene], now)
      : LC.driftPause(drift, now));
  }
  const refreshDrift = () => setDrift(driftWanted());
  // Taking hold of the view is a release rather than a pause: a drag, a key
  // or a dolly is the reader choosing the origin the next stretch belongs
  // around. A pointer merely crossing the stage is not.
  const dropDrift = () => {
    clearTimeout(drift.timer);
    Object.assign(drift, LC.driftRelease(drift, performance.now()));
  };

  // Taking hold of the stage ends whatever was easing it, and the delta is
  // applied to the pose the reader can *see*.
  function takeView(scene) {
    const from = shownView(scene);
    glide.active = false;
    return {az: from.az, el: from.el, dolly: from.dolly};
  }
  function orbitBy(dAz, dEl) {
    const scene = STEPS[state.step].scene;
    dropDrift();
    state.views[scene] = LC.orbitBy(takeView(scene), dAz, dEl, POSE[scene].limits);
    afterView(scene);
  }
  function dollyBy(factor) {
    const scene = STEPS[state.step].scene;
    dropDrift();
    state.views[scene] = LC.orbitDolly(takeView(scene), factor, POSE[scene].limits);
    afterView(scene);
  }
  function homeView() {
    const scene = STEPS[state.step].scene;
    dropDrift();
    const from = shownView(scene);
    const home = POSE[scene].home;
    state.views[scene] = LC.orbitView(home.az, home.el);
    glideTo(scene, from.az, from.el, home.az, home.el, 600);
    afterView(scene);
  }
  // The GL path repaints every frame on its own; the flat one draws when it is
  // told to, and stamps the pose for the browser check either way.
  function afterView(scene) {
    if (state.mode === "gl" && GL.ready) stampCam(scene); else draw();
  }

  function bindStage() {
    const stage = $("stage");
    let live = null;
    // pointerenter and pointerleave, not over/out: the label chips and the
    // CSS2D layers are children of #stage, and being over one of them is still
    // being on the stage.
    stage.addEventListener("pointerenter", () => { drift.hover = true; refreshMotion(); });
    stage.addEventListener("pointerleave", () => {
      drift.hover = false;
      refreshMotion();
    });
    // :focus-visible rather than :focus: a click focuses the stage too, and
    // keying off plain focus would kill the drift for the rest of the visit
    // the first time anyone clicked it.
    stage.addEventListener("focusin", () => {
      drift.focus = stage.matches(":focus-visible");
      refreshMotion();
    });
    stage.addEventListener("focusout", () => {
      drift.focus = false;
      refreshMotion();
    });
    document.addEventListener("visibilitychange", refreshMotion);

    stage.addEventListener("pointerdown", (e) => {
      try { stage.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      live = {id: e.pointerId, x: e.clientX, y: e.clientY};
      stage.dataset.grab = "1";
    });
    stage.addEventListener("pointermove", (e) => {
      if (!live || e.pointerId !== live.id) return;
      const dx = e.clientX - live.x, dy = e.clientY - live.y;
      live.x = e.clientX;
      live.y = e.clientY;
      // The scene follows the hand: drag right and it turns right.
      orbitBy(-dx * 0.008, dy * 0.005);
    });
    const release = (e) => {
      if (!live || e.pointerId !== live.id) return;
      live = null;
      delete stage.dataset.grab;
    };
    stage.addEventListener("pointerup", release);
    stage.addEventListener("pointercancel", release);

    // The frame owns plain wheel zoom; modifiers retain browser page zoom.
    stage.addEventListener("wheel", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault();
      const pixels = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? stage.clientHeight : 1);
      dollyBy(Math.exp(Math.max(-0.35, Math.min(0.35, pixels * 0.0015))));
    }, {passive: false});

    stage.addEventListener("keydown", (e) => {
      // Ctrl, command and alt belong to the browser. Shift is ours: the
      // coarse step.
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const step = e.shiftKey ? 0.3 : 0.1;
      const moves = {
        ArrowLeft: () => orbitBy(step, 0),
        ArrowRight: () => orbitBy(-step, 0),
        ArrowUp: () => orbitBy(0, -step),
        ArrowDown: () => orbitBy(0, step),
        "+": () => dollyBy(0.9),
        "=": () => dollyBy(0.9),
        "-": () => dollyBy(1.11),
        Home: () => homeView()
      };
      const move = moves[e.key];
      if (!move) return;
      e.preventDefault();
      // Driving the view from the keyboard is the same claim on it as a drag,
      // however the focus arrived: hold the drift until the stage is left.
      drift.focus = true;
      refreshMotion();
      move();
    });
  }

  // ─── the three.js stage ───────────────────────────────────────────────────

  const GL = {ready: false, composer: null, bloom: null, frames: [], budget: true, built: {}};

  // The stage's own black, in each of the two spaces this widget clears in:
  // getUnlitUniformColorSpace() clears a bound render target in the working
  // (linear) space and the canvas in the output (sRGB) one, and this widget
  // uses both -- the composer for the solid scenes, a direct two-viewport
  // render for the portal. So the clear colour is set per path. Filled by
  // initGL(): this script is classic and runs before the vendored module has
  // put THREE on the window.
  const STAGE = {target: null, canvas: null};

  function initGL() {
    const canvas = $("gl");
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true, alpha: false});
    } catch (e) { return false; }
    if (!renderer || !renderer.getContext()) return false;

    STAGE.canvas = new THREE.Color(css("--stage"));
    STAGE.target = STAGE.canvas.clone().convertSRGBToLinear();

    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setClearColor(STAGE.canvas, 1);   // reset per path in renderGL()
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    GL.renderer = renderer;

    const AD = window.THREE_ADDONS;
    // One CSS2D layer per viewport. The portal draws two viewports out of one
    // renderer, and a CSS2D layer maps a whole camera onto a whole element --
    // so the split needs two, each sized and placed over its own half.
    GL.lab = [new AD.CSS2DRenderer(), new AD.CSS2DRenderer()];
    for (const l of GL.lab) {
      l.domElement.style.position = "absolute";
      l.domElement.style.top = "0";
      l.domElement.style.pointerEvents = "none";
      $("stage").appendChild(l.domElement);
    }

    for (const s of SCENES) GL.built[s.id] = s.build(CTX[s.id]);

    // One composer, one render pass, re-pointed at whichever scene is on the
    // stage: RenderPass keeps `scene` and `camera` as plain fields for
    // exactly this.
    const first = SCENES.find((s) => GL.built[s.id].composer);
    const composer = new AD.EffectComposer(renderer);
    GL.pass = new AD.RenderPass(GL.built[first.id].scene, GL.built[first.id].cam);
    composer.addPass(GL.pass);
    // Strength a touch under what it was on navy: on black the halo reads
    // brighter for the same number.
    GL.bloom = new AD.UnrealBloomPass(new THREE.Vector2(1, 1), 0.45, 0.35, 0.82);
    composer.addPass(GL.bloom);
    // Last, always: without it the composer bypasses outputColorSpace and the
    // GL path renders darker than the flat one with nothing to explain it.
    composer.addPass(new AD.OutputPass());
    GL.composer = composer;

    GL.ready = true;
    return true;
  }

  // How far back a scene has to sit for its content to fit the viewport it is
  // drawn into: the vertical fit, and the horizontal fit through the aspect.
  const fit = (P, aspect) => {
    const t = Math.tan(P.fov * Math.PI / 360);
    return Math.max(P.content / t, P.content / (t * aspect));
  };

  function resize() {
    if (!GL.ready) return;
    const box = $("stage").getBoundingClientRect();
    const w = Math.max(1, Math.round(box.width));
    const h = Math.max(1, Math.round(box.height));
    GL.renderer.setSize(w, h, false);
    GL.composer.setSize(w, h);
    GL.bloom.setSize(w, h);

    for (const s of SCENES) {
      const g = GL.built[s.id];
      const n = s.panes || 1;
      const pw = Math.max(1, w / n);
      // A scene may keep a distance it shipped with wherever that is generous
      // enough (minRadius) and pull back on a stage too narrow to hold it.
      s.pose.radius = Math.max(s.pose.minRadius || 0, fit(s.pose, pw / h));
      for (const c of camsOf(g)) { c.aspect = pw / h; c.updateProjectionMatrix(); }
    }
    const step = STEPS[state.step];
    const n = BY_ID[step.scene].panes || 1;
    const pw = Math.max(1, w / n);
    GL.lab.forEach((l, i) => {
      if (i < n) {
        l.setSize(pw, h);
        l.domElement.style.left = (i * pw) + "px";
        l.domElement.style.display = "";
      } else {
        l.domElement.style.display = "none";
      }
    });
  }

  const camsOf = (g) => (g.panes ? g.panes.map((p) => p.cam) : [g.cam]);

  // One place moves the camera, whichever thing is moving it: the idle drift
  // while nobody is holding the stage, the glide while a scene turns into
  // place, and a drag or a key the rest of the time. The stored view is the
  // truth; applyCamera() only ever reads it.
  function applyCamera(scene) {
    const P = POSE[scene];
    const s = BY_ID[scene];
    if (drift.on && !glide.active) {
      const pose = LC.driftPose(drift, performance.now() - drift.t0, P.limits);
      Object.assign(state.views[scene], pose);
    }
    const zoom = s.zoom ? s.zoom(CTX[scene]) : 1;
    const eye = LC.orbitEye(P.target, P.radius * zoom, shownView(scene));
    for (const c of camsOf(GL.built[scene])) {
      c.up.set(LC.UP[0], LC.UP[1], LC.UP[2]);
      c.position.set(eye[0], eye[1], eye[2]);
      c.lookAt(P.target[0], P.target[1], P.target[2]);
    }
    stampCam(scene);
  }

  // The pose, on the stage, as numbers. The browser check reads rotation off
  // this rather than out of the pixels. Written only when it changes, because
  // it is touched sixty times a second.
  function stampCam(scene) {
    const v = state.views[scene];
    const at = v.az.toFixed(2) + "," + v.el.toFixed(2) + "," + v.dolly.toFixed(2);
    $("zoom-in").disabled = v.dolly <= (POSE[scene].limits.dollyMin || LC.CAMERA.dollyMin) + 1e-6;
    $("zoom-out").disabled = v.dolly >= (POSE[scene].limits.dollyMax || LC.CAMERA.dollyMax) - 1e-6;
    if (GL.stamp !== at) { GL.stamp = at; $("stage").dataset.cam = at; }
  }

  function renderGL() {
    const step = STEPS[state.step];
    const s = BY_ID[step.scene];
    const g = GL.built[s.id];
    applyCamera(s.id);
    if (GL.labScene !== s.id) {
      GL.labScene = s.id;
      for (const l of GL.lab) l.domElement.replaceChildren();
    }
    const t0 = performance.now();
    const r = GL.renderer;
    const w = r.domElement.width / r.getPixelRatio();
    const h = r.domElement.height / r.getPixelRatio();

    s.render(CTX[s.id], g);

    if (g.composer) {
      GL.pass.scene = g.scene;
      GL.pass.camera = g.cam;
      GL.bloom.enabled = state.glow && !reduceMotion && GL.budget;
      r.setClearColor(STAGE.target, 1);
      r.setScissorTest(false);
      r.setViewport(0, 0, w, h);
      GL.composer.render();
      GL.lab[0].render(g.scene, g.cam);
      $("stage").dataset.gl = "composer";
    } else {
      // Direct, one viewport per pane. UnrealBloomPass inherits enabled = true
      // and this branch never runs it, so clear the flag or the budget sampler
      // below counts direct renders as bloomed ones.
      GL.bloom.enabled = false;
      r.setClearColor(STAGE.canvas, 1);
      const n = g.panes.length;
      const pw = w / n;
      r.setScissorTest(true);
      g.panes.forEach((p, i) => {
        r.setViewport(i * pw, 0, pw, h); r.setScissor(i * pw, 0, pw, h);
        r.render(p.scene, p.cam);
      });
      r.setScissorTest(false);
      g.panes.forEach((p, i) => GL.lab[i].render(p.scene, p.cam));
      $("stage").dataset.gl = "direct";
    }

    // Bloom's cost is a property of the device, not a preference. Measure the
    // first stretch of frames that actually ran the bloom pass and stand down
    // if they are not making budget.
    if (GL.bloom.enabled && GL.frames.length < 60) {
      GL.frames.push(performance.now() - t0);
      if (GL.frames.length === 60) {
        const med = GL.frames.slice().sort((a, b) => a - b)[30];
        if (med > 24) {
          GL.budget = false;
          $("glow").checked = false;
          state.glow = false;
          $("glnote").textContent = T.glSlow;
          $("glnote").hidden = false;
          GL.note = "glSlow";
        }
      }
    }
  }

  // ─── drawing, whichever path is live ──────────────────────────────────────

  function draw() {
    const step = STEPS[state.step];
    const s = BY_ID[step.scene];
    // The GL path draws the divider and captions as page furniture; the flat
    // path draws its own inside the SVG, so they must not both appear.
    const showPanes = (s.panes || 1) > 1 && state.mode === "gl";
    $("panes").hidden = !showPanes;
    if (showPanes) { $("cap-in").textContent = s.copy[lang].labIn; $("cap-out").textContent = s.copy[lang].labOut; }
    if (state.mode === "gl" && GL.ready) {
      renderGL();
      $("labels").innerHTML = "";
    } else {
      $("flat").innerHTML = "";
      s.flat(CTX[s.id]);
      $("stage").dataset.gl = "none";
      stampCam(s.id);
    }
    readouts();
  }

  // The readout, the note on the stage, the aria label and the data-* the
  // browser check reads. Driven by the things that can change it -- a slider,
  // a step, a language -- never by the render loop: rewriting it sixty times
  // a second destroys any selection a reader makes in it.
  let dataKeys = [];
  function readouts() {
    const step = STEPS[state.step];
    const s = BY_ID[step.scene];
    const stage = $("stage");
    const r = s.readout(CTX[s.id]);
    $("comparison").hidden = !r.comparison;
    $("comparison").innerHTML = r.comparison || "";
    $("read-" + s.step).innerHTML = r.html;
    const title = $("stagetitle");
    const claim = s.copy[lang].claim || "";
    if (title.textContent !== claim) title.textContent = claim;
    $("stagenote").textContent = r.note || "";
    const fault = $("fault");
    if (r.fault) { fault.textContent = r.fault; fault.hidden = false; } else fault.hidden = true;
    for (const k of dataKeys) delete stage.dataset[k];
    dataKeys = Object.keys(r.data || {});
    for (const k of dataKeys) stage.dataset[k] = r.data[k];
    stage.setAttribute("aria-label", step.aria());
    stage.dataset.step = step.id;
    // The scene's own name beside its number, because the number is the one
    // that moves: the eight have been reordered twice, and a check that says
    // "expected portal, got collapse" is a different sentence from
    // "expected 4, got 3".
    stage.dataset.scene = s.id;
  }

  const arrived = new Set();
  function arriveOnce(sc) {
    if (arrived.has(sc.id) || CTX[sc.id].instant || !sc.arrive) return;
    arrived.add(sc.id);
    sc.arrive(CTX[sc.id]);
  }

  // ─── the step machine ─────────────────────────────────────────────────────

  function setStep(i, scroll) {
    const n = Math.max(0, Math.min(STEPS.length - 1, i));
    const changed = n !== state.step;
    const was = STEPS[state.step].scene;
    state.step = n;
    // A scene arriving turns the last third of a turn into place rather than
    // cutting to it, and the drift starts again from the pose the reader is
    // now looking at -- its origin belongs to the scene on the stage.
    if (changed && STEPS[n].scene !== was) {
      const scene = STEPS[n].scene;
      const v = state.views[scene];
      Object.assign(drift, LC.driftRelease(drift, performance.now()));
      // Through the same clamp the reader's own drags go through: a flat scene
      // bounds azimuth because past it every label reads backwards, and a
      // scene turning into place must not play that view on the way in.
      const from = LC.orbitClamp(
        {az: v.az - 0.34, el: v.el - 0.1, dolly: v.dolly}, POSE[scene].limits);
      glideTo(scene, from.az, from.el, v.az, v.el, 900);
      // The scene's own entrance -- y dropping onto the plane, the circle
      // inflating into the ellipse -- plays once, from here, and hands over to
      // the slider. Under reduced motion there is no entrance to play.
      const sc = BY_ID[scene];
      arriveOnce(sc);
    }
    STEPS.forEach((s, j) => $(s.el).classList.toggle("is-active", j === n));
    Array.from($("dots").children).forEach((d, j) => {
      if (j === n) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    $("prev").disabled = n === 0;
    $("next").disabled = n === STEPS.length - 1;
    $("stepnum").textContent = T.stepOf(n + 1, STEPS.length);
    if (changed) $("status").textContent = $("h-" + STEPS[n].id).textContent;
    if (state.mode === "gl" && GL.ready) resize();
    refreshDrift();
    if (scroll) {
      $(STEPS[n].el).scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "center"});
    }
    draw();
  }

  // Which step the reader is looking at: whichever section crosses a thin band
  // through the middle of the viewport. pickActive() owns the two cases that
  // flicker -- nothing in the band, and two things in it.
  function watchSteps() {
    let queued = false;
    const settle = () => {
      queued = false;
      const rects = STEPS.map((s) => {
        const r = $(s.el).getBoundingClientRect();
        return {top: r.top, bottom: r.bottom};
      });
      const band = innerHeight / 2;
      const next = LC.pickActive(rects, band - 50, band + 50, state.step);
      if (next >= 0 && next !== state.step) setStep(next, false);
    };
    const kick = () => { if (!queued) { queued = true; requestAnimationFrame(settle); } };
    const io = new IntersectionObserver(kick, {threshold: [0, 0.25, 0.5, 0.75, 1]});
    STEPS.forEach((s) => io.observe($(s.el)));
    addEventListener("scroll", kick, {passive: true});
    kick();
  }

  // ─── boot ─────────────────────────────────────────────────────────────────

  function whenThree(ms) {
    return new Promise((resolve, reject) => {
      if (window.THREE && window.THREE_ADDONS) return resolve();
      const timer = setTimeout(() => reject(new Error("timeout")), ms);
      addEventListener("three-ready", () => { clearTimeout(timer); resolve(); }, {once: true});
      const s = document.createElement("script");
      s.type = "module";
      s.src = "vendor/linalg-boot.js";
      s.onerror = () => { clearTimeout(timer); reject(new Error("load")); };
      document.head.appendChild(s);
    });
  }

  function setMode(mode, why) {
    state.mode = mode;
    $("gl").hidden = mode !== "gl";
    $("flat").style.display = mode === "gl" ? "none" : "block";
    const note = $("glnote");
    if (why) { note.textContent = T[why]; note.hidden = false; GL.note = why; }
    else { note.hidden = true; GL.note = null; }
    // Glow is a property of the composer, so in flat mode the control has
    // nothing to act on.
    $("glow").disabled = mode !== "gl";
    if (mode === "gl") resize();
    draw();
    refreshDrift();
  }

  function bootGL() {
    let settled = false;
    const flatly = (why) => { if (!settled) { settled = true; setMode("flat", why); } };
    whenThree(6000).then(() => {
      if (settled) return;
      settled = true;
      if (initGL()) {
        setMode("gl");
        loop();
        // The step the page opened on gets its entrance too; setStep() only
        // plays one on a change of scene.
        const sc = BY_ID[STEPS[state.step].scene];
        arriveOnce(sc);
      } else setMode("flat", "glNoWebgl");
    }).catch(() => flatly("glNoScript"));
  }

  // The render loop redraws the scene and nothing else; see readouts().
  function loop() {
    if (state.mode === "gl" && GL.ready) renderGL();
    requestAnimationFrame(loop);
  }

  // ─── wiring ───────────────────────────────────────────────────────────────

  fillText();
  for (const s of SCENES) if (s.init) s.init(CTX[s.id]);

  $("glow").addEventListener("change", (e) => {
    state.glow = e.target.checked;
    // Turning it back on has to mean something: the automatic downgrade gets
    // another measurement rather than standing for the rest of the session.
    if (state.glow) {
      GL.budget = true;
      GL.frames = [];
      // Only ever clears its own message; the same element carries the "no
      // WebGL" notes, and hiding one of those leaves a reader on the flat
      // renderer with nothing saying why.
      if (GL.note === "glSlow") { $("glnote").hidden = true; GL.note = null; }
    }
  });
  $("prev").addEventListener("click", () => setStep(state.step - 1, true));
  $("next").addEventListener("click", () => setStep(state.step + 1, true));
  $("home").addEventListener("click", () => homeView());
  $("reset").addEventListener("click", () => {
    const sc = BY_ID[STEPS[state.step].scene];
    if (sc.reset) sc.reset(CTX[sc.id]);
    for (const input of $(sc.section).querySelectorAll('input[type="range"]')) {
      input.value = input.defaultValue;
      input.dispatchEvent(new Event("input", {bubbles: true}));
    }
    homeView();
    draw();
  });
  $("motion").addEventListener("click", () => {
    motion.manual = !motion.manual;
    $("motion").setAttribute("aria-pressed", String(motion.manual));
    $("motion").textContent = motion.manual ? T.resume : T.pause;
    refreshMotion();
  });
  // The same dolly the + and - keys drive, for a reader who never focuses
  // the stage; the clamps in linalg-core decide how close is close enough.
  $("zoom-in").addEventListener("click", () => dollyBy(0.9));
  $("zoom-out").addEventListener("click", () => dollyBy(1.11));
  addEventListener("resize", () => { if (state.mode === "gl") resize(); else draw(); });

  // #step-N in the URL opens on that step, and so does the scene's own name
  // (#portal, #eigen): the name is what the notebooks link to, because it
  // survives the steps being reordered and a number does not. Each name is
  // also an empty element at the top of its section, so a link checker finds
  // the anchor and a browser has something to scroll to.
  const stepOf = (hash) => STEPS.findIndex((s) => s.el === hash || s.id === hash || s.scene === hash);
  const hash = (location.hash || "").replace("#", "");
  const at = stepOf(hash);
  // A hash that changes on a page already open -- a link followed from the
  // notebook in the same tab, or an edited address bar -- is the same request.
  // Not in embed mode: a hero card has no scroller, no step bar and no Next,
  // so a hash arriving there would strand it on a scene with nothing to say
  // and no way back to the one its caption describes.
  if (!embed) addEventListener("hashchange", () => {
    const n = stepOf((location.hash || "").replace("#", ""));
    if (n >= 0) setStep(n, true);
  });
  setStep(at >= 0 ? at : 0, false);

  if (embed) {
    // The hero gets the portal's still frame and no three.js at all.
    state.step = STEPS.findIndex((s) => s.scene === "portal");
    const text = document.createElement("span");
    text.innerHTML = "<b>" + T.embedCap + "</b>";
    $("embedcap").append(text);
    setMode("flat");
    addEventListener("resize", draw);
  } else {
    bindStage();
    watchSteps();
    bootGL();
    if (at >= 0) $(STEPS[at].el).scrollIntoView({block: "center"});
  }
})();
</script>
</body>
</html>
