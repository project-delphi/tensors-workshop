<link rel="stylesheet" href="widget-chrome.css">
<style>
  /* The surfaces, type and frame are widget-chrome.css; this page owns its
     accent and everything on the stage. --stage, --stage-chip, --stage-ink
     and --stage-mute are shared there too. */
  :root {
    --accent: #0369a1;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="navy"]) { --accent: #38bdf8; --on-accent: #0b1a26; }
  }
  :root[data-theme="navy"] { --accent: #38bdf8; --on-accent: #0b1a26; }

  /* The roles this stage's pictures use, over the shared stage ink: the
     query in the reader's hand, the key it is compared with, the value it
     draws from, one more of something being counted, and anything wrong. */
  :root {
    --at-q: #ffd84d;
    --at-k: #58c4dd;
    --at-v: #c39bd3;
    --at-w: #7ee787;
    --at-res: #fc6c85;
  }

  .two-pane {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    gap: 1.75rem;
    align-items: start;
    margin-top: 1.25rem;
  }
  .steps { min-width: 0; }
  .stagewrap { position: sticky; top: 1.5rem; min-width: 0; }

  @media (max-width: 62rem) {
    .two-pane { display: flex; flex-direction: column; gap: 1rem; }
    .stagewrap {
      order: -1; top: 0; z-index: 2; padding-bottom: 0.5rem; background: var(--bg);
      display: flex; flex-direction: column;
    }
    #stage { min-height: 14rem; }
    .step { min-height: 0; padding: 1.4rem 0; }
  }

  #stage {
    position: relative; height: min(56vh, 26rem);
    background: var(--stage); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  #stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #picture { display: block; width: 100%; height: 100%; }
  #claim {
    position: absolute; left: 0.75rem; top: 0.6rem; margin: 0; max-width: 62%;
    font-size: 0.82rem; color: var(--stage-ink); background: var(--stage-chip);
    padding: 0.15rem 0.4rem; border-radius: 4px; font-family: var(--mono);
  }
  #shapebadge {
    position: absolute; right: 0.75rem; top: 0.6rem; margin: 0; max-width: 34%;
    font-size: 0.82rem; color: var(--stage-ink); background: var(--stage-chip);
    padding: 0.15rem 0.4rem; border-radius: 4px; font-family: var(--mono);
  }
  /* At the hero's small embed size the claim wraps to three lines at the
     desktop font size and covers the picture under it. The chip's text
     content stays byte-exact -- this only shrinks how it is drawn.

     `html.embed` is in the selector as well as the width, because an embed
     is small however wide its frame happens to be: at 520px the width rule
     did not apply, and the softmax claim -- the one the embed always opens
     on -- wrapped to two lines over the scene's own title. The width half
     still has to stay for the non-embedded page at 390px.

     The claim's max-width plus the badge's 34% has to stay under 100%, or
     the two chips share the row and overlap. Wrapping to a third line is the
     cheaper failure, now that fitClaim() makes room for however many there
     are.

     This comment used to be two, and the first closed early: the second
     paragraph sat bare between them, the parser took it for the start of a
     selector, and the whole 420px rule below was swallowed with it. */
  @media (max-width: 420px) {
    #claim { font-size: 0.62rem; line-height: 1.25; max-width: 60%; padding: 0.1rem 0.3rem; top: 0.4rem; }
    #shapebadge { font-size: 0.62rem; padding: 0.1rem 0.3rem; top: 0.4rem; }
  }
  html.embed #claim { font-size: 0.62rem; line-height: 1.25; max-width: 60%; padding: 0.1rem 0.3rem; top: 0.4rem; }
  html.embed #shapebadge { font-size: 0.62rem; padding: 0.1rem 0.3rem; top: 0.4rem; }

  #dots { display: inline-flex; gap: 0.35rem; align-items: center; }
  .stagebar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.6rem; }
  .stagebar .grow { flex: 1 1 auto; }
  .stagebar .dot {
    width: 0.8rem; height: 0.8rem; padding: 0; border-radius: 50%;
    border: 2px solid var(--ink-mute); background: transparent; cursor: pointer;
  }
  .stagebar .dot:hover { border-color: var(--accent); }
  .stagebar .dot[aria-current="step"] { background: var(--accent); border-color: var(--accent); }
  #stepnum { font: 600 0.85rem/1 var(--sans); color: var(--ink-mute); }

  .step {
    min-height: 74vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 1rem 0;
  }
  .step .anchor { display: block; height: 0; }
  .step h2 { font-size: 1.2rem; font-weight: 650; margin: 0 0 0.2rem; }
  .step .part {
    font: 600 0.8rem/1.3 var(--sans); color: var(--ink-mute);
    border-top: 1px solid var(--line); padding-top: 0.6rem; margin: 0 0 0.9rem; max-width: 36rem;
  }
  .step .kicker { margin-bottom: 0.5rem; }
  .step p, .step .body { max-width: 36rem; overflow-wrap: break-word; }
  .step.is-active h2 { color: var(--accent); }

  .controls { display: grid; gap: 0.7rem; margin: 0.9rem 0 0; max-width: 34rem; }
  .controls label { display: block; font-size: 0.85rem; font-weight: 600; }
  .controls .val { float: right; font-family: var(--mono); font-weight: 500; color: var(--ink-mute); }
  .controls input[type="range"] { width: 100%; accent-color: var(--accent); }
  .controls select { width: 100%; max-width: 22rem; }

  .readout {
    margin: 0.7rem 0 0; padding: 0.65rem 0.8rem; background: var(--sunk);
    border: 1px solid var(--line); border-radius: 8px; font-size: 0.92rem;
    min-height: 3.2rem; max-width: 36rem;
  }
  .readout b { color: var(--accent); }
  .shape { font-family: var(--mono); font-size: 0.86rem; }

  /* The NumPy for each picture, the shape voice-stage.html keeps: one copy
     of the code for both languages, only the `#` comments translated, and
     written by changed() because every number in it comes from the
     controls. `contain: inline-size` is the .eqscroll lesson again: without
     it a long line reports its own min-content and takes the page past
     390px. */
  .np { margin: 0.9rem 0 0; max-width: 36rem; }
  .nplabel {
    margin: 0 0 0.3rem; font: 600 0.75rem/1.3 var(--sans);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute);
  }
  .np pre { margin: 0; contain: inline-size; border: 1px solid var(--line); }
  .np pre:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .step .body code, .readout code { font: 500 0.85em/1 var(--mono); }

  /* Display notation, the same shape voice-stage.html keeps. Static and
     language-neutral; only the caption under it is translated. */
  .eq {
    margin: 0.9rem 0 0; padding: 0.7rem 0.8rem; background: var(--sunk);
    border: 1px solid var(--line); border-radius: 8px; max-width: 36rem;
  }
  /* `contain: inline-size` (not `overflow-x: auto` alone) is what stops a
     wide formula pushing the page sideways at 390px -- see widget-chrome.css
     and the audio stage's own comment on this. */
  .eqscroll { overflow-x: auto; contain: inline-size; }
  .eq math { font-size: 1.05rem; color: var(--ink);
             font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif; }
  .eqcap { margin: 0.55rem 0 0; font-size: 0.82rem; color: var(--ink-mute); }
  .eq [data-hl] { cursor: help; border-bottom: 1px dashed var(--ink-mute); border-radius: 2px; }
  .eq [data-hl]:hover, .eq [data-hl].is-lit {
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    border-bottom: 1px solid var(--accent);
  }
  .eq [data-hl]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  html.embed .steps, html.embed .stagebar, html.embed .readout, html.embed .hint { display: none; }
  html.embed .two-pane { display: block; margin: 0; }
  html.embed .stagewrap { position: static; height: 100vh; display: flex; flex-direction: column; }
  html.embed #stage { flex: 1 1 auto; border: 0; border-radius: 0; height: auto; min-height: 0; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>

<script src="attention-scenes/project.js"></script>
<script src="attention-scenes/scores.js"></script>
<script src="attention-scenes/scale.js"></script>
<script src="attention-scenes/softmax.js"></script>
<script src="attention-scenes/output.js"></script>
<script src="attention-scenes/heads.js"></script>
<script src="attention-scenes/batch.js"></script>

<script>
(function () {
  "use strict";
  const AC = window.AttentionCore, K = window.AttentionKit, LC = window.LinalgCore;
  const $ = (id) => document.getElementById(id);

  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "es" ? "es" : "en";
  const embed = params.get("embed") === "1";
  const theme = params.get("theme");
  document.documentElement.lang = lang;
  if (embed) document.documentElement.classList.add("embed");
  if (theme === "navy") document.documentElement.dataset.theme = "navy";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const T = {
    en: {
      eyebrow: "Sections 04 and 06 · Appendix B",
      title: "Attention, from words to weights",
      navHome: "← Workshop home",
      navInteractive: "Interactive",
      navNotebooks: "Notebooks",
      intro: "A four-word sentence, followed all the way through one attention head, one step " +
             "per picture: the words cut into tokens, the tokens coded as integers, the " +
             "integers used to fetch rows of an embedding table, those rows projected into " +
             "queries, keys and values, every query scored against every key, the scores scaled " +
             "and turned into weights, and the weights used to average the values. Then two " +
             "pictures on what a real model adds: more heads, and a batch. Each picture asks you " +
             "to predict before you touch a control, and each one shows the NumPy that computes " +
             "it: numpy only, no framework.",
      shape: "Shape", concept: "Concept", code: "In NumPy",
      reset: "Reset this picture",
      prev: "◀ Back", next: "Next ▶",
      stepOf: (i, n) => i + " of " + n,
      stepName: (i, n, h) => i + " of " + n + ": " + h,
      embedCap: "Softmax turns each row of scores into weights that sum to one.",
      aboutH: "About this page",
      about1: "Every number on this page is computed in the browser, from a fixed seed, through " +
              "attention-core.js. Nothing is drawn from a stored answer. The embedding table and " +
              "the weight matrices are seeded, not trained, and kept to small integers so every " +
              "sum can be checked by hand, so no number here says anything about what the words " +
              "mean.",
      about2: "It accompanies section 04 (layout and reshape), section 06 (contraction with einsum) " +
              "and Appendix B (attention is two contractions). Each picture has its own address — " +
              "#words, #ids, #embed, #project, #scores, #scale, #softmax, #output, #heads, " +
              "#batch — and the notebooks link to the one they are teaching."
    },
    es: {
      eyebrow: "Secciones 04 y 06 · Apéndice B",
      title: "La atención, de las palabras a los pesos",
      navHome: "← Inicio del taller",
      navInteractive: "Interactivo",
      navNotebooks: "Cuadernos",
      intro: "Una frase de cuatro palabras, seguida de principio a fin a través de una cabeza de " +
             "atención, un paso por imagen: las palabras cortadas en tokens, los tokens " +
             "codificados como enteros, los enteros usados para traer filas de una tabla de " +
             "embeddings, esas filas proyectadas en consultas, claves y valores, cada consulta " +
             "puntuada contra cada clave, las puntuaciones escaladas y convertidas en pesos, y los " +
             "pesos usados para promediar los valores. Después, dos imágenes sobre lo que añade " +
             "un modelo real: más cabezas y un lote. Cada imagen te pide una predicción antes de " +
             "tocar un control, y cada una muestra el NumPy que la calcula: solo numpy, ningún " +
             "framework.",
      shape: "Forma", concept: "Concepto", code: "En NumPy",
      reset: "Reiniciar esta imagen",
      prev: "◀ Atrás", next: "Siguiente ▶",
      stepOf: (i, n) => i + " de " + n,
      stepName: (i, n, h) => i + " de " + n + ": " + h,
      embedCap: "Softmax convierte cada fila de puntuaciones en pesos que suman uno.",
      aboutH: "Sobre esta página",
      about1: "Cada número de esta página se calcula en el navegador, a partir de una semilla fija, " +
              "mediante attention-core.js. Nada se dibuja a partir de una respuesta guardada. La " +
              "tabla de embeddings y las matrices de pesos están sembradas, no entrenadas, y " +
              "limitadas a enteros pequeños para que cada suma pueda comprobarse a mano, así que " +
              "ningún número de aquí dice nada sobre lo que significan las palabras.",
      about2: "Acompaña a la sección 04 (disposición y reshape), a la 06 (contracción con einsum) y " +
              "al Apéndice B (la atención son dos contracciones). Cada imagen tiene su propia " +
              "dirección (#words, #ids, #embed, #project, #scores, #scale, #softmax, #output, " +
              "#heads, #batch) y los cuadernos enlazan a la que están enseñando."
    }
  }[lang];

  // -------------------------------------------------------------- scenes
  const scenes = window.AttentionScenes.list();
  if (!scenes.length) throw new Error("attention-stage: no scenes registered");
  for (const s of scenes) {
    if (!$("step-" + s.id)) throw new Error("attention-stage: no section for scene " + s.id);
  }
  let active = scenes[0];
  let step = 0;
  let hl = null;
  const ctxFor = new Map();
  const byId = (id) => scenes.find((s) => s.id === id);

  const stage = $("stage"), svg = $("picture");

  function contextFor(scene) {
    if (ctxFor.has(scene.id)) return ctxFor.get(scene.id);
    const c = {
      AC, K, LC, lang, embed, reduceMotion,
      state: {}, cache: {},
      stage, svg, W: 640, H: 400,
      get copy() { return scene.copy[lang]; },
      get hl() { return hl; },
      colour: (token) => K.css(token),
      changed,
      setControls: (vals) => setControls(scene, vals),
      control: (id) => $("c-" + scene.id + "-" + id)
    };
    ctxFor.set(scene.id, c);
    return c;
  }

  // ------------------------------------------------------- the controls
  function buildControls(scene) {
    const host = $("ctl-" + scene.id);
    host.textContent = "";
    const ctx = contextFor(scene);
    const copy = scene.copy[lang];
    (scene.controls || []).forEach((spec) => {
      const wrap = document.createElement("label");
      const val = document.createElement("span");
      val.className = "val";
      wrap.appendChild(val);
      const name = document.createElement("span");
      name.textContent = (copy.controls && copy.controls[spec.id]) || spec.id;
      wrap.appendChild(name);

      let input;
      if (spec.type === "select") {
        input = document.createElement("select");
        spec.options.forEach((o) => {
          const opt = document.createElement("option");
          opt.value = o;
          opt.textContent = (copy.options && copy.options[spec.id] && copy.options[spec.id][o]) || o;
          input.appendChild(opt);
        });
        input.value = String(ctx.state[spec.id]);
      } else {
        input = document.createElement("input");
        input.type = "range";
        input.min = spec.min; input.max = spec.max; input.step = spec.step || 1;
        input.value = String(ctx.state[spec.id]);
      }
      input.id = "c-" + scene.id + "-" + spec.id;
      input.autocomplete = "off";
      input.addEventListener("input", () => {
        ctx.state[spec.id] = spec.type === "select" ? input.value : Number(input.value);
        if (active !== scene) showScene(scene, false);
        changed();
      });
      val.textContent = spec.fmt ? spec.fmt(ctx.state[spec.id], ctx) : "";
      wrap.appendChild(input);
      host.appendChild(wrap);
    });
  }

  function rebuildLabels(scene) {
    const ctx = contextFor(scene), copy = scene.copy[lang];
    (scene.controls || []).forEach((spec) => {
      const input = $("c-" + scene.id + "-" + spec.id);
      if (!input) return;
      const val = input.parentNode.querySelector(".val");
      if (val) val.textContent = spec.fmt ? spec.fmt(ctx.state[spec.id], ctx) : "";
    });
  }

  function setControls(scene, vals) {
    const ctx = contextFor(scene);
    Object.keys(vals).forEach((k) => {
      ctx.state[k] = vals[k];
      const input = $("c-" + scene.id + "-" + k);
      if (input) input.value = String(vals[k]);
    });
    rebuildLabels(scene);
    changed();
  }

  // -------------------------------------------------------- the readout
  const written = new Set();

  function changed() {
    const ctx = contextFor(active);
    if (active.sync) active.sync(ctx);
    const r = active.readout(ctx) || {};
    $("read-" + active.id).innerHTML = r.html || "";
    $("claim").textContent = r.claim || active.copy[lang].claim;
    const sh = active.shape ? active.shape(ctx)
      : (r.data && r.data.shape ? "[" + String(r.data.shape).split(",").join(", ") + "]" : "");
    const badge = $("shapebadge");
    badge.textContent = sh ? T.shape + " " + sh : "";
    badge.hidden = !sh;
    if (sh) stage.dataset.tensorshape = sh; else delete stage.dataset.tensorshape;
    stage.setAttribute("aria-label", ctx.copy.aria(ctx) || "");

    const data = Object.assign({scene: active.id}, r.data || {});
    written.forEach((k) => { if (!(k in data)) delete stage.dataset[k]; });
    written.clear();
    Object.keys(data).forEach((k) => { stage.dataset[k] = String(data[k]); written.add(k); });

    // The NumPy block, written here rather than in fillText() because every
    // number in it comes from the controls.
    if (active.code) $("np-" + active.id).firstChild.textContent = active.code(ctx).join("\n");

    rebuildLabels(active);
    active.draw(ctx);
    fitClaim();
  }

  // Every scene starts its drawing 44 user units down, leaving the claim
  // chip the top of the viewBox to itself. 44 is right at the page's own
  // size and wrong at an embed's: the chip is sized in px, the picture in
  // user units, so the smaller the stage the more of it one line of claim
  // covers. The softmax claim is the longest of the seven and the one an
  // embed opens on, and at 390px it wrapped to two lines and put the second
  // one straight through that scene's own "L, head 0" title.
  //
  // So the reservation is measured rather than assumed: the viewBox grows
  // upward by whatever the chip actually needs, which moves every scene
  // down together without a scene knowing how tall the claim came out, and
  // leaves the drawing's own coordinates -- and the browser check's
  // viewBox assertion, which reads them through the CTM -- untouched.
  function fitClaim() {
    const svg = $("picture"), box = stage.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const claimH = $("claim").getBoundingClientRect().height;
    let extra = 0;
    // Twice, because growing the viewBox shrinks the scale, which is what
    // the requirement is measured in; the second pass settles it.
    for (let i = 0; i < 2; i++) {
      const scale = Math.min(box.width / 640, box.height / (400 + extra));
      extra = Math.max(0, Math.ceil((claimH + 12) / scale - 44));
    }
    svg.setAttribute("viewBox", "0 " + -extra + " 640 " + (400 + extra));
  }

  // Pointing at a letter in an equation bands the axis it names on the
  // stage. Never calls changed(): the readout is written from the controls,
  // and a hover that rewrote it would move the text under the cursor.
  function lightAxis(token, on) {
    const next = on ? token : (hl === token ? null : hl);
    if (next === hl) return;
    hl = next;
    if (hl) stage.dataset.hl = hl; else delete stage.dataset.hl;
    document.querySelectorAll(".eq [data-hl]").forEach((el) => {
      el.classList.toggle("is-lit", !!hl && el.dataset.hl === hl);
    });
    active.draw(contextFor(active));
  }

  function bindEquations() {
    document.querySelectorAll(".eq [data-hl]").forEach((el) => {
      const token = el.dataset.hl;
      el.addEventListener("pointerenter", () => lightAxis(token, true));
      el.addEventListener("pointerleave", () => lightAxis(token, false));
      el.addEventListener("focus", () => lightAxis(token, true));
      el.addEventListener("blur", () => lightAxis(token, false));
    });
  }

  // -------------------------------------------------------------- text
  function fillText() {
    let group = null;
    scenes.forEach((s) => {
      const c = s.copy[lang];
      $("k-" + s.id).textContent = c.k;
      $("h-" + s.id).textContent = c.h;
      $("con-" + s.id).innerHTML = c.concept || "";
      $("con-" + s.id).dataset.label = T.concept;
      $("body-" + s.id).innerHTML = c.b;
      $("pr-" + s.id).textContent = c.predict || "";
      const cap = document.getElementById("eqcap-" + s.id);
      if (cap) cap.textContent = c.eqcap || "";
      // The label over the NumPy block; the code itself is changed()'s. A
      // scene with no code() keeps an empty block out of the page.
      const np = document.getElementById("np-" + s.id);
      if (np) {
        np.parentNode.hidden = !s.code;
        $("nplab-" + s.id).textContent = T.code;
      }
      // The heading of the part this scene opens, above its kicker.
      if (s.part && s.part[lang] !== group) {
        group = s.part[lang];
        const part = document.createElement("p");
        part.className = "part";
        part.textContent = group;
        $("k-" + s.id).before(part);
      }
    });
    const dots = $("dots");
    dots.replaceChildren();
    scenes.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "dot";
      b.setAttribute("aria-label", T.stepName(i + 1, scenes.length, s.copy[lang].h));
      b.addEventListener("click", () => goTo(i, true));
      dots.appendChild(b);
    });
  }

  function showScene(scene, scroll) {
    const isNew = active !== scene;
    active = scene;
    step = scenes.indexOf(scene);
    scenes.forEach((s, j) => $("step-" + s.id).classList.toggle("is-active", j === step));
    Array.from($("dots").children).forEach((d, j) => {
      if (j === step) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    $("prev").disabled = step === 0;
    $("next").disabled = step === scenes.length - 1;
    $("stepnum").textContent = T.stepOf(step + 1, scenes.length);
    if (isNew) $("status").textContent = scene.copy[lang].h;
    changed();
    if (scroll) {
      $("step-" + scene.id).scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "center"});
    }
  }

  const goTo = (i, scroll) =>
    showScene(scenes[Math.max(0, Math.min(scenes.length - 1, i))], scroll);

  function watchSteps() {
    let queued = false;
    const settle = () => {
      queued = false;
      const rects = scenes.map((s) => {
        const r = $("step-" + s.id).getBoundingClientRect();
        return {top: r.top, bottom: r.bottom};
      });
      const band = innerHeight / 2;
      const next = LC.pickActive(rects, band - 50, band + 50, step);
      if (next >= 0 && next !== step) showScene(scenes[next], false);
    };
    const kick = () => { if (!queued) { queued = true; requestAnimationFrame(settle); } };
    const io = new IntersectionObserver(kick, {threshold: [0, 0.25, 0.5, 0.75, 1]});
    scenes.forEach((s) => io.observe($("step-" + s.id)));
    addEventListener("scroll", kick, {passive: true});
    kick();
  }

  // ----------------------------------------------------------- the chrome
  $("site-home").textContent = T.navHome;
  $("site-home").href = lang === "es" ? "../es/index.html" : "../index.html";
  $("site-interactive").textContent = T.navInteractive;
  $("site-interactive").href = lang === "es" ? "../es/interactive.html" : "../interactive.html";
  $("site-notebooks").textContent = T.navNotebooks;
  $("site-notebooks").href = lang === "es" ? "../es/notebooks.html" : "../notebooks.html";
  $("eyebrow").textContent = T.eyebrow;
  $("title").textContent = T.title;
  $("intro").textContent = T.intro;
  $("reset").textContent = T.reset;
  $("prev").textContent = T.prev;
  $("next").textContent = T.next;
  $("h-about").textContent = T.aboutH;
  $("about-1").textContent = T.about1;
  $("about-2").innerHTML = T.about2;
  document.title = T.title;

  if (embed) {
    const cap = $("embedcap");
    const b = document.createElement("b");
    b.textContent = T.embedCap;
    cap.appendChild(b);
  }

  $("reset").addEventListener("click", () => {
    const ctx = contextFor(active);
    if (active.reset) active.reset(ctx); else active.init(ctx);
    buildControls(active);
    changed();
  });
  $("prev").addEventListener("click", () => goTo(step - 1, true));
  $("next").addEventListener("click", () => goTo(step + 1, true));

  // The claim chip is sized in px and the picture in user units, so how
  // much of the stage one line of claim covers changes with every resize.
  window.addEventListener("resize", fitClaim);
  if (!embed) addEventListener("hashchange", () => {
    const s = byId((location.hash || "").replace("#", ""));
    if (s) showScene(s, true);
  });

  fillText();
  for (const s of scenes) { s.init(contextFor(s)); buildControls(s); }
  if (!embed) bindEquations();
  const wanted = embed ? byId("softmax") : byId((location.hash || "").replace("#", ""));
  showScene(wanted || scenes[0], false);
  stage.dataset.ready = "1";
  if (!embed) {
    watchSteps();
    if (wanted) $("step-" + wanted.id).scrollIntoView({block: "center"});
  }
})();
</script>

</body>
</html>
